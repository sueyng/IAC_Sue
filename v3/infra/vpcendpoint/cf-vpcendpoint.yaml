      PrivateDnsEnabled: true

  VPCInterfaceEndpointECRDkr:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateECR
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.ecr.dkr'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds    
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointECRAPI:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateECR
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.ecr.api'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds 
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointELB:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateELB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.elasticloadbalancing'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds   
      SecurityGroupIds:
