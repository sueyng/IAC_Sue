    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.rds'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds
      SecurityGroupIds:
        - !GetAtt VPCERDSSecurityGroup.GroupId
      VpcEndpointType: Interface
