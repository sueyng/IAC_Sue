  VPCInterfaceEndpointS3:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateS3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.s3'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointLambda:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateLambda
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.lambda'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointECS:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateECS
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.ecs'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointCloudFormation:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateCloudFormation
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.cloudformation'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
