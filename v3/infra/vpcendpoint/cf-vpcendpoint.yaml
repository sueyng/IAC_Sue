      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointSecrets:
      Type: 'AWS::EC2::VPCEndpoint'
      Condition: CreateSecrets
      DeletionPolicy: !If [IsProduction, Retain, Delete]
      UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
      Properties:
        ServiceName: !Sub 'com.amazonaws.${AWSRegion}.secretsmanager'
        VpcId: !Ref VpcId
        SubnetIds: !Ref AppSubnetIds  
        SecurityGroupIds:
          - !GetAtt VPCESecurityGroup.GroupId
        VpcEndpointType: Interface
        PrivateDnsEnabled: true

  VPCInterfaceEndpointElasticache:
    Type: 'AWS::EC2::VPCEndpoint'
    Condition: CreateElasticache
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.elasticache'
      VpcId: !Ref VpcId
      SubnetIds: !Ref AppSubnetIds       
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
