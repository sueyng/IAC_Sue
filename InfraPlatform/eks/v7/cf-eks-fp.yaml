AWSTemplateFormatVersion: 2010-09-09
Description: AWS EKS Fargate Profile v7
Parameters:
  AppShortName:
    Type: String
    Description: AppShortName
  EnvName:
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
    Description: Environment
  SecondProjectForExistingEKS:
    Type: String
    Default: "no"
    AllowedValues:
      - "no"
      - "yes"
    Description: Set to 'yes' when deploying a second project to an existing EKS cluster (provide direct values), 'no' uses SSM parameter references
  ClusterName:
    Type: String
    Default: ""
    Description: EKS Cluster Name (required when SecondProjectForExistingEKS is 'yes')
  OidcProviderEndpoint:
    Type: String
    Default: ""
    Description: OIDC Provider Endpoint without https:// (required when SecondProjectForExistingEKS is 'yes')
  FargateProfileName:
    Type: String
    MinLength: 1
    MaxLength: 15
    AllowedPattern: '^[A-Za-z0-9]([A-Za-z0-9-_]{0,13}[A-Za-z0-9])?$'
    ConstraintDescription: Must be 1-15 characters, start and end with an alphanumeric character, and contain only letters, numbers, hyphens or underscores
    Description: Short application profile purpose such as frontend, backend or batch; do not include AppShortName or EnvName
  Namespace1:
    Type: String
    Description: First Kubernetes Namespace
  Namespace2:
    Type: String
    Description: Second Kubernetes Namespace
  Namespace3:
    Type: String
    Default: ""
    Description: Third Kubernetes Namespace
  Namespace4:
    Type: String
    Default: ""
    Description: Fourth Kubernetes Namespace
  Namespace5:
    Type: String
    Default: ""
    Description: Fifth Kubernetes Namespace
  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of App Subnet IDs

Conditions:
  IsProduction: !Or [!Equals [!Ref EnvName, "prod"], !Equals [!Ref EnvName, "prod-a"], !Equals [!Ref EnvName, "prod-b"], !Equals [!Ref EnvName, "prod-c"]]
  IsSecondProject: !Equals [!Ref SecondProjectForExistingEKS, "yes"]
  HasNamespace1: !Not [!Equals [!Ref Namespace1, ""]]
  HasNamespace2: !Not [!Equals [!Ref Namespace2, ""]]
  HasNamespace3: !Not [!Equals [!Ref Namespace3, ""]]
  HasNamespace4: !Not [!Equals [!Ref Namespace4, ""]]
  HasNamespace5: !Not [!Equals [!Ref Namespace5, ""]]

Resources:
  SecretManagerIamPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Condition: IsSecondProject
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-sm-policy'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetResourcePolicy'
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:ListSecretVersionIds'
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}/${EnvName}/*'

  SQSIamPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Condition: IsSecondProject
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-sqs-policy'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: SQSPermissions
            Effect: Allow
            Action:
              - 'sqs:DeleteMessage'
              - 'sqs:GetQueueUrl'
              - 'sqs:ChangeMessageVisibility'
              - 'sqs:ReceiveMessage'
              - 'sqs:SendMessage'
              - 'sqs:GetQueueAttributes'
              - 'sqs:ListQueueTags'
              - 'sqs:ListDeadLetterSourceQueues'
              - 'sqs:PurgeQueue'
            Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AppShortName}-${EnvName}-*'

  S3IamPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-s3-policy'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: S3BucketAccess
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource:
              - !Sub 'arn:aws:s3:::${AppShortName}*'
              - !Sub 'arn:aws:s3:::${AppShortName}*/*'

  FargatePodExecutionRole:
    Type: 'AWS::IAM::Role'
    Condition: IsSecondProject
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - eks-fargate-pods.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      RoleName: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-fargate-PodExecution-role'
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  EKSFargateProfile:
    Type: 'AWS::EKS::FargateProfile'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FargateProfileName: !Sub fp_${FargateProfileName}
      ClusterName: !If 
        - IsSecondProject
        - !Ref ClusterName
        - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-EKSControlPlane}}'
      PodExecutionRoleArn: !If
        - IsSecondProject
        - !GetAtt FargatePodExecutionRole.Arn
        - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-FargatePodExecutionRoleArn}}'
      Subnets: !Ref AppSubnetIds
      Selectors:
        - Fn::If:
            - HasNamespace1
            - Namespace: !Ref Namespace1
            - !Ref "AWS::NoValue"
        - Fn::If:
            - HasNamespace2
            - Namespace: !Ref Namespace2
            - !Ref "AWS::NoValue"
        - Fn::If:
            - HasNamespace3
            - Namespace: !Ref Namespace3
            - !Ref "AWS::NoValue"
        - Fn::If:
            - HasNamespace4
            - Namespace: !Ref Namespace4
            - !Ref "AWS::NoValue"
        - Fn::If:
            - HasNamespace5
            - Namespace: !Ref Namespace5
            - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  AppPodServiceAccountRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcProviderEndpoint}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcProviderEndpoint}:aud": "sts.amazonaws.com",
                      "${OidcProviderEndpoint}:sub": [
                        ${NamespaceConditions}
                      ]
                    }
                  }
                }
              ]
            }
          - OidcProviderEndpoint: !If
              - IsSecondProject
              - !Ref OidcProviderEndpoint
              - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-OidcProviderEndpoint}}'
            NamespaceConditions:
              Fn::Join:
                - ","
                - - !If [HasNamespace1, !Sub '"system:serviceaccount:${Namespace1}:pod-svc-acc"', !Ref "AWS::NoValue"]
                  - !If [HasNamespace2, !Sub '"system:serviceaccount:${Namespace2}:pod-svc-acc"', !Ref "AWS::NoValue"]
                  - !If [HasNamespace3, !Sub '"system:serviceaccount:${Namespace3}:pod-svc-acc"', !Ref "AWS::NoValue"]
                  - !If [HasNamespace4, !Sub '"system:serviceaccount:${Namespace4}:pod-svc-acc"', !Ref "AWS::NoValue"]
                  - !If [HasNamespace5, !Sub '"system:serviceaccount:${Namespace5}:pod-svc-acc"', !Ref "AWS::NoValue"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonElastiCacheFullAccess
        - arn:aws:iam::aws:policy/AmazonPrometheusRemoteWriteAccess
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - !If
          - IsSecondProject
          - !Ref SecretManagerIamPolicy
          - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-SecretManagerIamPolicyArn}}'
        - !If
          - IsSecondProject
          - !Ref SQSIamPolicy
          - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-SQSIamPolicyArn}}'
        - !Ref S3IamPolicy
      RoleName: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-pod-svc-acc-role'
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  ParameterSecretManagerIamPolicyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-SecretManagerIamPolicyArn'
      Description: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-SecretManagerIamPolicyArn'
      Value: !If
        - IsSecondProject
        - !Ref SecretManagerIamPolicy
        - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-SecretManagerIamPolicyArn}}'
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterSQSIamPolicyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-SQSIamPolicyArn'
      Description: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-SQSIamPolicyArn'
      Value: !If
        - IsSecondProject
        - !Ref SQSIamPolicy
        - !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-SQSIamPolicyArn}}'
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterS3IamPolicyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-S3IamPolicyArn'
      Description: !Sub '${AppShortName}-${EnvName}-${FargateProfileName}-parameter-S3IamPolicyArn'
      Value: !Ref S3IamPolicy
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7
