AWSTemplateFormatVersion: 2010-09-09
## VPC-id, Subnets ID, ClusterSharedNodeSecurityGroup name, Cluster Control Plane name and Control Plane SecurityGroup name to be updated as per requirements.
Description: EKSPrivateCluster v7
Mappings:
  ServicePrincipalPartitionMap:
    aws:
      EC2: ec2.amazonaws.com
      EKS: eks.amazonaws.com
      EKSFargatePods: eks-fargate-pods.amazonaws.com
Parameters:
  AWSRegion:
    Type: String
    Description: AWS Region
    AllowedValues: 
      - ap-southeast-1
    Default: ap-southeast-1
  AppShortName:
    Type: String
    Description: AppShortName
    Default: ""
  EnvName:
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
    Description: Environment
    Default: "nprd"
  EKSAuthenticationMode:
    Type: String
    Description: EKS Cluster Authentication Mode - API (Access Entry API only), CONFIG_MAP (aws-auth ConfigMap only), or API_AND_CONFIG_MAP (both methods)
    AllowedValues:
      - API
      - CONFIG_MAP
      - API_AND_CONFIG_MAP
    Default: API
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VpcId of your existing Virtual Private Cloud (VPC)
    Default: ""
  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of App Subnet IDs
    Default: ""
  VPCSubnetCidrAppAZ1:
    Type: String
    Description: VPC Subnet CIDR for App AZ1
    Default: ""
  VPCSubnetCidrAppAZ2:
    Type: String
    Description: VPC Subnet CIDR for App AZ2
    Default: ""
  VPCSubnetCidrAppAZ3:
    Type: String
    Description: VPC Subnet CIDR for App AZ3
    Default: ""
  AppIngressNodePort:
    Type: String
    Description: Port Number for AppIngress(Frontend) Nodes/Pods
    Default: ""
  InternalIngressNodePort:
    Type: String
    Description: Port Number for InternalIngress(Backend) Nodes/Pods
    Default: ""
  HasCustomPorts:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Enable custom port range for InternalIngressController
  CustomPortStart:
    Type: String
    Default: ""
    Description: Start of custom port range for InternalIngressController
  CustomPortEnd:
    Type: String
    Default: ""
    Description: End of custom port range for InternalIngressController
  HIPDeploymentServer01:
    Type: String
    Description: Ansible AutoDeployment IP
    Default: ""
  HIPDeploymentServer02:
    Type: String
    Description: Ansible AutoDeployment IP
    Default: ""
  HIPDeploymentServer03:
    Type: String
    Description: Ansible AutoDeployment IP
    Default: ""
  DeploymentServerUTL01:
    Type: String
    Description: Deployment/Tooling Server 01
    Default: ""
  NLBIngressSecurityGroupId:
    Type: String
    Description: Security Group ID of the NLB created in the NLB Ingress stack
  HSGWSubnet01:
    Type: String
    Description: HSGW Subnet/IP information
    Default: ""
  HSGWSubnet02:
    Type: String
    Description: HSGW Subnet/IP information
    Default: ""
  HSGWSubnet03:
    Type: String
    Description: HSGW Subnet/IP information
  PrefixListNLBIngress:
    Type: String
    Description: Prefix list for Whitelisted NLB Ingress
    Default: ""
  KMSKeyRotationPeriod:
    Type: Number
    Description: Number of days for KMS key rotation period (default 365 days)
    Default: 365
  EnableEKSSecretsEncryption:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: Enable EKS Kubernetes secrets encryption at rest using EKSkmsKey. Keep true for new deployments; set false only when upgrading an existing cluster to avoid CloudFormation cluster replacement.
  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""
  DBSubnetCidrAZ1:
    Type: String
    Description: DB Subnet CIDR for AZ1
    Default: ""
  
  DBSubnetCidrAZ2:
    Type: String
    Description: DB Subnet CIDR for AZ2
    Default: ""

  DBSubnetCidrAZ3:
    Type: String
    Description: DB Subnet CIDR for AZ3 (optional)
    Default: ""

  ProdDBPort:
    Type: String
    Default: 53341
    NoEcho: true

  NProdDBPort:
    Type: String
    Default: 53331
    NoEcho: true


Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVPCSubnetCidrAppAZ3: !Not [!Equals [!Ref VPCSubnetCidrAppAZ3, '']]
  HasNLBIngressSecurityGroup: !Not [!Equals [!Ref NLBIngressSecurityGroupId, '']]
  HasHIPDeploymentServer03: !Not [!Equals [!Ref HIPDeploymentServer03, '']]
  HasHSGWSubnet01: !Not [!Equals [!Ref HSGWSubnet01, '']]
  HasHSGWSubnet02: !Not [!Equals [!Ref HSGWSubnet02, '']]
  HasHSGWSubnet03: !Not [!Equals [!Ref HSGWSubnet03, '']]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, ""]]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasCustomPorts: !Equals [!Ref HasCustomPorts, "true"]
  HasPrefixListNLBIngress: !Not [!Equals [!Ref PrefixListNLBIngress, '']]
  HasDBSubnetCidrAZ3: !Not [!Equals [!Ref DBSubnetCidrAZ3, '']]
  HasCustomPortsAndVPCSubnetCidrAppAZ3: !And [!Condition HasCustomPorts, !Condition HasVPCSubnetCidrAppAZ3]
  EnableEKSSecretsEncryptionCondition: !Equals [!Ref EnableEKSSecretsEncryption, "true"]

Resources:
## KMS Key and Secret Keys
  EKSkmsKey:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Description: KMS key for container secret keys
      EnableKeyRotation: true
      RotationPeriodInDays: !Ref KMSKeyRotationPeriod
      PendingWindowInDays: 7
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'

  EKSkmsKeyAlias:
    Type: 'AWS::KMS::Alias'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AliasName: !Sub alias/${AppShortName}-${EnvName}-kms-eks-secretsencryption
      TargetKeyId: !Ref EKSkmsKey

## IAM Policy
  PolicySecretsManageraccess:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-secretsmanageraccess-policy
      Description: Policy to allow access container secret keys
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetResourcePolicy'
              - 'secretsmanager:GetSecretValue'
              - 'kms:Decrypt'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:ListSecretVersionIds'
            Resource:
              # - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-docker-*
              # - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-a-docker-*
              # - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-b-docker-*
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-*
              - !GetAtt EKSkmsKey.Arn
          - Effect: Allow
            Action:
              - 'secretsmanager:GetRandomPassword'
              - 'secretsmanager:ListSecrets'
            Resource: '*'

  PolicyEKSLoadBalancerController:
    Type: 'AWS::IAM::ManagedPolicy'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-eks-loadbalancerController-policy
      Description: EKS LoadBalancer Controller Policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
            - iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
            - ec2:DescribeAccountAttributes
            - ec2:DescribeAddresses
            - ec2:DescribeAvailabilityZones
            - ec2:DescribeInternetGateways
            - ec2:DescribeVpcs
            - ec2:DescribeVpcPeeringConnections
            - ec2:DescribeSubnets
            - ec2:DescribeSecurityGroups
            - ec2:DescribeInstances
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeTags
            - ec2:GetCoipPoolUsage
            - ec2:DescribeCoipPools
            - ec2:GetSecurityGroupsForVpc
            - ec2:DescribeIpamPools
            - elasticloadbalancing:DescribeLoadBalancers
            - elasticloadbalancing:DescribeLoadBalancerAttributes
            - elasticloadbalancing:DescribeListeners
            - elasticloadbalancing:DescribeListenerCertificates
            - elasticloadbalancing:DescribeSSLPolicies
            - elasticloadbalancing:DescribeRules
            - elasticloadbalancing:DescribeTargetGroups
            - elasticloadbalancing:DescribeTargetGroupAttributes
            - elasticloadbalancing:DescribeTargetHealth
            - elasticloadbalancing:DescribeTags
            - elasticloadbalancing:DescribeTrustStores
            - elasticloadbalancing:DescribeListenerAttributes
            - elasticloadbalancing:DescribeCapacityReservation
            Resource: "*"
          - Effect: Allow
            Action:
            - cognito-idp:DescribeUserPoolClient
            - acm:ListCertificates
            - acm:DescribeCertificate
            - iam:ListServerCertificates
            - iam:GetServerCertificate
            - waf-regional:GetWebACL
            - waf-regional:GetWebACLForResource
            - waf-regional:AssociateWebACL
            - waf-regional:DisassociateWebACL
            - wafv2:GetWebACL
            - wafv2:GetWebACLForResource
            - wafv2:AssociateWebACL
            - wafv2:DisassociateWebACL
            - shield:GetSubscriptionState
            - shield:DescribeProtection
            - shield:CreateProtection
            - shield:DeleteProtection
            Resource: "*"
          - Effect: Allow
            Action:
            - ec2:AuthorizeSecurityGroupIngress
            - ec2:RevokeSecurityGroupIngress
            Resource: "*"
          - Effect: Allow
            Action:
            - ec2:CreateSecurityGroup
            Resource: "*"
          - Effect: Allow
            Action:
            - ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - ec2:CreateTags
            - ec2:DeleteTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - ec2:AuthorizeSecurityGroupIngress
            - ec2:RevokeSecurityGroupIngress
            - ec2:DeleteSecurityGroup
            Resource: "*"
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - elasticloadbalancing:CreateLoadBalancer
            - elasticloadbalancing:CreateTargetGroup
            Resource: "*"
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - elasticloadbalancing:CreateListener
            - elasticloadbalancing:DeleteListener
            - elasticloadbalancing:CreateRule
            - elasticloadbalancing:DeleteRule
            Resource: "*"
          - Effect: Allow
            Action:
            - elasticloadbalancing:AddTags
            - elasticloadbalancing:RemoveTags
            Resource:
            - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
            - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
            - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - elasticloadbalancing:AddTags
            - elasticloadbalancing:RemoveTags
            Resource:
            - arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*
            - arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*
            - arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*
            - arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*
          - Effect: Allow
            Action:
            - elasticloadbalancing:ModifyLoadBalancerAttributes
            - elasticloadbalancing:SetIpAddressType
            - elasticloadbalancing:SetSecurityGroups
            - elasticloadbalancing:SetSubnets
            - elasticloadbalancing:DeleteLoadBalancer
            - elasticloadbalancing:ModifyTargetGroup
            - elasticloadbalancing:ModifyTargetGroupAttributes
            - elasticloadbalancing:DeleteTargetGroup
            - elasticloadbalancing:ModifyListenerAttributes
            - elasticloadbalancing:ModifyCapacityReservation
            - elasticloadbalancing:ModifyIpPools
            Resource: "*"
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - elasticloadbalancing:AddTags
            Resource:
            - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
            - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
            - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              StringEquals:
                elasticloadbalancing:CreateAction:
                - CreateTargetGroup
                - CreateLoadBalancer
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
            - elasticloadbalancing:RegisterTargets
            - elasticloadbalancing:DeregisterTargets
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
            - elasticloadbalancing:SetWebAcl
            - elasticloadbalancing:ModifyListener
            - elasticloadbalancing:AddListenerCertificates
            - elasticloadbalancing:RemoveListenerCertificates
            - elasticloadbalancing:ModifyRule
            - elasticloadbalancing:SetRulePriorities
            Resource: "*"

  PolicyCloudWatchMetrics:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-eks-CloudWatchMetrics-policy
      Description: Policy to allow updating the CloudWatchMetric Data
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - 'cloudwatch:PutMetricData'
            Effect: Allow
            Resource: '*'

  PolicyELBPermissions:
    Type: 'AWS::IAM::ManagedPolicy'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-eks-ELBPermissions-policy
      Description: EKS ELBPermission Policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - 'ec2:DescribeAccountAttributes'
              - 'ec2:DescribeAddresses'
              - 'ec2:DescribeInternetGateways'
            Effect: Allow
            Resource: '*'

  PolicySQSaccess:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-sqs-access-policy
      Description: Policy to allow access sqs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'sqs:DeleteMessage'
              - 'sqs:GetQueueUrl'
              - 'sqs:ListDeadLetterSourceQueues'
              - 'sqs:ChangeMessageVisibility'
              - 'sqs:PurgeQueue'
              - 'sqs:ReceiveMessage'
              - 'sqs:DeleteQueue'
              - 'sqs:SendMessage'
              - 'sqs:GetQueueAttributes'
              - 'sqs:ListQueueTags'
              - 'sqs:CreateQueue'
              - 'sqs:SetQueueAttributes'
            Resource:
              - !Sub arn:aws:sqs:${AWSRegion}:${AWS::AccountId}:${AppShortName}-${EnvName}-sqs*

## IAM Roles
  eksNodeRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      RoleName: !Sub ${AppShortName}-${EnvName}-eks-Node-role
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  FargatePodExecutionRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - !FindInMap 
                  - ServicePrincipalPartitionMap
                  - !Ref 'AWS::Partition'
                  - EKSFargatePods
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      RoleName: !Sub ${AppShortName}-${EnvName}-fargate-PodExecution-role
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  eksClusterServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
        - !Ref PolicyCloudWatchMetrics
        - !Ref PolicyELBPermissions
      RoleName: !Sub ${AppShortName}-${EnvName}-eks-ClusterService-role
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

## Security Group
  AppIngressControllerSG:
    Type: 'AWS::EC2::SecurityGroup'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Security Group for App Ingress Controller ALB
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-app-ingress-controller
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-app-ingress-controller
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ1
          Description: Allow App Subnet AZ1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ2
          Description: Allow App Subnet AZ2
        - !If
          - HasVPCSubnetCidrAppAZ3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VPCSubnetCidrAppAZ3
            Description: Allow App Subnet AZ3
          - !Ref "AWS::NoValue"
        - !If
          - HasNLBIngressSecurityGroup
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourceSecurityGroupId: !Ref NLBIngressSecurityGroupId
            Description: Allow access from NLB Ingress security group
          - !Ref "AWS::NoValue"
        - !If
          - HasHSGWSubnet01
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HSGWSubnet01
            Description: Allow HSGW subnet1
          - !Ref "AWS::NoValue"
        - !If
          - HasHSGWSubnet02
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HSGWSubnet02
            Description: Allow HSGW subnet2
          - !Ref "AWS::NoValue"
        - !If
          - HasHSGWSubnet03
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HSGWSubnet03
            Description: Allow HSGW subnet3
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref DeploymentServerUTL01
          Description: Deployment Server 01
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref VPCSubnetCidrAppAZ1
          Description: Allow App Subnet AZ1
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref VPCSubnetCidrAppAZ2
          Description: Allow App Subnet AZ2
        - !If
          - HasVPCSubnetCidrAppAZ3
          - IpProtocol: tcp
            FromPort: 8443
            ToPort: 8443
            CidrIp: !Ref VPCSubnetCidrAppAZ3
            Description: Allow App Subnet AZ3
          - !Ref "AWS::NoValue"

  InternalIngressControllerSG:
    Type: 'AWS::EC2::SecurityGroup'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Security Group for Internal Ingress Controller ALB
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-Internal-IngressAlb
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-Internal-IngressAlb
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ1
          Description: Allow App Subnet AZ1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ2
          Description: Allow App Subnet AZ2
        - !If
          - HasVPCSubnetCidrAppAZ3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VPCSubnetCidrAppAZ3
            Description: Allow App Subnet AZ3
          - !Ref "AWS::NoValue"
        - !If
          - HasPrefixListNLBIngress
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListNLBIngress
          - !Ref "AWS::NoValue"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
