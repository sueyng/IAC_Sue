####Added on 28 Aug 2025######################################################

#InternalIngressController access to Fargate pods
  InternalIngressToDefaultClusterSG:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      Description: Allow the communication from Internal Ingress to Fargate Pods
      FromPort: !Ref InternalIngressNodePort
      GroupId: !GetAtt
        - ControlPlane
        - ClusterSecurityGroupId
      IpProtocol: tcp
      SourceSecurityGroupId: !GetAtt InternalIngressControllerSG.GroupId
      ToPort: !Ref InternalIngressNodePort

  ControlPlane:
    Type: 'AWS::EKS::Cluster'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      # EKS Access Entry API Authentication (API mode)
      # The cluster creator (IAM principal deploying the stack) automatically gets admin access.
      # For v5 migration, use API_AND_CONFIG_MAP first, then move to API after access entries are confirmed.
      AccessConfig:
        AuthenticationMode: !Ref EKSAuthenticationMode
      EncryptionConfig: !If
        - EnableEKSSecretsEncryptionCondition
        - - Resources:
              - secrets
            Provider:
              KeyArn: !GetAtt EKSkmsKey.Arn
        - !Ref "AWS::NoValue"
      KubernetesNetworkConfig:
        IpFamily: ipv4
      Name: !Sub ${AppShortName}-${EnvName}-app-eks
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
        SecurityGroupIds:
          - !Ref ControlPlaneSecurityGroup
        SubnetIds: !Ref AppSubnetIds
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      RoleArn: !GetAtt eksClusterServiceRole.Arn
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7


  # CoreDNS Add-on
  EKSAddon:
    Type: AWS::EKS::Addon
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties: 
      AddonName: coredns
      ClusterName: !Ref ControlPlane
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  # Cert Manager Add-on
  CertManagerAddon:
    Type: AWS::EKS::Addon
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties: 
      AddonName: cert-manager
      ClusterName: !Ref ControlPlane
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
    DependsOn:
      - EKSAddon
      - EKSFargateProfilemonitoring

  # Kube State Metrics Add-on
  KubeStateMetricsAddon:
    Type: AWS::EKS::Addon
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties: 
      AddonName: kube-state-metrics
      ClusterName: !Ref ControlPlane
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
    DependsOn:
      - EKSAddon
      - EKSFargateProfilemonitoring

  # Metrics Server Add-on (runs in kube-system namespace)
  MetricsServerAddon:
    Type: AWS::EKS::Addon
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties: 
      AddonName: metrics-server
      ClusterName: !Ref ControlPlane
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
    DependsOn:
      - EKSAddon

# EKS Fargate Profile
  EKSFargateProfileDefault:
    Type: 'AWS::EKS::FargateProfile'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FargateProfileName: fp_default
      ClusterName: !Ref ControlPlane
      PodExecutionRoleArn: !GetAtt FargatePodExecutionRole.Arn
      Subnets: !Ref AppSubnetIds
      Selectors:
        - Namespace: default
        - Namespace: kube-system
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

# EKS Fargate Profile for monitoring
  EKSFargateProfilemonitoring:
    Type: 'AWS::EKS::FargateProfile'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FargateProfileName: fp_observability
      ClusterName: !Ref ControlPlane
      PodExecutionRoleArn: !GetAtt FargatePodExecutionRole.Arn
      Subnets: !Ref AppSubnetIds
      Selectors:
        - Namespace: fargate-container-insights
        - Namespace: opentelemetry-operator-system
        - Namespace: cert-manager
        - Namespace: aws-observability
        - Namespace: kube-state-metrics
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
    DependsOn:
      - EKSFargateProfileDefault

  EKSLoadBalancerControllerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcProviderEndpoint}"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${OidcProviderEndpoint}:aud": "sts.amazonaws.com",
                    "${OidcProviderEndpoint}:sub": "system:serviceaccount:kube-system:aws-load-balancer-controller"
                  }
                }
              }
            ]
          }
        - OidcProviderEndpoint: !Select [1, !Split ["//", !GetAtt ControlPlane.OpenIdConnectIssuerUrl]]
      ManagedPolicyArns:
        - !Ref PolicyEKSLoadBalancerController
      RoleName: !Sub ${AppShortName}-${EnvName}-AmazonEKSLoadBalancerControllerRole
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

#EKS OTEL Service Account Role
  otelServiceAccountRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcProviderEndpoint}"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${OidcProviderEndpoint}:aud": "sts.amazonaws.com",
                    "${OidcProviderEndpoint}:sub": "system:serviceaccount:opentelemetry-operator-system:otel-collector"
                  }
                }
              }
            ]
          }
        - OidcProviderEndpoint: !Select [1, !Split ["//", !GetAtt ControlPlane.OpenIdConnectIssuerUrl]]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonPrometheusRemoteWriteAccess
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      RoleName: !Sub ${AppShortName}-${EnvName}-eks-otel-svc-acc-role
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

  EKSFargateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub ${AppShortName}-${EnvName}-eks-fargate-logs
      RetentionInDays: 365
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7

# Parameters will be referenced by EKS Fargate Profile Template
  ParameterEKSControlPlane: #Parameter for EKS Control Plane
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-EKSControlPlane
      Description: !Sub ${AppShortName}-${EnvName}-parameter-EKSControlPlane
      Value: !Ref ControlPlane
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterFargatePodExecutionRoleArn: #Parameter for Fargate Pod Execution Role ARN
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-FargatePodExecutionRoleArn
      Description: !Sub ${AppShortName}-${EnvName}-parameter-FargatePodExecutionRoleArn
      Value: !GetAtt FargatePodExecutionRole.Arn
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterSecretManagerIamPolicyArn: #Parameter for Secret Manager IAM Policy ARN
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-SecretManagerIamPolicyArn
      Description: !Sub ${AppShortName}-${EnvName}-parameter-SecretManagerIamPolicyArn
      Value: !Ref PolicySecretsManageraccess
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterSQSIamPolicyArn: #Parameter for SQS IAM Policy ARN
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-SQSIamPolicyArn
      Description: !Sub ${AppShortName}-${EnvName}-parameter-SQSIamPolicyArn
      Value: !Ref PolicySQSaccess
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7


  ParameterOidcProviderEndpoint: #Parameter for OIDC Provider Endpoint URL
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-OidcProviderEndpoint
      Description: !Sub ${AppShortName}-${EnvName}-parameter-OidcProviderEndpoint
      Value: !Select [1, !Split ["//", !GetAtt ControlPlane.OpenIdConnectIssuerUrl]]
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

  ParameterEKSkmsKeyId: #Parameter for EKS KMS Key
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-EKSkmsKeyId
      Description: !Sub ${AppShortName}-${EnvName}-parameter-EKSkmsKeyId
      Value: !Ref EKSkmsKey
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: InfraPlatform-EKS-v7

Outputs:
  EKSClusterName:
    Description: EKS Cluster Name
    Value: !Ref ControlPlane

  OIDCProviderEndpoint:
    Description: OIDC Provider Endpoint (without https://)
    Value: !Select [1, !Split ["//", !GetAtt ControlPlane.OpenIdConnectIssuerUrl]]

  ClusterArn:
    Description: EKS Cluster ARN
    Value: !GetAtt ControlPlane.Arn

  EKSAuthenticationMode:
    Description: EKS Cluster Authentication Mode
    Value: !Ref EKSAuthenticationMode
