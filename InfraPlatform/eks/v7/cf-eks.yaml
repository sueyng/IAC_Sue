            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: Allow HTTPS egress to VPC CIDR 3
          - !Ref AWS::NoValue
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: Allow HTTPS egress to VPC CIDR 4
          - !Ref AWS::NoValue
        - !If
          - HasVpcCidr5
