  ControlPlaneSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-ControlPlane
      GroupDescription: Communication between the control plane and worker nodegroups
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-ControlPlane
        - Key: IaCVersion
          Value: InfraPlatform-EKS-v7
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ1
          Description: Allow App Subnet AZ1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAppAZ2
          Description: Allow App Subnet AZ2
        - !If
          - HasVPCSubnetCidrAppAZ3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VPCSubnetCidrAppAZ3
            Description: Allow App Subnet AZ3
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref HIPDeploymentServer01
          Description: Ansible AutoDeployment Server 01
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref HIPDeploymentServer02
          Description: Ansible AutoDeployment Server 02
        - !If
          - HasHIPDeploymentServer03
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HIPDeploymentServer03
            Description: Ansible AutoDeployment Server 03
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref DeploymentServerUTL01
          Description: Deployment Server 01
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"   
        - IpProtocol: tcp
          FromPort: 10250
          ToPort: 10250
          CidrIp: !Ref VpcCidr1
          Description: Allow Kubelet communication on port 10250 (App Subnet AZ1)
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 10250
            ToPort: 10250
            CidrIp: !Ref VpcCidr2
            Description: Allow Kubelet communication on port 10250 (App Subnet AZ2)
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 10250
            ToPort: 10250
            CidrIp: !Ref VpcCidr3
            Description: Allow Kubelet communication on port 10250 (App Subnet AZ3)
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 10250
            ToPort: 10250
            CidrIp: !Ref VpcCidr4
            Description: Allow Kubelet communication on port 10250 (VPC CIDR 4)
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 10250
            ToPort: 10250
            CidrIp: !Ref VpcCidr5
            Description: Allow Kubelet communication on port 10250 (VPC CIDR 5)
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr1
          Description: Allow DNS (TCP 53) from VPC CIDR 1
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr2
            Description: Allow DNS (TCP 53) from VPC CIDR 2
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr3
            Description: Allow DNS (TCP 53) from VPC CIDR 3
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr4
            Description: Allow DNS (TCP 53) from VPC CIDR 4
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr5
            Description: Allow DNS (TCP 53) from VPC CIDR 5
          - !Ref "AWS::NoValue"
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr1
          Description: Allow DNS (UDP 53) from VPC CIDR 1
        - !If 
          - HasVpcCidr2
          - IpProtocol: udp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr2
            Description: Allow DNS (UDP 53) from VPC CIDR 2
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: udp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr3
            Description: Allow DNS (UDP 53) from VPC CIDR 3
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: udp
            FromPort: 53
            ToPort: 53
            CidrIp: !Ref VpcCidr4
            Description: Allow DNS (UDP 53) from VPC CIDR 4
          - !Ref "AWS::NoValue"
        - !If
