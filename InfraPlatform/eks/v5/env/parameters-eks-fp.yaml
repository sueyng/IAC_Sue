# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# Prerequisites:
# ⚠️ EKS cluster must be deployed first (cf-eks.yaml)
# ⚠️ Pod execution role must be stored in SSM Parameter Store
# ⚠️ Kubernetes namespaces must exist before deploying pods
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# APPLICATION BASICS
AppShortName: "<edit_here>"             # 📝 e.g. hsxx, myapp, frontend (max 10 characters)
EnvName: "<edit_here>"                  # 📝 e.g. nprd-dev, nprd-sit1, prod

# FARGATE PROFILE
FargateProfileName: "<edit_here>"       # 📝 e.g. hsxx-nprd-dev-ab, myapp-prod-frontend (max 63 characters)

# KUBERNETES NAMESPACES (at least 2 required)
Namespace1: "<edit_here>"               # 📝 e.g. myapp-nprd-dev-a, frontend-prod
Namespace2: "<edit_here>"               # 📝 e.g. myapp-nprd-dev-b, backend-prod

# NETWORK CONFIGURATION
AppSubnetIds: "<edit_here>"             # 📝 e.g. subnet-xxx,subnet-yyy,subnet-zzz (min 2 subnets, comma-separated)

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================

# ADDITIONAL KUBERNETES NAMESPACES
Namespace3: ""                          # 3rd namespace (optional)
Namespace4: ""                          # 4th namespace (optional)
Namespace5: ""                          # 5th namespace (optional)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Used to retrieve Pod Execution Role from SSM Parameter Store
# - SSM Path: /{AppShortName}/{EnvName}/eks/fargate-pod-execution-role-arn
# - Enables multi-application deployments in same EKS cluster
#
# Format: Lowercase alphanumeric, max 10 characters
# Example: hsxx, myapp, frontend
#
# Must Match:
# - AppShortName used in cf-eks.yaml deployment
# - SSM parameter path created during EKS cluster setup

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Allowed Values:
# Non-Production:
# - nprd, nprd-dev, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit
# - nprd-sit-a, nprd-sit-b, nprd-sit-c
# - nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c
# - nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#
# Production:
# - prod, prod-a, prod-b, prod-c
#
# Purpose:
# - Used with AppShortName to retrieve Pod Execution Role from SSM
# - Must match environment used in cf-eks.yaml deployment
#
# SSM Parameter Path:
# /{AppShortName}/{EnvName}/eks/fargate-pod-execution-role-arn

# --- FARGATE PROFILE NAME ---
# FargateProfileName: Unique identifier for this Fargate profile
#
# Requirements:
# - Must be unique within the EKS cluster
# - Maximum 63 characters
# - Alphanumeric and hyphens only
# - Cannot start or end with hyphen
#
# Naming Convention:
# {AppShortName}-{EnvName}-{identifier}
# Example: hsxx-nprd-dev-ab, myapp-prod-frontend
#
# Best Practices:
# - Include environment name for clarity
# - Use descriptive identifier (team name, app component)
# - Keep consistent with namespace naming
#
# Finding Existing Fargate Profiles:
# AWS Console:
# 1. Navigate to EKS → Clusters → Select your cluster
# 2. Go to Compute tab → Fargate profiles section
# 3. View list of existing profiles to avoid name conflicts

# --- NAMESPACE 1-5 ---
# Namespace1-5: Kubernetes namespaces assigned to this Fargate profile
#
# Requirements:
# - Namespace1 and Namespace2 are required (minimum 2 namespaces)
# - Namespace3-5 are optional
# - Maximum 5 namespaces per Fargate profile
# - Namespaces must exist or be created before pod deployment
# - Each namespace can only be assigned to one Fargate profile
#
# Namespace Selection Strategy:
# - Separate by application: One profile per application
# - Separate by environment: dev-a, dev-b, staging, production
# - Separate by team: team-alpha, team-beta
# - Separate by workload type: web, api, worker
#
# Default Profiles Already Created (by cf-eks.yaml):
# - fp_default: default, kube-system
# - fp_observability: fargate-container-insights, opentelemetry-operator-system,
#   cert-manager, aws-observability, kube-state-metrics
#
# ⚠️ Do not use these namespaces in custom Fargate profiles:
# - default
# - kube-system
# - fargate-container-insights
# - opentelemetry-operator-system
# - cert-manager
# - aws-observability
# - kube-state-metrics
#
# Common Namespace Patterns:
# - Application-based: myapp-frontend, myapp-backend, myapp-worker
# - Environment-based: dev, staging, production
# - Team-based: team-alpha, team-beta, team-gamma
# - Workload-based: web-tier, api-tier, data-tier
#
# How Fargate Profile Matching Works:
# 1. Pod is scheduled with namespace label
# 2. EKS checks if namespace matches any Fargate profile
# 3. If match found, pod runs on Fargate (serverless)
# 4. If no match, pod remains Pending (unless node groups available)
#
# Creating Namespaces:
# AWS Console (via CloudShell or local kubectl):
# kubectl create namespace {namespace-name}
# kubectl label namespace {namespace-name} name={namespace-name}
#
# Verifying Namespaces:
# kubectl get namespaces
# kubectl describe namespace {namespace-name}

# --- APP SUBNET IDS ---
# AppSubnetIds: Subnets where Fargate pods will run
#
# Requirements:
# - Minimum 2 subnets in different Availability Zones (required)
# - Maximum 3 subnets for high availability
# - Must be private subnets (no direct internet access)
# - Must have route to NAT Gateway for pulling container images
# - Must have sufficient available IP addresses
# - Comma-separated list (no spaces)
#
# Format: subnet-{17-char-hex},subnet-{17-char-hex}
# Example: subnet-08170d48a795103d2,subnet-083fba964c347656f
#
# Best Practices:
# - Use same subnets as EKS cluster (from cf-eks.yaml)
# - Ensure subnets span multiple AZs (e.g., ap-southeast-1a, 1b, 1c)
# - Private subnets with NAT Gateway route required
# - Verify VPC endpoint access (ECR, S3, CloudWatch, EKS)
#
# IP Address Allocation:
# - Each Fargate pod receives one ENI with one IP address
# - Plan for sufficient IP addresses per subnet
# - Consider maximum pod count per namespace
# - Example: 100 pods across 2 subnets = 50 IPs per subnet minimum
#
# Finding Subnet IDs:
# AWS Console:
# 1. Navigate to VPC → Subnets
# 2. Filter by VPC ID (from EKS cluster)
# 3. Identify private subnets (typically tagged with "private" in name)
# 4. Verify different Availability Zones
# 5. Copy subnet IDs (format: subnet-xxxxxxxxxxxxxxxxx)
# 6. Check available IP addresses (should have sufficient capacity)
#
# Verifying Subnet Configuration:
# AWS Console:
# 1. VPC → Subnets → Select subnet
# 2. Route table tab:
#    - Verify route to NAT Gateway (0.0.0.0/0 → nat-xxx)
#    - Verify local VPC route
# 3. Check available IPv4 addresses
# 4. Verify subnet tags:
#    - kubernetes.io/cluster/{cluster-name} = shared
#    - kubernetes.io/role/internal-elb = 1 (for internal load balancers)

# --- POD EXECUTION ROLE (AUTOMATIC RETRIEVAL) ---
# Note: Pod execution role is automatically retrieved from SSM Parameter Store
#
# SSM Parameter Path:
# /{AppShortName}/{EnvName}/eks/fargate-pod-execution-role-arn
#
# Role Created By: cf-eks.yaml (main EKS cluster template)
#
# Role Permissions:
# - AmazonEKSFargatePodExecutionRolePolicy (AWS managed)
# - CloudWatch Logs write access (for container logs)
# - ECR image pull access (for container images)
# - VPC endpoint access (for AWS services)
#
# Verifying SSM Parameter:
# AWS Console:
# 1. Navigate to Systems Manager → Parameter Store
# 2. Search: /{AppShortName}/{EnvName}/eks/fargate-pod-execution-role-arn
# 3. Verify parameter exists and contains valid IAM role ARN
# 4. Example ARN: arn:aws:iam::123456789012:role/myapp-nprd-eks-fargate-pod-execution-role
#
# Pod Execution Role vs Pod IAM Role (IRSA):
# - Pod Execution Role: Used by Fargate to launch and manage pods
#   - Pulls container images from ECR
#   - Writes logs to CloudWatch
#   - Manages pod networking and storage
#
# - Pod IAM Role (IRSA): Used by application running inside pod
#   - Access AWS services (S3, DynamoDB, SQS, etc.)
#   - Must be created separately
#   - Assigned via Kubernetes service account
#
# Configuring Pod IAM Roles (IRSA):
# Create service account with role annotation:
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: my-service-account
#   namespace: my-namespace
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-pod-role
#
# Then reference in pod spec:
# spec:
#   serviceAccountName: my-service-account

# --- FARGATE PROFILE DEPLOYMENT ---
# After deploying this template:
#
# 1. Verify Fargate Profile:
# AWS Console:
# - EKS → Clusters → Select cluster → Compute tab → Fargate profiles
# - Verify profile shows as "Active"
# - Check namespace selectors match your configuration
#
# 2. Create Kubernetes Namespaces (if not exists):
# kubectl create namespace {namespace-name}
# kubectl label namespace {namespace-name} name={namespace-name}
#
# 3. Deploy Pods to Fargate:
# apiVersion: v1
# kind: Pod
# metadata:
#   name: my-app
#   namespace: {namespace-from-fargate-profile}
# spec:
#   containers:
#   - name: my-container
#     image: my-image:latest
#
# 4. Verify Pod Running on Fargate:
# kubectl get pods -n {namespace-name}
# kubectl describe pod {pod-name} -n {namespace-name}
# - Check "Node:" field shows "fargate-xxx" (Fargate node)
# - Check events for successful scheduling

# --- FARGATE PROFILE LIMITS ---
# AWS Limits per EKS Cluster:
# - Maximum 10 Fargate profiles per cluster
# - Maximum 5 namespaces per Fargate profile
# - Maximum 50 selectors per Fargate profile (namespace + label selectors)
#
# Fargate Pod Limits:
# - vCPU: 0.25 to 4 vCPU
# - Memory: 0.5 GB to 30 GB
# - Ephemeral storage: 20 GB (fixed)
# - Maximum 4 vCPU and 30 GB memory per pod
#
# Planning Multiple Fargate Profiles:
# If you need more than 5 namespaces:
# - Create multiple Fargate profiles
# - Each profile can have up to 5 namespaces
# - Example: fp-app1 (5 namespaces), fp-app2 (5 namespaces)

# --- FARGATE PROFILE UPDATES ---
# Updating Fargate Profile:
#
# Allowed Updates (No Replacement):
# - Pod execution role ARN (if SSM parameter changes)
# - Subnet IDs (add or remove subnets)
#
# Not Allowed (Requires Replacement):
# - Fargate profile name (triggers recreation)
# - Namespace selectors (triggers recreation)
#
# Update Procedure:
# 1. Update CloudFormation template parameters
# 2. Deploy stack update
# 3. If profile is recreated:
#    - Running pods continue on old profile
#    - New pods use new profile
#    - Old profile deleted after pods terminate
#
# ⚠️ Important:
# - Changing namespaces requires creating new Fargate profile
# - Old profile must be deleted manually if CloudFormation fails
# - Pods in affected namespaces will be rescheduled

# --- DELETING FARGATE PROFILE ---
# Impact of deleting this CloudFormation stack:
#
# Before Deletion:
# 1. Verify no pods running in profile's namespaces:
#    kubectl get pods --all-namespaces
# 2. Delete or migrate pods to different namespaces
# 3. Ensure alternative scheduling target exists (node groups or other profiles)
#
# Deletion Process:
# 1. CloudFormation deletes Fargate profile
# 2. Running pods continue until terminated
# 3. New pods in these namespaces will remain Pending (no Fargate profile match)
# 4. Namespaces are NOT deleted (must delete manually if needed)
#
# Post-Deletion Cleanup:
# - Delete unused Kubernetes namespaces: kubectl delete namespace {namespace-name}
# - Remove SSM parameter if no longer needed (manual)
# - Verify no orphaned resources
