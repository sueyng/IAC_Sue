# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates secret names: {AppShortName}-{EnvName}-docker-ConnectionStrings
# - Used to retrieve KMS key from SSM: {AppShortName}-{ParentEnv}-parameter-EKSkmsKeyId
# - Enables multi-application deployments in same EKS cluster
#
# Format: Lowercase alphanumeric, max 10 characters
# Example: hsxx, myapp, frontend
#
# Must Match:
# - AppShortName used in cf-eks.yaml deployment
# - SSM parameter path created during EKS cluster setup

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Allowed Values:
# Non-Production:
# - nprd: Base non-production
# - nprd-dev: Development
# - nprd-sit1, nprd-sit2, nprd-sit3: System Integration Test (numbered)
# - nprd-sit, nprd-sit-a, nprd-sit-b, nprd-sit-c: System Integration Test (lettered)
# - nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c: User Acceptance Test
# - nprd-pt: Performance Test
# - nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c: Pre-Production
#
# Production:
# - prod: Base production
# - prod-a, prod-b, prod-c: Production (multi-region or multi-tenant)
#
# Parent Environment Mapping:
# The template uses parent environment mapping for KMS key sharing:
#
# | EnvName      | ParentEnv  | KMS Key SSM Parameter                              |
# |--------------|------------|---------------------------------------------------|
# | prod         | prod       | {AppShortName}-prod-parameter-EKSkmsKeyId         |
# | prod-a       | prod       | {AppShortName}-prod-parameter-EKSkmsKeyId         |
# | prod-b       | prod       | {AppShortName}-prod-parameter-EKSkmsKeyId         |
# | prod-c       | prod       | {AppShortName}-prod-parameter-EKSkmsKeyId         |
# | nprd         | nprd       | {AppShortName}-nprd-parameter-EKSkmsKeyId         |
# | nprd-dev     | nprd-dev   | {AppShortName}-nprd-dev-parameter-EKSkmsKeyId     |
# | nprd-sit     | nprd-sit   | {AppShortName}-nprd-sit-parameter-EKSkmsKeyId     |
# | nprd-sit1    | nprd-sit1  | {AppShortName}-nprd-sit1-parameter-EKSkmsKeyId    |
# | nprd-sit2    | nprd-sit2  | {AppShortName}-nprd-sit2-parameter-EKSkmsKeyId    |
# | nprd-sit3    | nprd-sit3  | {AppShortName}-nprd-sit3-parameter-EKSkmsKeyId    |
# | nprd-sit-a   | nprd-sit   | {AppShortName}-nprd-sit-parameter-EKSkmsKeyId     |
# | nprd-sit-b   | nprd-sit   | {AppShortName}-nprd-sit-parameter-EKSkmsKeyId     |
# | nprd-sit-c   | nprd-sit   | {AppShortName}-nprd-sit-parameter-EKSkmsKeyId     |
# | nprd-uat     | nprd-uat   | {AppShortName}-nprd-uat-parameter-EKSkmsKeyId     |
# | nprd-uat-a   | nprd-uat   | {AppShortName}-nprd-uat-parameter-EKSkmsKeyId     |
# | nprd-uat-b   | nprd-uat   | {AppShortName}-nprd-uat-parameter-EKSkmsKeyId     |
# | nprd-uat-c   | nprd-uat   | {AppShortName}-nprd-uat-parameter-EKSkmsKeyId     |
# | nprd-pt      | nprd-pt    | {AppShortName}-nprd-pt-parameter-EKSkmsKeyId      |
# | nprd-pp      | nprd-pp    | {AppShortName}-nprd-pp-parameter-EKSkmsKeyId      |
# | nprd-pp-a    | nprd-pp    | {AppShortName}-nprd-pp-parameter-EKSkmsKeyId      |
# | nprd-pp-b    | nprd-pp    | {AppShortName}-nprd-pp-parameter-EKSkmsKeyId      |
# | nprd-pp-c    | nprd-pp    | {AppShortName}-nprd-pp-parameter-EKSkmsKeyId      |
#
# Key Sharing Examples:
# - All prod-* environments (prod, prod-a, prod-b, prod-c) share the same KMS key from prod
# - nprd-sit-a, nprd-sit-b, nprd-sit-c share KMS key from nprd-sit
# - nprd-uat-a, nprd-uat-b, nprd-uat-c share KMS key from nprd-uat
# - nprd-dev has its own dedicated KMS key
#
# Why Parent Environment Mapping?
# - Cost efficiency: Share KMS keys across related environments
# - Simplified key management: Fewer keys to rotate and monitor
# - Logical grouping: Related environments use same encryption key
# - Disaster recovery: Easier backup/restore across environment families
#
# Verifying KMS Key SSM Parameter:
# AWS Console:
# 1. Navigate to Systems Manager → Parameter Store
# 2. Search: {AppShortName}-{ParentEnv}-parameter-EKSkmsKeyId
# 3. Verify parameter exists and contains valid KMS key ID
# 4. Example value: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

# --- SECRETS CREATED BY TEMPLATE ---
# The template creates these secrets (initially empty):
#
# 1. Database Connection Strings:
# Secret Name: {AppShortName}-{EnvName}-docker-ConnectionStrings
# Purpose: Store database connection strings for applications
# Initial Value: Empty (must populate after deployment)
#
# Expected Format (JSON):
# {
#   "DefaultConnection": "Server=mydb.rds.amazonaws.com;Port=5432;Database=mydb;User Id=myuser;Password=mypassword;",
#   "ReadOnlyConnection": "Server=mydb-ro.rds.amazonaws.com;Port=5432;Database=mydb;User Id=readonly;Password=mypassword;"
# }
#
# 2. Redis Connection String:
# Secret Name: {AppShortName}-{EnvName}-docker-RedisConnectionString
# Purpose: Store Redis connection strings for caching layers
# Initial Value: Empty (must populate after deployment)
#
# Expected Format (JSON):
# {
#   "RedisConnection": "myredis.cache.amazonaws.com:6379,ssl=true,password=mypassword"
# }
#
# 3. Application Environment Variables:
# Secret Name: {AppShortName}-{EnvName}-docker-EnvironmentVariables
# Purpose: Store application configuration secrets
# Initial Value: Empty (must populate after deployment)
#
# Expected Format (JSON):
# {
#   "API_KEY": "xxxxx-xxxxx-xxxxx",
#   "JWT_SECRET": "my-jwt-secret-key",
#   "EXTERNAL_SERVICE_URL": "https://api.external.com"
# }

# --- POPULATING SECRETS AFTER DEPLOYMENT ---
# Secrets are created empty and must be populated manually after deployment.
#
# AWS Console:
# 1. Navigate to Secrets Manager → Secrets
# 2. Search for secret name: {AppShortName}-{EnvName}-docker-ConnectionStrings
# 3. Click on secret → Retrieve secret value → Edit
# 4. Select "Plaintext" tab
# 5. Enter secret value in JSON format (see examples above)
# 6. Click Save
# 7. Repeat for other secrets (RedisConnectionString, EnvironmentVariables)
#
# Security Best Practices:
# - Never commit secrets to source control
# - Use temporary credentials when possible
# - Rotate secrets regularly (30-90 days)
# - Limit IAM permissions to minimum required
# - Enable CloudTrail logging for secret access
# - Use separate secrets for each environment

# --- KMS ENCRYPTION ---
# All secrets are encrypted using the EKS cluster KMS key.
#
# KMS Key Retrieval:
# - Template retrieves KMS key ID from SSM Parameter Store
# - SSM Path: {AppShortName}-{ParentEnv}-parameter-EKSkmsKeyId
# - KMS key created by cf-eks.yaml template
#
# KMS Key Permissions:
# - Secrets Manager has permissions to use KMS key for encryption/decryption
# - IAM roles (IRSA) require kms:Decrypt permission to read secrets
# - KMS key policy allows CloudFormation to manage secrets
#
# Verifying KMS Encryption:
# AWS Console:
# 1. Secrets Manager → Secrets → Select secret
# 2. Overview tab → Encryption key
# 3. Verify KMS key ARN matches EKS cluster KMS key
#
# KMS Key Rotation:
# - AWS managed keys: Automatic rotation every year
# - Customer managed keys: Configure rotation policy (recommended annually)
# - Secret rotation does NOT trigger KMS key rotation

# --- DELETION POLICIES ---
# Secrets have environment-specific deletion policies:
#
# Production Environments (prod, prod-a, prod-b, prod-c):
# - DeletionPolicy: Retain
# - RecoveryWindowInDays: 30
# - When stack is deleted:
#   - Secrets are retained (not deleted)
#   - Must manually delete secrets after 30-day recovery window
#   - Prevents accidental data loss
#
# Non-Production Environments (nprd-*):
# - DeletionPolicy: Delete
# - RecoveryWindowInDays: 7
# - When stack is deleted:
#   - Secrets enter 7-day recovery window
#   - After 7 days, secrets are permanently deleted
#   - Can recover within 7 days if needed
#
# Recovery Window:
# - During recovery window, secret cannot be accessed
# - Can restore secret using AWS Console or CLI
# - After recovery window expires, secret is permanently deleted
#
# --- SECRET VERSIONING ---
# Secrets Manager automatically versions secrets on every update.
#
# Version Labels:
# - AWSCURRENT: Current version (default when reading secret)
# - AWSPENDING: Version being rotated (during rotation process)
# - AWSPREVIOUS: Previous version (before last update)
#
# Retrieving Specific Version:
# AWS Console:
# 1. Secrets Manager → Secrets → Select secret
# 2. Retrieve secret value → View versions
# 3. Select version by version ID or label
# 4. View or copy secret value
#
# Version History:
# - Secrets Manager stores all versions indefinitely
# - No automatic cleanup of old versions
# - Can manually delete old versions if needed
#
# Application Best Practices:
# - Always use AWSCURRENT label (default)
# - Handle version transitions during rotation
# - Implement connection retry with exponential backoff

# --- DELETING SECRETS ---
# Impact of deleting this CloudFormation stack:
#
# Production Environments (prod, prod-a, prod-b, prod-c):
# - Secrets are RETAINED (DeletionPolicy: Retain)
# - 30-day recovery window configured
# - Manual deletion required after stack deletion:
#   1. Navigate to Secrets Manager → Secrets
#   2. Select retained secret
#   3. Actions → Delete secret
#   4. Confirm 30-day recovery window
#   5. After 30 days, secret is permanently deleted
#
# Non-Production Environments (nprd-*):
# - Secrets enter 7-day recovery window
# - After 7 days, secrets are automatically deleted
# - Can recover within 7 days if needed
#
