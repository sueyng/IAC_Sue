# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Used in resource naming: {AppShortName}-{EnvName}-{Function}-ingress-NLB
# - Example: hsxx-nprd-dev-APP-ingress-NLB
# - Facilitates resource organization and cost allocation
# - Enables multi-application deployments in same VPC
#
# Format: Lowercase alphanumeric, max 10 characters
# Example: hsxx, myapp, gms, xyz
#
# Must Match:
# - AppShortName used in EKS cluster deployment
# - Consistent naming across infrastructure components

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Allowed Values:
# Non-Production:
# - nprd: Base non-production
# - nprd-dev: Development
# - nprd-sit1, nprd-sit2, nprd-sit3: System Integration Test (numbered)
# - nprd-sit, nprd-sit-a, nprd-sit-b, nprd-sit-c: System Integration Test (lettered)
# - nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c: User Acceptance Test
# - nprd-pt: Performance Test
# - nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c: Pre-Production
#
# Production:
# - prod: Base production
# - prod-a, prod-b, prod-c: Production (multi-region or multi-tenant)
#
# Impact on Resource Lifecycle:
# Production Environments (prod, prod-a, prod-b, prod-c):
# - DeletionPolicy: Retain (resources preserved on stack deletion)
# - UpdateReplacePolicy: Retain
# - NLB and target groups retained for safety
#
# Non-Production Environments (nprd-*):
# - DeletionPolicy: Delete (resources deleted on stack deletion)
# - UpdateReplacePolicy: Delete
# - Automatic cleanup

# --- FUNCTION ---
# Function: Server function identifier
#
# Allowed Values:
# - APP: Application tier (backend services, APIs, business logic)
# - WEB: Web tier (frontend, public-facing services)
#
# Purpose:
# - Resource naming: {AppShortName}-{EnvName}-{Function}-ingress-NLB
# - Helps organize resources by tier
# - Facilitates cost allocation by function
# - Enables function-specific security policies
#
# Examples:
# - APP tier: REST APIs, GraphQL endpoints, microservices
# - WEB tier: Static websites, SPAs, public-facing APIs
#
# Multi-Tier Architecture:
# - Deploy separate NLBs for APP and WEB tiers
# - Each tier has dedicated security group rules
# - Independent scaling and management

# --- VPC ID ---
# VpcId: Virtual Private Cloud identifier
#
# Purpose:
# - Specifies VPC where NLB will be deployed
# - All subnets must belong to this VPC
# - ALB target must be in same VPC
# - Security group created in this VPC
#
# Format: vpc-{16-char-hex}
# Example: vpc-0d99a0c727b301d67
#
# Finding VPC ID:
# AWS Console:
# 1. Navigate to VPC → Your VPCs
# 2. Identify VPC by name or CIDR block
# 3. Copy VPC ID from list
# 4. Verify VPC has proper route tables configured
# 5. Check VPC endpoints exist for EKS (eks, ec2, ecr.api, ecr.dkr, s3, logs)
#
# Validation:
# - VPC must exist in same region as deployment
# - VPC must have DNS resolution enabled
# - VPC must have DNS hostnames enabled
# - VPC must have proper route tables for private subnets

# --- APP SUBNET IDS ---
# AppSubnetIds: Subnets for NLB deployment
#
# Requirements:
# - Minimum 2 subnets in different Availability Zones (for high availability)
# - Maximum 3 subnets (one per AZ in ap-southeast-1: 1a, 1b, 1c)
# - Must be in same VPC as VpcId
# - Comma-separated list (no spaces)
# - Recommended: Private subnets for internal NLB
#
# Format: subnet-{17-char-hex},subnet-{17-char-hex}
# Example: subnet-08170d48a795103d2,subnet-083fba964c347656f
#
# Finding Subnet IDs:
# AWS Console:
# 1. Navigate to VPC → Subnets
# 2. Filter by VPC ID
# 3. Identify private subnets (typically no auto-assign public IP)
# 4. Verify subnets in different AZs (e.g., ap-southeast-1a, 1b, 1c)
# 5. Copy subnet IDs (format: subnet-xxxxxxxxxxxxxxxxx)
# 6. Check available IP addresses (should have sufficient capacity)
#
# Best Practices:
# - Use private subnets for internal NLB (internet-facing=false)
# - Ensure subnets span multiple AZs for high availability
# - Match subnets with ALB subnets for optimal routing
# - Verify sufficient IP addresses available (NLB uses one IP per AZ)
# - Check route tables have proper VPC endpoint routes
#
# Multi-AZ Example:
# - subnet-xxx (ap-southeast-1a): 10.0.101.0/24
# - subnet-yyy (ap-southeast-1b): 10.0.102.0/24
# - subnet-zzz (ap-southeast-1c): 10.0.103.0/24

# --- INGRESS ALB ARN ---
# IngressALBArn: ARN of the ALB created by EKS ingress controller
#
# Purpose:
# - NLB forwards traffic to this ALB as target
# - ALB manages routing to EKS pods via ingress rules
# - Enables API Gateway VPC Link integration
# - Provides static IP addresses via NLB for API Gateway
#
# Expected Format:
# arn:aws:elasticloadbalancing:{region}:{account-id}:loadbalancer/app/{name}/{id}
# Example: arn:aws:elasticloadbalancing:ap-southeast-1:781576980265:loadbalancer/app/k8s-default-myapp-abc123/1234567890abcdef
#
# Finding ALB ARN:
# AWS Console:
# 1. Navigate to EC2 → Load Balancers
# 2. Filter by VPC ID (same VPC as NLB)
# 3. Identify ALB created by ingress controller:
#    - Type: application
#    - Scheme: internal (typically)
#    - Name pattern: k8s-{namespace}-{ingress-name}-{random-id}
# 4. Select ALB and copy ARN from Details tab
# 5. Verify ALB state is "active"
# 6. Check target group has healthy targets
#
# Alternative: Via Kubernetes Ingress
# 1. View Kubernetes ingress resource:
#    kubectl get ingress {ingress-name} -n {namespace} -o yaml
# 2. Find ALB DNS name in status.loadBalancer.ingress[0].hostname
# 3. Use DNS name to find ALB in AWS Console
#
# Validation:
# - ALB must exist before deploying this stack
# - ALB must be in same VPC as NLB
# - ALB must be in "active" state
# - ALB target group should have healthy targets
# - ALB security group must allow traffic from NLB
#
# Common Issues:
# - ALB not found: Check EKS ingress controller is deployed
# - Wrong ALB: Verify ingress resource annotations and namespace
# - Unhealthy targets: Check pod readiness and security groups

# --- HEALTH CHECK PATH ---
# HealthCheckPath: HTTP path for NLB to check ALB health
#
# Purpose:
# - NLB periodically calls this path on ALB to verify it's healthy
# - Only healthy ALB receives traffic from NLB
# - Should be lightweight, fast-responding endpoint
# - Must be accessible through the entire chain: NLB → ALB → Ingress → Service → Pod
#
# Requirements:
# - Must return HTTP 200 OK for healthy status
# - Must be accessible from NLB to ALB (security groups allow traffic)
# - Should respond within health check timeout (6 seconds)
# - Path must exist on backend application
# - Path should not require authentication
#
# Common Health Check Paths:
# - /health: Generic health endpoint (RESTful convention)
# - /api/health: API-specific health check
#
# Health Check Settings (configured in template):
# - Protocol: HTTP
# - Port: 80 (traffic port)
# - Interval: 30 seconds
# - Timeout: 6 seconds
# - Healthy threshold: 3 consecutive successes (90 seconds to become healthy)
# - Unhealthy threshold: 3 consecutive failures (90 seconds to become unhealthy)
#
# Implementing Health Endpoint:
# - Return HTTP 200 with simple JSON response
# - Check database connectivity (optional)
# - Check dependencies (optional)
# - Keep response time under 1 second
# - Log minimal information to reduce noise
#
# Example Response:
# {
#   "status": "healthy",
#   "timestamp": "2025-10-10T12:00:00Z"
# }

# --- INTERNET ALB SUBNET CIDRs (OPTIONAL) ---
# InternetALBSubnetAZ1/2/3: Internet-facing ALB subnet CIDRs
#
# Purpose:
# - Creates security group ingress rules from internet ALB subnets to NLB
# - Enables multi-tier architecture: Internet ALB → NLB → Internal ALB → EKS
# - Supports hybrid public/private infrastructure
#
# When to Use:
# - Multi-tier load balancer architecture
# - Internet-facing ALB terminates SSL/TLS, forwards to NLB
# - NLB provides static IPs for API Gateway, forwards to internal ALB
# - Separate public and private load balancers
#
# Format: CIDR notation
# Example: 10.0.11.0/24, 10.0.12.0/24, 10.0.13.0/24
#
# Finding Internet ALB Subnet CIDRs:
# AWS Console:
# 1. Navigate to EC2 → Load Balancers
# 2. Select internet-facing ALB
# 3. View "Network mapping" section
# 4. Note subnet IDs for each AZ
# 5. Go to VPC → Subnets
# 6. Find each subnet and copy CIDR block
#
#
# --- HSGW SUBNETS (OPTIONAL) ---
# HSGWSubnet1/2: Hybrid Secure Gateway subnet CIDRs or IP addresses
#
# Purpose:
# - Creates security group ingress rules for HSGW traffic to NLB
#
# Format: CIDR notation or single IP with /32
# Example: 10.50.196.38/32, 10.50.196.0/24
#
# Finding HSGW Subnet/IP:
# - Contact HSGW team for subnet ranges

