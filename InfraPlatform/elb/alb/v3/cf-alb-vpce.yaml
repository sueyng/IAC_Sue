AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create a ALB with target Group to Endpoint IP Addresses and up to 24 additional ssl cert arns. v3

Parameters:
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  ALBName: 
    Description: Name for Application Load Balancer
    Type: String

  ALBScheme:
    Description: ALB type, Internet or intranet ALB
    Type: String
    AllowedValues:
      - internal
      - internet-facing    
  
  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for the Ingress Subnets where the Public ALB will be deployed.

  VPCEndpointIP1:
    Description: VPC Interface Endpoint IP - AZ1
    Type: String

  VPCEndpointIP2:
    Description: VPC Interface Endpoint IP - AZ2
    Type: String

  VPCEndpointIP3:
    Description: VPC Interface Endpoint IP - AZ3
    Type: String

  SSLCertificateArn:
    Description: The ARN of the SSL certificate to associate with the ALB HTTPS listener.
    Type: String

  PrefixListIdIntranet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic from intranet subnets

  ListenerSslPolicy:
    Type: String
    Description: ALB Latest TLS Settings
    Default: "ELBSecurityPolicy-TLS13-1-2-2021-06"

  # Additional SSL Certificate ARNs (up to 24)
  AdditionalCertificateArn1:
    Type: String
    Description: ARN of the additional SSL certificate 1
    Default: ""

  AdditionalCertificateArn2:
    Type: String
    Description: ARN of the additional SSL certificate 2
    Default: ""

  AdditionalCertificateArn3:
    Type: String
    Description: ARN of the additional SSL certificate 3
    Default: ""

  AdditionalCertificateArn4:
    Type: String
    Description: ARN of the additional SSL certificate 4
    Default: ""

  AdditionalCertificateArn5:
    Type: String
    Description: ARN of the additional SSL certificate 5
    Default: ""

  AdditionalCertificateArn6:
    Type: String
    Description: ARN of the additional SSL certificate 6
    Default: ""

  AdditionalCertificateArn7:
    Type: String
    Description: ARN of the additional SSL certificate 7
    Default: ""

  AdditionalCertificateArn8:
    Type: String
    Description: ARN of the additional SSL certificate 8
    Default: ""

  AdditionalCertificateArn9:
    Type: String
    Description: ARN of the additional SSL certificate 9
    Default: ""

  AdditionalCertificateArn10:
    Type: String
    Description: ARN of the additional SSL certificate 10
    Default: ""

  AdditionalCertificateArn11:
    Type: String
    Description: ARN of the additional SSL certificate 11
    Default: ""

  AdditionalCertificateArn12:
    Type: String
    Description: ARN of the additional SSL certificate 12
    Default: ""

  AdditionalCertificateArn13:
    Type: String
    Description: ARN of the additional SSL certificate 13
    Default: ""

  AdditionalCertificateArn14:
    Type: String
    Description: ARN of the additional SSL certificate 14
    Default: ""

  AdditionalCertificateArn15:
    Type: String
    Description: ARN of the additional SSL certificate 15
    Default: ""

  AdditionalCertificateArn16:
    Type: String
    Description: ARN of the additional SSL certificate 16
    Default: ""

  AdditionalCertificateArn17:
    Type: String
    Description: ARN of the additional SSL certificate 17
    Default: ""

  AdditionalCertificateArn18:
    Type: String
    Description: ARN of the additional SSL certificate 18
    Default: ""

  AdditionalCertificateArn19:
    Type: String
    Description: ARN of the additional SSL certificate 19
    Default: ""

  AdditionalCertificateArn20:
    Type: String
    Description: ARN of the additional SSL certificate 20
    Default: ""

  AdditionalCertificateArn21:
    Type: String
    Description: ARN of the additional SSL certificate 21
    Default: ""

  AdditionalCertificateArn22:
    Type: String
    Description: ARN of the additional SSL certificate 22
    Default: ""

  AdditionalCertificateArn23:
    Type: String
    Description: ARN of the additional SSL certificate 23
    Default: ""

  AdditionalCertificateArn24:
    Type: String
    Description: ARN of the additional SSL certificate 24
    Default: ""

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVPCEndpointIP3: !Not [!Equals [!Ref "VPCEndpointIP3", ""]]
  IsPrivateALB: !Equals [!Ref "ALBScheme", "internal"]
  IsPublicALB: !Equals [!Ref "ALBScheme", "internet-facing"]
  HasPrefixListIdIntranet: !Not [!Equals [!Ref "PrefixListIdIntranet", ""]]
  
  # Conditions for additional certificates
  HasAdditionalCertificate1: !Not [!Equals [!Ref AdditionalCertificateArn1, ""]]
  HasAdditionalCertificate2: !Not [!Equals [!Ref AdditionalCertificateArn2, ""]]
  HasAdditionalCertificate3: !Not [!Equals [!Ref AdditionalCertificateArn3, ""]]
  HasAdditionalCertificate4: !Not [!Equals [!Ref AdditionalCertificateArn4, ""]]
  HasAdditionalCertificate5: !Not [!Equals [!Ref AdditionalCertificateArn5, ""]]
  HasAdditionalCertificate6: !Not [!Equals [!Ref AdditionalCertificateArn6, ""]]
  HasAdditionalCertificate7: !Not [!Equals [!Ref AdditionalCertificateArn7, ""]]
  HasAdditionalCertificate8: !Not [!Equals [!Ref AdditionalCertificateArn8, ""]]
  HasAdditionalCertificate9: !Not [!Equals [!Ref AdditionalCertificateArn9, ""]]
  HasAdditionalCertificate10: !Not [!Equals [!Ref AdditionalCertificateArn10, ""]]
  HasAdditionalCertificate11: !Not [!Equals [!Ref AdditionalCertificateArn11, ""]]
  HasAdditionalCertificate12: !Not [!Equals [!Ref AdditionalCertificateArn12, ""]]
  HasAdditionalCertificate13: !Not [!Equals [!Ref AdditionalCertificateArn13, ""]]
  HasAdditionalCertificate14: !Not [!Equals [!Ref AdditionalCertificateArn14, ""]]
  HasAdditionalCertificate15: !Not [!Equals [!Ref AdditionalCertificateArn15, ""]]
  HasAdditionalCertificate16: !Not [!Equals [!Ref AdditionalCertificateArn16, ""]]
  HasAdditionalCertificate17: !Not [!Equals [!Ref AdditionalCertificateArn17, ""]]
  HasAdditionalCertificate18: !Not [!Equals [!Ref AdditionalCertificateArn18, ""]]
  HasAdditionalCertificate19: !Not [!Equals [!Ref AdditionalCertificateArn19, ""]]
  HasAdditionalCertificate20: !Not [!Equals [!Ref AdditionalCertificateArn20, ""]]
  HasAdditionalCertificate21: !Not [!Equals [!Ref AdditionalCertificateArn21, ""]]
  HasAdditionalCertificate22: !Not [!Equals [!Ref AdditionalCertificateArn22, ""]]
  HasAdditionalCertificate23: !Not [!Equals [!Ref AdditionalCertificateArn23, ""]]
  HasAdditionalCertificate24: !Not [!Equals [!Ref AdditionalCertificateArn24, ""]]

Resources:

  # Security Group for ALB
  PublicALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPublicALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Pulbic ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-alb-v3

  PrivateALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPrivateALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Private ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixListIdIntranet
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListIdIntranet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-alb-v3

  #Application Load Balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Ref ALBName
      Subnets: !Ref IngressSubnetIds
      SecurityGroups:
        - !If
          - IsPrivateALB
          - !Ref PrivateALBSecurityGroup  # Private ALB Security Group
          - !Ref PublicALBSecurityGroup
      Scheme: !Ref ALBScheme
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: "true"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-alb-v3

  # Target Group
  ALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${ALBName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 443
      TargetType: ip
      Targets:
        - Id: !Ref VPCEndpointIP1 # First IP
        - Id: !Ref VPCEndpointIP2  # Second IP
        - !If
          - HasVPCEndpointIP3
          - Id: !Ref VPCEndpointIP3  # Third IP
          - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,403"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-alb-v3

  # Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTPS
      Port: 443
      SslPolicy: !Ref ListenerSslPolicy
      Certificates: 
        - CertificateArn: !Ref SSLCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG

  # Additional certificates (up to 24)
  AdditionalListenerCertificate1:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate1
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn1

  AdditionalListenerCertificate2:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate2
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn2

  AdditionalListenerCertificate3:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate3
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn3

  AdditionalListenerCertificate4:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate4
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn4

  AdditionalListenerCertificate5:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate5
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn5

  AdditionalListenerCertificate6:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate6
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn6

  AdditionalListenerCertificate7:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate7
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn7

  AdditionalListenerCertificate8:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate8
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn8

  AdditionalListenerCertificate9:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate9
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn9

  AdditionalListenerCertificate10:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate10
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn10

  AdditionalListenerCertificate11:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate11
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn11

  AdditionalListenerCertificate12:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate12
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn12

  AdditionalListenerCertificate13:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate13
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn13

  AdditionalListenerCertificate14:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate14
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn14

  AdditionalListenerCertificate15:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate15
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn15

  AdditionalListenerCertificate16:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate16
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
