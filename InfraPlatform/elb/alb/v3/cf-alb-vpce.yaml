  AdditionalListenerCertificate17:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate17
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn17

  AdditionalListenerCertificate18:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate18
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn18

  AdditionalListenerCertificate19:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate19
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
        - CertificateArn: !Ref AdditionalCertificateArn19

  AdditionalListenerCertificate20:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasAdditionalCertificate20
    Properties:
      ListenerArn: !Ref ALBListener
      Certificates:
