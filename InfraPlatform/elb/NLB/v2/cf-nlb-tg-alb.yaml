AWSTemplateFormatVersion: 2010-09-09
Description: Provision NLB with ALB Target Group
Parameters:
  AppShortName:
    Type: String
    Description: AppShortName
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  NLBSubnetIds:
    Type: CommaDelimitedList
    Description: VPC Subnet ids for App
  NLBName:
    Type: String
    Description: NLB Name
  TargetALBArn:
    Type: String
    Description: Target ALB Arn
  VpcId:
    Type: String
    Description: VPC ID
  HealthCheckPath:
    Type: String
    Description: Health Check Path
  PrefixListNLBIngress:
    Type: String
    Description: Prefix list for Whitelisted NLB Ingress
    Default: ""
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTargetALBArn: !Not [!Equals [!Ref TargetALBArn, '']]
  HasPrefixListNLBIngress: !Not [!Equals [!Ref PrefixListNLBIngress, '']]

Resources:
  NLBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${NLBName}-sg"
      GroupDescription: !Sub 'Security group for ${NLBName}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixListNLBIngress
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListNLBIngress
          - !Ref "AWS::NoValue"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-nlb-v2"

  IngressNLB:
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      IpAddressType: "ipv4"
      Subnets: !Ref NLBSubnetIds
      Type: "network"
      Scheme: "internal"
      Name: !Ref NLBName
      SecurityGroups:
        - !Ref NLBSecurityGroup
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: "true"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-nlb-v2"

  IngressNLBTG:
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete] 
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      IpAddressType: "ipv4"
      HealthCheckIntervalSeconds: 30
      Matcher:
        HttpCode: "200-399"
      HealthCheckPath: !Ref HealthCheckPath
      Port: 443
      Targets:
      - !If
        - HasTargetALBArn
        - Port: 443
          Id: !Ref TargetALBArn
        - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 10
      Name: !Sub ${NLBName}-TG
      VpcId: !Ref VpcId
      HealthyThresholdCount: 3
      HealthCheckProtocol: "HTTPS"
      TargetType: "alb"
      HealthCheckPort: "traffic-port"
      Protocol: "TCP"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-nlb-v2"

  IngressNLBListener:
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref IngressNLB
      Protocol: "TCP"
      DefaultActions:
      - Type: "forward"
        ForwardConfig:
          TargetGroups:
          - TargetGroupArn: !Ref IngressNLBTG
      Port: 443

  ParameterNLBArn: #Parameter for NLB Arn which will be used in VPCLink creation
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-parameter-NLBArn
      Description: !Sub ${AppShortName}-${EnvName}-parameter-NLBArn
      Value: !Ref IngressNLB
      Type: String
      Tier: Standard
      Tags:
        IaCVersion: "InfraPlatform-nlb-v2"