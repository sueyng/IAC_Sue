#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# APPLICATION BASICS
AppShortName: "<edit_here>"             # 📝 e.g. fhir, myapp, api (max 10 characters)
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod
NLBName: "<edit_here>"                  # 📝 e.g. apt-nprd-nlb-vpclink, fhir-prod-nlb

# NETWORK CONFIGURATION
VpcId: "<edit_here>"                    # 📝 e.g. vpc-0d99a0c727b301d67
NLBSubnetIds: "<edit_here>"             # 📝 e.g. subnet-xxx,subnet-yyy (min 2 subnets, comma-separated)

# TARGET CONFIGURATION
TargetALBArn: ""                        # Target ALB ARN (leave empty if ALB not yet created)
HealthCheckPath: "/ALBhealth"           # Health check path for ALB target

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================

# SECURITY - PREFIX LIST
PrefixListNLBIngress: ""                # Prefix List ID for NLB ingress (443)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates stack naming convention
# - Enables multi-application deployments
#
# Format: Lowercase alphanumeric
# Example: fhir, myapp, api

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Determines resource lifecycle policies
# - Used in resource naming
#
# Example: nprd, prod, nprd-dev

# --- NLB NAME ---
# NLBName: Unique identifier for the Network Load Balancer
#
# Purpose:
# - Internal NLB for API Gateway VPC Link integration
# - Static IPs per AZ for consistent access
#
# Format: Descriptive name
# Example: apt-nprd-nlb-vpclink, fhir-prod-nlb-apigw
#
# Key Features:
# - Layer 4 (TCP) load balancing
# - Ultra-low latency (<100 microseconds)
# - Static IP per AZ
# - Preserves source IP address
# - Deletion protection enabled by default
#
# Architecture:
# API Gateway → VPC Link → NLB → Target Group → ALB → Backend

# --- VPC ID ---
# VpcId: VPC where NLB will be deployed
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-0d99a0c727b301d67

# --- NLB SUBNET IDs ---
# NLBSubnetIds: Comma-separated list of subnet IDs for NLB deployment
#
# Requirements:
# - Minimum 2 subnets in different Availability Zones
# - Must be private subnets (NLB is internal)
# - Each subnet must have at least /27 CIDR (32 IPs)
#
# Format: subnet-xxx,subnet-yyy
# Example: subnet-08170d48a795103d2,subnet-083fba964c347656f
#
# Best Practice:
# - Use separate subnets for NLB, ALB, and application tiers
# - Ensure ALB is in same VPC (different subnets OK)

# --- TARGET ALB ARN ---
# TargetALBArn: ARN of target Application Load Balancer
#
# Two-Phase Deployment:
# 1. Deploy without ALB ARN (creates NLB, target group)
# 2. Update with ALB ARN and redeploy (registers ALB as target)
#
# Format: arn:aws:elasticloadbalancing:region:account:loadbalancer/app/name/id
# Leave empty if ALB not yet created
#
# How to find ALB ARN:
# aws elbv2 describe-load-balancers --names {alb-name} \
#   --query 'LoadBalancers[0].LoadBalancerArn' --output text
#
# Important:
# - ALB MUST be in same VPC as NLB
# - ALB can be in different subnets
# - Target type: "alb"

# --- HEALTH CHECK PATH ---
# HealthCheckPath: HTTP(S) path for ALB health checks
#
# Format: /path
# Example: /ALBhealth, /health, /api/status
#
# Health Check Behavior:
# - Protocol: HTTPS, Port: 443
# - Interval: 30 seconds, Timeout: 10 seconds
# - Healthy threshold: 5 consecutive successes
# - Unhealthy threshold: 2 consecutive failures
# - Success codes: 200-399
#
# Important:
# - ALB listener must respond to HealthCheckPath
# - ALB security group must allow NLB subnet CIDR on 443
# - Unhealthy target → NLB returns 503

# --- PREFIX LIST NLB INGRESS (OPTIONAL) ---
# PrefixListNLBIngress: Prefix List ID for NLB ingress access control
#
# Purpose: Security group rule allowing traffic to NLB on port 443
#
# Use Cases:
# - API Gateway VPC Link access
# - VPN client access for testing
# - Cross-VPC peered traffic
# - On-premises network via Direct Connect
#
# Format: pl-xxxxxxxxxxxxxxxxx or empty
#
# If empty: No ingress rules created (may need manual configuration)
#
# How to create Prefix List:
# 1. VPC Console → Managed Prefix Lists → Create
# 2. Add CIDR blocks (e.g., 10.0.0.0/8, API Gateway service CIDRs)
# 3. Note the Prefix List ID (pl-xxxxx)

