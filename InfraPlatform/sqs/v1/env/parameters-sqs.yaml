# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. myapp, api, processor
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
QueueName: "<edit_here>"                         # 📝 e.g. processing, notifications, orders

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
QueueDescription: "Standard SQS Queue for message processing"   # e.g. Queue for order processing (default is "Standard SQS Queue for message processing")
VisibilityTimeoutSeconds: "300"                                 # e.g. 300 (default is 300 / 5 minutes)
MessageRetentionPeriod: "1209600"                               # e.g. 1209600 (default is 1209600 / 14 days)
MaxReceiveCount: "5"                                            # e.g. 5 (default is 5)
DelaySeconds: "0"                                               # e.g. 0 (default is 0)
ReceiveMessageWaitTimeSeconds: "20"                             # e.g. 20 (default is 20 / long polling enabled)
MaxMessageSize: "262144"                                        # e.g. 262144 (default is 262144 / 256 KB)

# FEATURE TOGGLES
EnableDeadLetterQueue: "true"                # Enable DLQ for failed messages (default is true)
EnableServerSideEncryption: "true"           # Enable KMS encryption (default is true)

# OPTIONAL - ADVANCED SETTINGS
DeadLetterQueueMessageRetentionPeriod: "1209600"        # e.g. 1209600 (default is 1209600 / 14 days)
KmsMasterKeyId: "alias/aws/sqs"                         # e.g. alias/aws/sqs or arn:aws:kms:... (default is alias/aws/sqs)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. myapp, api, processor)
#   Creates queue: {AppShortName}-{EnvName}-sqs-{QueueName}

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain
#   Non-Prod (nprd*): DeletionPolicy Delete

# QueueName
#   Value: Descriptive queue name (e.g. processing, notifications, orders)
#   Full queue name: {AppShortName}-{EnvName}-sqs-{QueueName}
#   Common names: processing, notifications, orders, events, tasks, audit

# --- OPTIONAL PARAMETERS (with defaults) ---

# QueueDescription
#   Value: Description of queue purpose
#   Default: "Standard SQS Queue for message processing"

# VisibilityTimeoutSeconds
#   Value: Seconds message is invisible after being received
#   Range: 0-43200 (0-12 hours)
#   Default: 300 (5 minutes)
#   Recommendation: Set to 6x your function execution time
#   Common: 60 (fast), 300 (medium), 900 (long), 3600 (very long)

# MessageRetentionPeriod
#   Value: Seconds SQS retains a message
#   Range: 60-1209600 (1 minute to 14 days)
#   Default: 1209600 (14 days - maximum)
#   Recommendation: Use maximum (1209600) for production

# MaxReceiveCount
#   Value: Delivery attempts before moving to DLQ
#   Range: 1-1000
#   Default: 5
#   Common: 3 (strict), 5 (standard), 10 (retry-heavy)

# DelaySeconds
#   Value: Delay before messages become available
#   Range: 0-900 (0-15 minutes)
#   Default: 0 (no delay)
#   Use: Delayed job execution, rate limiting

# ReceiveMessageWaitTimeSeconds
#   Value: Long polling wait time
#   Range: 0-20 seconds
#   Default: 20 (long polling - recommended)
#   Recommendation: Always use 20 (reduces costs by 95%)

# MaxMessageSize
#   Value: Maximum message size in bytes
#   Range: 1024-262144 (1 KB to 256 KB)
#   Default: 262144 (256 KB - maximum)
#   Note: For larger messages, store in S3 and send reference

# --- FEATURE TOGGLES ---

# EnableDeadLetterQueue
#   Values: true/false (DELETE the value you don't need)
#   Default: true
#   Recommendation: Always use true for production
#   Creates: {AppShortName}-{EnvName}-sqs-{QueueName}-dlq
#   Purpose: Captures messages that fail processing repeatedly

# EnableServerSideEncryption
#   Values: true/false (DELETE the value you don't need)
#   Default: true
#   Recommendation: Always use true
#   Purpose: Encrypts messages at rest with KMS (no extra cost with AWS managed key)

# --- ADVANCED SETTINGS ---

# DeadLetterQueueMessageRetentionPeriod
#   Value: DLQ message retention in seconds
#   Range: 60-1209600 (1 minute to 14 days)
#   Default: 1209600 (14 days)
#   Recommendation: Use maximum (1209600) for investigation time
#   Only used if EnableDeadLetterQueue: true

# KmsMasterKeyId
#   Value: KMS key for encryption
#   Default: alias/aws/sqs (AWS managed key - FREE)
#   Options:
#     - alias/aws/sqs (AWS managed, recommended)
#     - alias/your-custom-key (custom alias)
#     - arn:aws:kms:region:account:key/xxx (KMS key ARN)
#   Only used if EnableServerSideEncryption: true
#   Finding: KMS Console → Customer managed keys → copy alias/ARN
