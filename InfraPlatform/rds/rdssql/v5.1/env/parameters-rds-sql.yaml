# ========================================================================
# <<< PARAMETERS_START >>>

# APPLICATION BASICS
AppShortName: "<edit_here>"             # (required) e.g. myapp, grm, acp
EnvName: "<edit_here>"                  # (required) e.g. nprd, nprd-dev, prod

# NETWORK CONFIGURATION
VpcId: "<edit_here>"                    # (required) e.g. vpc-02fb2e32bbb6ff24e
AvailabilityZone: "<edit_here>"         # (required) e.g. ap-southeast-1a, ap-southeast-1b, ap-southeast-1c

# APPLICATION SUBNET CIDRs (for security group ingress)
VPCSubnetCidrAppAZ1: "<edit_here>"      # (required) e.g. 10.0.101.0/24 (consolidated range supported)
VPCSubnetCidrAppAZ2: "<edit_here>"      # (required) e.g. 10.0.102.0/24 (consolidated range supported)
VPCSubnetCidrAppAZ3: ""                 # (optional) e.g. 10.0.103.0/24

# DATABASE SUBNET CONFIGURATION
DBSubnetCidrAZ1: "<edit_here>"          # (required) e.g. 10.0.151.0/24
DBSubnetCidrAZ2: "<edit_here>"          # (required) e.g. 10.0.152.0/24
DBSubnetCidrAZ3: ""                     # (optional) e.g. 10.0.153.0/24
DBSubnetIds: "<edit_here>"              # (required) e.g. subnet-0463242cbb6f21b45,subnet-054fa74f69bf99d68

# DEPLOYMENT SERVER
DeploymentServer: "<edit_here>"         # (required) e.g. 10.53.26.197/32

# DATABASE ENGINE CONFIGURATION
DBEngine: "<edit_here>"                 # (required) sqlserver-se or sqlserver-ee
DBMajorEngineVersion: "<edit_here>"     # (required) e.g. 16.00
EngineVersion: "<edit_here>"            # (required) e.g. 16.00.4095.4.v1
RdsDBParameterGroupFamily: "<edit_here>" # (required) e.g. sqlserver-se-16.0

# DATABASE INSTANCE CONFIGURATION
DBInstanceClass: "<edit_here>"          # (required) e.g. db.m6i.xlarge, db.m5.large
AllocatedStorage: "<edit_here>"         # (required) e.g. 100 (in GiB)
RDSMaxAllocatedStorage: "<edit_here>"   # (required) e.g. 1000 (in GiB)
StorageType: "<edit_here>"              # (required) e.g. gp3
StorageIops: "<edit_here>"              # (required) e.g. 3000
MultiAZ: "<edit_here>"                  # (required) true or false

