VpcCidr1: "<edit_here>"                 # (required) e.g. 10.193.0.0/16 (primary VPC CIDR - required for egress)

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================

# ADDITIONAL SECURITY GROUP INGRESS
AdditionalAppPrefixList: ""             # e.g. pl-0abc123def456789 (prefix list for additional app networks)

# ADDITIONAL SECURITY GROUP EGRESS CIDRs (NEW in v5.1)
VpcCidr2: ""                            # e.g. 10.2.0.0/16 (secondary VPC CIDR)
VpcCidr3: ""                            # e.g. 10.3.0.0/16 (tertiary VPC CIDR)
VpcCidr4: ""                            # e.g. 10.4.0.0/16 (quaternary VPC CIDR)
VpcCidr5: ""                            # e.g. 10.5.0.0/16 (quinary VPC CIDR)
S3PrefixListId: ""                      # e.g. pl-6fa54006 (S3 prefix list for egress)
HCCVpceCidr: ""                         # e.g. 10.48.42.0/24 (HCC VPC Endpoint subnet)

# OPTION GROUP
UseExistingOptionGroup: "false"         # true to use existing, false to create new
ExistingOptionGroupName: ""             # name of existing option group (if UseExistingOptionGroup is true)

