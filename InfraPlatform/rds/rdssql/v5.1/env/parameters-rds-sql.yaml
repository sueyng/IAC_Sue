# ================================================================================
# PARAMETER REFERENCE
# ================================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates resource names: {AppShortName}-{EnvName}-{resource-type}
# - e.g. myapp-nprd-dev-rdssql, myapp-nprd-dev-sg-Rds-DB-Cluster
#
# Format: Lowercase alphanumeric (3-6 characters recommended)
# Example: myapp, grm, acp

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines DeletionPolicy (Retain for prod, Delete for non-prod)
# - Determines DB port (prod: 53341, non-prod: 53331)
# - Determines backup retention (prod: 35 days, non-prod: 7 days)
# - Determines Performance Insights retention (prod: 31 days, non-prod: 7 days)
#
# Allowed Values:
# - Non-Production: nprd, nprd-dev, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit,
#   nprd-sit-a, nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
# - Production: prod, prod-a, prod-b, prod-c

# --- VPC ID ---
# VpcId: VPC where RDS and security group will be deployed
#
# Format: vpc-xxxxxxxxxxxxxxxxx
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC
# 2. In left menu, click "Your VPCs"
# 3. Identify your target VPC (check Name tag or CIDR)
# 4. Copy the "VPC ID" column value

# --- AVAILABILITY ZONE ---
# AvailabilityZone: Primary AZ for RDS deployment (ignored if MultiAZ is true)
#
# Allowed Values: ap-southeast-1a, ap-southeast-1b, ap-southeast-1c

# --- APPLICATION SUBNET CIDRs ---
# VPCSubnetCidrAppAZ1/AZ2/AZ3: Application subnet CIDRs for security group ingress
#
# Purpose: Allows application subnets to connect to RDS on the database port
# Format: x.x.x.x/xx (CIDR notation, consolidated range supported)
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Subnets
# 2. Filter by your VPC ID
# 3. Find application/app-tier subnets
# 4. Copy the "IPv4 CIDR" for each AZ

# --- DATABASE SUBNET CIDRs ---
# DBSubnetCidrAZ1/AZ2/AZ3: Database subnet CIDRs for security group ingress
#
# Purpose: Allows database subnet traffic (e.g. for replication)
# Format: x.x.x.x/xx (CIDR notation)
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Subnets
# 2. Filter by your VPC ID
# 3. Find database/db-tier subnets
# 4. Copy the "IPv4 CIDR" for each AZ

# --- DATABASE SUBNET IDS ---
# DBSubnetIds: Subnet IDs for RDS subnet group (minimum 2 AZs required)
#
# Format: subnet-xxx,subnet-yyy (comma-separated, NO spaces)
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Subnets
# 2. Filter by your VPC ID
# 3. Find database/db-tier subnets in at least 2 AZs
# 4. Copy each "Subnet ID" and combine with commas

# --- DEPLOYMENT SERVER ---
# DeploymentServer: IP address of the deployment/bastion server
#
# Format: x.x.x.x/32 (single IP with /32 mask)
# Purpose: Allows deployment server to connect to RDS for management

# --- ADDITIONAL APP PREFIX LIST ---
# AdditionalAppPrefixList: AWS Prefix List ID for additional application networks
#
# Purpose: Allows additional networks to access RDS without modifying the template
# Format: pl-xxxxxxxxxxxxxxxxx
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Managed prefix lists
# 2. Find or create a prefix list with required CIDR ranges
# 3. Copy the "Prefix list ID"

# ================================================================================
# v5.1 NEW PARAMETERS - Security Group Egress Configuration
# ================================================================================

# --- VPC CIDR 1-5 ---
# VpcCidr1-5: VPC CIDR blocks for security group egress rules
#
# Purpose:
# - Restricts RDS security group outbound traffic to TCP 443 only
# - Replaces default "allow all" egress rule from v5
# - Enhances security by limiting outbound destinations
#
# Format: x.x.x.x/xx (CIDR notation)
#
# How to find VPC CIDR in AWS Console:
# 1. Go to AWS Console -> VPC
# 2. In left menu, click "Your VPCs"
# 3. Find your VPC (same as VpcId above)
# 4. Look at the "IPv4 CIDR" column
# 5. For additional CIDRs, check "CIDRs" tab for secondary CIDR blocks
#
# Important:
# - VpcCidr1 is REQUIRED for egress connectivity
# - Without any CIDR, all outbound traffic will be blocked
# - Add additional CIDRs if services span multiple VPCs

# --- S3 PREFIX LIST ID ---
# S3PrefixListId: AWS-managed prefix list for S3 service
#
# Purpose: Allow egress to S3 endpoints (port 443)
# Format: pl-xxxxxxxxxxxxxxxxx
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Managed prefix lists
# 2. Search for "s3"
# 3. Find: "com.amazonaws.ap-southeast-1.s3" (Owner: AWS)
# 4. Copy the "Prefix list ID" (e.g., pl-6fa54006)

# --- HCC VPCE CIDR ---
# HCCVpceCidr: HCC VPC Endpoint subnet CIDR
#
# Purpose: Allow egress to HCC VPC Endpoint for corporate connectivity
# Format: x.x.x.x/xx (CIDR notation)
#
# How to find in AWS Console:
# 1. Go to AWS Console -> VPC -> Endpoints
# 2. Find the HCC-related endpoint
# 3. Check "Subnets" tab for the subnet CIDR

# ================================================================================
# v5.1 NEW PARAMETERS - Backup & S3 Buckets
# ================================================================================

# --- PREFERRED BACKUP WINDOW ---
# PreferredBackupWindow: Daily time range for automated backups
#
# Purpose:
# - Specifies when RDS performs daily automated backups
# - Allows customization without template modification
#
# Format: HH:MM-HH:MM (UTC timezone, must be at least 30 minutes)
# Default: 16:00-17:00
#
# Examples:
# - "16:00-17:00" (1-hour window starting at 4 PM UTC)
# - "16:00-18:00" (2-hour window starting at 4 PM UTC)
# - "20:00-21:00" (1-hour window starting at 8 PM UTC)
#
# Important:
# - Time is in UTC (Singapore is UTC+8)
# - 16:00 UTC = 00:00 Singapore Time (midnight)
# - Avoid overlapping with maintenance window (sat:18:00-sat:19:00 UTC)

# --- RDS ALLOWED S3 BUCKETS 1-4 ---
# RDSAllowedS3Bucket1-4: Additional S3 buckets to allow in RDS IAM policy
#
# Purpose:
# - Grants RDS IAM role access to external S3 buckets
# - Used for native backup/restore operations
# - Supports data migration, cross-account transfers, analytics integration
#
# Format: bucket-name-only (NO arn:aws:s3::: prefix, NO /* suffix)
#
# Examples:
# - "hhm-prod-data-migration-backup-store"
# - "hh-prod-prn-data-migration"
# - "shared-analytics-bucket"
# - "cross-account-data-bucket"
#
# How to find bucket name:
# 1. Go to AWS Console -> S3
# 2. Find the target bucket
# 3. Copy the bucket name (NOT the ARN)
#
# Important:
# - Leave empty if no external S3 access is required
# - The RDS role will have read/write access to these buckets
# - Ensure the bucket policy allows access from this account

