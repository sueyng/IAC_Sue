KMSKeyRotationPeriod: "365"             # number of days for KMS key rotation (default 365)

# BACKUP CONFIGURATION (NEW in v5.1)
PreferredBackupWindow: "16:00-17:00"    # daily backup window in UTC, e.g. 16:00-17:00, 16:00-18:00

# RDS ALLOWED S3 BUCKETS (NEW in v5.1)
RDSAllowedS3Bucket1: ""                 # e.g. hhm-prod-data-migration-backup-store (bucket name only, no arn)
RDSAllowedS3Bucket2: ""                 # e.g. hh-prod-prn-data-migration (bucket name only, no arn)
RDSAllowedS3Bucket3: ""                 # e.g. myapp-shared-analytics (bucket name only, no arn)
RDSAllowedS3Bucket4: ""                 # e.g. cross-account-data-bucket (bucket name only, no arn)

