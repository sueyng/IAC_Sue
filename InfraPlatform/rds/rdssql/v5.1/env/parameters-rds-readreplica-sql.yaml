# ========================================================================
# QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with (required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
# 3. The primary RDS instance must be deployed first (cf-rds-sql.yaml)
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# APPLICATION BASICS
AppShortName: "<edit_here>"                         # (required) e.g. myapp, grm, acp
EnvName: "<edit_here>"                              # (required) e.g. nprd, nprd-dev, prod

# DATABASE ENGINE
ReadReplicaRdsDBParameterGroupFamily: "<edit_here>" # (required) e.g. sqlserver-ee-16.0, sqlserver-se-15.0
DBEngine: "<edit_here>"                             # (required) sqlserver-se or sqlserver-ee

# DATABASE INSTANCE
ReadReplicaDBInstanceClass: "<edit_here>"            # (required) e.g. db.m6i.xlarge, db.m5.large

# <<< PARAMETERS_END >>>

# ================================================================================
# PARAMETER REFERENCE
# ================================================================================

# --- APP SHORT NAME ---
# AppShortName: Must match the primary RDS instance AppShortName
#
# Purpose:
# - Used to resolve SSM parameter for source DB instance identifier
# - Creates resource names: {AppShortName}-{EnvName}-readreplica-rdssql
#
# Format: Lowercase alphanumeric (3-6 characters recommended)

# --- ENVIRONMENT NAME ---
# EnvName: Must match the primary RDS instance EnvName
#
# Purpose:
# - Used to resolve SSM parameter for source DB instance identifier
# - Determines DeletionPolicy (Retain for prod, Delete for non-prod)
#
# Allowed Values:
# - Non-Production: nprd, nprd-dev, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit,
#   nprd-sit-a, nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
# - Production: prod, prod-a, prod-b, prod-c

# --- READ REPLICA PARAMETER GROUP FAMILY ---
# ReadReplicaRdsDBParameterGroupFamily: Parameter group family for the read replica
#
# Format: {engine}-{major-version}
# Example: sqlserver-ee-16.0, sqlserver-se-15.0
#
# Important: Must match the engine type and version of the primary RDS instance

# --- DB ENGINE ---
# DBEngine: SQL Server engine edition
#
# Allowed Values:
# - sqlserver-se  (Standard Edition)
# - sqlserver-ee  (Enterprise Edition)
#
# Important: Must match the primary RDS instance engine

# --- READ REPLICA DB INSTANCE CLASS ---
# ReadReplicaDBInstanceClass: Instance type for the read replica
#
# Format: db.{family}.{size}
# Example: db.m6i.xlarge, db.m5.large
#
# How to determine:
# - Can be same or different size from primary instance
# - Consider read workload requirements
# - Check AWS documentation for available instance types

# ================================================================================
# PREREQUISITES
# ================================================================================
#
# 1. Primary RDS instance must be deployed using cf-rds-sql.yaml
# 2. SSM Parameter must exist: {AppShortName}-{EnvName}-parameter-RDSInstanceName
#    (automatically created by the primary RDS template)
# 3. Enhanced Monitoring Role must exist: {AppShortName}-{EnvName}-rds-EnhancedMonitoring-Role
#    (automatically created by the primary RDS template)

