# AvailabilityZone
#   Allowed Values: ap-southeast-1a, ap-southeast-1b, ap-southeast-1c
#   Only used if MultiAZ: false

# --- DB SUBNET GROUP UPGRADE TOGGLE (NEW in v5.1) ---
# v5.1 changed the subnet group naming convention from
#   '${AppShortName}-${EnvName}-subnetgroup'  (v3/v4/v5)
# to
#   '${AppShortName}-${EnvName}-postgres-subnetgroup'  (v5.1, disambiguates from rdssql)
# Because DBSubnetGroupName is IMMUTABLE on AWS::RDS::DBInstance, changing it
# would force DBInstance replacement (= total data loss in nprd, prod is Retained
# but the DB is replaced/orphaned). The toggle below preserves the existing
# subnet group during upgrade.

# UseExistingSubnetGroup
#   Allowed Values: 'true', 'false'
#   Default: 'false'
#   'false' (greenfield): provisions a new subnet group with the v5.1 standard name
#   'true'  (upgrade):    skips creating the subnet group; DBInstance points to ExistingSubnetGroupName

# ExistingSubnetGroupName
#   Value: name of the existing DB subnet group (string, no ARN)
#   Used only when UseExistingSubnetGroup='true'
#   For v3 upgrade: typically '${AppShortName}-${EnvName}-subnetgroup' (without '-postgres-')
#   IMPORTANT: subnet group must already exist in the same VPC and contain the same DBSubnetIds

# --- BEHAVIOR DURING v3 → v5.1 UPGRADE (with UseExistingSubnetGroup='true') ---
# - pgsqldbsubnetgroup: shown as 'Remove' in changeset; with DeletionPolicy: Retain
#   (production), the AWS resource is preserved (orphaned from CFN management).
#   In non-production (Delete policy), CFN will delete it — only safe if you provided
#   the existing name AND that resource was created OUTSIDE this stack.
# - pgsqlinstance: DBSubnetGroupName resolves to the same string as before → no
#   replacement, no modification, zero downtime.
# - Once switched to override mode, do NOT switch back later (would force DB replacement).