AvailabilityZone: "<edit_here>"                  # 📝 e.g. ap-southeast-1a (only if MultiAZ is set to false)
VPCSubnetCidrAppAZ1: "<edit_here>"               # 📝 e.g. 10.0.102.0/24 (app subnet CIDR)
VPCSubnetCidrAppAZ2: "<edit_here>"               # 📝 e.g. 10.0.103.0/24 (app subnet CIDR)
DBSubnetIds: "<edit_here>"                       # 📝 e.g. subnet-xxx,subnet-yyy (min 2, different AZs, NO SPACES)
DBSubnetCidrAZ1: "<edit_here>"                   # 📝 e.g. 10.1.2.16/28 (DB subnet CIDR for AZ1)
DBSubnetCidrAZ2: "<edit_here>"                   # 📝 e.g. 10.1.2.0/28 (DB subnet CIDR for AZ2)
DBSubnetCidrAZ3: ""                              # DB subnet CIDR for AZ3 (optional)

# DB SUBNET GROUP — v3/v4/v5 → v5.1 UPGRADE TOGGLE
# Greenfield: leave both as default (creates new subnet group with v5.1 standard name)
# v3→v5.1 upgrade: set UseExistingSubnetGroup='true' AND ExistingSubnetGroupName=<v3 name>
#   to avoid DBInstance replacement (DBSubnetGroupName is immutable on RDS)
UseExistingSubnetGroup: "false"                  # 'true' or 'false' (default 'false' — provisions new subnet group)
ExistingSubnetGroupName: ""                      # e.g. "myapp-prod-subnetgroup" (only used when UseExistingSubnetGroup='true')

