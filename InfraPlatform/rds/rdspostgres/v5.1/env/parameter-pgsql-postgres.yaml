HCCVpceCidr: "<edit_here>"                       # 📝 e.g. 10.48.42.0/24 (HCC VPC endpoint CIDR)

# FEATURE TOGGLES (DELETE the value you don't need)
MultiAZ: "true/false"                              # 📝 Multi-AZ high availability
EnableIAMDatabaseAuthentication: "true/false"      # 📝 IAM database authentication

# INSTANCE
