AWSTemplateFormatVersion: 2010-09-09
## VPC-id, Subnets ID, ClusterSharedNodeSecurityGroup name, Cluser Control Plane name and Control Plane SecurityGroup name to be updated as per requirements.
Description: EC2 Launch Template
Parameters:
  AppShortName:
    Type: String
    Description: AppShortName
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

Resources:
  EC2IAMRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
      RoleName: !Sub ${AppShortName}-${EnvName}-ec2-iam-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentAdminPolicy
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EC2-v2

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties: 
      InstanceProfileName: !Sub ${AppShortName}-${EnvName}-ec2-instance-profile
      Roles: 
        - !Ref EC2IAMRole

  EC2KeyPair:
    Type: 'AWS::EC2::KeyPair'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      KeyName: !Sub ${AppShortName}-${EnvName}-EC2-KeyPair
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EC2-v2

  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn: 
      - EC2IAMRole
    Properties: 
      LaunchTemplateName: !Sub ${AppShortName}-${EnvName}-ec2-lt
      LaunchTemplateData:
#        IamInstanceProfile:
#          Arn: !GetAtt EC2InstanceProfile.Arn
        KeyName: !Ref EC2KeyPair
        MetadataOptions:
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags: 
              - Key: FUNCTION
                Value: TBC
              - Key: EBS-SNAPSHOT
                Value: 'YES'
              - Key: Name
                Value: !Sub ${AppShortName}-${EnvName}-EC2
              - Key: BACKUP-DAILY
                Value: 'YES'
              - Key: BACKUP-WEEKLY
                Value: 'YES'
              - Key: BACKUP-MONTHLY
                Value: 'YES'
              - Key: BACKUP-YEARLY
                Value: 'YES'
              - Key: CW-CONFIG
                Value: 'BASELINE'
              - Key: CREATE-AUTO-ALARMS
                Value: ''
              - Key: IaCVersion
                Value: InfraPlatform-EC2-v2
          - ResourceType: volume
            Tags: 
              - Key: FUNCTION
                Value: TBC
              - Key: EBS-SNAPSHOT
                Value: 'YES'
              - Key: Name
                Value: !Sub ${AppShortName}-${EnvName}-EBS
              - Key: IaCVersion
                Value: InfraPlatform-EC2-v2
          - ResourceType: network-interface
            Tags: 
              - Key: FUNCTION
                Value: TBC
              - Key: Name
                Value: !Sub ${AppShortName}-${EnvName}-vNIC
              - Key: IaCVersion
                Value: InfraPlatform-EC2-v2
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: IaCVersion
              Value: InfraPlatform-EC2-v2

  EC2InfraSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Properties:
      GroupDescription: Common Infra Security Group for EC2
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-ec2-infra
      VpcId: !Ref VpcId
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-EC2-v2

Outputs:
  EC2LaunchTemplateID:
    Description: The ID of EC2 LaunchTemplate
    Value: !Ref EC2LaunchTemplate
    Export:
      Name: "EC2LaunchTemplateID"
  EC2LaunchTemplateLatestVersionNumber:
    Description: EC2LaunchTemplate Latest Version Number
    Value: !GetAtt EC2LaunchTemplate.LatestVersionNumber
    Export:
      Name: "EC2LaunchTemplateLatestVersionNumber"
  EC2InstanceProfileName:
    Description: EC2 Instance Profile Name
    Value: !Ref EC2InstanceProfile
    Export:
      Name: "EC2InstanceProfileName"
  EC2InstanceProfileArn:
    Description: EC2 Instance Profile Arn
    Value: !GetAtt EC2InstanceProfile.Arn
    Export:
      Name: "EC2InstanceProfileArn"
  EC2InfraSecurityGroupID:
    Description: EC2 Infra Security Group ID
    Value: !GetAtt EC2InfraSecurityGroup.GroupId
    Export:
      Name: "EC2InfraSecurityGroupID"