# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# Prerequisites:
# - Deploy cf-ec2-launchTemplate.yaml FIRST
# - Deploy cf-ec2-securitygroups.yaml SECOND
# - Deploy this template THIRD
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"                      # 📝 e.g. xyz, myapp, demo
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
InstanceName: "<edit_here>"                      # 📝 e.g. CHIS3HHASUTL01
AvailabilityZone: "<edit_here>"                  # 📝 e.g. ap-southeast-1a
SubnetIdappAZ1: "<edit_here>"                    # 📝 e.g. subnet-08170d48a795103d2
AMIId: "<edit_here>"                             # 📝 e.g. ami-0adcf082d85f6a445
InstanceType: "<edit_here>"                      # 📝 e.g. t3.medium, m5.large
OSVolumeSize: "<edit_here>"                      # 📝 e.g. 100, 200
Function: "<edit_here>"                          # 📝 e.g. APP, WEB, DB, UTL
EC2InfraSecurityGroupID: "<edit_here>"           # 📝 e.g. sg-0a1b2c3d4e5f6g7h8

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
DataVolumeSize: ""                               # e.g. 500
EC2AppSecurityGroupID: ""                        # e.g. sg-xxx
EC2DeploymentSecurityGroupID: ""                 # e.g. sg-xxx

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Must match AppShortName from cf-ec2-launchTemplate.yaml
# - Used for SSM parameter lookups
#
# Format: Lowercase alphanumeric, max 10 characters
# Example: xyz, myapp, demo
#
# Finding Your Value:
# - Use same value from cf-ec2-launchTemplate.yaml
# - Use your organization's application naming convention

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation for resource naming and configuration
#
# Purpose:
# - Used in resource naming
# - Determines deletion policy and termination protection
#
# Allowed Values (Non-Production):
# - nprd, nprd-dev, nprd-stg, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit-a,
#   nprd-sit-b, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-pt, nprd-pp,
#   nprd-pp-a, nprd-pp-b
#
# Allowed Values (Production):
# - prod, prod-a, prod-b, prod-c
#
# Environment-Specific Behavior:
# Production (prod*):
# - DeletionPolicy: Retain (instance preserved on stack deletion)
# - DisableApiTermination: true
#
# Non-Production (nprd*):
# - DeletionPolicy: Delete (instance terminated on stack deletion)
# - DisableApiTermination: false
#
# Finding Your Value:
# - Coordinate with your infrastructure team
# - Should match environment naming used in related resources

# --- INSTANCE NAME ---
# InstanceName: EC2 instance hostname
#
# Purpose:
# - Sets EC2 instance Name tag
# - Used as hostname within the OS
#
# Format: Alphanumeric, uppercase recommended
# Example: CHIS3HHASUTL01, PROD-WEB-01, myapp-db-prod
#
# Finding Your Value:
# - Use your organization's naming convention
# - Include environment indicator
# - Include sequence number for multiple instances

# --- AVAILABILITY ZONE ---
# AvailabilityZone: AWS Availability Zone for instance placement
#
# Purpose:
# - Determines physical data center location
# - Must match the AZ of SubnetIdappAZ1
#
# Common Values (ap-southeast-1):
# - ap-southeast-1a
# - ap-southeast-1b
# - ap-southeast-1c
#
# Format: region-az
# Example: ap-southeast-1a
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Subnets
# 2. Find your subnet
# 3. Note the Availability Zone column
# 4. Use that AZ value

# --- SUBNET ID APP AZ1 ---
# SubnetIdappAZ1: Subnet ID for EC2 instance deployment
#
# Purpose:
# - Defines which subnet the EC2 instance will be launched in
# - Must be in same AZ as AvailabilityZone parameter
#
# Format: subnet-xxxxxxxxxxxxxxxxx
# Example: subnet-08170d48a795103d2
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Subnets
# 2. Filter by VPC ID
# 3. Filter by AZ (must match AvailabilityZone)
# 4. Filter by tag Name (e.g., "*app*" or "*private*")
# 5. Copy subnet ID

# --- AMI ID ---
# AMIId: Amazon Machine Image identifier
#
# Purpose:
# - Defines operating system and pre-installed software
# - Should use organization's hardened/golden AMI
#
# Format: ami-xxxxxxxxxxxxxxxxx
# Example: ami-0adcf082d85f6a445
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → AMIs → Owned by me
# 2. Filter by name (e.g., HCC-Hardened-AMI-*)
# 3. Sort by creation date (newest first)
# 4. Copy AMI ID

# --- INSTANCE TYPE ---
# InstanceType: EC2 instance size and performance class
#
# Purpose:
# - Determines CPU, memory, network, and storage performance
#
# Common Values:
# Development/Testing:
# - t3.micro, t3.small, t3.medium
#
# Production:
# - t3.large, t3.xlarge (burstable)
# - m5.large, m5.xlarge, m5.2xlarge (general purpose)
# - c5.large, c5.xlarge (compute optimized)
# - r5.large, r5.xlarge (memory optimized)
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → Instance Types
# 2. Browse available instance types
# 3. Select appropriate size based on workload requirements

# --- OS VOLUME SIZE ---
# OSVolumeSize: Size of OS root volume in GiB
#
# Purpose:
# - Defines root volume size for operating system and applications
# - Volume type: gp3, encrypted
#
# Common Values:
# - 100: Standard (OS + applications)
# - 200: Application with logs
# - 500: Application with local data
#
# Format: Number (without unit)
# Example: 100, 200, 500
#
# Finding Your Value:
# - Web Servers: 100 GiB
# - Application Servers: 100-200 GiB
# - Database Servers: 100 GiB (use separate data volume)
# - Utility/Integration Servers: 100-200 GiB

# --- FUNCTION ---
# Function: Server role/function identifier
#
# Purpose:
# - Categorizes server by function for tagging
# - Used for cost allocation
#
# Allowed Values:
# - APP: Application server
# - WEB: Web server
# - DB: Database server
# - DBS: Database server variant
# - UTL: Utility server
# - INT: Integration server
# - RPT: Reporting server
# - SYS: System server
#
# Finding Your Value:
# - Determine server's primary function
# - Use standard function code from allowed values

# --- EC2 INFRA SECURITY GROUP ID ---
# EC2InfraSecurityGroupID: Base infrastructure security group ID
#
# Purpose:
# - Created by cf-ec2-launchTemplate.yaml
# - Contains baseline egress rules for VPC access
#
# Format: sg-xxxxxxxxxxxxxxxxx
# Example: sg-0a1b2c3d4e5f6g7h8
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → Security Groups
# 2. Filter by name: {AppShortName}-{EnvName}-sg-ec2-infra
# 3. Copy security group ID

# --- DATA VOLUME SIZE (OPTIONAL) ---
# DataVolumeSize: Size of additional data volume in GiB
#
# Purpose:
# - Optional additional EBS volume for application data
# - Only created if value is specified
# - Volume type: gp3, encrypted
# - Automatic backup tags applied
#
# Format: Number (without unit) or empty string
# Example: 500, 1000, 5000, or ""
#
# Common Values:
# - 500: Application data
# - 1000: Database files
# - 5000: Large database files
#
# Finding Your Value:
# - Use for database files, application uploads, or logs
# - Leave empty ("") if no additional storage needed

# --- EC2 APP SECURITY GROUP ID (OPTIONAL) ---
# EC2AppSecurityGroupID: Application-specific security group ID
#
# Purpose:
# - Created by cf-ec2-securitygroups.yaml
# - Contains ALB ingress and database egress rules
# - Optional - only attach if created
#
# Format: sg-xxxxxxxxxxxxxxxxx or empty string
# Example: sg-0a1b2c3d4e5f6g7h8 or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → Security Groups
# 2. Filter by name: {AppShortName}-{EnvName}-sg-ec2-app
# 3. Copy security group ID
# 4. Leave empty ("") if not created

# --- EC2 DEPLOYMENT SECURITY GROUP ID (OPTIONAL) ---
# EC2DeploymentSecurityGroupID: Deployment/management security group ID
#
# Purpose:
# - Created by cf-ec2-securitygroups.yaml
# - Contains WinRM access from Ansible servers
# - Optional - only attach if created
#
# Format: sg-xxxxxxxxxxxxxxxxx or empty string
# Example: sg-0a1b2c3d4e5f6g7h8 or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → Security Groups
# 2. Filter by name: {AppShortName}-{EnvName}-sg-ec2-deployment
# 3. Copy security group ID
# 4. Leave empty ("") if not created
