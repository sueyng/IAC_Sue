# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# Prerequisites:
# - VPC with database subnets
# - Deploy cf-ec2-launchTemplate.yaml FIRST
# - Deploy this SECOND before cf-ec2.yaml
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. xyz, myapp, demo
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
VpcId: "<edit_here>"                             # 📝 e.g. vpc-0d99a0c727b301d67
CreateAppSecurityGroup: "<edit_here>"            # 📝 yes or no
CreateDeploymentSecurityGroup: "<edit_here>"     # 📝 yes or no
EC2AppSecurityGroupName: "<edit_here>"           # 📝 e.g. xyz-nprd-sg-ec2-app
EC2DeploymentSecurityGroupName: "<edit_here>"    # 📝 e.g. xyz-nprd-sg-ec2-deployment
VPCSubnetCidrDBAZ1: "<edit_here>"                # 📝 e.g. 10.53.144.128/26
VPCSubnetCidrDBAZ2: "<edit_here>"                # 📝 e.g. 10.53.144.192/26

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
ALBSecurityGroupId: ""                           # e.g. sg-0a1b2c3d4e5f6g7h8
AnsibleServerIP1: ""                             # e.g. 10.1.50.100/32
AnsibleServerIP2: ""                             # e.g. 10.1.50.101/32
VPCSubnetCidrDBAZ3: ""                           # e.g. 10.53.144.0/26

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================
# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates security group names: {AppShortName}-{EnvName}-sg-ec2-*
# - Must match AppShortName from cf-ec2-launchTemplate.yaml
#
# Format: Lowercase alphanumeric, max 10 characters
# Example: xyz, myapp, demo
#
# Finding Your Value:
# - Use same value from cf-ec2-launchTemplate.yaml
# - Use your organization's application naming convention

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation for resource naming and configuration
#
# Purpose:
# - Used in resource naming
# - Determines PostgreSQL port in database egress rules
#
# Allowed Values (Non-Production):
# - nprd, nprd-dev, nprd-stg, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit-a,
#   nprd-sit-b, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-pt, nprd-pp,
#   nprd-pp-a, nprd-pp-b
#
# Allowed Values (Production):
# - prod, prod-a, prod-b, prod-c
#
# Environment-Specific Behavior:
# Non-Production (nprd*):
# - PostgreSQL port: 53331
#
# Production (prod*):
# - PostgreSQL port: 53341
#
# SQL Server (All Environments):
# - Port: 1433
#
# Finding Your Value:
# - Coordinate with your infrastructure team
# - Should match environment naming used in related resources

# --- VPC ID ---
# VpcId: Virtual Private Cloud identifier
#
# Purpose:
# - VPC where security groups will be created
# - Must match VPC ID from cf-ec2-launchTemplate.yaml
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-0d99a0c727b301d67
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Your VPCs
# 2. Select the VPC where EC2 security groups will be created
# 3. Copy VPC ID

# --- CREATE APP SECURITY GROUP ---
# CreateAppSecurityGroup: Control application security group creation
#
# Purpose:
# - Controls whether to create EC2 app security group
#
# Available Options:
#
# yes:
# - Create EC2 app security group with ALB ingress and DB egress
# - Use when EC2 instances behind ALB
# - Use when EC2 instances need database access
#
# no:
# - Skip app security group creation
# - Use when not using ALB
# - Use when no database access required
#
# Finding Your Value:
# - Use "yes" if EC2 instances behind Application Load Balancer
# - Use "yes" if EC2 instances need to access RDS databases
# - Use "no" otherwise

# --- CREATE DEPLOYMENT SECURITY GROUP ---
# CreateDeploymentSecurityGroup: Control deployment security group creation
#
# Purpose:
# - Controls whether to create deployment security group for WinRM access
#
# Available Options:
#
# yes:
# - Create deployment security group with WinRM access from Ansible
# - Use for Windows EC2 instances managed by Ansible
#
# no:
# - Skip deployment security group creation
# - Use for Linux instances
# - Use when not using Ansible for deployment
#
# Finding Your Value:
# - Use "yes" if Windows EC2 instances managed by Ansible
# - Use "no" for Linux instances or manual deployment

# --- EC2 APP SECURITY GROUP NAME ---
# EC2AppSecurityGroupName: Application security group name
#
# Purpose:
# - Name for app security group (if CreateAppSecurityGroup=yes)
# - Contains ALB ingress and database egress rules
#
# Format: Alphanumeric and hyphens
# Example: xyz-nprd-sg-ec2-app
#
# Recommended Format: {AppShortName}-{EnvName}-sg-ec2-app
#
# Finding Your Value:
# - Use consistent naming convention
# - Required if CreateAppSecurityGroup=yes
# - Not required if CreateAppSecurityGroup=no

# --- EC2 DEPLOYMENT SECURITY GROUP NAME ---
# EC2DeploymentSecurityGroupName: Deployment security group name
#
# Purpose:
# - Name for deployment security group (if CreateDeploymentSecurityGroup=yes)
# - Contains WinRM ingress from Ansible servers
#
# Format: Alphanumeric and hyphens
# Example: xyz-nprd-sg-ec2-deployment
#
# Recommended Format: {AppShortName}-{EnvName}-sg-ec2-deployment
#
# Finding Your Value:
# - Use consistent naming convention
# - Required if CreateDeploymentSecurityGroup=yes
# - Not required if CreateDeploymentSecurityGroup=no

# --- VPC SUBNET CIDR DB AZ1 ---
# VPCSubnetCidrDBAZ1: Database subnet CIDR for Availability Zone 1
#
# Purpose:
# - Creates egress rule for database access from EC2
# - Allows EC2 to connect to RDS databases in first AZ
#
# Format: CIDR notation
# Example: 10.53.144.128/26
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Subnets
# 2. Filter by tag Name containing "database" or "db"
# 3. Identify subnets by Availability Zone
# 4. Copy IPv4 CIDR for AZ1

# --- VPC SUBNET CIDR DB AZ2 ---
# VPCSubnetCidrDBAZ2: Database subnet CIDR for Availability Zone 2
#
# Purpose:
# - Creates egress rule for database access from EC2
# - Allows EC2 to connect to RDS databases in second AZ
#
# Format: CIDR notation
# Example: 10.53.144.192/26
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Subnets
# 2. Filter by tag Name containing "database" or "db"
# 3. Identify subnets by Availability Zone
# 4. Copy IPv4 CIDR for AZ2

# --- ALB SECURITY GROUP ID (OPTIONAL) ---
# ALBSecurityGroupId: Application Load Balancer security group ID
#
# Purpose:
# - Allows inbound HTTPS (443) from ALB to EC2 instances
# - Only used if CreateAppSecurityGroup=yes
#
# Format: sg-xxxxxxxxxxxxxxxxx or empty string
# Example: sg-0a1b2c3d4e5f6g7h8 or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to EC2 Console → Load Balancers
# 2. Select your ALB
# 3. Security tab → Security groups
# 4. Copy security group ID
# 5. Leave empty ("") if not using ALB

# --- ANSIBLE SERVER IP1 (OPTIONAL) ---
# AnsibleServerIP1: Primary Ansible control node IP address
#
# Purpose:
# - Allows inbound WinRM HTTPS (5986) from Ansible to Windows EC2
# - Only used if CreateDeploymentSecurityGroup=yes
#
# Format: IP address with /32 CIDR or empty string
# Example: 10.1.50.100/32 or ""
#
# Finding Your Value:
# - Contact your deployment team for Ansible server IP
# - Use CIDR notation with /32 for single IP
# - Leave empty ("") if not using Ansible

# --- ANSIBLE SERVER IP2 (OPTIONAL) ---
# AnsibleServerIP2: Secondary Ansible control node IP address
#
# Purpose:
# - Allows inbound WinRM HTTPS (5986) from secondary Ansible server
# - Only used if CreateDeploymentSecurityGroup=yes
#
# Format: IP address with /32 CIDR or empty string
# Example: 10.1.50.101/32 or ""
#
# Finding Your Value:
# - Contact your deployment team for secondary Ansible server IP
# - Leave empty ("") if only using one Ansible server

# --- VPC SUBNET CIDR DB AZ3 (OPTIONAL) ---
# VPCSubnetCidrDBAZ3: Database subnet CIDR for Availability Zone 3
#
# Purpose:
# - Creates egress rule for database access from EC2
# - Optional - only needed if database subnets span 3 AZs
#
# Format: CIDR notation or empty string
# Example: 10.53.144.0/26 or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to VPC Console → Subnets
# 2. Filter by tag Name containing "database" or "db"
# 3. Identify subnets by Availability Zone
# 4. Copy IPv4 CIDR for AZ3
# 5. Leave empty ("") if only using 2 AZs

