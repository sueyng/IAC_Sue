AWSTemplateFormatVersion: 2010-09-09
## Provisioning of EC2
Description: EC2
Parameters:
  AvailabilityZone:
    Type: String
    Description: AvailabilityZone
    AllowedValues: 
      - ap-southeast-1a
      - ap-southeast-1b
      - ap-southeast-1c      
  SubnetIdappAZ1:
    Type: String
    Description: VPC Subnet id for App AZ1
  AppShortName:
    Type: String
    Description: AppShortName
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-c
      - nprd-pt
      - nprd-pp-c
      - prod
      - prod-c
  AMIId: #HCC Hardened AMI
    Type: String
    Description: HCC AMI Image ID
  RunningNum: #Server Number, eg:01,02
    Type: String
    Description: Server Number
  InstanceType: #EC2 Instance Type
    Type: String
    Description: EC2 Instance Type
  DataVolumeSize: #Data Volume Size
    Type: String
    Description: Size of the Data Volume
  Function:
    Type: String
    Description: Server Function (eg, APP, UTL, DB)
    AllowedValues:
      - APP
      - RP
      - WEB
      - UTL
      - DBS

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-c"]]
  AddDataVolume: !Not [!Equals [!Ref DataVolumeSize, '']]
  AdditionalSG: !Not [!Equals [!Ref Function, 'UTL']]

Resources:
  DataVolume:
    Condition: AddDataVolume
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Type: AWS::EC2::Volume
    Properties: 
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub CHIS3${AppShortName}AS${Function}${RunningNum}-Data
        - Key: IaCVersion
          Value: InfraPlatform-EC2-v1

  DataVolumeMountPoint:
    Condition: AddDataVolume
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdm

  EC2Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      LaunchTemplate:
        LaunchTemplateId: !ImportValue EC2LaunchTemplateID
#        LaunchTemplateId: !ImportValue cf-ec2-lt-app-EC2LTID
#        LaunchTemplateId: Fn::ImportValue
#        'Fn::Sub': '${EC2LaunchTemplateStackName}-EC2-LTID'          
        Version: !ImportValue EC2LaunchTemplateLatestVersionNumber
      ImageId: !Ref AMIId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !ImportValue EC2InstanceProfileName
      SubnetId: !Ref SubnetIdappAZ1
      SecurityGroupIds: 
        - !ImportValue EC2InfraSecurityGroupID
        - !If [AdditionalSG, !ImportValue EC2AppSecurityGroupID, !Ref "AWS::NoValue"] 
#        - Fn::ImportValue: !Sub ${StackNameEC2SecurityGroup}-EC2InfraSecurityGroupID
#        - !If [AdditionalSG, Fn::ImportValue: !Sub '${StackNameEC2SecurityGroup}-EC2AppSecurityGroupID', !Ref "AWS::NoValue"]    
      BlockDeviceMappings: 
        -
          DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 80
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        -
          Key: Name
          #Value: !Sub ${AppShortName}-${EnvName}-DeploymentServer01
          Value: !Sub CHIS3${AppShortName}AS${Function}${RunningNum}
        -
          Key: FUNCTION
          Value: !Ref Function
        -
          Key: IaCVersion
          Value: InfraPlatform-EC2-v1