AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: 'AWS KMS customer managed keys (one per KeyNames entry) sharing the same key spec, key usage and key policy (root, administrators, users)'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General
        Parameters:
          - AppShortName
          - EnvName
          - KeyNames
          - KeyDescription
      - Label:
          default: Key Type and Usage
        Parameters:
          - KeySpec
          - KeyUsage
          - EnableKeyRotation
          - RotationPeriodInDays
          - PendingWindowInDays
      - Label:
          default: Key Policy - Root Statement
        Parameters:
          - RootPrincipalArn
          - RootActions
      - Label:
          default: Key Policy - Key Administrators Statement
        Parameters:
          - KeyAdminPrincipals
          - KeyAdminActions
      - Label:
          default: Key Policy - Key Users Statement
        Parameters:
          - KeyUserPrincipals
          - KeyUserActions
          - KeyUserResource
          - KeyUserViaServices
          - EnableGrantForAwsResources

Parameters:
  AppShortName:
    Type: String
    Description: Application short name

  EnvName:
    Type: String
    Description: Environment name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  KeyNames:
    Type: CommaDelimitedList
    Description: Comma separated key name suffixes, one key and alias alias/{AppShortName}-{EnvName}-kms-{KeyName} per entry (e.g. ec2,s3,rds)
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    ConstraintDescription: Each key name may only contain letters, numbers and hyphen

  KeyDescription:
    Type: String
    Description: Description applied to every KMS key, the key name is appended
    Default: 'Customer managed KMS key'

  # Key Type and Usage
  KeySpec:
    Type: String
    Description: Key type (key spec). SYMMETRIC_DEFAULT = AES-256-GCM symmetric key
    Default: SYMMETRIC_DEFAULT
    AllowedValues:
      - SYMMETRIC_DEFAULT
      - RSA_2048
      - RSA_3072
      - RSA_4096
      - ECC_NIST_P256
      - ECC_NIST_P384
      - ECC_NIST_P521
      - ECC_SECG_P256K1
      - HMAC_224
      - HMAC_256
      - HMAC_384
      - HMAC_512
      - SM2

  KeyUsage:
    Type: String
    Description: Cryptographic operations the keys are used for
    Default: ENCRYPT_DECRYPT
    AllowedValues:
      - ENCRYPT_DECRYPT
      - SIGN_VERIFY
      - GENERATE_VERIFY_MAC
      - KEY_AGREEMENT

  EnableKeyRotation:
    Type: String
    Description: Enable automatic key rotation (only applied when KeySpec is SYMMETRIC_DEFAULT)
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  RotationPeriodInDays:
    Type: Number
    Description: Number of days between automatic key rotations
    Default: 365
    MinValue: 90
    MaxValue: 2560

  PendingWindowInDays:
    Type: Number
    Description: Waiting period in days before a key is deleted after it is removed from KeyNames or the stack is deleted
    Default: 30
    MinValue: 7
    MaxValue: 30

  # Key Policy - Root Statement
  RootPrincipalArn:
    Type: String
    Description: Principal for the root statement (leave empty to use arn:aws:iam::{AccountId}:root of this account)
    Default: ''

  RootActions:
    Type: CommaDelimitedList
    Description: Actions allowed for the root principal
    Default: 'kms:*'

  # Key Policy - Key Administrators Statement
  KeyAdminPrincipals:
    Type: CommaDelimitedList
    Description: IAM role/user ARNs that administer the keys (leave empty to skip this statement)
    Default: ''

  KeyAdminActions:
    Type: CommaDelimitedList
    Description: Actions allowed for key administrators (leave empty to use the standard administrator actions)
    Default: ''

  # Key Policy - Key Users Statement
  KeyUserPrincipals:
    Type: CommaDelimitedList
    Description: IAM role/user ARNs or account ARNs that use the keys (leave empty to skip this statement)
    Default: ''

  KeyUserActions:
    Type: CommaDelimitedList
    Description: Actions allowed for key users (leave empty to use the default actions for the selected KeyUsage)
    Default: ''

  KeyUserResource:
    Type: String
    Description: Resource for the key users statement. In a key policy "*" means this key
    Default: '*'

  KeyUserViaServices:
    Type: CommaDelimitedList
    Description: Restrict key users to requests made through these services via kms:ViaService, e.g. s3.ap-southeast-1.amazonaws.com (leave empty for no restriction)
    Default: ''

  EnableGrantForAwsResources:
    Type: String
    Description: Allow key users to create grants for AWS services such as EBS and RDS (kms:GrantIsForAWSResource)
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Rules:
  # Only Singapore region is allowed; keys are single-Region so they cannot be replicated elsewhere
  SingaporeRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-southeast-1]
        AssertDescription: 'KMS keys can only be created in ap-southeast-1 (Singapore)'

  EncryptDecryptKeySpec:
    RuleCondition: !Equals [!Ref KeyUsage, ENCRYPT_DECRYPT]
    Assertions:
      - Assert: !Contains [[SYMMETRIC_DEFAULT, RSA_2048, RSA_3072, RSA_4096, SM2], !Ref KeySpec]
        AssertDescription: 'ENCRYPT_DECRYPT supports KeySpec SYMMETRIC_DEFAULT, RSA_2048, RSA_3072, RSA_4096 or SM2'

  SignVerifyKeySpec:
    RuleCondition: !Equals [!Ref KeyUsage, SIGN_VERIFY]
    Assertions:
      - Assert: !Contains [[RSA_2048, RSA_3072, RSA_4096, ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, ECC_SECG_P256K1, SM2], !Ref KeySpec]
        AssertDescription: 'SIGN_VERIFY supports KeySpec RSA_*, ECC_* or SM2'

  GenerateVerifyMacKeySpec:
    RuleCondition: !Equals [!Ref KeyUsage, GENERATE_VERIFY_MAC]
    Assertions:
      - Assert: !Contains [[HMAC_224, HMAC_256, HMAC_384, HMAC_512], !Ref KeySpec]
        AssertDescription: 'GENERATE_VERIFY_MAC supports KeySpec HMAC_224, HMAC_256, HMAC_384 or HMAC_512'

  KeyAgreementKeySpec:
    RuleCondition: !Equals [!Ref KeyUsage, KEY_AGREEMENT]
    Assertions:
      - Assert: !Contains [[ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, SM2], !Ref KeySpec]
        AssertDescription: 'KEY_AGREEMENT supports KeySpec ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521 or SM2'

Conditions:
  # Production environment condition
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

  # Key type conditions
  IsSymmetric: !Equals [!Ref KeySpec, SYMMETRIC_DEFAULT]
  EnableRotation: !And [!Condition IsSymmetric, !Equals [!Ref EnableKeyRotation, 'true']]

  # Key usage conditions (drive the default key user actions)
  IsEncryptDecrypt: !Equals [!Ref KeyUsage, ENCRYPT_DECRYPT]
  IsSignVerify: !Equals [!Ref KeyUsage, SIGN_VERIFY]
  IsGenerateVerifyMac: !Equals [!Ref KeyUsage, GENERATE_VERIFY_MAC]

  # Key policy conditions
  UseDefaultRootPrincipal: !Equals [!Ref RootPrincipalArn, '']
  HasKeyAdmins: !Not [!Equals [!Join ['', !Ref KeyAdminPrincipals], '']]
  UseDefaultKeyAdminActions: !Equals [!Join ['', !Ref KeyAdminActions], '']
  HasKeyUsers: !Not [!Equals [!Join ['', !Ref KeyUserPrincipals], '']]
  UseDefaultKeyUserActions: !Equals [!Join ['', !Ref KeyUserActions], '']
  HasViaServices: !Not [!Equals [!Join ['', !Ref KeyUserViaServices], '']]
  CreateGrantStatement: !And [!Condition HasKeyUsers, !Equals [!Ref EnableGrantForAwsResources, 'true']]

Resources:
  # One key and alias per KeyNames entry. &{KeyName} strips "-" for the logical ID
  # (KmsKeyrdsdata), so names like "rds-data" and "rdsdata" collide. &{} only works
  # in keys, so references rebuild the logical ID with Join/Split on "-".
  Fn::ForEach::KmsKeys:
    - KeyName
    - !Ref KeyNames
    - 'KmsKey&{KeyName}':
        Type: AWS::KMS::Key
        DeletionPolicy: !If [IsProduction, Retain, Delete]
        UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
        Properties:
          Description: !Sub "${KeyDescription} (${KeyName})"
          Enabled: true
          KeySpec: !Ref KeySpec
          KeyUsage: !Ref KeyUsage
          # Single-Region key only, cross-Region replication is not allowed
          MultiRegion: false
          EnableKeyRotation: !If [EnableRotation, true, false]
          RotationPeriodInDays: !If [EnableRotation, !Ref RotationPeriodInDays, !Ref 'AWS::NoValue']
          PendingWindowInDays: !Ref PendingWindowInDays
          # The key policy is built as a JSON string. Inside Fn::ForEach an optional
          # statement written as !If [..., !Ref 'AWS::NoValue'] becomes null instead of
          # being removed, so each optional statement adds ",{...}" or "" to the list.
          # Same statements and default actions as cf-kms.yaml.
          KeyPolicy: !Sub
            - '{"Version":"2012-10-17","Id":"${AppShortName}-${EnvName}-kms-${KeyName}-policy","Statement":[${RootStatement}${AdminStatement}${UserStatement}${GrantStatement}]}'
            - RootStatement:
                Fn::ToJsonString:
                  Sid: Enable IAM Root Permissions
                  Effect: Allow
                  Principal:
                    AWS: !If
                      - UseDefaultRootPrincipal
                      - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                      - !Ref RootPrincipalArn
                  Action: !Ref RootActions
                  Resource: '*'

              AdminStatement: !If
                - HasKeyAdmins
                - !Join
                  - ''
                  - - ','
                    - Fn::ToJsonString:
                        Sid: Allow administration of the key
                        Effect: Allow
                        Principal:
                          AWS: !Ref KeyAdminPrincipals
                        Action: !If
                          - UseDefaultKeyAdminActions
                          - - kms:Create*
                            - kms:Describe*
                            - kms:Enable*
                            - kms:List*
                            - kms:Put*
                            - kms:Update*
                            - kms:Revoke*
                            - kms:Disable*
                            - kms:Get*
                            - kms:Delete*
                            - kms:TagResource
                            - kms:UntagResource
                            - kms:ScheduleKeyDeletion
                            - kms:CancelKeyDeletion
                            - kms:RotateKeyOnDemand
                          - !Ref KeyAdminActions
                        Resource: '*'
                - ''

              # Split/Join removes the ',"Condition":null' rendered when KeyUserViaServices is empty
              UserStatement: !If
                - HasKeyUsers
                - !Join
                  - ''
                  - - ','
                    - !Join
                      - ''
                      - !Split
                        - ',"Condition":null'
                        - Fn::ToJsonString:
                            Sid: Allow use of the key
                            Effect: Allow
                            Principal:
                              AWS: !Ref KeyUserPrincipals
                            Action: !If
                              - UseDefaultKeyUserActions
                              - !If
                                - IsEncryptDecrypt
                                - - kms:Encrypt
                                  - kms:Decrypt
                                  - kms:ReEncrypt*
                                  - kms:DescribeKey
                                  - kms:GenerateDataKey*
                                - !If
                                  - IsSignVerify
                                  - - kms:Sign
                                    - kms:Verify
                                    - kms:GetPublicKey
                                    - kms:DescribeKey
                                  - !If
                                    - IsGenerateVerifyMac
                                    - - kms:GenerateMac
                                      - kms:VerifyMac
                                      - kms:DescribeKey
                                    # KEY_AGREEMENT
                                    - - kms:DeriveSharedSecret
                                      - kms:GetPublicKey
                                      - kms:DescribeKey
                              - !Ref KeyUserActions
                            Resource: !Ref KeyUserResource
                            Condition: !If
                              - HasViaServices
                              - StringEquals:
                                  kms:ViaService: !Ref KeyUserViaServices
                              - !Ref 'AWS::NoValue'
                - ''

              GrantStatement: !If
                - CreateGrantStatement
                - !Join
                  - ''
                  - - ','
                    - Fn::ToJsonString:
                        Sid: Allow attachment of persistent resources
                        Effect: Allow
                        Principal:
                          AWS: !Ref KeyUserPrincipals
                        Action:
                          - kms:CreateGrant
                          - kms:ListGrants
                          - kms:RevokeGrant
                        Resource: '*'
                        Condition:
                          Bool:
                            kms:GrantIsForAWSResource: 'true'
                - ''
          Tags:
            - Key: Name
              Value: !Sub "${AppShortName}-${EnvName}-kms-${KeyName}"
            - Key: AppShortName
              Value: !Ref AppShortName
            - Key: Environment
              Value: !Ref EnvName
            - Key: IaCVersion
              Value: "InfraPlatform-kms-v1.1"

      'KmsKeyAlias&{KeyName}':
        Type: AWS::KMS::Alias
        Properties:
          AliasName: !Sub "alias/${AppShortName}-${EnvName}-kms-${KeyName}"
          TargetKeyId: !GetAtt [!Join ['', !Split ['-', !Sub 'KmsKey${KeyName}']], Arn]

Outputs:
  Fn::ForEach::KmsKeyOutputs:
    - KeyName
    - !Ref KeyNames
    - 'KmsKeyId&{KeyName}':
        Description: ID of the KMS key
        Value: !GetAtt [!Join ['', !Split ['-', !Sub 'KmsKey${KeyName}']], KeyId]
        Export:
          Name: !Sub "${AWS::StackName}-${KeyName}-KmsKeyId"

      'KmsKeyArn&{KeyName}':
        Description: ARN of the KMS key
        Value: !GetAtt [!Join ['', !Split ['-', !Sub 'KmsKey${KeyName}']], Arn]
        Export:
          Name: !Sub "${AWS::StackName}-${KeyName}-KmsKeyArn"

      'KmsKeyAliasName&{KeyName}':
        Description: Alias name of the KMS key
        Value: !Sub "alias/${AppShortName}-${EnvName}-kms-${KeyName}"
        Export:
          Name: !Sub "${AWS::StackName}-${KeyName}-KmsKeyAliasName"

  KmsKeySpec:
    Description: Key spec of the KMS keys
    Value: !Ref KeySpec

  KmsKeyUsage:
    Description: Key usage of the KMS keys
    Value: !Ref KeyUsage
