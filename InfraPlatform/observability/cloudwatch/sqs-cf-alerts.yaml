AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for AWS SQS Standard Alerts with SNS Topics V1

Parameters:
  AppShortName:
    Type: String
    Description: Application short name
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  SQSQueueName:
    Type: String
    Description: Name of the SQS Queue to monitor
    
  Team1SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 1 notifications (e.g., L2 Operations)
    Default: ""
    
  Team2SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 2 notifications (e.g., L3 Support/Development)
    Default: ""
    
  Team3SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 3 notifications (e.g., Infrastructure/Platform)
    Default: ""
  
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTeam1Topic: !Not [!Equals [!Ref Team1SNSTopicArn, ""]]
  HasTeam2Topic: !Not [!Equals [!Ref Team2SNSTopicArn, ""]]
  HasTeam3Topic: !Not [!Equals [!Ref Team3SNSTopicArn, ""]]
  EnableDLQAlarm: !Not [!Equals [!Ref SQSQueueName, '']]

Resources:
  # CloudWatch Alarm for SQS Queue Depth (Critical Priority)
  SQSQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub '${AppShortName}-${EnvName}-sqs-queue-depth-alarm'
      AlarmDescription: !Sub 'Alarm for SQS Queue ${SQSQueueName} high message count'
      MetricName: ApproximateNumberOfMessages
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1000  # Adjust based on your queue requirements
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref SQSQueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub '${AppShortName}-${EnvName}-sqs-queue-depth-alarm'
        - Key: IaCVersion
          Value: Observability-SQS-Alerts-v1
        - Key: Classification
          Value: Critical Priority

  # CloudWatch Alarm for SQS Dead Letter Queue (Critical)
  SQSDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableDLQAlarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub '${AppShortName}-${EnvName}-sqs-dlq-alarm'
      AlarmDescription: !Sub 'Alarm for SQS Dead Letter Queue ${SQSQueueName} messages'
      MetricName: ApproximateNumberOfMessages
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !Sub '${SQSQueueName}-dlq'
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub '${AppShortName}-${EnvName}-sqs-dlq-alarm'
        - Key: IaCVersion
          Value: Observability-SQS-Alerts-v1
        - Key: Classification
          Value: Critical

  # CloudWatch Alarm for SQS Message Age (Critical Priority)
  SQSMessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub '${AppShortName}-${EnvName}-sqs-message-age-alarm'
      AlarmDescription: !Sub 'Alarm for SQS Queue ${SQSQueueName} old messages'
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref SQSQueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub '${AppShortName}-${EnvName}-sqs-message-age-alarm'
        - Key: IaCVersion
          Value: Observability-SQS-Alerts-v1
        - Key: Classification
          Value: Critical Priority
