AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for ALB CloudWatch Alarms - Multi-ALB & Multi-TG Support V1

Parameters:
  AppShortName:
    Type: String
    Description: Application short name
    
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
      
  Alb1Name:
    Type: String
    Description: ALB 1 Name for monitoring
    
  Alb1TargetGroup1Name:
    Type: String
    Description: ALB 1 Target Group 1 Name for monitoring
    Default: ""
    
  Alb1TargetGroup2Name:
    Type: String
    Description: ALB 1 Target Group 2 Name for monitoring
    Default: ""
    
  Alb1TargetGroup3Name:
    Type: String
    Description: ALB 1 Target Group 3 Name for monitoring
    Default: ""
    
  Alb2Name:
    Type: String
    Description: ALB 2 Name for monitoring (optional)
    Default: ""
    
  Alb2TargetGroup1Name:
    Type: String
    Description: ALB 2 Target Group 1 Name for monitoring
    Default: ""
    
  Alb2TargetGroup2Name:
    Type: String
    Description: ALB 2 Target Group 2 Name for monitoring
    Default: ""
    
  Alb2TargetGroup3Name:
    Type: String
    Description: ALB 2 Target Group 3 Name for monitoring
    Default: ""
    
  Alb3Name:
    Type: String
    Description: ALB 3 Name for monitoring (optional)
    Default: ""
    
  Alb3TargetGroup1Name:
    Type: String
    Description: ALB 3 Target Group 1 Name for monitoring
    Default: ""
    
  Alb3TargetGroup2Name:
    Type: String
    Description: ALB 3 Target Group 2 Name for monitoring
    Default: ""
    
  Alb3TargetGroup3Name:
    Type: String
    Description: ALB 3 Target Group 3 Name for monitoring
    Default: ""
    
  Alb4Name:
    Type: String
    Description: ALB 4 Name for monitoring (optional)
    Default: ""
    
  Alb4TargetGroup1Name:
    Type: String
    Description: ALB 4 Target Group 1 Name for monitoring
    Default: ""
    
  Alb4TargetGroup2Name:
    Type: String
    Description: ALB 4 Target Group 2 Name for monitoring
    Default: ""
    
  Alb4TargetGroup3Name:
    Type: String
    Description: ALB 4 Target Group 3 Name for monitoring
    Default: ""
    
  Team1SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 1 notifications (e.g., L2 Operations)
    Default: ""
    
  Team2SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 2 notifications (e.g., L3 Support/Development)
    Default: ""
    
  Team3SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 3 notifications (e.g., Infrastructure/Platform)
    Default: ""
    
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTeam1Topic: !Not [!Equals [!Ref Team1SNSTopicArn, ""]]
  HasTeam2Topic: !Not [!Equals [!Ref Team2SNSTopicArn, ""]]
  HasTeam3Topic: !Not [!Equals [!Ref Team3SNSTopicArn, ""]]
  HasAlb2: !Not [!Equals [!Ref Alb2Name, ""]]
  HasAlb3: !Not [!Equals [!Ref Alb3Name, ""]]
  HasAlb4: !Not [!Equals [!Ref Alb4Name, ""]]
  HasAlb1TargetGroup1: !Not [!Equals [!Ref Alb1TargetGroup1Name, ""]]
  HasAlb1TargetGroup2: !Not [!Equals [!Ref Alb1TargetGroup2Name, ""]]
  HasAlb1TargetGroup3: !Not [!Equals [!Ref Alb1TargetGroup3Name, ""]]
  HasAlb2TargetGroup1: !Not [!Equals [!Ref Alb2TargetGroup1Name, ""]]
  HasAlb2TargetGroup2: !Not [!Equals [!Ref Alb2TargetGroup2Name, ""]]
  HasAlb2TargetGroup3: !Not [!Equals [!Ref Alb2TargetGroup3Name, ""]]
  HasAlb3TargetGroup1: !Not [!Equals [!Ref Alb3TargetGroup1Name, ""]]
  HasAlb3TargetGroup2: !Not [!Equals [!Ref Alb3TargetGroup2Name, ""]]
  HasAlb3TargetGroup3: !Not [!Equals [!Ref Alb3TargetGroup3Name, ""]]
  HasAlb4TargetGroup1: !Not [!Equals [!Ref Alb4TargetGroup1Name, ""]]
  HasAlb4TargetGroup2: !Not [!Equals [!Ref Alb4TargetGroup2Name, ""]]
  HasAlb4TargetGroup3: !Not [!Equals [!Ref Alb4TargetGroup3Name, ""]]

Resources:
  # ALB 1 Level Alarms
  Alb1FiveXXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Alb1Name}-HTTPCode_ELB_5XX_Count"
      AlarmDescription: !Sub "ALB 1 5XX errors for ${AppShortName}-${EnvName}-${Alb1Name}"
      MetricName: HTTPCode_ELB_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref Alb1Name
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Alb1Name}-5XX-Error-Alarm"
        - Key: IaCVersion
          Value: Observability-ALB-MultiTG-v1

  # ALB 1 Target Group 1 Unhealthy Host Alarm
  Alb1TG1UnhealthyHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlb1TargetGroup1
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Alb1TargetGroup1Name}-UnhealthyHostCount"
      AlarmDescription: !Sub "ALB 1 Target Group 1 unhealthy hosts for ${AppShortName}-${EnvName}-${Alb1TargetGroup1Name}"
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TargetGroup
          Value: !Ref Alb1TargetGroup1Name
        - Name: LoadBalancer
          Value: !Ref Alb1Name
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Alb1TargetGroup1Name}-UnhealthyHost-Alarm"
        - Key: IaCVersion
          Value: Observability-ALB-MultiTG-v1

  # ALB 1 Target Group 1 5XX Error Alarm
  Alb1TG1FiveXXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlb1TargetGroup1
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
