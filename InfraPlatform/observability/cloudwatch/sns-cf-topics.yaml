AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template SNS Monitoring Topic for Important Alerts for SMS and Emails V1
Parameters:
  InstituteName:
    Type: String
    Description: Institute Name
  AppShortName:
    Type: String
    Description: Application short name
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

Resources:
  AppL2OpsSNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TopicName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l2-ops'
      DisplayName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l2-ops'
      Tags:
        - Key: Name
          Value: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l2-ops'
        - Key: IaCVersion
          Value: Observability-SNS-v1

  AppL3SupportSNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TopicName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l3-support'
      DisplayName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l3-support'
      Tags:
        - Key: Name
          Value: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-app-l3-support'
        - Key: IaCVersion
          Value: Observability-SNS-v1

  InfraL3SupportSNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TopicName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-infra-l3-support'
      DisplayName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-infra-l3-support'
      Tags:
        - Key: Name
          Value: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-infra-l3-support'
        - Key: IaCVersion
          Value: Observability-SNS-v1

  DbOpsSNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TopicName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-db-ops'
      DisplayName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-db-ops'
      Tags:
        - Key: Name
          Value: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-db-ops'
        - Key: IaCVersion
          Value: Observability-SNS-v1

  SecurityOpsSNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TopicName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-security-ops'
      DisplayName: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-security-ops'
      Tags:
        - Key: Name
          Value: !Sub '${InstituteName}-${AppShortName}-${EnvName}-sns-security-ops'
        - Key: IaCVersion
          Value: Observability-SNS-v1