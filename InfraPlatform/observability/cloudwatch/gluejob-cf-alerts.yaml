AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for AWS Glue Job Standard Alerts with SNS Topics V1

Parameters:
  AppShortName:
    Type: String
    Description: Application short name
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
      - prod-b
  GlueJobName:
    Type: String
    Description: Name of the Glue Job to monitor
    
  Team1SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 1 notifications (e.g., L2 Operations)
    Default: ""
    
  Team2SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 2 notifications (e.g., L3 Support/Development)
    Default: ""
    
  Team3SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 3 notifications (e.g., Infrastructure/Platform)
    Default: ""
  
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTeam1Topic: !Not [!Equals [!Ref Team1SNSTopicArn, ""]]
  HasTeam2Topic: !Not [!Equals [!Ref Team2SNSTopicArn, ""]]
  HasTeam3Topic: !Not [!Equals [!Ref Team3SNSTopicArn, ""]]
  EnableDurationAlarm: !Not [!Equals [!Ref GlueJobName, '']]

Resources:
  # CloudWatch Alarm for Glue Job Failures (Critical)
  GlueJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub '${AppShortName}-${EnvName}-glue-job-failure-alarm'
      AlarmDescription: !Sub 'Alarm for Glue Job ${GlueJobName} failures'
      MetricName: glue.driver.aggregate.numFailedTasks
      Namespace: Glue
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: JobName
          Value: !Ref GlueJobName
        - Name: JobRunId
          Value: ALL
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub '${AppShortName}-${EnvName}-glue-job-failure-alarm'
        - Key: IaCVersion
          Value: Observability-Glue-Alerts-v1
        - Key: Classification
          Value: Critical

  # CloudWatch Alarm for Glue Job Duration (Critical)
  GlueJobDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableDurationAlarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub '${AppShortName}-${EnvName}-glue-job-duration-alarm'
      AlarmDescription: !Sub 'Alarm for Glue Job ${GlueJobName} excessive duration'
      MetricName: glue.driver.aggregate.elapsedTime
      Namespace: Glue
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600000  # 1 hour in milliseconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: JobName
          Value: !Ref GlueJobName
        - Name: JobRunId
          Value: ALL
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub '${AppShortName}-${EnvName}-glue-job-duration-alarm'
        - Key: IaCVersion
          Value: Observability-Glue-Alerts-v1
        - Key: Classification
          Value: Critical