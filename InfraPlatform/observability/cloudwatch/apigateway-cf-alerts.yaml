      AlarmDescription: !Sub "API Gateway high integration latency for ${AppShortName}-${EnvName}-${ApiGateway1Name}"
      MetricName: IntegrationLatency
      Namespace: AWS/ApiGateway
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 4000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
