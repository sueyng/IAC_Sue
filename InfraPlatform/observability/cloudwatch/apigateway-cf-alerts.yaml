      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiGateway2Name
        - Name: Stage
          Value: !Ref ApiGateway2Stage
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ApiGateway2Name}-4XX-Error-Alarm"
        - Key: IaCVersion
          Value: Observability-APIGateway-v1

  # API Gateway 2 Latency Alarm
  ApiGateway2LatencyAlarm:
