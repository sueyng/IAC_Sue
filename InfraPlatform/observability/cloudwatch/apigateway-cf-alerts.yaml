      AlarmDescription: !Sub "API Gateway high latency for ${AppShortName}-${EnvName}-${ApiGateway2Name}"
      MetricName: Latency
      Namespace: AWS/ApiGateway
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiGateway2Name
        - Name: Stage
