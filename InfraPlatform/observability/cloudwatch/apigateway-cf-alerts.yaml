          Value: !Ref ApiGateway1Name
        - Name: Stage
          Value: !Ref ApiGateway1Stage
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ApiGateway1Name}-IntegrationLatency-Alarm"
        - Key: IaCVersion
          Value: Observability-APIGateway-v1

  # API Gateway 1 Count (Request Count) High Traffic Alarm - CRITICAL
  ApiGateway1CountHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ApiGateway1Name}-Count-High"
      AlarmDescription: !Sub "API Gateway unusually high request count for ${AppShortName}-${EnvName}-${ApiGateway1Name}"
      MetricName: Count
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiGateway1Name
        - Name: Stage
          Value: !Ref ApiGateway1Stage
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ApiGateway1Name}-CountHigh-Alarm"
        - Key: IaCVersion
          Value: Observability-APIGateway-v1

  # API Gateway 2 Alarms (Conditional)
  # API Gateway 2 5XX Error Alarm
  ApiGateway2FiveXXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasApiGateway2
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ApiGateway2Name}-5XXError"
      AlarmDescription: !Sub "API Gateway 5XX errors for ${AppShortName}-${EnvName}-${ApiGateway2Name}"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiGateway2Name
        - Name: Stage
          Value: !Ref ApiGateway2Stage
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ApiGateway2Name}-5XX-Error-Alarm"
        - Key: IaCVersion
          Value: Observability-APIGateway-v1

  # API Gateway 2 4XX Error Alarm
  ApiGateway2FourXXErrorAlarm:
