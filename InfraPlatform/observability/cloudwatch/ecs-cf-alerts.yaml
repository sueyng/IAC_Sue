AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for ECS CloudWatch Alarms and Monitoring with Critical and Important Alerts V1

Parameters:
  AppShortName:
    Type: String
    Description: Application short name
    
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
      
  ECSClusterName:
    Type: String
    Description: ECS Cluster name for monitoring
    
  ECSService1Name:
    Type: String
    Description: ECS Service 1 name for monitoring
    
  ECSService2Name:
    Type: String
    Description: ECS Service 2 name for monitoring (optional)
    Default: ""
    
  ECSService3Name:
    Type: String
    Description: ECS Service 3 name for monitoring (optional)
    Default: ""
    
  CPUUtilizationCriticalThreshold:
    Type: Number
    Description: CPU utilization critical threshold (%)
    Default: 90
    MinValue: 50
    MaxValue: 100
    
  CPUUtilizationWarningThreshold:
    Type: Number
    Description: CPU utilization warning threshold (%)
    Default: 80
    MinValue: 50
    MaxValue: 100
    
  MemoryUtilizationCriticalThreshold:
    Type: Number
    Description: Memory utilization critical threshold (%)
    Default: 90
    MinValue: 50
    MaxValue: 100
    
  MemoryUtilizationWarningThreshold:
    Type: Number
    Description: Memory utilization warning threshold (%)
    Default: 80
    MinValue: 50
    MaxValue: 100
    
  DesiredCountThreshold:
    Type: Number
    Description: Minimum desired count threshold for running tasks
    Default: 1
    MinValue: 1
    
  RunningTaskCountThreshold:
    Type: Number
    Description: Minimum running task count threshold
    Default: 1
    MinValue: 1
    
  Team1SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 1 notifications (e.g., L2 Operations)
    Default: ""
    
  Team2SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 2 notifications (e.g., L3 Support/Development)
    Default: ""
    
  Team3SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 3 notifications (e.g., Infrastructure/Platform)
    Default: ""
    
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTeam1Topic: !Not [!Equals [!Ref Team1SNSTopicArn, ""]]
  HasTeam2Topic: !Not [!Equals [!Ref Team2SNSTopicArn, ""]]
  HasTeam3Topic: !Not [!Equals [!Ref Team3SNSTopicArn, ""]]
  HasECSService2: !Not [!Equals [!Ref ECSService2Name, ""]]
  HasECSService3: !Not [!Equals [!Ref ECSService3Name, ""]]

Resources:
  # ========================================
  # ECS Service 1 Alarms - CRITICAL
  # ========================================
  
  # CPU Utilization Critical Alarm
  ECSService1CPUCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ECSService1Name}-CPU-Critical"
      AlarmDescription: !Sub "CRITICAL: ECS Service CPU utilization is critically high for ${AppShortName}-${EnvName}-${ECSService1Name}"
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CPUUtilizationCriticalThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref ECSService1Name
        - Name: ClusterName
          Value: !Ref ECSClusterName
      TreatMissingData: breaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ECSService1Name}-CPU-Critical-Alarm"
        - Key: Severity
          Value: "Critical"
        - Key: IaCVersion
          Value: Observability-ECS-v1

  # Memory Utilization Critical Alarm
  ECSService1MemoryCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
