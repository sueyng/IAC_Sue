    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-RunningTaskCount-Critical"
      AlarmDescription: !Sub "CRITICAL: ECS Service running task count is below threshold for ${AppShortName}-${EnvName}-${ECSService3Name}"
      MetricName: RunningTaskCount
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref RunningTaskCountThreshold
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref ECSService3Name
        - Name: ClusterName
          Value: !Ref ECSClusterName
      TreatMissingData: breaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-RunningTaskCount-Critical-Alarm"
        - Key: Severity
          Value: "Critical"
        - Key: IaCVersion
          Value: Observability-ECS-v1

  # Desired Count Critical Alarm - Service 3
  ECSService3DesiredCountCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasECSService3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-DesiredCount-Critical"
      AlarmDescription: !Sub "CRITICAL: ECS Service desired count is below threshold for ${AppShortName}-${EnvName}-${ECSService3Name}"
      MetricName: DesiredCount
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref DesiredCountThreshold
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref ECSService3Name
        - Name: ClusterName
          Value: !Ref ECSClusterName
      TreatMissingData: breaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-DesiredCount-Critical-Alarm"
        - Key: Severity
          Value: "Critical"
        - Key: IaCVersion
          Value: Observability-ECS-v1

  # ========================================
  # ECS Service 3 Alarms - IMPORTANT
  # ========================================
  
  # CPU Utilization Warning Alarm - Service 3
  ECSService3CPUWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasECSService3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-CPU-Warning"
      AlarmDescription: !Sub "WARNING: ECS Service CPU utilization is high for ${AppShortName}-${EnvName}-${ECSService3Name}"
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref CPUUtilizationWarningThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref ECSService3Name
        - Name: ClusterName
          Value: !Ref ECSClusterName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-CPU-Warning-Alarm"
        - Key: Severity
          Value: "Warning"
        - Key: IaCVersion
          Value: Observability-ECS-v1

  # Memory Utilization Warning Alarm - Service 3
  ECSService3MemoryWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasECSService3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-Memory-Warning"
      AlarmDescription: !Sub "WARNING: ECS Service memory utilization is high for ${AppShortName}-${EnvName}-${ECSService3Name}"
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref MemoryUtilizationWarningThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref ECSService3Name
        - Name: ClusterName
          Value: !Ref ECSClusterName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${ECSService3Name}-Memory-Warning-Alarm"
        - Key: Severity
          Value: "Warning"
        - Key: IaCVersion
          Value: Observability-ECS-v1

Outputs:
  ECSService1CriticalAlarms:
    Description: "Critical alarms for ECS Service 1"
    Value: !Join
      - ", "
      - - !Ref ECSService1CPUCriticalAlarm
        - !Ref ECSService1MemoryCriticalAlarm
        - !Ref ECSService1RunningTaskCountCriticalAlarm
        - !Ref ECSService1DesiredCountCriticalAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService1-Critical-Alarms"

  ECSService1ImportantAlarms:
    Description: "Important alarms for ECS Service 1"
    Value: !Join
      - ", "
      - - !Ref ECSService1CPUWarningAlarm
        - !Ref ECSService1MemoryWarningAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService1-Important-Alarms"

  ECSService2CriticalAlarms:
    Condition: HasECSService2
    Description: "Critical alarms for ECS Service 2"
    Value: !Join
      - ", "
      - - !Ref ECSService2CPUCriticalAlarm
        - !Ref ECSService2MemoryCriticalAlarm
        - !Ref ECSService2RunningTaskCountCriticalAlarm
        - !Ref ECSService2DesiredCountCriticalAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService2-Critical-Alarms"

  ECSService2ImportantAlarms:
    Condition: HasECSService2
    Description: "Important alarms for ECS Service 2"
    Value: !Join
      - ", "
      - - !Ref ECSService2CPUWarningAlarm
        - !Ref ECSService2MemoryWarningAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService2-Important-Alarms"

  ECSService3CriticalAlarms:
    Condition: HasECSService3
    Description: "Critical alarms for ECS Service 3"
    Value: !Join
      - ", "
      - - !Ref ECSService3CPUCriticalAlarm
        - !Ref ECSService3MemoryCriticalAlarm
        - !Ref ECSService3RunningTaskCountCriticalAlarm
        - !Ref ECSService3DesiredCountCriticalAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService3-Critical-Alarms"

  ECSService3ImportantAlarms:
    Condition: HasECSService3
    Description: "Important alarms for ECS Service 3"
    Value: !Join
      - ", "
      - - !Ref ECSService3CPUWarningAlarm
        - !Ref ECSService3MemoryWarningAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSService3-Important-Alarms"

  ECSClusterAlarms:
    Description: "Cluster level alarms"
    Value: !Join
      - ", "
      - - !Ref ECSClusterCPUReservationHighAlarm
        - !Ref ECSClusterMemoryReservationHighAlarm
    Export:
      Name: !Sub "${AWS::StackName}-ECSCluster-Alarms"
