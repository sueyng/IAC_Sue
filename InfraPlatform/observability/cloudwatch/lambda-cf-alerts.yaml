AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for AWS Lambda CloudWatch Alarms and Monitoring V1

Parameters:
  AppShortName:
    Type: String
    Description: Application short name
    
  EnvName:
    Type: String
    Description: Environment Name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
      
  Lambda1FunctionName:
    Type: String
    Description: Lambda Function 1 Name for monitoring
    
  Lambda2FunctionName:
    Type: String
    Description: Lambda Function 2 Name for monitoring (optional)
    Default: ""
    
  Lambda3FunctionName:
    Type: String
    Description: Lambda Function 3 Name for monitoring (optional)
    Default: ""
    
  Team1SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 1 notifications (e.g., L2 Operations)
    Default: ""
    
  Team2SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 2 notifications (e.g., L3 Support/Development)
    Default: ""
    
  Team3SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for Team 3 notifications (e.g., Infrastructure/Platform)
    Default: ""

  ErrorThreshold:
    Type: Number
    Description: Error count threshold for alarms
    Default: 5
    
  DurationThreshold:
    Type: Number
    Description: Duration threshold in milliseconds
    Default: 30000
    
  ThrottleThreshold:
    Type: Number
    Description: Throttle count threshold
    Default: 1
    
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasTeam1Topic: !Not [!Equals [!Ref Team1SNSTopicArn, ""]]
  HasTeam2Topic: !Not [!Equals [!Ref Team2SNSTopicArn, ""]]
  HasTeam3Topic: !Not [!Equals [!Ref Team3SNSTopicArn, ""]]
  HasLambda2: !Not [!Equals [!Ref Lambda2FunctionName, ""]]
  HasLambda3: !Not [!Equals [!Ref Lambda3FunctionName, ""]]

Resources:
  # Lambda Function 1 Alarms
  Lambda1ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Errors"
      AlarmDescription: !Sub "Lambda function errors for ${AppShortName}-${EnvName}-${Lambda1FunctionName}"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref ErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref Lambda1FunctionName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Error-Alarm"
        - Key: IaCVersion
          Value: Observability-Lambda-v1

  Lambda1DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Duration"
      AlarmDescription: !Sub "Lambda function high duration for ${AppShortName}-${EnvName}-${Lambda1FunctionName}"
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref DurationThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref Lambda1FunctionName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Duration-Alarm"
        - Key: IaCVersion
          Value: Observability-Lambda-v1

  Lambda1ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Throttles"
      AlarmDescription: !Sub "Lambda function throttles for ${AppShortName}-${EnvName}-${Lambda1FunctionName}"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref ThrottleThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref Lambda1FunctionName
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasTeam1Topic, !Ref Team1SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-Throttle-Alarm"
        - Key: IaCVersion
          Value: Observability-Lambda-v1

  Lambda1DeadLetterQueueAlarm:
