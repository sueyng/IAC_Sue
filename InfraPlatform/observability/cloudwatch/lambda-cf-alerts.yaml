    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AlarmName: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-DeadLetterErrors"
      AlarmDescription: !Sub "Lambda function dead letter queue errors for ${AppShortName}-${EnvName}-${Lambda1FunctionName}"
      MetricName: DeadLetterErrors
