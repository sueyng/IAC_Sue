        - !If [HasTeam2Topic, !Ref Team2SNSTopicArn, !Ref "AWS::NoValue"]
        - !If [HasTeam3Topic, !Ref Team3SNSTopicArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-${Lambda1FunctionName}-ConcurrentExec-Alarm"
        - Key: IaCVersion
          Value: Observability-Lambda-v1

