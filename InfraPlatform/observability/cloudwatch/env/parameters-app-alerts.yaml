# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates alarm names: {AppShortName}-{EnvName}-{ApiName}-*
# - Used for alarm organization and filtering
#
# Format: Lowercase alphanumeric
# Example: myapp, fusion, api
#
# Finding Your Value:
# - Use your organization's application naming convention
# - Should match naming used in other infrastructure components

# --- API 1 NAME ---
# Api1Name: API Gateway 1 name for monitoring
#
# Purpose:
# - Specifies first API Gateway for CloudWatch alarms
# - Creates stage-level and per-path alarms
#
# Format: API Gateway name
# Example: fusionapi, myapi-gateway
#
# Finding Your Value (AWS Console):
# 1. Navigate to API Gateway Console → APIs
# 2. Find your API Gateway
# 3. Copy the API name

# --- API 2 NAME ---
# Api2Name: API Gateway 2 name for monitoring
#
# Purpose:
# - Specifies second API Gateway for CloudWatch alarms
# - Creates stage-level and per-path alarms
#
# Format: API Gateway name
# Example: fhirtrg, myapi-gateway-v2
#
# Finding Your Value (AWS Console):
# 1. Navigate to API Gateway Console → APIs
# 2. Find your API Gateway
# 3. Copy the API name

# --- ENVIRONMENT NAME (OPTIONAL) ---
# EnvName: Environment designation for resource naming and configuration
#
# Purpose:
# - Used in resource naming
# - Determines deletion policy (Retain for prod, Delete for nprd)
#
# Allowed Values (Non-Production):
# - nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit-a,
#   nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#
# Allowed Values (Production):
# - prod, prod-a, prod-b, prod-c
#
# Format: Environment name or empty string
# Default: nprd
# Example: nprd, prod, or ""
#
# Finding Your Value:
# - Coordinate with your infrastructure team
# - Should match environment naming used in related resources
# - Leave empty ("") to use default (nprd)

# --- TEAM 1/2/3 SNS TOPIC ARN (OPTIONAL) ---
# Team1SNSTopicArn, Team2SNSTopicArn, Team3SNSTopicArn
#
# Purpose:
# - Sends alarm notifications to different teams
# - Team 1: Typically L2 Operations
# - Team 2: Typically L3 Support/Development
# - Team 3: Typically Infrastructure/Platform
#
# Format: arn:aws:sns:region:account-id:topic-name or empty string
# Example: arn:aws:sns:ap-southeast-1:123456789012:ops-team or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to SNS Console → Topics
# 2. Find the topic for the team
# 3. Copy the ARN
# 4. Leave empty ("") if not using team notifications

# --- API 1/2 STAGE (OPTIONAL) ---
# Api1Stage, Api2Stage: API Gateway deployment stage
#
# Purpose:
# - Specifies which stage to monitor (e.g., dev, test, prod)
# - Used as CloudWatch metric dimension
#
# Format: Stage name or empty string
# Default: dev
# Example: dev, prod, test, v1, or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to API Gateway Console → APIs → Your API → Stages
# 2. Find your deployment stage
# 3. Copy the stage name
# 4. Leave empty ("") to use default (dev)

# --- API 1/2 RESOURCE PATH 1 (OPTIONAL) ---
# Api1ResourcePath1, Api2ResourcePath1: First resource path to monitor
#
# Purpose:
# - Monitor specific API resource path
# - Creates path-level alarms for 5XX, 4XX, latency
#
# Format: API resource path or empty string
# Default: /{proxy+}
# Example: /{proxy+}, /, /api/v1, or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to API Gateway Console → APIs → Your API → Resources
# 2. Find your resource path
# 3. Copy the resource path
# 4. Leave empty ("") to use default (/{proxy+})

# --- API 1/2 RESOURCE PATH 2/3/4 (OPTIONAL) ---
# Api1ResourcePath2/3/4, Api2ResourcePath2/3/4: Additional resource paths
#
# Purpose:
# - Monitor additional specific API resource paths
# - Creates path-level alarms for 5XX, 4XX, latency
#
# Format: API resource path or empty string
# Example: /, /health, /status, /metrics, or ""
#
# Finding Your Value (AWS Console):
# 1. Navigate to API Gateway Console → APIs → Your API → Resources
# 2. Find your resource path
# 3. Copy the resource path
# 4. Leave empty ("") if not monitoring additional paths
