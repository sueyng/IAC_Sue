# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. myapp, api, data
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
RDSInstanceIdentifier1: "<edit_here>"            # 📝 e.g. myapp-prod-db-primary

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
RDSInstanceIdentifier2: ""                       # e.g. myapp-prod-db-replica
RDSInstanceIdentifier3: ""                       # e.g. myapp-prod-db-readonly
Team1SNSTopicArn: ""                             # e.g. arn:aws:sns:region:account:ops-team
Team2SNSTopicArn: ""                             # e.g. arn:aws:sns:region:account:dev-team
Team3SNSTopicArn: ""                             # e.g. arn:aws:sns:region:account:infra-team
CPUThreshold: ""                                 # e.g. 80 (default is 80)
DatabaseConnectionsThreshold: "80"               # e.g. 80 (default is 80)
