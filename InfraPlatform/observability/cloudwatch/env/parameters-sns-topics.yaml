# <<< PARAMETERS_START >>>

InstituteName: "<edit_here>"                     # 📝 e.g. myorg, acme, company
AppShortName: "<edit_here>"                      # 📝 e.g. myapp, api, webapp
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- INSTITUTE NAME ---
# InstituteName: Organization or institute identifier
#
# Purpose:
# - Creates SNS topic names: {InstituteName}-{AppShortName}-{EnvName}-sns-*
# - Enables multi-organization deployments
#
# Format: Lowercase alphanumeric
# Example: myorg, acme, company
#
# SNS Topics Created:
# - {InstituteName}-{AppShortName}-{EnvName}-sns-app-l2-ops
# - {InstituteName}-{AppShortName}-{EnvName}-sns-app-l3-support
# - {InstituteName}-{AppShortName}-{EnvName}-sns-infra-l3-support
# - {InstituteName}-{AppShortName}-{EnvName}-sns-db-ops
# - {InstituteName}-{AppShortName}-{EnvName}-sns-security-ops
#
# Finding Your Value:
# - Use your organization's standard identifier
# - Should match naming used in other infrastructure components

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates SNS topic names: {InstituteName}-{AppShortName}-{EnvName}-sns-*
# - Enables multi-application monitoring in same organization
#
# Format: Lowercase alphanumeric
# Example: myapp, api, webapp
#
# Finding Your Value:
# - Use your organization's application naming convention
# - Should match naming used in other infrastructure components

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation for resource naming and configuration
#
# Purpose:
# - Used in resource naming
# - Determines deletion policy (Retain for prod, Delete for nprd)
#
# Allowed Values (Non-Production):
# - nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit-a,
#   nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#
# Allowed Values (Production):
# - prod, prod-a, prod-b, prod-c
#
# Environment-Specific Behavior:
# Production environments (prod*):
# - DeletionPolicy: Retain (SNS topics preserved on stack deletion)
#
# Non-Production environments (nprd*):
# - DeletionPolicy: Delete (SNS topics deleted on stack deletion)
#
# Finding Your Value:
# - Coordinate with your infrastructure team
# - Should match environment naming used in related resources
