# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. myapp, api, webapp)
#   Creates secret: {AppShortName}-{EnvName}-secret-{SecretName}

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain (secrets preserved on stack deletion)
#   Non-Prod (nprd*): DeletionPolicy Delete

# Secret1Name
#   Value: Descriptive secret name (e.g. database-credentials, twilio-api-key)
#   Full secret name: {AppShortName}-{EnvName}-secret-{Secret1Name}
#   Common names: database-credentials, rds-password, api-key, oauth-secret, jwt-key
#   Note: At least Secret1Name is required

# --- OPTIONAL PARAMETERS (with defaults) ---

# Secret1Description
#   Value: Description of secret purpose
#   Default: "Secret for application integration"
#   Example: "Database credentials for RDS PostgreSQL instance"

# DeletionWindowInDays
#   Value: Recovery window before permanent deletion
#   Range: 7-30 days
#   Default: 7
#   Recommendation: Use 30 for production
#   Note: Production secrets use DeletionPolicy Retain, must delete manually

# --- FEATURE TOGGLES ---

# EnableCustomKmsKey
#   Values: true/false (DELETE the value you don't need)
#   Default: false (AWS managed key)
#   Use false: AWS managed key (aws/secretsmanager) - FREE, automatic rotation
#   Use true: Custom KMS key - full control, cross-account access, $1/month per key

# --- ADVANCED SETTINGS ---

# CustomKmsKeyId
#   Value: KMS key ARN for encryption
#   Format: arn:aws:kms:region:account:key/xxx
#   Default: "" (uses AWS managed key)
#   Only used if EnableCustomKmsKey: true
#   Finding: KMS Console → Customer managed keys → copy ARN

# --- ADDITIONAL SECRETS (2-10) ---

# Secret2Name through Secret10Name
#   Value: Secret name suffix (leave "" to skip)
#   Creates: {AppShortName}-{EnvName}-secret-{SecretXName}
#   Maximum: 10 secrets per stack
#   Leave empty ("") for unused secrets

# Secret2Description through Secret10Description
#   Value: Description for each secret
#   Default: "Secret for application integration"
#   Only used if corresponding SecretXName is provided
