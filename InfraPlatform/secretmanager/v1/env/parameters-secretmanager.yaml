# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"                      # 📝 e.g. myapp, api, webapp
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
Secret1Name: "<edit_here>"                       # 📝 e.g. database-credentials, twilio-api-key

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
Secret1Description: "Secret for application integration"    # e.g. Database credentials for RDS (default is "Secret for application integration")
DeletionWindowInDays: "7"                                   # e.g. 7, 14, 30 (default is 7)

# FEATURE TOGGLES (DELETE the value you don't need)
EnableCustomKmsKey: "true/false"                   # 📝 Use custom KMS key (default is false / AWS managed)

# OPTIONAL - ADVANCED SETTINGS
CustomKmsKeyId: ""                               # e.g. arn:aws:kms:region:account:key/xxx (only if EnableCustomKmsKey set to true)

# OPTIONAL - ADDITIONAL SECRETS (up to 10 total)
