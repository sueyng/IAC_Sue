AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager template supporting up to 10 optional secrets'

Parameters:
  AppShortName:
    Type: String
    Description: Application short name

  EnvName:
    Type: String
    Description: Environment name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  # Security Configuration (Global)
  EnableCustomKmsKey:
    Type: String
    Description: Use custom KMS key for encryption (recommended for production)
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CustomKmsKeyId:
    Type: String
    Description: Custom KMS key ID or ARN (leave empty to use AWS managed key)
    Default: ''

  # Deletion Configuration (Global)
  DeletionWindowInDays:
    Type: Number
    Description: Number of days to wait before deletion (7-30 recommended for prod)
    Default: 7
    MinValue: 0
    MaxValue: 30

  # Secret 1 Configuration
  Secret1Name:
    Type: String
    Description: Name of the first secret (leave empty to skip)
    Default: ''

  Secret1Description:
    Type: String
    Description: Description of the first secret
    Default: 'Secret for application integration'

  # Secret 2 Configuration
  Secret2Name:
    Type: String
    Description: Name of the second secret (leave empty to skip)
    Default: ''

  Secret2Description:
    Type: String
    Description: Description of the second secret
    Default: 'Secret for application integration'

  # Secret 3 Configuration
  Secret3Name:
    Type: String
    Description: Name of the third secret (leave empty to skip)
    Default: ''

  Secret3Description:
    Type: String
    Description: Description of the third secret
    Default: 'Secret for application integration'

  # Secret 4 Configuration
  Secret4Name:
    Type: String
    Description: Name of the fourth secret (leave empty to skip)
    Default: ''

  Secret4Description:
    Type: String
    Description: Description of the fourth secret
    Default: 'Secret for application integration'

  # Secret 5 Configuration
  Secret5Name:
    Type: String
    Description: Name of the fifth secret (leave empty to skip)
    Default: ''

  Secret5Description:
    Type: String
    Description: Description of the fifth secret
    Default: 'Secret for application integration'

  # Secret 6 Configuration
  Secret6Name:
    Type: String
    Description: Name of the sixth secret (leave empty to skip)
    Default: ''

  Secret6Description:
    Type: String
    Description: Description of the sixth secret
    Default: 'Secret for application integration'

  # Secret 7 Configuration
  Secret7Name:
    Type: String
    Description: Name of the seventh secret (leave empty to skip)
    Default: ''

  Secret7Description:
    Type: String
    Description: Description of the seventh secret
    Default: 'Secret for application integration'

  # Secret 8 Configuration
  Secret8Name:
    Type: String
    Description: Name of the eighth secret (leave empty to skip)
    Default: ''

  Secret8Description:
    Type: String
    Description: Description of the eighth secret
    Default: 'Secret for application integration'

  # Secret 9 Configuration
  Secret9Name:
    Type: String
    Description: Name of the ninth secret (leave empty to skip)
    Default: ''

  Secret9Description:
    Type: String
    Description: Description of the ninth secret
    Default: 'Secret for application integration'

  # Secret 10 Configuration
  Secret10Name:
    Type: String
    Description: Name of the tenth secret (leave empty to skip)
    Default: ''

  Secret10Description:
    Type: String
    Description: Description of the tenth secret
    Default: 'Secret for application integration'

Conditions:
  # Production environment condition
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

  # Security conditions
  UseCustomKmsKey: !And 
    - !Equals [!Ref EnableCustomKmsKey, 'true']
    - !Not [!Equals [!Ref CustomKmsKeyId, '']]

  # Secret creation conditions
  CreateSecret1: !Not [!Equals [!Ref Secret1Name, '']]
  CreateSecret2: !Not [!Equals [!Ref Secret2Name, '']]
  CreateSecret3: !Not [!Equals [!Ref Secret3Name, '']]
  CreateSecret4: !Not [!Equals [!Ref Secret4Name, '']]
  CreateSecret5: !Not [!Equals [!Ref Secret5Name, '']]
  CreateSecret6: !Not [!Equals [!Ref Secret6Name, '']]
  CreateSecret7: !Not [!Equals [!Ref Secret7Name, '']]
  CreateSecret8: !Not [!Equals [!Ref Secret8Name, '']]
  CreateSecret9: !Not [!Equals [!Ref Secret9Name, '']]
  CreateSecret10: !Not [!Equals [!Ref Secret10Name, '']]

Resources:
  # Secret 1
  Secret1:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecret1
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-secret-${Secret1Name}"
      Description: !Ref Secret1Description
      SecretString: |
        {
          "key": "PLACEHOLDER_REPLACE_AFTER_DEPLOYMENT",
          "value": "PLACEHOLDER_REPLACE_AFTER_DEPLOYMENT"
        }
      KmsKeyId: !If [UseCustomKmsKey, !Ref CustomKmsKeyId, !Ref 'AWS::NoValue']
      Tags:
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-secret-${Secret1Name}"
        - Key: AppShortName
          Value: !Ref AppShortName
        - Key: Environment
          Value: !Ref EnvName
        - Key: IaCVersion
          Value: "InfraPlatform-secretmanager-v1"

  # Secret 2
  Secret2:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecret2
