AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Lambda Authorizer'

Parameters:
  AppShortName:
    Type: String
    Description: AppShortName

  EnvName:
    Type: String
    Description: Environment

  AppModuleName:
    Type: String
    Description: Name of the module that belongs to the application
    Default: ""

  LambdaS3bucket:
    Type: String
    Description: The S3 bucket where Lambda code is stored.
    Default: ""

  CodeZipFileName:
    Type: String
    Description: Zip file name for Lambda function code.
    Default: ""

  LambdaRuntime:
    Type: String
    Description: Runtime for the Lambda function (e.g., nodejs14.x).
    Default: ""

  LambdaHandler:
    Type: String
    Description: "Handler for the Lambda function"
    Default: ""

  AzureAdClientId:
    Type: String
    Description: Azure AD Client ID.
    Default: ""

  AzureAdTenantId:
    Type: String
    Description: Azure AD Tenant ID.
    Default: ""

  ForwardProxyAddress:
    Type: String
    Description: Forward Proxy Address.
    Default: ""

  SecurityGroupName:
    Type: String
    Description: Security group ID to attach to the Lambda function.
    Default: ""

  LogRetentionInDays:
    Type: Number
    Description: Log retention period in days.
    Default: 14

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of Subnet IDs for the Lambda function

  VpcId:
    Type: String
    Description: VPC ID for the security group and Lambda function

  LambdaTimeout:
    Type: Number
    Description: The amount of time (in seconds) that Lambda allows a function to run before stopping it.
    Default: 15

  ApiGWid:
    Type: String
    Description: Provide apigw id if want to tighten in lambda resource permission.
    Default: ""

  ProdHCCProxyCidr1:
    Description: HCC Proxy Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: "10.48.9.0/25"

  ProdHCCProxyCidr2:
    Description: HCC Proxy Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: "10.48.130.64/28"
  
  NprdHCCProxyCidr1:
    Description: HCC Proxy Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: "10.48.72.0/28"

  NprdHCCProxyCidr2:
    Description: HCC Proxy Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: "10.48.72.16/28"

  HCCProxyPort:
    Description: HCC Proxy Port
    Type: String
    Default: "4000"

Conditions:
  IsProduction: !Or 
    - !Equals [!Ref EnvName, prod]
    - !Equals [!Ref EnvName, prod-a]
    - !Equals [!Ref EnvName, prod-b]
    - !Equals [!Ref EnvName, prod-c]
  HasAzureAdClientId: !Not [!Equals [!Ref AzureAdClientId, ""]]
  HasAzureAdTenantId: !Not [!Equals [!Ref AzureAdTenantId, ""]]
  HasForwardProxyAddress: !Not [!Equals [!Ref ForwardProxyAddress, ""]]
  HasApiGWid: !Not [!Equals [!Ref ApiGWid, ""]]
  HasAppModuleName: !Not [!Equals [!Ref AppModuleName, ""]]

Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Ref SecurityGroupName
      GroupDescription: "Lambda Security Group with egress restricted to port 443"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref HCCProxyPort
          ToPort: !Ref HCCProxyPort
          CidrIp: !If [IsProduction, !Ref ProdHCCProxyCidr1, !Ref NprdHCCProxyCidr1]
          Description: "HCC Proxy Subnet 1"
        - IpProtocol: tcp
          FromPort: !Ref HCCProxyPort
          ToPort: !Ref HCCProxyPort
          CidrIp: !If [IsProduction, !Ref ProdHCCProxyCidr2, !Ref NprdHCCProxyCidr2]
          Description: "HCC Proxy Subnet 2"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v2"

  LambdaAuthorizerFunction:
    Type: 'AWS::Lambda::Function'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FunctionName: !If 
        - HasAppModuleName
        - !Sub '${AppShortName}-${EnvName}-${AppModuleName}-LambdaAuthorizer'
        - !Sub '${AppShortName}-${EnvName}-LambdaAuthorizer'
      Handler: !Ref LambdaHandler
      Role: !GetAtt LambdaAuthorizerRole.Arn
      Runtime: !Ref LambdaRuntime
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaS3bucket
        S3Key: !Ref CodeZipFileName
      Environment:
        Variables:
          AZURE_AD_TENANT_ID: !If [HasAzureAdTenantId, !Ref AzureAdTenantId, !Ref "AWS::NoValue"]
          AZURE_AD_CLIENT_ID: !If [HasAzureAdClientId, !Ref AzureAdClientId, !Ref "AWS::NoValue"]
          FORWARD_PROXY_ADDRESS: !If [HasForwardProxyAddress, !Ref ForwardProxyAddress, !Ref "AWS::NoValue"]
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v2"

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If 
        - HasAppModuleName
        - !Sub "/aws/lambda/${AppShortName}-${EnvName}-${AppModuleName}-LambdaAuthorizer"
        - !Sub "/aws/lambda/${AppShortName}-${EnvName}-LambdaAuthorizer"
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v2"

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !If 
        - HasAppModuleName
        - !Sub '${AppShortName}-${EnvName}-${AppModuleName}-lambda-authorizer-role'
        - !Sub '${AppShortName}-${EnvName}-lambda-authorizer-role'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !If 
            - HasAppModuleName
            - !Sub '${AppShortName}-${EnvName}-${AppModuleName}-LambdaAuthorizerExecutionPolicy'
            - !Sub '${AppShortName}-${EnvName}-LambdaAuthorizerExecutionPolicy'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !If 
                  - HasAppModuleName
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppShortName}-${EnvName}-${AppModuleName}-LambdaAuthorizer:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppShortName}-${EnvName}-LambdaAuthorizer:*"
        - PolicyName: !If 
            - HasAppModuleName
            - !Sub '${AppShortName}-${EnvName}-${AppModuleName}-LambdaAuthorizerVPCAccessExecutionPolicy'
            - !Sub '${AppShortName}-${EnvName}-LambdaAuthorizerVPCAccessExecutionPolicy'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v2"

  LambdaInvokeApiGWPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref LambdaAuthorizerFunction
      Principal: "apigateway.amazonaws.com"
      #SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/authorizers/*"
      SourceArn: !If [HasApiGWid, !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGWid}/authorizers/*", !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/authorizers/*"]