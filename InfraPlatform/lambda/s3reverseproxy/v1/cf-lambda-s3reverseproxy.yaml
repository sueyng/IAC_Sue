AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template for Lambda with multiple S3 bucket support using AppShortName-EnvName pattern and VPC configuration

Parameters:
  AppShortName:
    Type: String
    Description: Short name for the application

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  LambdaS3bucket:
    Type: String
    Description: The S3 bucket where Lambda code is stored

  CodeZipFileName:
    Type: String
    Description: Zip file name for lambda function code

  LambdaRuntime:
    Type: String
    Description: Runtime for Lambda
    Default: 'nodejs20.x'

  LambdaHandler:
    Type: String
    Description: Handler for Lambda function
    Default: 'index.handler'
    
  APIGatewayToS3BucketMapping:
    Type: String
    Description: "JSON mapping of API Gateway IDs to S3 bucket names"

  LogRetentionInDays:
    Type: Number
    Description: Number of days for Log Retention
    Default: 14
    
  # VPC Configuration Parameters
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Lambda will be deployed

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of subnet IDs where Lambda will be deployed

  VPCSubnetCidrAZ1:
    Type: String
    Description: CIDR block for the first subnet (AZ1)
    Default: ""

  VPCSubnetCidrAZ2:
    Type: String
    Description: CIDR block for the second subnet (AZ2)
    Default: ""

  VPCSubnetCidrAZ3:
    Type: String
    Description: CIDR block for the third subnet (AZ3)
    Default: ""

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasSubnetCidrAZ1: !Not [!Equals [!Ref VPCSubnetCidrAZ1, ""]]
  HasSubnetCidrAZ2: !Not [!Equals [!Ref VPCSubnetCidrAZ2, ""]]
  HasSubnetCidrAZ3: !Not [!Equals [!Ref VPCSubnetCidrAZ3, ""]]

Resources:
  # Log group for Lambda function
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AppShortName}-${EnvName}-s3ReverseProxy'
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v1"

  # Security group for Lambda with multiple ingress rules
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${AppShortName}-${EnvName}-s3ReverseProxy-sg"
      GroupDescription: !Sub "Security group for ${AppShortName}-${EnvName}-s3ReverseProxy Lambda function"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1  # All traffic
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v1"

  # Ingress rules for AZ1 CIDR (if provided)
  SecurityGroupIngressAZ1:
    Type: AWS::EC2::SecurityGroupIngress
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasSubnetCidrAZ1
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VPCSubnetCidrAZ1
      Description: "Allow HTTPS from AZ1 subnet"

  # Ingress rules for AZ2 CIDR (if provided)
  SecurityGroupIngressAZ2:
    Type: AWS::EC2::SecurityGroupIngress
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasSubnetCidrAZ2
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VPCSubnetCidrAZ2
      Description: "Allow HTTPS from AZ2 subnet"

  # Ingress rules for AZ3 CIDR (if provided)
  SecurityGroupIngressAZ3:
    Type: AWS::EC2::SecurityGroupIngress
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: HasSubnetCidrAZ3
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VPCSubnetCidrAZ3
      Description: "Allow HTTPS from AZ3 subnet"

  # Lambda Function to serve content from multiple S3 buckets
  LambdaS3ReverseProxy:
    Type: AWS::Lambda::Function
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy
      TracingConfig:
        Mode: Active
      Code:
        S3Bucket: !Ref LambdaS3bucket
        S3Key: !Ref CodeZipFileName
      Handler: !Ref LambdaHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: !Ref LambdaRuntime
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          API_TO_S3_BUCKET_MAP: !Ref APIGatewayToS3BucketMapping
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v1"

  # IAM Role for Lambda with access to all referenced S3 buckets
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-lambda-execution-s3ReverseProxy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
            - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-cloudwatch-log-creation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppShortName}-${EnvName}-s3ReverseProxy:*"
        
        # S3 Bucket Access Policy - using AppShortName-EnvName-* pattern
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
              - s3:GetObject
              Resource:
              # Lambda code bucket access
              - !Sub "arn:aws:s3:::${LambdaS3bucket}/*"
              # Frontend buckets access using AppShortName-EnvName-* pattern
              - !Sub "arn:aws:s3:::${AppShortName}-${EnvName}-*/*"
        
        # VPC access policy if needed
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-VPCAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
      Tags:
        - Key: "IaCVersion"
          Value: "InfraPlatform-lambda-v1"

  # Permission for API Gateway to invoke the Lambda function
  APIGatewayInvokeLambdaPolicy:
    Type: AWS::Lambda::Permission
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LambdaS3ReverseProxy
      Principal: 'apigateway.amazonaws.com'

  # SSM Parameter to store the Lambda ARN
  ParameterLambdaArn:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "/${AppShortName}/${EnvName}/Lambda-s3ReverseProxy-Arn"
      Type: String
      Value: !GetAtt LambdaS3ReverseProxy.Arn
      Description: Lambda Function Arn for S3 Reverse Proxy
      Tags:
        IaCVersion: "InfraPlatform-lambda-v1"