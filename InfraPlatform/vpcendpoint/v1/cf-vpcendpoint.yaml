      ServiceName: !Sub 'com.amazonaws.${AWSRegion}.ecr.dkr'
      VpcId: !Ref VpcId
      SubnetIds: 
        - !Ref VPCSubnetIdappAZ1
        - !Ref VPCSubnetIdappAZ2
        - !If [IsProduction, !Ref VPCSubnetIdappAZ3, !Ref "AWS::NoValue"]       
      SecurityGroupIds:
        - !GetAtt VPCESecurityGroup.GroupId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

  VPCInterfaceEndpointECRAPI:
