# ========================================================================
# 📋 QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. hsxx, myapp, infra
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
AWSRegion: "<edit_here>"                         # 📝 e.g. ap-southeast-1, us-east-1
VpcId: "<edit_here>"                             # 📝 e.g. vpc-0f7c715e458acd938
AppSubnetIds: "<edit_here>"                      # 📝 e.g. subnet-xxx,subnet-yyy (comma-separated, NO SPACES, min 2)
VpcCidr1: "<edit_here>"                          # 📝 e.g. 10.193.0.0/16

# ENDPOINT TOGGLES (DELETE the value you don't need)
CreateECREndpoints: "true/false"                   # 📝 ECR (creates 2 for ecr.api and ecr.dkr)
CreateS3Endpoint: "true/false"                     # 📝 S3 Gateway (FREE - recommended)
CreateSecretsEndpoint: "true/false"                # 📝 Secrets Manager
CreateCloudWatchLogsEndpoint: "true/false"         # 📝 CloudWatch Logs
CreateECSEndpoint: "true/false"                    # 📝 ECS
CreateEKSEndpoint: "true/false"                    # 📝 EKS
CreateLambdaEndpoint: "true/false"                 # 📝 Lambda
CreateRDSEndpoint: "true/false"                    # 📝 RDS
CreateElasticacheEndpoint: "true/false"            # 📝 ElastiCache
CreateSQSEndpoint: "true/false"                    # 📝 SQS
CreateSNSEndpoint: "true/false"                    # 📝 SNS
CreateSESEndpoint: "true/false"                    # 📝 SES SMTP (email-smtp, port 587)
CreateSESAPIEndpoint: "true/false"                 # 📝 SES API (email, port 443)
CreateAPIGatewayEndpoint: "true/false"             # 📝 API Gateway
CreateELBEndpoint: "true/false"                    # 📝 ELB
CreateAthenaEndpoint: "true/false"                 # 📝 Athena
CreateGlueEndpoint: "true/false"                   # 📝 Glue
CreateGrafanaEndpoint: "true/false"                # 📝 Grafana
CreateAMPEndpoint: "true/false"                    # 📝 Prometheus
CreateXRayEndpoint: "true/false"                   # 📝 X-Ray
CreateBatchEndpoint: "true/false"                  # 📝 Batch
CreateDataSyncEndpoint: "true/false"               # 📝 DataSync
CreateCloudFormationEndpoint: "true/false"         # 📝 CloudFormation
CreateStepFunctionEndpoint: "true/false"           # 📝 Step Functions
CreateSchedulerEndpoint: "true/false"              # 📝 EventBridge Scheduler
CreateEventBridgeEndpoint: "true/false"            # 📝 EventBridge event buses
CreateACMEndpoint: "true/false"                    # 📝 ACM (Certificate Manager — for private ListCertificates/DescribeCertificate API calls)
CreateFirehoseEndpoint: "true/false"               # 📝 Kinesis Data Firehose

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
VpcCidr2: ""                                     # Secondary VPC CIDR (if exists)
VpcCidr3: ""                                     # Tertiary VPC CIDR (if exists)
VpcCidr4: ""                                     # Quaternary VPC CIDR (if exists)
VpcCidr5: ""                                     # Quinary VPC CIDR (if exists)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. hsxx, myapp, infra)
#   Creates security group: {AppShortName}-{EnvName}-sg-vpce

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain
#   Non-Prod (nprd*): DeletionPolicy Delete

# AWSRegion
#   Allowed Values: ap-southeast-1
#   Must match VPC region
#   Finding: Check region selector in AWS Console top-right

# VpcId
#   Value: vpc-xxxxxxxxxxxxxxxxx (17 chars after "vpc-")
#   Finding: VPC Console → Your VPCs → copy VPC ID

# AppSubnetIds
#   Value: subnet-xxx,subnet-yyy,subnet-zzz (comma-separated, NO SPACES)
#   Requirements:
#   - Minimum 2 subnets
#   - Must be in different AZs
#   - Must be private subnets
#   Finding: VPC Console → Subnets → filter by VPC → select app subnets

# VpcCidr1 (required), VpcCidr2-5 (optional)
#   Value: 10.193.0.0/16, 172.16.0.0/12, etc.
#   Purpose: Security group allows HTTPS (443) from these CIDRs to VPC endpoints
#   Use Cases:
#   - Multi-VPC peering scenarios requiring broad security group rules
#   - Hybrid cloud connectivity with multiple on-premises networks
#   - Cross-region VPC connectivity patterns
#   - Supports up to 5 VPC CIDR ranges for complex architectures
#   Finding: VPC Console → Your VPCs → view "CIDR blocks" tab

# --- ENDPOINT TOGGLES ---
# Set true to create, false to skip. DELETE the value you don't need.

# COMMON ENDPOINTS (recommend true)
# ----------------------------------
# CreateS3Endpoint
#   Use: true (FREE - no cost, required for ECR)
#   When: Almost always needed
#
# CreateECREndpoints
#   Use: true if running containers (ECS/EKS)
#   Creates: ecr.api + ecr.dkr (2 endpoints)
#   Also needs: S3 endpoint
#
# CreateSecretsEndpoint
#   Use: true if apps retrieve secrets (DB passwords, API keys)
#   When: ECS tasks, Lambda using Secrets Manager
#
# CreateCloudWatchLogsEndpoint
#   Use: true if sending logs from private subnets
#   When: ECS/Fargate logs, Lambda logs, EC2 CloudWatch agent

# CONTAINER & COMPUTE
# -------------------
# CreateECSEndpoint
#   Use: true if running ECS workloads
#
# CreateEKSEndpoint
#   Use: true if running EKS clusters
#
# CreateLambdaEndpoint
#   Use: true if Lambda deployed in VPC

# DATABASE & CACHE
# ----------------
# CreateRDSEndpoint
#   Use: true if managing RDS from private subnets
#
# CreateElasticacheEndpoint
#   Use: true if managing ElastiCache from private subnets

# MESSAGING
# ---------
# CreateSQSEndpoint
#   Use: true if apps use SQS
#
# CreateSNSEndpoint
#   Use: true if apps publish to SNS
#
# CreateSESEndpoint
#   Use: true if sending emails via SES SMTP (port 587)
#   Security Group: Dedicated SES security group (VPCESESSecurityGroup)
#   Service: com.amazonaws.{region}.email-smtp
#
# CreateSESAPIEndpoint
#   Use: true if calling SES API from private subnets (port 443)
#   Security Group: Main security group (VPCESecurityGroup)
#   Service: com.amazonaws.{region}.email

# API & LOAD BALANCING
# ---------------------
# CreateAPIGatewayEndpoint
#   Use: true for private API Gateway APIs
#
# CreateELBEndpoint
#   Use: true if managing load balancers from private subnets

# DATA & ANALYTICS
# ----------------
# CreateAthenaEndpoint
#   Use: true if running Athena queries
#
# CreateGlueEndpoint
#   Use: true if running Glue jobs

# OBSERVABILITY
# -------------
# CreateGrafanaEndpoint
#   Use: true if using Amazon Managed Grafana
#
# CreateAMPEndpoint
#   Use: true if using Amazon Managed Prometheus
#
# CreateXRayEndpoint
#   Use: true if using X-Ray tracing

# OTHER SERVICES
# --------------
# CreateBatchEndpoint
#   Use: true if using AWS Batch
#
# CreateDataSyncEndpoint
#   Use: true if using DataSync
#
# CreateCloudFormationEndpoint
#   Use: true if managing CloudFormation from private subnets
#
# CreateStepFunctionEndpoint
#   Use: true if calling Step Functions APIs from private subnets
#   Service: com.amazonaws.{region}.states
#   Security Group: Main security group (VPCESecurityGroup, port 443)
#
# CreateSchedulerEndpoint
#   Use: true if calling EventBridge Scheduler APIs from private subnets
#   Service: com.amazonaws.{region}.scheduler
#   Security Group: Main security group (VPCESecurityGroup, port 443)
#
# CreateEventBridgeEndpoint
#   Use: true if sending custom events or calling EventBridge APIs from private subnets
#   Service: com.amazonaws.{region}.events
#   Security Group: Main security group (VPCESecurityGroup, port 443)
#
# CreateACMEndpoint
#   Use: true if calling ACM APIs (ListCertificates, DescribeCertificate, RequestCertificate) from private subnets
#   Service: com.amazonaws.{region}.acm
#
# CreateFirehoseEndpoint
#   Use: true if apps deliver to Kinesis Data Firehose from private subnets
#   Service: com.amazonaws.{region}.kinesis-firehose
#   Security Group: Main security group (VPCESecurityGroup, port 443)
