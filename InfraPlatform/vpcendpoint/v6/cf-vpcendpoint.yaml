            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: !If [IsProduction, 53341, 53331]
            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: !If [IsProduction, 53341, 53331]
            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !If [IsProduction, 53341, 53331]
          ToPort: !If [IsProduction, 53341, 53331]
          CidrIp: !Ref VpcCidr1
