          - IpProtocol: tcp
            FromPort: !If [IsProduction, 53341, 53331]
            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: !If [IsProduction, 53341, 53331]
            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: !If [IsProduction, 53341, 53331]
            ToPort: !If [IsProduction, 53341, 53331]
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
