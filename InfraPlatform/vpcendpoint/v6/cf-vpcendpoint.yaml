AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon VPC Endpoints stack

Parameters:
  AWSRegion:
    Description: Region for AWS Services
    Type: String
    AllowedValues:
      - ap-southeast-1
  VpcId:
    Description: VPC to create endpoints and workspace
    Type: AWS::EC2::VPC::Id
  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  AppSubnetIds:
    Description: Subnets to create endpoints and workspace
    Type: List<AWS::EC2::Subnet::Id>
  AppShortName:
    Description: Application name
    Type: String
  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  CreateGrafanaEndpoint:
    Description: Create VPC Endpoint for Grafana?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateEKSEndpoint:
    Description: Create VPC Endpoint for EKS?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateXRayEndpoint:
    Description: Create VPC Endpoint for X-Ray?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateAMPEndpoint:
    Description: Create VPC Endpoint for AMP (Prometheus)?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateECREndpoints:
    Description: Create VPC Endpoints for ECR (API and Docker)?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateELBEndpoint:
    Description: Create VPC Endpoint for Elastic Load Balancing?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSecretsEndpoint:
    Description: Create VPC Endpoint for Secrets Manager?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateElasticacheEndpoint:
    Description: Create VPC Endpoint for Elasticache?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSESEndpoint:
    Description: Create VPC Endpoint for SES SMTP?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSESAPIEndpoint:
    Description: Create VPC Endpoint for SES API (HTTPS 443)?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateAPIGatewayEndpoint:
    Description: Create VPC Endpoint for API Gateway?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSQSEndpoint:
    Description: Create VPC Endpoint for SQS?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateRDSEndpoint:
    Description: Create VPC Endpoint for RDS?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateLambdaEndpoint:
    Description: Create VPC Endpoint for Lambda?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateS3Endpoint:
    Description: Create VPC Endpoint for S3?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateECSEndpoint:
    Description: Create VPC Endpoint for ECS?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateCloudFormationEndpoint:
    Description: Create VPC Endpoint for CloudFormation?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateGlueEndpoint:
    Description: Create VPC Endpoint for AWS Glue?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateDataSyncEndpoint:
    Description: Create VPC Endpoint for AWS DataSync?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSNSEndpoint:
    Description: Create VPC Endpoint for Amazon SNS?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateBatchEndpoint:
    Description: Create VPC Endpoint for AWS Batch?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateAthenaEndpoint:
    Description: Create VPC Endpoint for Amazon Athena?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateCloudWatchLogsEndpoint:
    Description: Create VPC Endpoint for CloudWatch Logs?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateStepFunctionEndpoint:
    Description: Create VPC Endpoint for AWS Step Functions?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateSchedulerEndpoint:
    Description: Create VPC Endpoint for Amazon EventBridge Scheduler?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateEventBridgeEndpoint:
    Description: Create VPC Endpoint for Amazon EventBridge event buses?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateACMEndpoint:
    Description: Create VPC Endpoint for AWS Certificate Manager (ACM)?
    Type: String
    AllowedValues: [true, false]
    Default: false

  CreateFirehoseEndpoint:
    Description: Create VPC Endpoint for Amazon Kinesis Data Firehose?
    Type: String
    AllowedValues: [true, false]
    Default: false

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, '']]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, '']]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, '']]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, '']]

  # Service-specific conditions
  CreateGrafana: !Equals [!Ref CreateGrafanaEndpoint, "true"]
  CreateEKS: !Equals [!Ref CreateEKSEndpoint, "true"]
  CreateXRay: !Equals [!Ref CreateXRayEndpoint, "true"]
  CreateAMP: !Equals [!Ref CreateAMPEndpoint, "true"]
  CreateECR: !Equals [!Ref CreateECREndpoints, "true"]
  CreateELB: !Equals [!Ref CreateELBEndpoint, "true"]
  CreateSecrets: !Equals [!Ref CreateSecretsEndpoint, "true"]
  CreateElasticache: !Equals [!Ref CreateElasticacheEndpoint, "true"]
  CreateSES: !Equals [!Ref CreateSESEndpoint, "true"]
  CreateSESAPI: !Equals [!Ref CreateSESAPIEndpoint, "true"]
  CreateAPIGateway: !Equals [!Ref CreateAPIGatewayEndpoint, "true"]
  CreateSQS: !Equals [!Ref CreateSQSEndpoint, "true"]
  CreateRDS: !Equals [!Ref CreateRDSEndpoint, "true"]
  CreateLambda: !Equals [!Ref CreateLambdaEndpoint, "true"]
  CreateS3: !Equals [!Ref CreateS3Endpoint, "true"]
  CreateECS: !Equals [!Ref CreateECSEndpoint, "true"]
  CreateCloudFormation: !Equals [!Ref CreateCloudFormationEndpoint, "true"]
  CreateGlue: !Equals [!Ref CreateGlueEndpoint, "true"]
  CreateDataSync: !Equals [!Ref CreateDataSyncEndpoint, "true"]
  CreateSNS: !Equals [!Ref CreateSNSEndpoint, "true"]
  CreateBatch: !Equals [!Ref CreateBatchEndpoint, "true"]
  CreateAthena: !Equals [!Ref CreateAthenaEndpoint, "true"]
  CreateCloudWatchLogs: !Equals [!Ref CreateCloudWatchLogsEndpoint, "true"]
  CreateStepFunction: !Equals [!Ref CreateStepFunctionEndpoint, "true"]
  CreateScheduler: !Equals [!Ref CreateSchedulerEndpoint, "true"]
  CreateEventBridge: !Equals [!Ref CreateEventBridgeEndpoint, "true"]
  CreateACM: !Equals [!Ref CreateACMEndpoint, "true"]
  CreateFirehose: !Equals [!Ref CreateFirehoseEndpoint, "true"]


  # Condition to create main security group if any non-SES endpoint is enabled
  CreateMainSecurityGroup: !Or
    - !Condition CreateGrafana
    - !Condition CreateEKS
    - !Or
      - !Condition CreateXRay
      - !Condition CreateAMP
      - !Condition CreateECR
      - !Condition CreateELB
      - !Condition CreateSecrets
      - !Condition CreateElasticache
      - !Condition CreateAPIGateway
      - !Condition CreateSQS
      - !Condition CreateS3
      - !Condition CreateECS
    - !Or
      - !Condition CreateCloudFormation
      - !Condition CreateLambda
      - !Condition CreateGlue
      - !Condition CreateDataSync
      - !Condition CreateSNS
      - !Condition CreateBatch
      - !Condition CreateAthena
      - !Condition CreateCloudWatchLogs
      - !Condition CreateStepFunction
      - !Condition CreateFirehose
    - !Or
      - !Condition CreateSESAPI
      - !Condition CreateACM
      - !Condition CreateScheduler
      - !Condition CreateEventBridge

Resources:
  # Security Groups
  VPCESecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Condition: CreateMainSecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Security Group for VPC Endpoints
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-vpce
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-vpce
        - Key: IaCVersion
          Value: InfraPlatform-vpcendpoint-v6
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"

  VPCEAPIGwSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Condition: CreateAPIGateway
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Security Group for API Gateway Endpoint
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-vpce-apigw
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-vpce-apigw
        - Key: IaCVersion
          Value: InfraPlatform-vpcendpoint-v6
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"

  VPCESESSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Condition: CreateSES
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Security Group for SES VPC Endpoint
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-vpce-ses
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-vpce-ses
        - Key: IaCVersion
          Value: InfraPlatform-vpcendpoint-v6
      SecurityGroupIngress:
        # SMTP Port 25
        - IpProtocol: tcp
          FromPort: 25
          ToPort: 25
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTP Port 587
        - IpProtocol: tcp
          FromPort: 587
          ToPort: 587
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTP Port 2587
        - IpProtocol: tcp
          FromPort: 2587
          ToPort: 2587
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTPS Port 465
        - IpProtocol: tcp
          FromPort: 465
          ToPort: 465
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTPS Port 2465
        - IpProtocol: tcp
          FromPort: 2465
          ToPort: 2465
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
      SecurityGroupEgress:
        # SMTP Port 25
        - IpProtocol: tcp
          FromPort: 25
          ToPort: 25
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 25
            ToPort: 25
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTP Port 587
        - IpProtocol: tcp
          FromPort: 587
          ToPort: 587
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTP Port 2587
        - IpProtocol: tcp
          FromPort: 2587
          ToPort: 2587
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 2587
            ToPort: 2587
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTPS Port 465
        - IpProtocol: tcp
          FromPort: 465
          ToPort: 465
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 465
            ToPort: 465
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # SMTPS Port 2465
        - IpProtocol: tcp
          FromPort: 2465
          ToPort: 2465
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 2465
            ToPort: 2465
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"

