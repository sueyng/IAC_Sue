AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  AppShortName:
    Type: String
    Description: AppShortNameBucket

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  BucketName:
    Type: String
    Description: S3 bucket name suffix
    Default: ""
    
  DomainBucketName:
    Type: String
    Description: A fully qualified domain-based bucket name when needed.
    Default: ""

  # CORS Configuration Parameters
  EnableCorsConfiguration:
    Type: String
    Description: Enable CORS configuration for bucket
    AllowedValues: 
      - "true"
      - "false"
    Default: "false"

  AllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed origins for CORS (e.g., "https://example1.com,https://example2.com")
    Default: "*"

  EnableEventBridgeForS3Bucket:
    Type: String
    Description: Enable EventBridge notifications for bucket
    AllowedValues: 
      - "true"
      - "false"
    Default: "false"

  # Lifecycle Configuration Parameters
  EnableLifecycle:
    Type: String
    Description: Enable lifecycle configuration for bucket
    AllowedValues: 
      - "true"
      - "false"
    Default: "false"

  LifecycleExpirationDays:
    Type: Number
    Description: Number of days after which objects should be deleted
    Default: 90
    MinValue: 1

  LifecyclePrefix:
    Type: String
    Description: Prefix for objects that the lifecycle rule applies to
    Default: ""

  # Versioning Configuration Parameters
  EnableVersioning:
    Type: String
    Description: Enable versioning for the S3 bucket
    AllowedValues: 
      - "true"
      - "false"
    Default: "false"

  # Enhanced Lifecycle Configuration for Versioned Objects
  EnableNoncurrentVersionExpiration:
    Type: String
    Description: Enable expiration of non-current versions (only applicable when versioning is enabled)
    AllowedValues: 
      - "true"
      - "false"
    Default: "false"

  NoncurrentVersionExpirationDays:
    Type: Number
    Description: Number of days after which non-current versions should be deleted
    Default: 30
    MinValue: 1

  NoncurrentVersionTransitionDays:
    Type: Number
    Description: Number of days after which non-current versions transition to IA storage class
    Default: 7
    MinValue: 1

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  IsCorsEnabled: !Equals [!Ref "EnableCorsConfiguration", "true"]
  IsEventBridgeEnabled: !Equals [!Ref "EnableEventBridgeForS3Bucket", "true"]
  IsLifecycleEnabled: !Equals [!Ref "EnableLifecycle", "true"]
  IsDomainNameUsed: !Not [!Equals [!Ref "DomainBucketName", ""]]
  IsVersioningEnabled: !Equals [!Ref "EnableVersioning", "true"]
  IsNoncurrentVersionExpirationEnabled: !And
    - !Condition IsVersioningEnabled
    - !Equals [!Ref "EnableNoncurrentVersionExpiration", "true"]

Resources:
  S3Bucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BucketName: !If
        - IsDomainNameUsed
        - !Ref DomainBucketName
        - !Sub "${AppShortName}-${EnvName}-s3-${BucketName}"
      BucketEncryption:
        ServerSideEncryptionConfiguration: 
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: !If
        - IsVersioningEnabled
        - Status: Enabled
        - !Ref "AWS::NoValue"
      NotificationConfiguration: !If
        - IsEventBridgeEnabled
        - EventBridgeConfiguration:
            EventBridgeEnabled: true
        - !Ref "AWS::NoValue"
      CorsConfiguration: !If 
        - IsCorsEnabled
        - CorsRules:
            - AllowedHeaders: 
              - "*"
              AllowedMethods: 
                - "GET"
                - "PUT"
                - "POST"
                - "DELETE"
                - "HEAD"
              AllowedOrigins: !Split [",", !Ref AllowedOrigins]
              ExposedHeaders: []
              MaxAge: 3600
        - !Ref "AWS::NoValue"
      LifecycleConfiguration: !If
        - IsLifecycleEnabled
        - Rules:
            - Id: ExpirationRule
              Status: Enabled
              Prefix: !Ref LifecyclePrefix
              ExpirationInDays: !Ref LifecycleExpirationDays
              # Enhanced lifecycle rules for versioned objects
              NoncurrentVersionTransitions: !If
                - IsNoncurrentVersionExpirationEnabled
                - - TransitionInDays: !Ref NoncurrentVersionTransitionDays
                    StorageClass: STANDARD_IA
                - !Ref "AWS::NoValue"
              NoncurrentVersionExpirationInDays: !If
                - IsNoncurrentVersionExpirationEnabled
                - !Ref NoncurrentVersionExpirationDays
                - !Ref "AWS::NoValue"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v5
        - Key: VersioningEnabled
          Value: !Ref EnableVersioning

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: 
              - !GetAtt S3Bucket.Arn
              - !Join ['', [!GetAtt S3Bucket.Arn, '/*']]
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: 
              - !GetAtt S3Bucket.Arn
              - !Join ['', [!GetAtt S3Bucket.Arn, '/*']]
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  S3BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref S3Bucket

  S3BucketArn:
    Description: ARN of the created S3 bucket
    Value: !GetAtt S3Bucket.Arn

  S3BucketDomainName:
    Description: Domain name of the created S3 bucket
    Value: !GetAtt S3Bucket.DomainName

  S3BucketRegionalDomainName:
    Description: Regional domain name of the created S3 bucket
    Value: !GetAtt S3Bucket.RegionalDomainName

  VersioningStatus:
    Description: Versioning status of the S3 bucket
    Value: !If [IsVersioningEnabled, "Enabled", "Disabled"]