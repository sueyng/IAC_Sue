AWSTemplateFormatVersion: "2010-09-09"
Transform: 'AWS::LanguageExtensions'

Parameters:
  AppShortName:
    Type: String
    Description: AppShortNameBucket

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  BucketNames:
    Type: CommaDelimitedList
    Description: S3 bucket names

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

Resources:
  'Fn::ForEach::Buckets':
    - BucketName
    - !Ref BucketNames
    - 'S3Bucket${BucketName}':
        Type: 'AWS::S3::Bucket'
        DeletionPolicy: !If [IsProduction, Retain, Delete]
        UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
        Properties:
          BucketName: !Sub ${AppShortName}-${EnvName}-s3-${BucketName}
          BucketEncryption:
            ServerSideEncryptionConfiguration: 
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
          AccessControl: Private
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          Tags:
            - Key: IaCVersion
              Value: InfraPlatform-s3-v5

  'Fn::ForEach::BucketPolicies':
    - Bucket
    - !Ref BucketNames
    - 'S3BucketPolicy${Bucket}':
        Type: AWS::S3::BucketPolicy
        DeletionPolicy: !If [IsProduction, Retain, Delete]
        UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
        Properties:
          Bucket: !Sub ${AppShortName}-${EnvName}-s3-${Bucket}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: EnforceTLSv12orHigher
                Effect: Deny
                Principal: '*'
                Action: s3:*
                Resource: 
                  - !GetAtt [!Sub "S3Bucket${Bucket}", Arn]
                  - !Join
                      - ''
                      - - !GetAtt [!Sub "S3Bucket${Bucket}", Arn]
                        - '/*'
                Condition:
                  NumericLessThan:
                    s3:TlsVersion: 1.2
              - Sid: AllowSSLRequestsOnly
                Effect: Deny
                Principal: '*'
                Action: s3:*
                Resource: 
                  - !GetAtt [!Sub "S3Bucket${Bucket}", Arn]
                  - !Join
                      - ''
                      - - !GetAtt [!Sub "S3Bucket${Bucket}", Arn]
                        - '/*'
                Condition:
                  Bool:
                    aws:SecureTransport: 'false'