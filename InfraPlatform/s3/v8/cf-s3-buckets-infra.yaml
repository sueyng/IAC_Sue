AWSTemplateFormatVersion: 2010-09-09
Description: AWS S3 and Inspector Template

Parameters:
  AppShortName:
    Type: String
    Description: AppShortName

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  KMSKeyRotationPeriod:
    Type: Number
    Description: Number of days for KMS key rotation period (default 365 days)
    Default: 365

  EnableS3Versioning:
    Type: String
    Description: Enable S3 bucket versioning for ec2FileRepo bucket
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  S3CurrentVersionExpirationDays:
    Type: Number
    Description: Days before current (live) objects are deleted from ec2FileRepo bucket (0 to disable lifecycle rule). Default 365 preserves previous hardcoded behavior. Does not apply to Inspector bucket (fixed 365 by design).
    Default: 365
    MinValue: 0
    MaxValue: 3650

  S3NoncurrentVersionExpirationDays:
    Type: Number
    Description: Days to retain noncurrent object versions before deletion (0 to disable)
    Default: 30
    MinValue: 0
    MaxValue: 365

  EnableInspectorFindingsExportScheduler:
    Type: String
    Description: Enable native EventBridge Scheduler to export Amazon Inspector findings report to the Inspector S3 bucket.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  EnableVersioning: !Equals [!Ref EnableS3Versioning, "true"]
  EnableInspectorExportScheduler: !Equals [!Ref EnableInspectorFindingsExportScheduler, "true"]
  HasCurrentExpiration: !Not [!Equals [!Ref S3CurrentVersionExpirationDays, 0]]
  HasNoncurrentExpiration: !And
    - !Condition EnableVersioning
    - !Not [!Equals [!Ref S3NoncurrentVersionExpirationDays, 0]]
  HasAnyLifecycleRule: !Or
    - !Condition HasCurrentExpiration
    - !Condition HasNoncurrentExpiration

Resources:
  ec2FileRepoS3Bucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BucketName: !Sub ${AppShortName}-${EnvName}-s3-ec2-file-repo
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: !If
        - EnableVersioning
        - Status: Enabled
        - !Ref "AWS::NoValue"
      LifecycleConfiguration: !If
        - HasAnyLifecycleRule
        - Rules:
            - !If
              - HasCurrentExpiration
              - Id: CurrentVersionExpiration
                Status: Enabled
                ExpirationInDays: !Ref S3CurrentVersionExpirationDays
                Prefix: ""
              - !Ref "AWS::NoValue"
            - !If
              - HasNoncurrentExpiration
              - Id: NoncurrentVersionCleanup
                Status: Enabled
                NoncurrentVersionExpiration:
                  NoncurrentDays: !Ref S3NoncurrentVersionExpirationDays
              - !Ref "AWS::NoValue"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v8

  ec2FileRepoS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ec2FileRepoS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ec2FileRepoS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt ec2FileRepoS3Bucket.Arn
                    - '/*'
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource:
              - !GetAtt ec2FileRepoS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt ec2FileRepoS3Bucket.Arn
                    - '/*'
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  InspectorKMSKey:
    Type: "AWS::KMS::Key"
    Properties:
      Description: "KMS Key for S3 Inspector"
      EnableKeyRotation: true
      RotationPeriodInDays: !Ref KMSKeyRotationPeriod
      KeyPolicy:
        Version: "2012-10-17"
        Id: "key-consolepolicy-3"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: "Allow"
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow Amazon Inspector to use the key"
            Effect: "Allow"
            Principal:
              Service: "inspector2.amazonaws.com"
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:inspector2:ap-southeast-1:${AWS::AccountId}:report/*"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v8

  InspectorKMSKeyAlias:
    Type: "AWS::KMS::Alias"
    Properties:
      AliasName: !Sub 'alias/${AppShortName}-${EnvName}-kms-inspector'
      TargetKeyId: !Ref InspectorKMSKey

  InspectorS3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub ${AppShortName}-${EnvName}-s3-inspector
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter1Year
            Status: Enabled
            ExpirationInDays: 365
            Prefix: ""
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v8

  InspectorS3BucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref InspectorS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}"
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: "allow-inspector"
            Effect: "Allow"
            Principal:
              Service: "inspector2.amazonaws.com"
            Action:
              - "s3:PutObject"
              - "s3:AbortMultipartUpload"
            Resource: !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:inspector2:ap-southeast-1:${AWS::AccountId}:report/*"
          - Sid: "AllowSSLRequestsOnly"
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}"
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  InspectorFindingsExportSchedulerRole:
    Type: AWS::IAM::Role
    Condition: EnableInspectorExportScheduler
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-inspector-findings-export-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: create-inspector-findings-report
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CreateInspectorFindingsReport
                Effect: Allow
                Action:
                  - inspector2:CreateFindingsReport
                Resource: "*"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v8

  InspectorFindingsExportSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: EnableInspectorExportScheduler
    DependsOn: InspectorS3BucketPolicy
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-inspector-findings-export
      Description: Schedule Amazon Inspector v2 findings report export to S3.
      ScheduleExpression: cron(0 20 * * ? *)
      ScheduleExpressionTimezone: Asia/Singapore
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:inspector2:createFindingsReport
        RoleArn: !GetAtt InspectorFindingsExportSchedulerRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
        Input: !Sub
          - |
            {
              "ReportFormat": "CSV",
              "S3Destination": {
                "BucketName": "${BucketName}",
                "KeyPrefix": "inspector2/findings",
                "KmsKeyArn": "${KmsKeyArn}"
              },
              "FilterCriteria": {
                "FindingStatus": [
                  {
                    "Comparison": "EQUALS",
                    "Value": "ACTIVE"
                  }
                ]
              }
            }
          - BucketName: !Ref InspectorS3Bucket
            KmsKeyArn: !GetAtt InspectorKMSKey.Arn
