# ========================================================================
# 📋 QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. xxx, batchapp, etl
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-sit1, prod

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
EnableS3Versioning: "true"                       # true or false (default is true)
EnableObjectLock: "false"                        # ONE-WAY; when true, keep EnableLifecycle set to false
ObjectLockRetentionYears: "1"                    # COMPLIANCE retention; minimum 1, maximum 100
EnableLifecycle: "true"                          # MUST be false when Object Lock is enabled
S3CurrentVersionExpirationDays: "365"            # default 365; ignored when EnableLifecycle is false
S3NoncurrentVersionExpirationDays: "14"          # default 14; ignored when EnableLifecycle is false

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================
#
# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates bucket names:
#   * {AppShortName}-{EnvName}-s3-dataload
#   * {AppShortName}-{EnvName}-s3-data-extraction
# - Part of globally unique bucket naming
#
# Format: Lowercase alphanumeric, no special characters
# Example: xxx, batchapp, etl
#
# Finding Your Value:
# - Use your organization's application naming convention
# - Ensure it creates globally unique bucket names when combined with EnvName

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation for resource naming and configuration
#
# Purpose:
# - Used in bucket naming
# - Determines deletion policy (Retain for prod or Object Lock; Delete otherwise)
#
# Allowed Values (Non-Production):
# - nprd, nprd-dev, nprd-dev1, nprd-dev2, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#   nprd-sit-a, nprd-sit-b, nprd-sit-c,
#   nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#
# Allowed Values (Production):
# - prod, prod-a, prod-b, prod-c
#
# Environment-Specific Behavior:
# Production environments (prod*):
# - DeletionPolicy: Retain (buckets preserved on stack deletion)
#
# Non-Production environments (nprd*):
# - DeletionPolicy: Delete unless Object Lock is enabled

# --- ENABLE S3 VERSIONING ---
# EnableS3Versioning: Toggle bucket versioning for all batch job buckets
#
# Values: true | false (default: true)
#
# true  — Versioning enabled (recommended). Protects against accidental deletes and overwrites.
# false — Versioning not enabled. Use only for transient data where history is not needed.
#
# Note: Once Enabled, CloudFormation cannot set it back to Unversioned via template.
#       Toggling from true → false on an existing bucket is a no-op (bucket stays Enabled).
#       EnableObjectLock=true forces versioning on for both buckets.

# --- OPTIONAL S3 OBJECT LOCK ---
# EnableObjectLock: Enable COMPLIANCE-mode Object Lock for BOTH batch job buckets.
#
# Values: true | false (default: false)
#
# IMPORTANT — PERMANENT ONE-WAY CHANGE:
# - Obtain application, security, and retention approval before setting true.
# - Object Lock cannot be disabled after it is enabled.
# - Bucket versioning cannot be suspended afterward.
# - Changing this parameter back to false is not a rollback mechanism.
# - Protected object versions cannot be deleted or have their retention shortened
#   before expiry, including by the AWS account root user.
# - The default retention applies only to new object versions written after
#   Object Lock becomes active; historical versions are not protected automatically.
# - Object-Lock-enabled buckets and bucket policies are retained if the stack is
#   deleted or the resources are replaced, including in non-production.
#
# ObjectLockRetentionYears:
# - Values: 1-100 (default: 1)
# - Retention mode is fixed to COMPLIANCE.
# - The setting applies to new object versions in both buckets.
#
# Lifecycle compatibility:
# - When EnableObjectLock=true, set EnableLifecycle=false.
# - The expiration-day values can remain unchanged and are ignored while
#   EnableLifecycle=false.
# - The template rejects Object Lock deployment while EnableLifecycle=true.
# - Review and test post-retention cleanup separately.

# --- ENABLE LIFECYCLE ---
# EnableLifecycle: Enable lifecycle rules for BOTH batch job buckets.
#
# Values: true | false (default: true)
#
# true  — Apply lifecycle rules according to the two expiration-day parameters.
# false — Do not create current or noncurrent lifecycle expiration rules.
#
# Default true preserves the existing v8 Batch Job lifecycle behaviour.
# EnableLifecycle must be false when EnableObjectLock=true.

# --- S3 CURRENT VERSION EXPIRATION DAYS ---
# S3CurrentVersionExpirationDays: Auto-delete current (live) objects after N days.
#
# Values: 0-3650 (0 to disable, default: 365)
#
# Default 365 preserves previous hardcoded v6 behavior — batch data retained for 1 year.
# Applies to BOTH DataloadS3Bucket and DataExtractionS3Bucket.
# Ignored when EnableLifecycle=false.
#
# Common values:
# - 30  : Short-lived processing files
# - 90  : Medium-term retention
# - 365 : Annual rotation (default)
# - 0   : Disable (keep objects forever)

# --- S3 NONCURRENT VERSION EXPIRATION DAYS ---
# S3NoncurrentVersionExpirationDays: Auto-delete noncurrent (old) versions after N days.
#
# Values: 0-365 (0 to disable, default: 14)
#
# Default 14 — batch data is reprocessable from source, so short noncurrent retention is fine.
# Only applies when EnableLifecycle=true and versioning is enabled.
# Noncurrent = previous version after an object is overwritten or deleted.

# --- BUCKETS CREATED ---
# - {AppShortName}-{EnvName}-s3-dataload           (input data)
# - {AppShortName}-{EnvName}-s3-data-extraction    (output data)
#
# Both buckets:
# - AES256 encryption
# - Public access fully blocked
# - TLS 1.2+ enforcement
# - Object ownership: BucketOwnerEnforced (S3 ACLs disabled)
# - Versioning (configurable, default enabled)
# - Object Lock COMPLIANCE retention (optional, disabled by default)
# - Current-version lifecycle (configurable, default 365 days)
# - Noncurrent-version lifecycle (configurable, default 14 days)
