# ========================================================================
# 📋 QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. xxx, myapp, infra
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
KMSKeyRotationPeriod: "365"                      # e.g. 365 (default is 365 days)
EnableS3Versioning: "true"                       # true or false (default is true)
S3CurrentVersionExpirationDays: "365"            # e.g. 365 (default is 365, set 0 to disable). ec2FileRepo only - Inspector bucket fixed at 365 by design.
S3NoncurrentVersionExpirationDays: "30"          # e.g. 30 (default is 30, set 0 to disable)
EnableInspectorFindingsExportScheduler: "false"  # true or false (default is false)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. xxx, myapp, infra)
#   Creates buckets:
#     - {AppShortName}-{EnvName}-s3-ec2-file-repo
#     - {AppShortName}-{EnvName}-s3-inspector

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-dev1, nprd-dev2, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain
#   Non-Prod (nprd*): DeletionPolicy Delete

# --- OPTIONAL PARAMETERS ---

# KMSKeyRotationPeriod
#   Value: Days for KMS key automatic rotation
#   Range: 90-2560 days
#   Default: 365 (1 year)
#   Recommendation: Use 365 for most cases

# EnableS3Versioning
#   Toggle bucket versioning for ec2FileRepo bucket.
#   Values: true | false (default: true)
#
#   true  — Versioning enabled (recommended). Protects against accidental deletes and overwrites.
#   false — Versioning not enabled.
#
#   Note: Inspector bucket versioning is always enabled (hardcoded — compliance requirement).
#   Note: Once Enabled, CloudFormation cannot set it back to Unversioned via template.

# S3CurrentVersionExpirationDays
#   Auto-delete current (live) objects from ec2FileRepo after N days.
#   Values: 0-3650 (0 to disable, default: 365)
#
#   Default 365 preserves previous hardcoded v6 behavior.
#
#   IMPORTANT: This parameter does NOT apply to InspectorS3Bucket.
#   The Inspector bucket lifecycle is fixed at 365 days by design (compliance/audit requirement).

# S3NoncurrentVersionExpirationDays
#   Auto-delete noncurrent (old) object versions after N days.
#   Values: 0-365 (0 to disable, default: 30)
#
#   Applies to ec2FileRepo bucket only (Inspector bucket has fixed lifecycle).
#   Only applies when EnableS3Versioning = true.

# EnableInspectorFindingsExportScheduler
#   Toggle native Inspector findings report export schedule.
#   Values: true | false (default: false)
#
#   true  — Creates EventBridge Scheduler and IAM role to export ACTIVE Inspector findings daily.
#   false — Does not create the scheduler or scheduler IAM role.
#
#   Fixed schedule configuration when enabled:
#     - Schedule name: {AppShortName}-{EnvName}-inspector-findings-export
#     - Schedule state: ENABLED
#     - Schedule expression: cron(0 20 * * ? *)
#     - Timezone: Asia/Singapore
#     - Report format: CSV
#     - Finding status: ACTIVE
#     - S3 prefix: inspector2/findings
#
#   Prerequisite:
#     - Amazon Inspector v2 must be enabled in the target account and Region.

# --- BUCKETS CREATED ---

# EC2 File Repository Bucket
#   Name: {AppShortName}-{EnvName}-s3-ec2-file-repo
#   Purpose: Transfer installer files from office to EC2 instances
#   Encryption: AES256
#   Object Ownership: BucketOwnerEnforced (S3 ACLs disabled)
#   Lifecycle (current): Configurable via S3CurrentVersionExpirationDays (default: 365 days)
#   Lifecycle (noncurrent): Configurable via S3NoncurrentVersionExpirationDays (default: 30 days)
#   Versioning: Configurable (default: enabled)
#   Public Access: Fully blocked

# Inspector Report Bucket
#   Name: {AppShortName}-{EnvName}-s3-inspector
#   Purpose: Store Amazon Inspector vulnerability scan reports
#   Encryption: KMS (custom key)
#   Object Ownership: BucketOwnerEnforced (S3 ACLs disabled)
#   Lifecycle: Fixed at 365 days (by design)
#   Versioning: Always Enabled (by design)
#   Public Access: Fully blocked
#   Special Policy: Allows Inspector service to write reports

# --- ADDITIONAL RESOURCES CREATED ---

# - KMS Key: For Inspector bucket encryption with auto-rotation
# - KMS Key Alias: alias/{AppShortName}-{EnvName}-kms-inspector
# - Optional EventBridge Scheduler: {AppShortName}-{EnvName}-inspector-findings-export
# - Optional Scheduler IAM Role: {AppShortName}-{EnvName}-inspector-findings-export-role
