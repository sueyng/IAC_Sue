AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 application bucket template v9 with optional irreversible Object Lock COMPLIANCE retention"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterLabels:
      EnableObjectLock:
        default: "Enable Object Lock - IRREVERSIBLE"
      ObjectLockRetentionYears:
        default: "COMPLIANCE retention period in years (minimum 1)"

Parameters:
  AppShortName:
    Type: String
    Description: AppShortNameBucket

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  BucketName:
    Type: String
    Description: S3 bucket name suffix
    Default: ""

  DomainBucketName:
    Type: String
    Description: A fully qualified domain-based bucket name when needed.
    Default: ""

  # CORS Configuration Parameters
  EnableCorsConfiguration:
    Type: String
    Description: Enable CORS configuration for bucket
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  AllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed origins for CORS (e.g., "https://example1.com,https://example2.com")
    Default: "*"

  EnableEventBridgeForS3Bucket:
    Type: String
    Description: Enable EventBridge notifications for bucket
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  # Lifecycle Configuration Parameters
  EnableLifecycle:
    Type: String
    Description: Enable lifecycle configuration for bucket
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  LifecycleExpirationDays:
    Type: Number
    Description: Number of days after which objects should be deleted
    Default: 90
    MinValue: 1

  LifecyclePrefix:
    Type: String
    Description: Prefix for objects that the lifecycle rule applies to
    Default: ""

  # Versioning Configuration Parameters
  EnableVersioning:
    Type: String
    Description: Enable versioning for the S3 bucket
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  # Object Lock Configuration Parameters
  EnableObjectLock:
    Type: String
    Description: "ONE-WAY CHANGE: Enable S3 Object Lock with COMPLIANCE retention. After Object Lock is enabled, it cannot be disabled and bucket versioning cannot be suspended."
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  ObjectLockRetentionYears:
    Type: Number
    Description: Default COMPLIANCE retention period applied to each new object version when Object Lock is enabled
    Default: 1
    MinValue: 1
    MaxValue: 100

  # Enhanced Lifecycle Configuration for Versioned Objects
  EnableNoncurrentVersionExpiration:
    Type: String
    Description: Enable expiration of non-current versions (only applicable when versioning is enabled)
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  NoncurrentVersionExpirationDays:
    Type: Number
    Description: Number of days after which non-current versions should be deleted
    Default: 30
    MinValue: 1

  NoncurrentVersionTransitionDays:
    Type: Number
    Description: Number of days after which non-current versions transition to IA storage class
    Default: 7
    MinValue: 1

Rules:
  ObjectLockLifecycleCompatibility:
    RuleCondition: !Equals [!Ref "EnableObjectLock", "true"]
    Assertions:
      - Assert: !Equals [!Ref "EnableLifecycle", "false"]
        AssertDescription: "EnableLifecycle must be false when Object Lock is enabled. Review and test post-retention lifecycle cleanup separately."

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  IsCorsEnabled: !Equals [!Ref "EnableCorsConfiguration", "true"]
  IsEventBridgeEnabled: !Equals [!Ref "EnableEventBridgeForS3Bucket", "true"]
  IsLifecycleEnabled: !Equals [!Ref "EnableLifecycle", "true"]
  IsDomainNameUsed: !Not [!Equals [!Ref "DomainBucketName", ""]]
  IsVersioningEnabled: !Equals [!Ref "EnableVersioning", "true"]
  IsObjectLockEnabled: !Equals [!Ref "EnableObjectLock", "true"]
  IsEffectiveVersioningEnabled: !Or
    - !Condition IsVersioningEnabled
    - !Condition IsObjectLockEnabled
  ShouldRetainBucket: !Or
    - !Condition IsProduction
    - !Condition IsObjectLockEnabled
  IsNoncurrentVersionExpirationEnabled: !And
    - !Condition IsEffectiveVersioningEnabled
    - !Equals [!Ref "EnableNoncurrentVersionExpiration", "true"]

Resources:
  S3Bucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: !If [ShouldRetainBucket, Retain, Delete]
    UpdateReplacePolicy: !If [ShouldRetainBucket, Retain, Delete]
    Properties:
      BucketName: !If
        - IsDomainNameUsed
        - !Ref DomainBucketName
        - !Sub "${AppShortName}-${EnvName}-s3-${BucketName}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: !If
        - IsEffectiveVersioningEnabled
        - Status: Enabled
        - !Ref "AWS::NoValue"
      ObjectLockEnabled: !If
        - IsObjectLockEnabled
        - true
        - !Ref "AWS::NoValue"
      ObjectLockConfiguration: !If
        - IsObjectLockEnabled
        - ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              Mode: COMPLIANCE
              Years: !Ref ObjectLockRetentionYears
        - !Ref "AWS::NoValue"
      NotificationConfiguration: !If
        - IsEventBridgeEnabled
        - EventBridgeConfiguration:
            EventBridgeEnabled: true
        - !Ref "AWS::NoValue"
      CorsConfiguration: !If
        - IsCorsEnabled
        - CorsRules:
            - AllowedHeaders:
              - "*"
              AllowedMethods:
                - "GET"
                - "PUT"
                - "POST"
                - "DELETE"
                - "HEAD"
              AllowedOrigins: !Split [",", !Ref AllowedOrigins]
              ExposedHeaders: []
              MaxAge: 3600
        - !Ref "AWS::NoValue"
      LifecycleConfiguration: !If
        - IsLifecycleEnabled
        - Rules:
            - Id: ExpirationRule
              Status: Enabled
              Prefix: !Ref LifecyclePrefix
              ExpirationInDays: !Ref LifecycleExpirationDays
              NoncurrentVersionTransitions: !If
                - IsNoncurrentVersionExpirationEnabled
                - - TransitionInDays: !Ref NoncurrentVersionTransitionDays
                    StorageClass: STANDARD_IA
                - !Ref "AWS::NoValue"
              NoncurrentVersionExpirationInDays: !If
                - IsNoncurrentVersionExpirationEnabled
                - !Ref NoncurrentVersionExpirationDays
                - !Ref "AWS::NoValue"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v9
        - Key: VersioningEnabled
          Value: !If [IsEffectiveVersioningEnabled, "true", "false"]
        - Key: ObjectLockEnabled
          Value: !Ref EnableObjectLock

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: !If [ShouldRetainBucket, Retain, Delete]
    UpdateReplacePolicy: !If [ShouldRetainBucket, Retain, Delete]
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt S3Bucket.Arn
              - !Join ['', [!GetAtt S3Bucket.Arn, '/*']]
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt S3Bucket.Arn
              - !Join ['', [!GetAtt S3Bucket.Arn, '/*']]
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  S3BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref S3Bucket

  S3BucketArn:
    Description: ARN of the created S3 bucket
    Value: !GetAtt S3Bucket.Arn

  S3BucketDomainName:
    Description: Domain name of the created S3 bucket
    Value: !GetAtt S3Bucket.DomainName

  S3BucketRegionalDomainName:
    Description: Regional domain name of the created S3 bucket
    Value: !GetAtt S3Bucket.RegionalDomainName

  VersioningStatus:
    Description: Versioning status of the S3 bucket
    Value: !If [IsEffectiveVersioningEnabled, "Enabled", "Disabled"]

  ObjectLockStatus:
    Description: S3 Object Lock status of the bucket
    Value: !If [IsObjectLockEnabled, "Enabled", "Disabled"]

  ObjectLockMode:
    Description: Default S3 Object Lock retention mode
    Value: !If [IsObjectLockEnabled, "COMPLIANCE", "NotConfigured"]

  ObjectLockRetentionYears:
    Description: Default Object Lock retention period in years
    Value: !If [IsObjectLockEnabled, !Ref ObjectLockRetentionYears, "NotConfigured"]
