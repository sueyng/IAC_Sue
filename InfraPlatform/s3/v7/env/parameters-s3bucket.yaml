# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. xxx, myapp, dataplatform)
#   Creates buckets: {AppShortName}-{EnvName}-s3-{BucketSuffix}

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-dev1, nprd-dev2, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain (buckets preserved on stack deletion)
#   Non-Prod (nprd*): DeletionPolicy Delete

# BucketNames
#   Value: Comma-separated bucket suffixes (NO SPACES, ALPHANUMERIC ONLY)
#   Format: "suffix1,suffix2,suffix3"
#   Maximum: 10 buckets per stack
#   Creates: {AppShortName}-{EnvName}-s3-{suffix} for each suffix
#
#   IMPORTANT — ALPHANUMERIC ONLY (no hyphens, underscores, or dots):
#     Template uses Fn::ForEach to generate resource logical IDs (e.g. S3Bucket{suffix}).
#     CloudFormation requires logical IDs to be alphanumeric. Stack creation will fail with:
#       "Transform AWS::LanguageExtensions failed with: OutputKey '...' should be alphanumeric"
#     if any suffix contains non-alphanumeric characters.
#
#     ✓ Correct:   "dataloading,extraction,archive"
#     ❌ Wrong:    "data-loading,extraction" (hyphens not allowed)
#     ❌ Wrong:    "DataLoading,Extraction" (uppercase not allowed)
#     ❌ Wrong:    "data_load"               (underscore not allowed)
#
#     Note: the resulting bucket name (e.g. myapp-prod-s3-dataloading) can contain
#     hyphens — the restriction applies only to the suffix you provide here.
#
#   Example:
#     Input: "dataloading,extraction,archive"
#     AppShortName: myapp, EnvName: prod
#     Creates: myapp-prod-s3-dataloading, myapp-prod-s3-extraction, myapp-prod-s3-archive
#
#   Common bucket suffixes:
#     - dataloading: Raw data ingestion
#     - extraction: Processed data
#     - archive: Long-term storage
#     - backup: Backups
#     - logs: Application logs
#     - artifacts: Build artifacts, Lambda packages
#     - uploads: User uploads
#     - temp: Temporary storage
#
#   Global Uniqueness:
#     - S3 bucket names must be globally unique across ALL AWS accounts
#     - If name exists anywhere, deployment fails
#     - Use specific AppShortName to ensure uniqueness

# --- OPTIONAL PARAMETERS ---

# EnableS3Versioning
#   Toggle bucket versioning for all buckets created by this stack.
#   Values: true | false (default: true)
#
#   true  — Versioning enabled (recommended). Protects against accidental deletes and overwrites.
#   false — Versioning not enabled. Use only for temporary/transient data.
#
#   NOTE: Once a bucket is Enabled, CloudFormation cannot set it back to Unversioned via template.
#         Toggling from true → false on an already-versioned bucket is a no-op (bucket stays Enabled).

# S3CurrentVersionExpirationDays
#   Auto-delete current (live) objects after N days.
#   Values: 0-3650 (0 to disable, default: 0)
#
#   0    — Disabled (keep objects forever). Generic buckets default to 0 because use case varies.
#   30   — Short-term cache/temp data
#   90   — Working files, intermediate data
#   365  — Annual archival/rotation
#   1095 — 3 years (compliance)
#
#   Applies to CURRENT object versions (the live/latest version).
#   Distinct from S3NoncurrentVersionExpirationDays which cleans up OLD versions.

# S3NoncurrentVersionExpirationDays
#   Auto-delete noncurrent (old) object versions after N days.
#   Values: 0-365 (0 to disable, default: 30)
#
#   0   — Disabled (keep all versions forever — high storage cost)
#   7   — Short retention for transient data
#   14  — Batch job data (reprocessable from source)
#   30  — General purpose (default, good balance of cost vs recovery)
#   90  — DB backups, compliance data (longer recovery window)
#
#   Only applies when EnableS3Versioning = true.
#   Noncurrent = previous version after an object is overwritten or deleted.

# --- BUCKET FEATURES (AUTOMATICALLY CONFIGURED) ---
#   - Encryption: AES256 server-side encryption
#   - Public Access: Fully blocked (all 4 settings enabled)
#   - TLS: Enforces TLS 1.2 or higher
#   - HTTPS Only: Denies non-SSL requests
#   - Access Control: Private
#   - Versioning: Enabled by default (can be disabled via EnableS3Versioning)
#   - Lifecycle: Noncurrent version cleanup after 30 days by default
