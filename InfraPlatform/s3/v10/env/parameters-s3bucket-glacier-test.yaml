# ========================================================================
# Glacier test parameters for cf-s3bucket-glacier-test.yaml
# Only edit values between PARAMETERS_START and PARAMETERS_END
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "suev10gl"                         # 📝 e.g. xxx, myapp
EnvName: "nprd-dev"                              # 📝 e.g. nprd, nprd-dev
BucketNames: "generic"                           # 📝 comma-separated, ALPHANUMERIC ONLY

EnableS3Versioning: "true"                       # true or false (default is true)
S3CurrentVersionExpirationDays: "0"              # 0 = keep objects forever
S3NoncurrentVersionExpirationDays: "30"          # 0 = disable
GlacierStorageClass: "GLACIER_IR"                # GLACIER_IR | GLACIER | DEEP_ARCHIVE
S3CurrentVersionTransitionDays: "0"              # -1 = disable, 0 = next lifecycle run
S3NoncurrentVersionTransitionDays: "1"           # 0 = disable

# <<< PARAMETERS_END >>>
# ========================================================================
# NOTES
#   - Lifecycle rules run about once a day (midnight UTC); allow 24-48h for transitions.
#   - For an immediate test, upload with: aws s3 cp f.txt s3://<bucket>/ --storage-class GLACIER
#   - GLACIER_IR objects are readable instantly (no restore). Use GLACIER or DEEP_ARCHIVE
#     to test restore-object.
#   - Any expiration days must be greater than the matching transition days.
