# ========================================================================
# 📋 QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

AppShortName: "<edit_here>"                      # 📝 e.g. xxx, myapp, dataplatform
EnvName: "<edit_here>"                           # 📝 e.g. nprd, nprd-dev, prod
BucketNames: "<edit_here>"                       # 📝 e.g. dataloading,extraction,archive (comma-separated, NO SPACES, ALPHANUMERIC ONLY)

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================
EnableS3Versioning: "true"                       # true or false (default is true)
S3CurrentVersionExpirationDays: "0"              # e.g. 0 (default is 0 - disabled, keep objects forever)
S3NoncurrentVersionExpirationDays: "30"          # e.g. 30 (default is 30, set 0 to disable)
EnableGlacierTransition: "false"                 # true or false (default is false)
GlacierTransitionDays: "90"                      # e.g. 90 (default is 90, min 1)
GlacierStorageClass: "GLACIER"                   # GLACIER_IR, GLACIER or DEEP_ARCHIVE (default is GLACIER)
GlacierNoncurrentTransitionDays: "0"             # e.g. 7 (default is 0 - disabled)
GlacierTransitionPrefix: ""                      # setting 1 prefixes, e.g. archive/,backup/ (up to 5, no spaces; "" = whole bucket)
Glacier2TransitionPrefix: ""                     # setting 2 prefixes, e.g. logs/ (up to 5, no spaces; "" = not used)
Glacier2TransitionDays: "90"                     # setting 2: days before moving (default is 90)
Glacier2StorageClass: "GLACIER"                  # setting 2: GLACIER_IR, GLACIER or DEEP_ARCHIVE (default is GLACIER)
Glacier2NoncurrentTransitionDays: "0"            # setting 2: old versions, e.g. 7 (default is 0 - disabled)
Glacier3TransitionPrefix: ""                     # setting 3 prefixes, e.g. reports/ (up to 5, no spaces; "" = not used)
Glacier3TransitionDays: "90"                     # setting 3: days before moving (default is 90)
Glacier3StorageClass: "GLACIER"                  # setting 3: GLACIER_IR, GLACIER or DEEP_ARCHIVE (default is GLACIER)
Glacier3NoncurrentTransitionDays: "0"            # setting 3: old versions, e.g. 7 (default is 0 - disabled)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. xxx, myapp, dataplatform)
#   Creates buckets: {AppShortName}-{EnvName}-s3-{BucketSuffix}

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-dev1, nprd-dev2, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain (buckets preserved on stack deletion)
#   Non-Prod (nprd*): DeletionPolicy Delete

# BucketNames
#   Value: Comma-separated bucket suffixes (NO SPACES, ALPHANUMERIC ONLY)
#   Format: "suffix1,suffix2,suffix3"
#   Maximum: 10 buckets per stack
#   Creates: {AppShortName}-{EnvName}-s3-{suffix} for each suffix
#
#   IMPORTANT — ALPHANUMERIC ONLY (no hyphens, underscores, or dots):
#     Template uses Fn::ForEach to generate resource logical IDs (e.g. S3Bucket{suffix}).
#     CloudFormation requires logical IDs to be alphanumeric. Stack creation will fail with:
#       "Transform AWS::LanguageExtensions failed with: OutputKey '...' should be alphanumeric"
#     if any suffix contains non-alphanumeric characters.
#
#     ✓ Correct:   "dataloading,extraction,archive"
#     ❌ Wrong:    "data-loading,extraction" (hyphens not allowed)
#     ❌ Wrong:    "DataLoading,Extraction" (uppercase not allowed)
#     ❌ Wrong:    "data_load"               (underscore not allowed)
#
#     Note: the resulting bucket name (e.g. myapp-prod-s3-dataloading) can contain
#     hyphens — the restriction applies only to the suffix you provide here.
#
#   Example:
#     Input: "dataloading,extraction,archive"
#     AppShortName: myapp, EnvName: prod
#     Creates: myapp-prod-s3-dataloading, myapp-prod-s3-extraction, myapp-prod-s3-archive
#
#   Common bucket suffixes:
#     - dataloading: Raw data ingestion
#     - extraction: Processed data
#     - archive: Long-term storage
#     - backup: Backups
#     - datasets: Application datasets
#     - artifacts: Build artifacts, Lambda packages
#     - uploads: User uploads
#     - temp: Temporary storage
#
#   For log buckets requiring Object Lock, use cf-s3bucket-app.yaml with
#   EnableObjectLock set to true after confirming the irreversible change.
#
#   Global Uniqueness:
#     - S3 bucket names must be globally unique across ALL AWS accounts
#     - If name exists anywhere, deployment fails
#     - Use specific AppShortName to ensure uniqueness

# --- OPTIONAL PARAMETERS ---

# EnableS3Versioning
#   Toggle bucket versioning for all buckets created by this stack.
#   Values: true | false (default: true)
#
#   true  — Versioning enabled (recommended). Protects against accidental deletes and overwrites.
#   false — Versioning not enabled. Use only for temporary/transient data.
#
#   NOTE: Once a bucket is Enabled, CloudFormation cannot set it back to Unversioned via template.
#         Toggling from true → false on an already-versioned bucket is a no-op (bucket stays Enabled).
#         Versioning alone does not meet the log-bucket Object Lock requirement.
#         Use the v10 app template when Object Lock is required.

# S3CurrentVersionExpirationDays
#   Auto-delete current (live) objects after N days.
#   Values: 0-3650 (0 to disable, default: 0)
#
#   0    — Disabled (keep objects forever). Generic buckets default to 0 because use case varies.
#   30   — Short-term cache/temp data
#   90   — Working files, intermediate data
#   365  — Annual archival/rotation
#   1095 — 3 years (long retention; this is not Object Lock/WORM protection)
#
#   Applies to CURRENT object versions (the live/latest version).
#   Distinct from S3NoncurrentVersionExpirationDays which cleans up OLD versions.

# S3NoncurrentVersionExpirationDays
#   Auto-delete noncurrent (old) object versions after N days.
#   Values: 0-365 (0 to disable, default: 30)
#
#   0   — Disabled (keep all versions forever — high storage cost)
#   7   — Short retention for transient data
#   14  — Batch job data (reprocessable from source)
#   30  — General purpose (default, good balance of cost vs recovery)
#   90  — DB backups and other data needing a longer recovery window
#
#   Only applies when EnableS3Versioning = true.
#   Noncurrent = previous version after an object is overwritten or deleted.

# EnableGlacierTransition
#   Move current (live) objects to GlacierStorageClass after GlacierTransitionDays.
#   Values: true | false (default: false)

# GlacierTransitionDays
#   Days after object creation before current objects transition.
#   Values: 1-3650 (default: 90). Only used when EnableGlacierTransition = true.
#   Must be lower than S3CurrentVersionExpirationDays when expiration is set.

# GlacierStorageClass
#   GLACIER_IR   — Instant Retrieval (milliseconds, no restore needed)
#   GLACIER      — Flexible Retrieval (minutes to hours, restore required) (default)
#   DEEP_ARCHIVE — Lowest cost (up to 48 hours, restore required)

# GlacierNoncurrentTransitionDays
#   Days after a version becomes noncurrent before it transitions.
#   Values: 0-3650 (0 to disable, default: 0)
#   Only used when EnableGlacierTransition = true AND EnableS3Versioning = true.
#   Must be lower than S3NoncurrentVersionExpirationDays when expiration is set.
#
#   NOTE: Lifecycle rules run about once a day (midnight UTC); allow 24-48h for
#   transitions. For an immediate test, upload with --storage-class GLACIER.

# GlacierTransitionPrefix / Glacier2... / Glacier3... (Glacier settings 1-3)
#   Up to 3 Glacier settings. Each setting has its own prefix list, days and storage
#   class, so prefixes that need the same aging share one setting.
#
#   Setting 1: GlacierTransitionPrefix + GlacierTransitionDays, GlacierStorageClass,
#              GlacierNoncurrentTransitionDays
#   Setting 2: Glacier2TransitionPrefix + Glacier2TransitionDays, Glacier2StorageClass,
#              Glacier2NoncurrentTransitionDays
#   Setting 3: Glacier3TransitionPrefix + Glacier3... (same as setting 2)
#
#   Prefix lists:
#   - Comma-separated, up to 5 prefixes per setting, no spaces: archive/,backup/
#   - Include the trailing slash for a folder; matching is case-sensitive
#     (archive would also match archive-old/).
#   - Setting 1 with an empty list applies to the whole bucket.
#   - Settings 2 and 3 are only used when their list is not empty.
#   - All settings need EnableGlacierTransition = true (template rejects a
#     setting 2 or 3 prefix list otherwise).
#   - Use separate prefixes per setting. If prefixes overlap (including an empty
#     setting 1 = whole bucket), S3 applies more than one rule to the same objects.
#
#   Example:
#     GlacierTransitionPrefix: "archive/,backup/"   GlacierTransitionDays: "30"   GlacierStorageClass: "GLACIER"
#     Glacier2TransitionPrefix: "logs/"             Glacier2TransitionDays: "90"  Glacier2StorageClass: "DEEP_ARCHIVE"
#
#   Expiration rules still apply to the whole bucket.
#   When any prefix is set, unused prefix slots appear in the bucket lifecycle as
#   rules with Status Disabled (needed by AWS::LanguageExtensions); they do nothing.

# --- BUCKET FEATURES (AUTOMATICALLY CONFIGURED) ---
#   - Encryption: AES256 server-side encryption
#   - Public Access: Fully blocked (all 4 settings enabled)
#   - TLS: Enforces TLS 1.2 or higher
#   - HTTPS Only: Denies non-SSL requests
#   - Object Ownership: BucketOwnerEnforced (S3 ACLs disabled)
#   - Versioning: Enabled by default (can be disabled via EnableS3Versioning)
#   - Lifecycle: Noncurrent version cleanup after 30 days by default
#   - Glacier: Optional, up to 3 settings with prefix lists, or whole bucket (disabled by default)
