AWSTemplateFormatVersion: 2010-09-09
Description: 'AWS S3 and Inspector Template v10 - optional Glacier transition for the ec2FileRepo bucket'

Parameters:
  AppShortName:
    Type: String
    Description: AppShortName

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  KMSKeyRotationPeriod:
    Type: Number
    Description: Number of days for KMS key rotation period (default 365 days)
    Default: 365

  EnableS3Versioning:
    Type: String
    Description: Enable S3 bucket versioning for ec2FileRepo bucket
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  S3CurrentVersionExpirationDays:
    Type: Number
    Description: Days before current (live) objects are deleted from ec2FileRepo bucket (0 to disable lifecycle rule). Default 365 preserves previous hardcoded behavior. Does not apply to Inspector bucket (fixed 365 by design).
    Default: 365
    MinValue: 0
    MaxValue: 3650

  S3NoncurrentVersionExpirationDays:
    Type: Number
    Description: Days to retain noncurrent object versions before deletion (0 to disable)
    Default: 30
    MinValue: 0
    MaxValue: 365

  EnableGlacierTransition:
    Type: String
    Description: Automatically transition current (live) objects to GlacierStorageClass after GlacierTransitionDays (ec2FileRepo bucket only - Inspector bucket lifecycle is fixed)
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  GlacierTransitionDays:
    Type: Number
    Description: Days after object creation before current objects transition to GlacierStorageClass (only used when EnableGlacierTransition is true). Must be lower than S3CurrentVersionExpirationDays when expiration is set.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  GlacierStorageClass:
    Type: String
    Description: "Target storage class - GLACIER_IR (Instant Retrieval, milliseconds), GLACIER (Flexible Retrieval, minutes to hours), DEEP_ARCHIVE (up to 48 hours)"
    Default: GLACIER
    AllowedValues:
      - GLACIER_IR
      - GLACIER
      - DEEP_ARCHIVE

  GlacierNoncurrentTransitionDays:
    Type: Number
    Description: Days after an object version becomes noncurrent before it transitions to GlacierStorageClass (0 to disable). Only used when EnableGlacierTransition and versioning are true. Must be lower than S3NoncurrentVersionExpirationDays when expiration is set.
    Default: 0
    MinValue: 0
    MaxValue: 3650

  GlacierTransitionPrefix:
    Type: String
    Description: "Glacier setting 1 - comma-separated object key prefixes, up to 5, no spaces (e.g. archive/,backup/). Leave empty to apply setting 1 to the whole bucket. Only used when EnableGlacierTransition is true."
    Default: ""
    AllowedPattern: '^$|^[^,\s]+(,[^,\s]+){0,4}$'
    ConstraintDescription: Up to 5 comma-separated prefixes with no spaces or empty items.

  Glacier2TransitionPrefix:
    Type: String
    Description: "Glacier setting 2 - comma-separated object key prefixes, up to 5, no spaces (e.g. logs/,reports/). Leave empty to not use setting 2. Requires EnableGlacierTransition to be true."
    Default: ""
    AllowedPattern: '^$|^[^,\s]+(,[^,\s]+){0,4}$'
    ConstraintDescription: Up to 5 comma-separated prefixes with no spaces or empty items.

  Glacier2TransitionDays:
    Type: Number
    Description: Glacier setting 2 - days after object creation before current objects under Glacier2TransitionPrefix transition to Glacier2StorageClass.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  Glacier2StorageClass:
    Type: String
    Description: "Glacier setting 2 - target storage class: GLACIER_IR, GLACIER or DEEP_ARCHIVE"
    Default: GLACIER
    AllowedValues:
      - GLACIER_IR
      - GLACIER
      - DEEP_ARCHIVE

  Glacier2NoncurrentTransitionDays:
    Type: Number
    Description: Glacier setting 2 - days after an object version becomes noncurrent before it transitions to Glacier2StorageClass (0 to disable). Requires versioning.
    Default: 0
    MinValue: 0
    MaxValue: 3650

  Glacier3TransitionPrefix:
    Type: String
    Description: "Glacier setting 3 - comma-separated object key prefixes, up to 5, no spaces (e.g. logs/,reports/). Leave empty to not use setting 3. Requires EnableGlacierTransition to be true."
    Default: ""
    AllowedPattern: '^$|^[^,\s]+(,[^,\s]+){0,4}$'
    ConstraintDescription: Up to 5 comma-separated prefixes with no spaces or empty items.

  Glacier3TransitionDays:
    Type: Number
    Description: Glacier setting 3 - days after object creation before current objects under Glacier3TransitionPrefix transition to Glacier3StorageClass.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  Glacier3StorageClass:
    Type: String
    Description: "Glacier setting 3 - target storage class: GLACIER_IR, GLACIER or DEEP_ARCHIVE"
    Default: GLACIER
    AllowedValues:
      - GLACIER_IR
      - GLACIER
      - DEEP_ARCHIVE

  Glacier3NoncurrentTransitionDays:
    Type: Number
    Description: Glacier setting 3 - days after an object version becomes noncurrent before it transitions to Glacier3StorageClass (0 to disable). Requires versioning.
    Default: 0
    MinValue: 0
    MaxValue: 3650

  EnableInspectorFindingsExportScheduler:
    Type: String
    Description: Enable native EventBridge Scheduler to export Amazon Inspector findings report to the Inspector S3 bucket.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Rules:
  Glacier2RequiresGlacierTransition:
    RuleCondition: !Not [!Equals [!Ref "Glacier2TransitionPrefix", ""]]
    Assertions:
      - Assert: !Equals [!Ref "EnableGlacierTransition", "true"]
        AssertDescription: "EnableGlacierTransition must be true when Glacier2TransitionPrefix is set."
  Glacier3RequiresGlacierTransition:
    RuleCondition: !Not [!Equals [!Ref "Glacier3TransitionPrefix", ""]]
    Assertions:
      - Assert: !Equals [!Ref "EnableGlacierTransition", "true"]
        AssertDescription: "EnableGlacierTransition must be true when Glacier3TransitionPrefix is set."

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  EnableVersioning: !Equals [!Ref EnableS3Versioning, "true"]
  EnableInspectorExportScheduler: !Equals [!Ref EnableInspectorFindingsExportScheduler, "true"]
  HasCurrentExpiration: !Not [!Equals [!Ref S3CurrentVersionExpirationDays, 0]]
  HasNoncurrentExpiration: !And
    - !Condition EnableVersioning
    - !Not [!Equals [!Ref S3NoncurrentVersionExpirationDays, 0]]
  HasGlacierTransition: !Equals [!Ref EnableGlacierTransition, "true"]
  HasNoncurrentGlacierTransition: !And
    - !Condition HasGlacierTransition
    - !Condition EnableVersioning
    - !Not [!Equals [!Ref GlacierNoncurrentTransitionDays, 0]]
  HasGlacierSet1Prefix2: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [1, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet1Prefix3: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [2, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet1Prefix4: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [3, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet1Prefix5: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [4, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet2Prefix1: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [0, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet2Prefix2: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [1, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet2Prefix3: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [2, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet2Prefix4: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [3, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet2Prefix5: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [4, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet3Prefix1: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [0, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet3Prefix2: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [1, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet3Prefix3: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [2, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet3Prefix4: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [3, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]], ""]]
  HasGlacierSet3Prefix5: !And
    - !Condition HasGlacierTransition
    - !Not [!Equals [!Select [4, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]], ""]]
  HasNoncurrentGlacier2Transition: !And
    - !Condition HasGlacierTransition
    - !Condition EnableVersioning
    - !Not [!Equals [!Ref Glacier2NoncurrentTransitionDays, 0]]
  HasNoncurrentGlacier3Transition: !And
    - !Condition HasGlacierTransition
    - !Condition EnableVersioning
    - !Not [!Equals [!Ref Glacier3NoncurrentTransitionDays, 0]]
  HasAnyLifecycleRule: !Or
    - !Condition HasCurrentExpiration
    - !Condition HasNoncurrentExpiration
    - !Condition HasGlacierTransition

Resources:
  ec2FileRepoS3Bucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BucketName: !Sub ${AppShortName}-${EnvName}-s3-ec2-file-repo
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: !If
        - EnableVersioning
        - Status: Enabled
        - !Ref "AWS::NoValue"
      LifecycleConfiguration: !If
        - HasAnyLifecycleRule
        - Rules:
            - !If
              - HasCurrentExpiration
              - Id: CurrentVersionExpiration
                Status: Enabled
                ExpirationInDays: !Ref S3CurrentVersionExpirationDays
                Prefix: ""
              - !Ref "AWS::NoValue"
            - !If
              - HasNoncurrentExpiration
              - Id: NoncurrentVersionCleanup
                Status: Enabled
                NoncurrentVersionExpiration:
                  NoncurrentDays: !Ref S3NoncurrentVersionExpirationDays
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierTransition
              - Id: GlacierSet1Prefix1
                Status: Enabled
                Prefix: !Select [0, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref GlacierTransitionDays
                    StorageClass: !Ref GlacierStorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacierTransition
                  - - TransitionInDays: !Ref GlacierNoncurrentTransitionDays
                      StorageClass: !Ref GlacierStorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet1Prefix2
              - Id: GlacierSet1Prefix2
                Status: Enabled
                Prefix: !Select [1, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref GlacierTransitionDays
                    StorageClass: !Ref GlacierStorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacierTransition
                  - - TransitionInDays: !Ref GlacierNoncurrentTransitionDays
                      StorageClass: !Ref GlacierStorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet1Prefix3
              - Id: GlacierSet1Prefix3
                Status: Enabled
                Prefix: !Select [2, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref GlacierTransitionDays
                    StorageClass: !Ref GlacierStorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacierTransition
                  - - TransitionInDays: !Ref GlacierNoncurrentTransitionDays
                      StorageClass: !Ref GlacierStorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet1Prefix4
              - Id: GlacierSet1Prefix4
                Status: Enabled
                Prefix: !Select [3, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref GlacierTransitionDays
                    StorageClass: !Ref GlacierStorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacierTransition
                  - - TransitionInDays: !Ref GlacierNoncurrentTransitionDays
                      StorageClass: !Ref GlacierStorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet1Prefix5
              - Id: GlacierSet1Prefix5
                Status: Enabled
                Prefix: !Select [4, !Split [",", !Join ["", [!Ref GlacierTransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref GlacierTransitionDays
                    StorageClass: !Ref GlacierStorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacierTransition
                  - - TransitionInDays: !Ref GlacierNoncurrentTransitionDays
                      StorageClass: !Ref GlacierStorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet2Prefix1
              - Id: GlacierSet2Prefix1
                Status: Enabled
                Prefix: !Select [0, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier2TransitionDays
                    StorageClass: !Ref Glacier2StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier2Transition
                  - - TransitionInDays: !Ref Glacier2NoncurrentTransitionDays
                      StorageClass: !Ref Glacier2StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet2Prefix2
              - Id: GlacierSet2Prefix2
                Status: Enabled
                Prefix: !Select [1, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier2TransitionDays
                    StorageClass: !Ref Glacier2StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier2Transition
                  - - TransitionInDays: !Ref Glacier2NoncurrentTransitionDays
                      StorageClass: !Ref Glacier2StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet2Prefix3
              - Id: GlacierSet2Prefix3
                Status: Enabled
                Prefix: !Select [2, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier2TransitionDays
                    StorageClass: !Ref Glacier2StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier2Transition
                  - - TransitionInDays: !Ref Glacier2NoncurrentTransitionDays
                      StorageClass: !Ref Glacier2StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet2Prefix4
              - Id: GlacierSet2Prefix4
                Status: Enabled
                Prefix: !Select [3, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier2TransitionDays
                    StorageClass: !Ref Glacier2StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier2Transition
                  - - TransitionInDays: !Ref Glacier2NoncurrentTransitionDays
                      StorageClass: !Ref Glacier2StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet2Prefix5
              - Id: GlacierSet2Prefix5
                Status: Enabled
                Prefix: !Select [4, !Split [",", !Join ["", [!Ref Glacier2TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier2TransitionDays
                    StorageClass: !Ref Glacier2StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier2Transition
                  - - TransitionInDays: !Ref Glacier2NoncurrentTransitionDays
                      StorageClass: !Ref Glacier2StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet3Prefix1
              - Id: GlacierSet3Prefix1
                Status: Enabled
                Prefix: !Select [0, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier3TransitionDays
                    StorageClass: !Ref Glacier3StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier3Transition
                  - - TransitionInDays: !Ref Glacier3NoncurrentTransitionDays
                      StorageClass: !Ref Glacier3StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet3Prefix2
              - Id: GlacierSet3Prefix2
                Status: Enabled
                Prefix: !Select [1, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier3TransitionDays
                    StorageClass: !Ref Glacier3StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier3Transition
                  - - TransitionInDays: !Ref Glacier3NoncurrentTransitionDays
                      StorageClass: !Ref Glacier3StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet3Prefix3
              - Id: GlacierSet3Prefix3
                Status: Enabled
                Prefix: !Select [2, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier3TransitionDays
                    StorageClass: !Ref Glacier3StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier3Transition
                  - - TransitionInDays: !Ref Glacier3NoncurrentTransitionDays
                      StorageClass: !Ref Glacier3StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet3Prefix4
              - Id: GlacierSet3Prefix4
                Status: Enabled
                Prefix: !Select [3, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier3TransitionDays
                    StorageClass: !Ref Glacier3StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier3Transition
                  - - TransitionInDays: !Ref Glacier3NoncurrentTransitionDays
                      StorageClass: !Ref Glacier3StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
            - !If
              - HasGlacierSet3Prefix5
              - Id: GlacierSet3Prefix5
                Status: Enabled
                Prefix: !Select [4, !Split [",", !Join ["", [!Ref Glacier3TransitionPrefix, ",,,,"]]]]
                Transitions:
                  - TransitionInDays: !Ref Glacier3TransitionDays
                    StorageClass: !Ref Glacier3StorageClass
                NoncurrentVersionTransitions: !If
                  - HasNoncurrentGlacier3Transition
                  - - TransitionInDays: !Ref Glacier3NoncurrentTransitionDays
                      StorageClass: !Ref Glacier3StorageClass
                  - !Ref "AWS::NoValue"
              - !Ref "AWS::NoValue"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v10

  ec2FileRepoS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ec2FileRepoS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ec2FileRepoS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt ec2FileRepoS3Bucket.Arn
                    - '/*'
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource:
              - !GetAtt ec2FileRepoS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt ec2FileRepoS3Bucket.Arn
                    - '/*'
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  InspectorKMSKey:
    Type: "AWS::KMS::Key"
    Properties:
      Description: "KMS Key for S3 Inspector"
      EnableKeyRotation: true
      RotationPeriodInDays: !Ref KMSKeyRotationPeriod
      KeyPolicy:
        Version: "2012-10-17"
        Id: "key-consolepolicy-3"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: "Allow"
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow Amazon Inspector to use the key"
            Effect: "Allow"
            Principal:
              Service: "inspector2.amazonaws.com"
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:inspector2:ap-southeast-1:${AWS::AccountId}:report/*"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v10

  InspectorKMSKeyAlias:
    Type: "AWS::KMS::Alias"
    Properties:
      AliasName: !Sub 'alias/${AppShortName}-${EnvName}-kms-inspector'
      TargetKeyId: !Ref InspectorKMSKey

  InspectorS3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub ${AppShortName}-${EnvName}-s3-inspector
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter1Year
            Status: Enabled
            ExpirationInDays: 365
            Prefix: ""
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v10

  InspectorS3BucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref InspectorS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}"
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: "allow-inspector"
            Effect: "Allow"
            Principal:
              Service: "inspector2.amazonaws.com"
            Action:
              - "s3:PutObject"
              - "s3:AbortMultipartUpload"
            Resource: !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:inspector2:ap-southeast-1:${AWS::AccountId}:report/*"
          - Sid: "AllowSSLRequestsOnly"
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}"
              - !Sub "arn:aws:s3:::${InspectorS3Bucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  InspectorFindingsExportSchedulerRole:
    Type: AWS::IAM::Role
    Condition: EnableInspectorExportScheduler
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-inspector-findings-export-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: create-inspector-findings-report
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CreateInspectorFindingsReport
                Effect: Allow
                Action:
                  - inspector2:CreateFindingsReport
                Resource: "*"
      Tags:
        - Key: IaCVersion
          Value: InfraPlatform-s3-v10

  InspectorFindingsExportSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: EnableInspectorExportScheduler
    DependsOn: InspectorS3BucketPolicy
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-inspector-findings-export
      Description: Schedule Amazon Inspector v2 findings report export to S3.
      ScheduleExpression: cron(0 20 * * ? *)
      ScheduleExpressionTimezone: Asia/Singapore
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:inspector2:createFindingsReport
        RoleArn: !GetAtt InspectorFindingsExportSchedulerRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
        Input: !Sub
          - |
            {
              "ReportFormat": "CSV",
              "S3Destination": {
                "BucketName": "${BucketName}",
                "KeyPrefix": "inspector2/findings",
                "KmsKeyArn": "${KmsKeyArn}"
              },
              "FilterCriteria": {
                "FindingStatus": [
                  {
                    "Comparison": "EQUALS",
                    "Value": "ACTIVE"
                  }
                ]
              }
            }
          - BucketName: !Ref InspectorS3Bucket
            KmsKeyArn: !GetAtt InspectorKMSKey.Arn
