AWSTemplateFormatVersion: 2010-09-09
## Provisioning of EC2
Description: EC2
Parameters:
  AppShortName:
    Type: String
    Description: AppShortName
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: AvailabilityZone
    AllowedValues: 
      - ap-southeast-1a
      - ap-southeast-1b
      - ap-southeast-1c      
  SubnetIdappAZ1:
    Type: AWS::EC2::Subnet::Id
    Description: VPC Subnet id for App AZ1
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b
  AMIId: #HCC Hardened AMI
    Type: AWS::EC2::Image::Id
    Description: HCC AMI Image ID
  InstanceName:
    Type: String
    Description: EC2 Instance Name
  InstanceType: #EC2 Instance Type
    Type: String
    Description: EC2 Instance Type
  DataVolumeSize: #Data Volume Size
    Type: String
    Description: Size of the Data Volume
  OSVolumeSize: #OS Volume Size
    Type: String
    Description: Size of the OS Volume
    Default: 100
  Function:
    Type: String
    Description: Server Function (eg, APP, UTL, DB)
    AllowedValues:
      - APP
      - WEB
      - DB
      - UTL
      - INT
      - RPT
      - SYS
  EC2InfraSecurityGroupID: 
    Type: String
    Description: EC2 Infra Security Group ID
  EC2AppSecurityGroupID: 
    Type: String
    Description: EC2 App Security Group ID
  EC2DeploymentSecurityGroupID:
    Type: String
    Default: ""
    Description: Optional - Deployment Security Group ID, leave blank if not used

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"]]
  AddDataVolume: !Not [!Equals [!Ref DataVolumeSize, '']]
  AdditionalSG: !Not [!Equals [!Ref EC2AppSecurityGroupID, '']]
  IncludeDeploymentSG: !Not [!Equals [!Ref EC2DeploymentSecurityGroupID, '']]

Resources:
  DataVolume:
    Condition: AddDataVolume
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Type: AWS::EC2::Volume
    Properties: 
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub ${InstanceName}-Data
        - Key: FUNCTION
          Value: !Ref Function
        - Key: EBS-SNAPSHOT
          Value: 'YES'
        - Key: BACKUP-DAILY
          Value: 'YES'
        - Key: BACKUP-WEEKLY
          Value: 'YES'
        - Key: BACKUP-MONTHLY
          Value: 'YES'
        - Key: BACKUP-YEARLY
          Value: 'YES'

  DataVolumeMountPoint:
    Condition: AddDataVolume
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdm

  EC2Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]  
    Properties:
      DisableApiTermination: !If [IsProduction, true, false]
      AvailabilityZone: !Ref AvailabilityZone
      LaunchTemplate:
        LaunchTemplateId: !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-EC2LaunchTemplateID}}'
        Version: !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-EC2LaunchTemplateLatestVersionNumber}}'
      ImageId: !Ref AMIId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Sub '{{resolve:ssm:${AppShortName}-${EnvName}-parameter-EC2InstanceProfileName}}'
      SubnetId: !Ref SubnetIdappAZ1
      SecurityGroupIds: 
        - !Ref EC2InfraSecurityGroupID
        - !If 
          - AdditionalSG
          - !Ref EC2AppSecurityGroupID
          - !Ref "AWS::NoValue"
        - !If 
          - IncludeDeploymentSG
          - !Ref EC2DeploymentSecurityGroupID
          - !Ref "AWS::NoValue"
      BlockDeviceMappings: 
        -
          DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref OSVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        -
          Key: Name
          Value: !Ref InstanceName
        -
          Key: FUNCTION
          Value: !Ref Function
        -
          Key: PatchGroup
          Value: 'CUSTOM'
