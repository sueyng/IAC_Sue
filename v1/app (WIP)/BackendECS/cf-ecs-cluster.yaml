AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create an ECS Cluster and ECS Task Execution Role with custom managed policies

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the ECS tasks will run

Conditions:
  IsProduction:
    Fn::Or:
      - Fn::Equals: [!Ref EnvName, prod]
      - Fn::Equals: [!Ref EnvName, prod-a]
      - Fn::Equals: [!Ref EnvName, prod-b]
      
Resources:
  # ECSkmsKey:
  #   Type: 'AWS::KMS::Key'
  #   DeletionPolicy: !If [IsProduction, Retain, Delete]
  #   UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
  #   Properties:
  #     Description: KMS key for container secret keys
  #     EnableKeyRotation: false
  #     PendingWindowInDays: 7
  #     KeyPolicy:
  #       Version: 2012-10-17
  #       Id: key-default-1
  #       Statement:
  #         - Sid: Enable IAM User Permissions
  #           Effect: Allow
  #           Principal:
  #             AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
  #           Action: 'kms:*'
  #           Resource: '*'

  # ECSkmsKeyAlias:
  #   Type: 'AWS::KMS::Alias'
  #   DeletionPolicy: !If [IsProduction, Retain, Delete]
  #   UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
  #   Properties:
  #     AliasName: !Sub alias/${AppShortName}-${EnvName}-kms-ecs-secretsencryption
  #     TargetKeyId: !Ref ECSkmsKey
      
  ECSCluster:
    Type: AWS::ECS::Cluster
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ClusterName: !Sub "${AppShortName}-${EnvName}-ecs"
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
    
  ECSTaskECRPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${AppShortName}-${EnvName}-ECSTaskECR"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "ecr:GetDownloadUrlForLayer"
              - "ecr:BatchGetImage"
              - "ecr:BatchCheckLayerAvailability"
              - "ecr:GetAuthorizationToken"
            Resource: "*"

  ECSTaskCloudWatchPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${AppShortName}-${EnvName}-ECSTaskCloudWatch"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "logs:DescribeLogStreams"
              - "logs:DescribeLogGroups"
              - "cloudwatch:PutMetricData"
              - "cloudwatch:GetMetricStatistics"
              - "cloudwatch:ListMetrics"
              - "cloudwatch:DescribeAlarms"
            Resource: 
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/*:*"
              - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:*"

  ECSTaskSSMPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${AppShortName}-${EnvName}-ECSTaskSSM"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "ssmmessages:CreateControlChannel"
              - "ssmmessages:CreateDataChannel"
              - "ssmmessages:OpenControlChannel"
              - "ssmmessages:OpenDataChannel"
              - "ecs:ExecuteCommand"
            Resource: "*"

  PolicySecretsManagerAccess:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${AppShortName}-${EnvName}-secretsmanageraccess"
      Description: Policy to allow access to container secret keys
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetResourcePolicy'
              - 'secretsmanager:GetSecretValue'
              - 'kms:Decrypt'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:ListSecretVersionIds'
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-*"
              - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              # - !GetAtt ECSkmsKey.Arn
          - Effect: Allow
            Action:
              - 'secretsmanager:GetRandomPassword'
              - 'secretsmanager:ListSecrets'
            Resource: '*'

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    DependsOn:
      - ECSTaskECRPolicy
      - ECSTaskCloudWatchPolicy
      - ECSTaskSSMPolicy
      - PolicySecretsManagerAccess
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub "${AppShortName}-${EnvName}-ecsTaskExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref ECSTaskECRPolicy
        - !Ref ECSTaskCloudWatchPolicy
        - !Ref ECSTaskSSMPolicy
        - !Ref PolicySecretsManagerAccess
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
        - 'arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

  # Store ECS Task Execution Role ARN in SSM for other services to use
  ECSTaskExecutionRoleParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]    
    Properties:
      Name: !Sub "/${AppShortName}/${EnvName}/ECSTaskExecutionRoleArn"
      Type: String
      Value: !GetAtt ECSTaskExecutionRole.Arn
      Description: ARN of the ECS Task Execution Role

  # Store the ECS Cluster Name in SSM
  ECSClusterNameParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]    
    Properties:
      Name: !Sub "/${AppShortName}/${EnvName}/ecs-cluster-name"
      Type: String
      Value: !Ref ECSCluster
      Description: Name of the ECS Cluster
