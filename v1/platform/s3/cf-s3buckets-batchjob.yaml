    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Bucket: !Ref DataloadS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: 
              - !GetAtt DataloadS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt DataloadS3Bucket.Arn
                    - '/*'
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource: 
              - !GetAtt DataloadS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt DataloadS3Bucket.Arn
                    - '/*'
            Principal: '*'
            Condition:
              Bool:
