          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource: 
              - !GetAtt ec2UploadS3Bucket.Arn
              - !Join
                  - ''
                  - - !GetAtt ec2UploadS3Bucket.Arn
                    - '/*'
            Principal: '*'
