AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon Grafana workspace stack
Parameters:
  VPCID:
    Description: VPC to create endpoints and workspace
    Type: String
  SubnetIDAZ1:
    Description: Subnets to create endpoints and workspace for AZ1
    Type: String
  SubnetIDAZ2:
    Description: Subnets to create endpoints and workspace for AZ2
    Type: String
  AppShortName:
    Description: Application name
    Type: String
  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-uat
      - nprd-pt
      - prod
  AuthProvider:
    Description: Authentication Provider (SAML/AWS_SSO)
    Type: String
    Default: AWS_SSO
    AllowedValues:
      - AWS_SSO
      - SAML
Conditions:
  IsProduction: !Equals
    - !Ref EnvName
    - prod

Resources:
  PrefixListOfficeNetwork:
    Type: AWS::EC2::PrefixList
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      PrefixListName: !Sub pl-${AppShortName}-${EnvName}-OfficeNetwork
      AddressFamily: "IPv4"
      MaxEntries: 10
      Entries:
        - Cidr: "34.87.130.0/24"
          Description: "Office SN Public"
        - Cidr: "54.254.116.150/32"
          Description: "HCC-AWS-FW NAT PIP-AZ2"
        - Cidr: "18.136.160.66/32"
          Description: "HCC-AWS-FW NAT PIP-AZ3"
        - Cidr: "57.140.27.199/32"
          Description: "HVPN-Menlo(SecureWebGateway)"
        - Cidr: "34.87.130.120/32"
          Description: "IHIS Public IP"                            
# IAM Role
  AmazonGrafanaWorkspaceIAMRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - grafana.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      RoleName: !Sub ${AppShortName}-${EnvName}-grafana-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXrayReadOnlyAccess
  GrafanaCloudWatchPolicy:
    Type: 'AWS::IAM::Policy'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      PolicyDocument:
        Statement:
          - Sid: AllowReadingLogsFromCloudWatch
            Action:
              - "logs:DescribeLogGroups"
              - "logs:GetLogGroupFields"
              - "logs:StartQuery"
              - "logs:StopQuery"
              - "logs:GetQueryResults"
              - "logs:GetLogEvents"
            Effect: Allow
            Resource: "*"
          - Sid: AllowReadingMetricsFromCloudWatch
            Action:
              - "cloudwatch:DescribeAlarmsForMetric"
              - "cloudwatch:DescribeAlarmHistory"
              - "cloudwatch:DescribeAlarms"
              - "cloudwatch:ListMetrics"
              - "cloudwatch:GetMetricStatistics"
              - "cloudwatch:GetMetricData"
              - "cloudwatch:GetInsightRuleReport"
            Effect: Allow
            Resource: "*"
          - Sid: AllowReadingTagsInstancesRegionsFromEC2
            Action:
              - "ec2:DescribeTags"
              - "ec2:DescribeInstances"
              - "ec2:DescribeRegions"
            Effect: Allow
            Resource: "*"
          - Sid: AllowReadingResourcesForTags
            Action:
              - "tag:GetResources"
            Effect: Allow
            Resource: "*"
        Version: 2012-10-17
      PolicyName: !Sub ${AppShortName}-${EnvName}-grafana-CloudWatch-Policy
      Roles:
        - !Ref AmazonGrafanaWorkspaceIAMRole

# Security Group
  AmazonGrafanaWorkspaceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Security Group for Amazon Grafana Workspace
      GroupName: !Sub sg_${AppShortName}-${EnvName}-grafana-workspace
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - SourcePrefixListId: !Ref PrefixListOfficeNetwork
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
      Tags:
        - Key: Name
          Value: !Sub 'sg_${AppShortName}-${EnvName}-grafana-workspace'

# Grafana Workspace
  AmazonGrafanaWorkspace:
    Type: 'AWS::Grafana::Workspace'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      AccountAccessType: CURRENT_ACCOUNT
      Name: !Sub ${AppShortName}-${EnvName}-grafana
      Description: Amazon Grafana Workspace
      PermissionType: CUSTOMER_MANAGED
      RoleArn: !GetAtt AmazonGrafanaWorkspaceIAMRole.Arn
      GrafanaVersion: 8.4
      NetworkAccessControl:
        PrefixListIds:
          - !Ref PrefixListOfficeNetwork
#        VpceIds:
#          - !Ref VPCInterfaceEndpointGrafanaWorkspace
      AuthenticationProviders:
        - !Ref AuthProvider
      VpcConfiguration:
        SecurityGroupIds:
          - !GetAtt AmazonGrafanaWorkspaceSecurityGroup.GroupId
        SubnetIds: 
          - !Ref SubnetIDAZ1
          - !Ref SubnetIDAZ2
Outputs:
  WorkspaceEndpoint:
    Value: !GetAtt 
      - AmazonGrafanaWorkspace
      - Endpoint
  WorkspaceStatus:
    Value: !GetAtt 
      - AmazonGrafanaWorkspace
      - Status
  WorkspaceId:
    Value: !Ref AmazonGrafanaWorkspace
  GrafanaVersion:
    Value: !GetAtt 
      - AmazonGrafanaWorkspace
      - GrafanaVersion