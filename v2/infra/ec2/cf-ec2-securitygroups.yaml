AWSTemplateFormatVersion: 2010-09-09
Description: EC2 Security Group Conditional Creation based on Function

Parameters:
  AppShortName:
    Type: String
    Description: AppShortName
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID
  Function:
    Type: String
    Description: Server Function (eg, APP, UTL, DB)
    AllowedValues:
      - APP
      - WEB
      - DB
      - UTL
      - INT
      - RPT
      - SYS
  ALBSecurityGroupId:
    Type: String
    Description: Application Load Balancer Security Group id

  AnsibleServerIP1:
    Type: String
    Description: IP Address of the first Ansible server
  
  AnsibleServerIP2:
    Type: String
    Description: IP Address of the second Ansible server

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"]]
  IsUTLFunction: !Equals [!Ref Function, "UTL"]
  IsNotUTLFunction: !Not [!Equals [!Ref Function, "UTL"]]
  HasALBSecurityGroup: !Not [!Equals [!Ref ALBSecurityGroupId, ""]]
  HasAnsibleServerIP1: !Not [!Equals [!Ref AnsibleServerIP1, ""]]
  HasAnsibleServerIP2: !Not [!Equals [!Ref AnsibleServerIP1, ""]]

Resources:
  EC2AppSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Condition: IsNotUTLFunction
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Common Security Group for EC2
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-ec2-${Function}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If 
            - "HasALBSecurityGroup"
            - IpProtocol: tcp
              FromPort: 443
              ToPort: 443
              SourceSecurityGroupId: !Ref ALBSecurityGroupId
              Description: Application Load Balancer SecurityGroup ID
            - !Ref AWS::NoValue

  EC2DeploymentSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Condition: IsUTLFunction
    Properties:
      GroupDescription: Deployment Security Group for EC2
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-ec2-deployment-${Function}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5986
          ToPort: 5986
          CidrIp: !If [HasAnsibleServerIP1, !Sub "${AnsibleServerIP1}", !Ref "AWS::NoValue"]
          Description: Access from Ansible Server 1
        - IpProtocol: tcp
          FromPort: 5986
          ToPort: 5986
          CidrIp: !If [HasAnsibleServerIP2, !Sub "${AnsibleServerIP2}", !Ref "AWS::NoValue"]
          Description: Access from Ansible Server 2

Outputs:
  EC2AppSecurityGroupID:
    Condition: IsNotUTLFunction
    Description: EC2 App Security Group ID
    Value: !GetAtt EC2AppSecurityGroup.GroupId
    Export:
      Name: !Sub ${EnvName}-${Function}-EC2AppSecurityGroupID

  EC2DeploymentSecurityGroupID:
    Condition: IsUTLFunction
    Description: EC2 Deployment Security Group ID
    Value: !GetAtt EC2DeploymentSecurityGroup.GroupId
    Export:
      Name: !Sub ${EnvName}-${Function}-EC2DeploymentSecurityGroupID