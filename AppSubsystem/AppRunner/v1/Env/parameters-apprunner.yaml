# VPC CONFIGURATION
VpcId: "<edit_here>"                    # 📝 e.g. vpc-02fb2e32bbb6ff24e
SubnetIds: "<edit_here>"                # 📝 e.g. subnet-abc123,subnet-def456,subnet-ghi789 (private subnets, NO SPACES)
AppRunnerVPCEndpoint: "<edit_here>"     # 📝 e.g. vpce-08f03eef9287fb0da (VPC endpoint for App Runner)

# SECURITY GROUP EGRESS RULES
VpcCidr1: "<edit_here>"                 # 📝 e.g. 10.0.0.0/16 (primary VPC CIDR for HTTPS egress)
VPCSubnetCidrDBAZ1: "<edit_here>"       # 📝 e.g. 10.0.151.0/24 (database subnet CIDR AZ1)
VPCSubnetCidrDBAZ2: "<edit_here>"       # 📝 e.g. 10.0.152.0/24 (database subnet CIDR AZ2)
VPCSubnetCidrDBAZ3: "<edit_here>"       # 📝 e.g. 10.0.153.0/24 (database subnet CIDR AZ3)
VPCSubnetCidrAppAZ1: "<edit_here>"      # 📝 e.g. 10.0.101.0/24 (app subnet CIDR AZ1, for ElastiCache)
VPCSubnetCidrAppAZ2: "<edit_here>"      # 📝 e.g. 10.0.102.0/24 (app subnet CIDR AZ2, for ElastiCache)
VPCSubnetCidrAppAZ3: "<edit_here>"      # 📝 e.g. 10.0.103.0/24 (app subnet CIDR AZ3, for ElastiCache)

