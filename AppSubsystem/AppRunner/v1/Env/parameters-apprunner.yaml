AppRunnerMemory: "2048"                 # Memory (MB) - 512-12288 (default - 2048 = 2 GB)

# Additional VPC CIDRs (leave "" if not needed)
VpcCidr2: ""                            # Additional VPC CIDR for HTTPS egress
