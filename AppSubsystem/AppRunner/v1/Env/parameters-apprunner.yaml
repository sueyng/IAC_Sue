HCCVpceCidr: "10.48.42.0/24"            # HCC VPC Endpoint subnet CIDR (default - 10.48.42.0/24)

# WAF Web ACL (optional)
WAFWebACLArn: ""                        # WAF Web ACL ARN (leave "" to skip WAF)

