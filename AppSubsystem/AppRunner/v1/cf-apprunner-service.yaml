AWSTemplateFormatVersion: '2010-09-09'
Description: App Runner service using ECR image with IAM, VPC connector, env vars, secrets, and internal SG

Parameters:
  AppShortName:
    Description: Application name
    Default: ""
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
    Default: nprd

  ServiceName:
    Type: String
    Default: ""
    Description: Name of the App Runner service

  EcrImageUri:
    Type: String
    Default: ""
    Description: Full URI of the ECR image (e.g., 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/my-app:latest)

  ContainerPort:
    Type: String
    Default: ""
    Description: Port the application container listens on

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: ""
    Description: VPC ID for subnet and SG

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: ""
    Description: Private subnets for the VPC Connector

  AppRunnerCpu:
    Type: String
    Default: "1024"
    Description: CPU configuration for App Runner service (in units of 1024 CPU shares)

  AppRunnerMemory:
    Type: String
    Default: "2048"
    Description: Memory configuration for App Runner service (in MB)

  MaxConcurrency:
    Type: String
    Default: "100"
    Description: Maximum number of concurrent requests per instance
  MinInstances:
    Type: String
    Default: 1
    Description: Minimum number of instances for the App Runner service
  
  MaxInstances:
    Type: String
    Default: 2
    Description: Maximum number of instances for the App Runner service
    
  HealthCheckPath:
    Type: String
    Default: "/health"
    Description: The path for App Runner health check endpoint

  HealthyThreshold:
    Type: String
    Default: "2"
    Description: Number of consecutive successful health checks required to consider the service healthy

  UnhealthyThreshold:
    Type: String
    Default: "2"
    Description: Number of consecutive failed health checks required to consider the service unhealthy

  HealthCheckInterval:
    Type: String
    Default: "20"
    Description: Interval in seconds between health checks
  
  Timeout:
    Type: String
    Default: "5"
    Description: Timeout in seconds for each health check

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: "10.0.0.0/16"
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
    
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""

# Optional HCC VPC Endpoint Subnet CIDR Ranges
  HCCSubnetCidrBCSAZ1:
    Description: HCC Proxy Subnet1
    Type: String
    Default: ""

  HCCSubnetCidrBCSAZ2:
    Description: HCC Proxy Subnet2
    Type: String
    Default: ""

  BCSProxyPort:
    Description: BCS Proxy Port
    Type: String
    Default: "4000"

  WAFWebACLArn:
    Description: ARN of the WAF Web ACL to associate with the App Runner service (leave empty to disable WAF)
    Type: String
    Default: ""
  
  AppRunnerVPCEndpoint:
    Type: String
    Default: ""
    Description: VPC Endpoint ID for App Runner service to connect to the VPC

  AdditionalSecretsManagerSecretArns:
    Type: String
    Default: ""
    Description: >-
      Optional. Comma-separated extra Secrets Manager secret ARNs for secrets that do not
      follow the AppShortName naming prefix. Wildcards (* and ?) are allowed only in
      the secret name portion, but bare secret wildcards are rejected. For example:
      arn:aws:secretsmanager:ap-southeast-1:123456789012:secret:shared-*.
      Leave empty if not needed.
    AllowedPattern: "^(|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]*[A-Za-z0-9/_+=.@-][A-Za-z0-9/_+=.@*-]*(,arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]*[A-Za-z0-9/_+=.@-][A-Za-z0-9/_+=.@*-]*)*)$"
    ConstraintDescription: "Provide comma-separated Secrets Manager secret ARNs with explicit region/account and at least one non-wildcard character in the secret name, or leave empty."

  ProdDBPort:
    Type: String
    Default: 53341
    Description: Production database port number
    NoEcho: true

  NProdDBPort:
    Type: String
    Default: 53331
    Description: Non-production database port number
    NoEcho: true

  VPCSubnetCidrDBAZ1:
    Type: String
    Description: AZ1 App Subnet
    Default: ""
  
  VPCSubnetCidrDBAZ2:
    Type: String
    Description: AZ2 App Subnet
    Default: ""

  VPCSubnetCidrDBAZ3:
    Type: String
    Description: AZ3 App Subnet
    Default: ""
  
  VPCSubnetCidrAppAZ1:
    Description: CIDR block for the ECS service traffic
    Type: String
    Default: ""
 
  VPCSubnetCidrAppAZ2:
    Description: CIDR block for the ECS service traffic
    Type: String
    Default: ""

  VPCSubnetCidrAppAZ3:
    Description: CIDR block for the ECS service traffic
    Type: String
    Default: ""

  EnvVar1Name:
    Description: Environment Variable Name 1
    Type: String
    Default: ""
  EnvVar1Value:
    Description: Environment Variable Value 1
    Type: String
    Default: ""

  EnvVar2Name:
    Description: Environment Variable Name 2
    Type: String
    Default: ""
  EnvVar2Value:
    Description: Environment Variable Value 2
    Type: String
    Default: ""

  EnvVar3Name:
    Description: Environment Variable Name 3
    Type: String
    Default: ""
  EnvVar3Value:
    Description: Environment Variable Value 3
    Type: String
    Default: ""

  EnvVar4Name:
    Description: Environment Variable Name 4
    Type: String
    Default: ""
  EnvVar4Value:
    Description: Environment Variable Value 4
    Type: String
    Default: ""

  EnvVar5Name:
    Description: Environment Variable Name 5
    Type: String
    Default: ""
  EnvVar5Value:
    Description: Environment Variable Value 5
    Type: String
    Default: ""

  EnvVar6Name:
    Description: Environment Variable Name 6
    Type: String
    Default: ""
  EnvVar6Value:
    Description: Environment Variable Value 6
    Type: String
    Default: ""

  EnvVar7Name:
    Description: Environment Variable Name 7
    Type: String
    Default: ""
  EnvVar7Value:
    Description: Environment Variable Value 7
    Type: String
    Default: ""
 
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, ""]]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, ""]]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasWAFWebACL: !Not [!Equals [!Ref WAFWebACLArn, ""]]
  HasVPCSubnetCidrDBAZ3: !Not [!Equals [!Ref VPCSubnetCidrDBAZ3, ""]]
  HasVPCSubnetCidrDBAZ1: !Not [!Equals [!Ref VPCSubnetCidrDBAZ1, ""]]
  HasVPCSubnetCidrDBAZ2: !Not [!Equals [!Ref VPCSubnetCidrDBAZ2, ""]]
  HasVPCSubnetCidrAppAZ3: !Not [!Equals [!Ref VPCSubnetCidrAppAZ3, ""]]
  HasAdditionalSecretsManagerSecretArns: !Not [!Equals [!Ref AdditionalSecretsManagerSecretArns, ""]]
  HasEnvVar1: !And [!Not [!Equals [!Ref EnvVar1Name, ""]], !Not [!Equals [!Ref EnvVar1Value, ""]]]
  HasEnvVar2: !And [!Not [!Equals [!Ref EnvVar2Name, ""]], !Not [!Equals [!Ref EnvVar2Value, ""]]]
  HasEnvVar3: !And [!Not [!Equals [!Ref EnvVar3Name, ""]], !Not [!Equals [!Ref EnvVar3Value, ""]]]
  HasEnvVar4: !And [!Not [!Equals [!Ref EnvVar4Name, ""]], !Not [!Equals [!Ref EnvVar4Value, ""]]]
  HasEnvVar5: !And [!Not [!Equals [!Ref EnvVar5Name, ""]], !Not [!Equals [!Ref EnvVar5Value, ""]]]
  HasEnvVar6: !And [!Not [!Equals [!Ref EnvVar6Name, ""]], !Not [!Equals [!Ref EnvVar6Value, ""]]]
  HasEnvVar7: !And [!Not [!Equals [!Ref EnvVar7Name, ""]], !Not [!Equals [!Ref EnvVar7Value, ""]]]
  HasHCCSubnetCidrBCSAZ1: !Not [!Equals [!Ref HCCSubnetCidrBCSAZ1, ""]]
  HasHCCSubnetCidrBCSAZ2: !Not [!Equals [!Ref HCCSubnetCidrBCSAZ2, ""]]

Resources:
  AppRunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for App Runner VPC connector
      GroupName: !Sub "${AppShortName}-${EnvName}-sg-apprunner"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"     
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCSubnetCidrBCSAZ1
          - IpProtocol: tcp
            FromPort: !Ref BCSProxyPort
            ToPort: !Ref BCSProxyPort
            CidrIp: !Ref HCCSubnetCidrBCSAZ1
            Description: HCC BCS AZ1 Subnet
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCSubnetCidrBCSAZ2
          - IpProtocol: tcp
            FromPort: !Ref BCSProxyPort
            ToPort: !Ref BCSProxyPort
            CidrIp: !Ref HCCSubnetCidrBCSAZ2
            Description: HCC BCS AZ2 Subnet
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          CidrIp: !Ref VPCSubnetCidrAppAZ1
          Description: Allow ElasticCache AZ1
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          CidrIp: !Ref VPCSubnetCidrAppAZ2
          Description: Allow ElasticCache AZ2
        - !If
          - HasVPCSubnetCidrAppAZ3
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref VPCSubnetCidrAppAZ3
            Description: Allow ElasticCache AZ3
          - !Ref "AWS::NoValue"
        - !If
          - HasVPCSubnetCidrDBAZ1
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ1
            Description: Allow DB AZ1 Subnet
          - !Ref AWS::NoValue
        - !If
          - HasVPCSubnetCidrDBAZ2
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ2
            Description: Allow DB AZ2 Subnet
          - !Ref AWS::NoValue  
        - !If
          - HasVPCSubnetCidrDBAZ3
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ3
            Description: Allow DB Subnet AZ3
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-sg-apprunner"
  
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppShortName}-${EnvName}-apprunner-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !If
                  - HasAdditionalSecretsManagerSecretArns
                  - !Split
                    - ","
                    - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}*,${AdditionalSecretsManagerSecretArns}"
                  - - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}*"
        - PolicyName: XRayAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                  - xray:GetSamplingStatisticSummaries
                Resource: "*"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-apprunner-instance-role"

  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppShortName}-${EnvName}-apprunner-ecr-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1

  AppRunnerVpcConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      VpcConnectorName: !Sub "${AppShortName}-${EnvName}-vpc"
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AppRunnerSecurityGroup
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-vpc"

  AppRunnerAutoScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AppShortName}-${EnvName}-scaling"
      MaxConcurrency: !Ref MaxConcurrency
      MaxSize: !Ref MaxInstances
      MinSize: !Ref MinInstances
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-scaling"
  
  AppRunnerObservabilityConfiguration:
    Type: AWS::AppRunner::ObservabilityConfiguration
    Properties:
      ObservabilityConfigurationName: !Sub "${AppShortName}-${EnvName}-observability"
      TraceConfiguration:
        Vendor: AWSXRAY
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-observability"

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref EcrImageUri
          ImageConfiguration:
            Port: !Ref ContainerPort
            RuntimeEnvironmentVariables:
              - Name: LOG_LEVEL
                Value: debug
              - Name: FEATURE_FLAG
                Value: true
            RuntimeEnvironmentSecrets:
              - !If 
                - HasEnvVar1
                - Name: !Ref EnvVar1Name
                  Value: !Ref EnvVar1Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar2
                - Name: !Ref EnvVar2Name
                  Value: !Ref EnvVar2Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar3
                - Name: !Ref EnvVar3Name
                  Value: !Ref EnvVar3Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar4
                - Name: !Ref EnvVar4Name
                  Value: !Ref EnvVar4Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar5
                - Name: !Ref EnvVar5Name
                  Value: !Ref EnvVar5Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar6
                - Name: !Ref EnvVar6Name
                  Value: !Ref EnvVar6Value
                - !Ref AWS::NoValue
              - !If 
                - HasEnvVar7
                - Name: !Ref EnvVar7Name
                  Value: !Ref EnvVar7Value
                - !Ref AWS::NoValue
        AutoDeploymentsEnabled: false
      HealthCheckConfiguration:
        HealthyThreshold: !Ref HealthyThreshold
        Interval: !Ref HealthCheckInterval
        Path: !Ref HealthCheckPath
        Protocol: HTTP
        Timeout: !Ref Timeout
        UnhealthyThreshold: !Ref UnhealthyThreshold

      InstanceConfiguration:
        Cpu: !Ref AppRunnerCpu
        Memory: !Ref AppRunnerMemory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      
      ObservabilityConfiguration:
        ObservabilityEnabled: true
        ObservabilityConfigurationArn: !GetAtt AppRunnerObservabilityConfiguration.ObservabilityConfigurationArn
      
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: false
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !GetAtt AppRunnerVpcConnector.VpcConnectorArn
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-apprunner-service"

  AppRunnerVpcIngressConnection:
    Type: AWS::AppRunner::VpcIngressConnection
    Properties:
      IngressVpcConfiguration:
        VpcEndpointId: !Ref AppRunnerVPCEndpoint
        VpcId: !Ref VpcId
      ServiceArn: !GetAtt AppRunnerService.ServiceArn
      VpcIngressConnectionName: !Sub "${AppShortName}-${EnvName}-vpc-ingress-conc"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-AppRunner-v1
        - Key: Name
          Value: !Sub "${AppShortName}-${EnvName}-vpc-ingress-connection"
  # WAF Web ACL Association
  AppRunnerWafAssociation:
    Condition: HasWAFWebACL
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn: !Ref WAFWebACLArn
      ResourceArn: !GetAtt AppRunnerService.ServiceArn
