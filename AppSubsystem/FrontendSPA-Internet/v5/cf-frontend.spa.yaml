AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront distribution v5 - Merged response headers policy, configurable TLS, multi-origin S3 (1-4 buckets), optional Bucket1 path pattern'

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  NumberOfBuckets:
    Type: Number
    Description: Number of S3 bucket origins to use (1-4)
    MinValue: 1
    MaxValue: 4
    Default: 1

  DefaultPage:
    Type: String
    Description: Default page
    Default: index.html

  UseCustomDomain:
    Type: String
    Description: Choose whether to use a custom domain name or CloudFront default domain
    AllowedValues: ["true", "false"]
    Default: "false"

  CustomDomainName:
    Type: String
    Description: Custom domain name for CloudFront Distribution (required if UseCustomDomain is true)
    Default: ""

  CloudFrontCertArn:
    Type: String
    Description: The ARN of the ACM certificate (must be in us-east-1, required if UseCustomDomain is true)
    Default: ""

  GeoLocation:
    Type: String
    Description: Comma-separated list of two-letter ISO country codes (e.g., "VN,PH,SG")

  CloudFrontSecurityPolicy:
    Type: String
    Description: CloudFront minimum SSL/TLS protocol version for viewer connections
    AllowedValues:
      - TLSv1.2_2021
      - TLSv1.2_2025
      - TLSv1.3_2025
    Default: TLSv1.2_2021

  WAFWebACLArn:
    Type: String
    Description: The ARN of the WAF Web ACL to associate with CloudFront (leave empty to disable)
    Default: ""

  CloudFrontLoggingV2ManualSetupRequired:
    Type: String
    Description: Enter CONFIRM to acknowledge that CloudFront logging v2 is not configured by this template and must be enabled manually from the CloudFront console after deployment.
    AllowedValues:
      - CONFIRM

  # Bucket 1 Parameters
  Bucket1Name:
    Type: String
    Description: Name of the existing first S3 bucket

  Bucket1UsePathPattern:
    Type: String
    Description: Whether Bucket1 should also be added as an additional cache behavior matched by Bucket1PathPattern
    AllowedValues: ["true", "false"]
    Default: "false"

  Bucket1PathPattern:
    Type: String
    Description: Path pattern for first bucket (required if Bucket1UsePathPattern is true)
    Default: ""

  Bucket1FunctionEnabled:
    Type: String
    Description: Enable CloudFront Function for Bucket1
    Default: "false"
    AllowedValues: ["true", "false"]

  Bucket1FunctionName:
    Type: String
    Description: Name for Bucket1's CloudFront Function (required if Bucket1FunctionEnabled is true)
    Default: ""
    MinLength: 0
    MaxLength: 64
    AllowedPattern: "^$|[a-zA-Z0-9-_]+"
    ConstraintDescription: "Function name can only contain letters, numbers, hyphens, and underscores"

  # Bucket 2 Parameters
  Bucket2Name:
    Type: String
    Description: Name of the existing second S3 bucket (if needed)
    Default: ""

  Bucket2PathPattern:
    Type: String
    Description: Path pattern for second bucket
    Default: ""

  Bucket2FunctionEnabled:
    Type: String
    Description: Enable CloudFront Function for Bucket2
    Default: "false"
    AllowedValues: ["true", "false"]

  Bucket2FunctionName:
    Type: String
    Description: Name for Bucket2's CloudFront Function (required if Bucket2FunctionEnabled is true)
    Default: ""
    MinLength: 0
    MaxLength: 64
    AllowedPattern: "^$|[a-zA-Z0-9-_]+"
    ConstraintDescription: "Function name can only contain letters, numbers, hyphens, and underscores"

  # Bucket 3 Parameters
  Bucket3Name:
    Type: String
    Description: Name of the existing third S3 bucket (if needed)
    Default: ""

  Bucket3PathPattern:
    Type: String
    Description: Path pattern for third bucket
    Default: ""

  Bucket3FunctionEnabled:
    Type: String
    Description: Enable CloudFront Function for Bucket3
    Default: "false"
    AllowedValues: ["true", "false"]

  Bucket3FunctionName:
    Type: String
    Description: Name for Bucket3's CloudFront Function (required if Bucket3FunctionEnabled is true)
    Default: ""
    MinLength: 0
    MaxLength: 64
    AllowedPattern: "^$|[a-zA-Z0-9-_]+"
    ConstraintDescription: "Function name can only contain letters, numbers, hyphens, and underscores"

  # Bucket 4 Parameters
  Bucket4Name:
    Type: String
    Description: Name of the existing fourth S3 bucket (if needed)
    Default: ""

  Bucket4PathPattern:
    Type: String
    Description: Path pattern for fourth bucket
    Default: ""

  Bucket4FunctionEnabled:
    Type: String
    Description: Enable CloudFront Function for Bucket4
    Default: "false"
    AllowedValues: ["true", "false"]

  Bucket4FunctionName:
    Type: String
    Description: Name for Bucket4's CloudFront Function (required if Bucket4FunctionEnabled is true)
    Default: ""
    MinLength: 0
    MaxLength: 64
    AllowedPattern: "^$|[a-zA-Z0-9-_]+"
    ConstraintDescription: "Function name can only contain letters, numbers, hyphens, and underscores"

  # ========== Response Headers Policy Parameters ==========

  EnableResponseHeadersPolicy:
    Type: String
    Description: Enable CloudFront Response Headers Policy (applies to all cache behaviors)
    AllowedValues: ["true", "false"]
    Default: "true"

  # CORS response headers for static GET/HEAD content
  EnableCORS:
    Type: String
    Description: Enable CloudFront CORS response headers for all cache behaviors
    AllowedValues: ["true", "false"]
    Default: "false"

  CORSAllowedOrigins:
    Type: String
    Description: Comma-separated approved origins without spaces; exact origins are recommended and * is not recommended except for intentionally public content
    Default: ""

  # HSTS
  EnableHSTS:
    Type: String
    Description: Enable HTTP Strict-Transport-Security header
    AllowedValues: ["true", "false"]
    Default: "true"

  HSTSMaxAge:
    Type: Number
    Description: HSTS max-age in seconds (31536000 = 1 year)
    Default: 31536000
    MinValue: 0

  HSTSIncludeSubdomains:
    Type: String
    Description: Include subdomains in HSTS policy
    AllowedValues: ["true", "false"]
    Default: "true"

  HSTSPreload:
    Type: String
    Description: Enable HSTS preload (submit to browser preload lists)
    AllowedValues: ["true", "false"]
    Default: "false"

  # X-Content-Type-Options
  EnableXContentTypeOptions:
    Type: String
    Description: Enable X-Content-Type-Options nosniff header
    AllowedValues: ["true", "false"]
    Default: "true"

  # X-Frame-Options
  EnableXFrameOptions:
    Type: String
    Description: Enable X-Frame-Options header
    AllowedValues: ["true", "false"]
    Default: "true"

  XFrameOptionsValue:
    Type: String
    Description: X-Frame-Options value
    AllowedValues: ["DENY", "SAMEORIGIN"]
    Default: "DENY"

  # Referrer-Policy
  EnableReferrerPolicy:
    Type: String
    Description: Enable Referrer-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  ReferrerPolicyValue:
    Type: String
    Description: Referrer-Policy value
    AllowedValues:
      - no-referrer
      - no-referrer-when-downgrade
      - origin
      - origin-when-cross-origin
      - same-origin
      - strict-origin
      - strict-origin-when-cross-origin
      - unsafe-url
    Default: "strict-origin-when-cross-origin"

  # XSS Protection (deprecated, off by default)
  EnableXSSProtection:
    Type: String
    Description: Enable X-XSS-Protection header (deprecated — off by default)
    AllowedValues: ["true", "false"]
    Default: "false"

  # Content-Security-Policy
  EnableCSP:
    Type: String
    Description: Enable Content-Security-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  CSPValue:
    Type: String
    Description: "Content-Security-Policy directive (unique per application)"
    Default: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"

  # OWASP Cross-Origin Headers (CustomHeadersConfig)
  EnableCOOP:
    Type: String
    Description: Enable Cross-Origin-Opener-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  COOPValue:
    Type: String
    Description: Cross-Origin-Opener-Policy value
    AllowedValues: ["same-origin", "same-origin-allow-popups", "unsafe-none"]
    Default: "same-origin"

  EnableCOEP:
    Type: String
    Description: Enable Cross-Origin-Embedder-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  COEPValue:
    Type: String
    Description: Cross-Origin-Embedder-Policy value
    AllowedValues: ["require-corp", "credentialless", "unsafe-none"]
    Default: "require-corp"

  EnableCORP:
    Type: String
    Description: Enable Cross-Origin-Resource-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  CORPValue:
    Type: String
    Description: Cross-Origin-Resource-Policy value
    AllowedValues: ["same-origin", "same-site", "cross-origin"]
    Default: "same-origin"

  EnablePermissionsPolicy:
    Type: String
    Description: Enable Permissions-Policy header
    AllowedValues: ["true", "false"]
    Default: "true"

  PermissionsPolicyValue:
    Type: String
    Description: "Permissions-Policy directive (restricts browser features)"
    Default: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

  # Custom Headers (up to 5)
  CustomHeader1Name:
    Type: String
    Description: "Custom header 1 name (leave empty to skip)"
    Default: ""
  CustomHeader1Value:
    Type: String
    Description: "Custom header 1 value"
    Default: ""
  CustomHeader1Override:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  CustomHeader2Name:
    Type: String
    Description: "Custom header 2 name (leave empty to skip)"
    Default: ""
  CustomHeader2Value:
    Type: String
    Description: "Custom header 2 value"
    Default: ""
  CustomHeader2Override:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  CustomHeader3Name:
    Type: String
    Description: "Custom header 3 name (leave empty to skip)"
    Default: ""
  CustomHeader3Value:
    Type: String
    Description: "Custom header 3 value"
    Default: ""
  CustomHeader3Override:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  CustomHeader4Name:
    Type: String
    Description: "Custom header 4 name (leave empty to skip)"
    Default: ""
  CustomHeader4Value:
    Type: String
    Description: "Custom header 4 value"
    Default: ""
  CustomHeader4Override:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  CustomHeader5Name:
    Type: String
    Description: "Custom header 5 name (leave empty to skip)"
    Default: ""
  CustomHeader5Value:
    Type: String
    Description: "Custom header 5 value"
    Default: ""
  CustomHeader5Override:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

Rules:
  ConfirmCloudFrontLoggingV2ManualSetup:
    Assertions:
      - Assert: !Equals [!Ref CloudFrontLoggingV2ManualSetupRequired, "CONFIRM"]
        AssertDescription: CloudFront logging v2 is not configured by this template and must be enabled manually from the CloudFront console after deployment.
  ValidateCORSConfiguration:
    RuleCondition: !Equals [!Ref EnableCORS, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableResponseHeadersPolicy, "true"]
        AssertDescription: EnableResponseHeadersPolicy must be true when EnableCORS is true.
      - Assert: !Not [!Equals [!Ref CORSAllowedOrigins, ""]]
        AssertDescription: CORSAllowedOrigins must contain at least one approved origin when EnableCORS is true.

Conditions:
  IsProduction: !Or [!Equals [!Ref EnvName, "prod"], !Equals [!Ref EnvName, "prod-a"], !Equals [!Ref EnvName, "prod-b"], !Equals [!Ref EnvName, "prod-c"]]
  CreateBucket1PathPattern: !Equals [!Ref Bucket1UsePathPattern, "true"]
  CreateBucket2: !Not [!Equals [!Ref NumberOfBuckets, 1]]
  CreateBucket3: !Or [!Equals [!Ref NumberOfBuckets, 3], !Equals [!Ref NumberOfBuckets, 4]]
  CreateBucket4: !Equals [!Ref NumberOfBuckets, 4]
  UseCustomDomainConfig: !Equals [!Ref UseCustomDomain, "true"]
  UseWAFConfig: !Not [!Equals [!Ref WAFWebACLArn, ""]]

  # Response Headers Policy
  UseResponseHeadersPolicy: !Equals [!Ref EnableResponseHeadersPolicy, "true"]
  IncludeCORS: !Equals [!Ref EnableCORS, "true"]

  # Security header toggles
  IncludeHSTS: !Equals [!Ref EnableHSTS, "true"]
  IncludeXContentTypeOptions: !Equals [!Ref EnableXContentTypeOptions, "true"]
  IncludeXFrameOptions: !Equals [!Ref EnableXFrameOptions, "true"]
  IncludeReferrerPolicy: !Equals [!Ref EnableReferrerPolicy, "true"]
  IncludeXSSProtection: !Equals [!Ref EnableXSSProtection, "true"]
  IncludeCSP: !Equals [!Ref EnableCSP, "true"]

  # OWASP custom header toggles
  IncludeCOOP: !Equals [!Ref EnableCOOP, "true"]
  IncludeCOEP: !Equals [!Ref EnableCOEP, "true"]
  IncludeCORP: !Equals [!Ref EnableCORP, "true"]
  IncludePermissionsPolicy: !Equals [!Ref EnablePermissionsPolicy, "true"]

  # User-defined custom headers
  HasCustomHeader1: !Not [!Equals [!Ref CustomHeader1Name, ""]]
  HasCustomHeader2: !Not [!Equals [!Ref CustomHeader2Name, ""]]
  HasCustomHeader3: !Not [!Equals [!Ref CustomHeader3Name, ""]]
  HasCustomHeader4: !Not [!Equals [!Ref CustomHeader4Name, ""]]
  HasCustomHeader5: !Not [!Equals [!Ref CustomHeader5Name, ""]]

  HasAnySecurityHeader: !Or
    - !Condition IncludeHSTS
    - !Condition IncludeXContentTypeOptions
    - !Condition IncludeXFrameOptions
    - !Condition IncludeReferrerPolicy
    - !Condition IncludeXSSProtection
    - !Condition IncludeCSP

  HasAnyCustomHeader: !Or
    - !Condition IncludeCOOP
    - !Condition IncludeCOEP
    - !Condition IncludeCORP
    - !Condition IncludePermissionsPolicy
    - !Condition HasCustomHeader1
    - !Condition HasCustomHeader2
    - !Condition HasCustomHeader3
    - !Condition HasCustomHeader4
    - !Condition HasCustomHeader5

  # CloudFront Function conditions
  ValidateBucket1FunctionName: !And
    - !Equals [!Ref Bucket1FunctionEnabled, "true"]
    - !Not [!Equals [!Ref Bucket1FunctionName, ""]]
  ValidateBucket2FunctionName: !And
    - !Equals [!Ref Bucket2FunctionEnabled, "true"]
    - !Not [!Equals [!Ref Bucket2FunctionName, ""]]
  ValidateBucket3FunctionName: !And
    - !Equals [!Ref Bucket3FunctionEnabled, "true"]
    - !Not [!Equals [!Ref Bucket3FunctionName, ""]]
  ValidateBucket4FunctionName: !And
    - !Equals [!Ref Bucket4FunctionEnabled, "true"]
    - !Not [!Equals [!Ref Bucket4FunctionName, ""]]

  CreateBucket1Function: !And
    - !Equals [!Ref Bucket1FunctionEnabled, "true"]
    - !Condition ValidateBucket1FunctionName
  CreateBucket2Function: !And
    - !Equals [!Ref Bucket2FunctionEnabled, "true"]
    - !Condition CreateBucket2
    - !Condition ValidateBucket2FunctionName
  CreateBucket3Function: !And
    - !Equals [!Ref Bucket3FunctionEnabled, "true"]
    - !Condition CreateBucket3
    - !Condition ValidateBucket3FunctionName
  CreateBucket4Function: !And
    - !Equals [!Ref Bucket4FunctionEnabled, "true"]
    - !Condition CreateBucket4
    - !Condition ValidateBucket4FunctionName

Resources:
  # ========== Response Headers Policy (merged from v3 separate template) ==========
  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: UseResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Join
          - "-"
          - - !Sub "${AppShortName}-${EnvName}-ResponseHeadersPolicy"
            - !Select [4, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
        Comment: !Sub "Response headers policy for ${AppShortName}-${EnvName}"
        CorsConfig: !If
          - IncludeCORS
          - AccessControlAllowCredentials: false
            AccessControlAllowHeaders:
              Items:
                - "*"
            AccessControlAllowMethods:
              Items:
                - GET
                - HEAD
            AccessControlAllowOrigins:
              Items: !Split [",", !Ref CORSAllowedOrigins]
            AccessControlExposeHeaders:
              Items:
                - ETag
            AccessControlMaxAgeSec: 600
            OriginOverride: true
          - !Ref "AWS::NoValue"
        SecurityHeadersConfig: !If
          - HasAnySecurityHeader
          - StrictTransportSecurity: !If
              - IncludeHSTS
              - AccessControlMaxAgeSec: !Ref HSTSMaxAge
                IncludeSubdomains: !Ref HSTSIncludeSubdomains
                Preload: !Ref HSTSPreload
                Override: true
              - !Ref "AWS::NoValue"
            ContentTypeOptions: !If
              - IncludeXContentTypeOptions
              - Override: true
              - !Ref "AWS::NoValue"
            FrameOptions: !If
              - IncludeXFrameOptions
              - FrameOption: !Ref XFrameOptionsValue
                Override: true
              - !Ref "AWS::NoValue"
            ReferrerPolicy: !If
              - IncludeReferrerPolicy
              - ReferrerPolicy: !Ref ReferrerPolicyValue
                Override: true
              - !Ref "AWS::NoValue"
            XSSProtection: !If
              - IncludeXSSProtection
              - Protection: true
                ModeBlock: true
                Override: true
              - !Ref "AWS::NoValue"
            ContentSecurityPolicy: !If
              - IncludeCSP
              - ContentSecurityPolicy: !Ref CSPValue
                Override: true
              - !Ref "AWS::NoValue"
          - !Ref "AWS::NoValue"
        CustomHeadersConfig: !If
          - HasAnyCustomHeader
          - Items:
              - !If
                - IncludeCOOP
                - Header: Cross-Origin-Opener-Policy
                  Value: !Ref COOPValue
                  Override: true
                - !Ref "AWS::NoValue"
              - !If
                - IncludeCOEP
                - Header: Cross-Origin-Embedder-Policy
                  Value: !Ref COEPValue
                  Override: true
                - !Ref "AWS::NoValue"
              - !If
                - IncludeCORP
                - Header: Cross-Origin-Resource-Policy
                  Value: !Ref CORPValue
                  Override: true
                - !Ref "AWS::NoValue"
              - !If
                - IncludePermissionsPolicy
                - Header: Permissions-Policy
                  Value: !Ref PermissionsPolicyValue
                  Override: true
                - !Ref "AWS::NoValue"
              - !If
                - HasCustomHeader1
                - Header: !Ref CustomHeader1Name
                  Value: !Ref CustomHeader1Value
                  Override: !Ref CustomHeader1Override
                - !Ref "AWS::NoValue"
              - !If
                - HasCustomHeader2
                - Header: !Ref CustomHeader2Name
                  Value: !Ref CustomHeader2Value
                  Override: !Ref CustomHeader2Override
                - !Ref "AWS::NoValue"
              - !If
                - HasCustomHeader3
                - Header: !Ref CustomHeader3Name
                  Value: !Ref CustomHeader3Value
                  Override: !Ref CustomHeader3Override
                - !Ref "AWS::NoValue"
              - !If
                - HasCustomHeader4
                - Header: !Ref CustomHeader4Name
                  Value: !Ref CustomHeader4Value
                  Override: !Ref CustomHeader4Override
                - !Ref "AWS::NoValue"
              - !If
                - HasCustomHeader5
                - Header: !Ref CustomHeader5Name
                  Value: !Ref CustomHeader5Value
                  Override: !Ref CustomHeader5Override
                - !Ref "AWS::NoValue"
          - !Ref "AWS::NoValue"

  # ========== Bucket Policies ==========
  Bucket1Policy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket1Name
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${Bucket1Name}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket1Name}"
              - !Sub "arn:aws:s3:::${Bucket1Name}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket1Name}"
              - !Sub "arn:aws:s3:::${Bucket1Name}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Bucket2Policy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket2
    Properties:
      Bucket: !Ref Bucket2Name
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${Bucket2Name}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket2Name}"
              - !Sub "arn:aws:s3:::${Bucket2Name}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket2Name}"
              - !Sub "arn:aws:s3:::${Bucket2Name}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Bucket3Policy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket3
    Properties:
      Bucket: !Ref Bucket3Name
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${Bucket3Name}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket3Name}"
              - !Sub "arn:aws:s3:::${Bucket3Name}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket3Name}"
              - !Sub "arn:aws:s3:::${Bucket3Name}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Bucket4Policy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket4
    Properties:
      Bucket: !Ref Bucket4Name
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${Bucket4Name}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket4Name}"
              - !Sub "arn:aws:s3:::${Bucket4Name}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${Bucket4Name}"
              - !Sub "arn:aws:s3:::${Bucket4Name}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ========== Origin Access Controls ==========
  CloudFrontOriginAccessControl1:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref Bucket1Name
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
        OriginAccessControlOriginType: "s3"

  CloudFrontOriginAccessControl2:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateBucket2
    Properties:
      OriginAccessControlConfig:
        Name: !Ref Bucket2Name
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
        OriginAccessControlOriginType: "s3"

  CloudFrontOriginAccessControl3:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateBucket3
    Properties:
      OriginAccessControlConfig:
        Name: !Ref Bucket3Name
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
        OriginAccessControlOriginType: "s3"

  CloudFrontOriginAccessControl4:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateBucket4
    Properties:
      OriginAccessControlConfig:
        Name: !Ref Bucket4Name
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
        OriginAccessControlOriginType: "s3"

  # ========== Cache Policy ==========
  CloudFrontCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Join ["-", [!Sub "${AppShortName}-${EnvName}-CacheDisabledPolicy", !Select [4, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]]]
        Comment: "Custom policy with caching disabled"
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: "none"
          HeadersConfig:
            HeaderBehavior: "none"
          QueryStringsConfig:
            QueryStringBehavior: "none"

  # ========== CloudFront Functions ==========
  Bucket1CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateBucket1Function
    Properties:
      Name: !Ref Bucket1FunctionName
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "Function for ${Bucket1Name} origin - update code via console"
        Runtime: "cloudfront-js-2.0"
      FunctionCode: |
        function handler(event) {
          return event.request;
        }

  Bucket2CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateBucket2Function
    Properties:
      Name: !Ref Bucket2FunctionName
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "Function for ${Bucket2Name} origin - update code via console"
        Runtime: "cloudfront-js-2.0"
      FunctionCode: |
        function handler(event) {
          return event.request;
        }

  Bucket3CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateBucket3Function
    Properties:
      Name: !Ref Bucket3FunctionName
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "Function for ${Bucket3Name} origin - update code via console"
        Runtime: "cloudfront-js-2.0"
      FunctionCode: |
        function handler(event) {
          return event.request;
        }

  Bucket4CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateBucket4Function
    Properties:
      Name: !Ref Bucket4FunctionName
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "Function for ${Bucket4Name} origin - update code via console"
        Runtime: "cloudfront-js-2.0"
      FunctionCode: |
        function handler(event) {
          return event.request;
        }

  # ========== CloudFront Distribution ==========
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: !Ref DefaultPage
        WebACLId: !If
          - UseWAFConfig
          - !Ref WAFWebACLArn
          - !Ref "AWS::NoValue"
        Origins:
          - Id: !Ref Bucket1Name
            DomainName: !Sub "${Bucket1Name}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl1
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - CreateBucket2
            - Id: !Ref Bucket2Name
              DomainName: !Sub "${Bucket2Name}.s3.${AWS::Region}.amazonaws.com"
              OriginAccessControlId: !Ref CloudFrontOriginAccessControl2
              S3OriginConfig:
                OriginAccessIdentity: ""
            - !Ref "AWS::NoValue"
          - !If
            - CreateBucket3
            - Id: !Ref Bucket3Name
              DomainName: !Sub "${Bucket3Name}.s3.${AWS::Region}.amazonaws.com"
              OriginAccessControlId: !Ref CloudFrontOriginAccessControl3
              S3OriginConfig:
                OriginAccessIdentity: ""
            - !Ref "AWS::NoValue"
          - !If
            - CreateBucket4
            - Id: !Ref Bucket4Name
              DomainName: !Sub "${Bucket4Name}.s3.${AWS::Region}.amazonaws.com"
              OriginAccessControlId: !Ref CloudFrontOriginAccessControl4
              S3OriginConfig:
                OriginAccessIdentity: ""
            - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: !Ref Bucket1Name
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref CloudFrontCachePolicy
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          FunctionAssociations: !If
            - CreateBucket1Function
            - - EventType: viewer-request
                FunctionARN: !GetAtt Bucket1CloudFrontFunction.FunctionARN
            - []
          ResponseHeadersPolicyId: !If
            - UseResponseHeadersPolicy
            - !Ref ResponseHeadersPolicy
            - !Ref "AWS::NoValue"
        CacheBehaviors:
          - !If
            - CreateBucket1PathPattern
            - PathPattern: !Ref Bucket1PathPattern
              TargetOriginId: !Ref Bucket1Name
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: !Ref CloudFrontCachePolicy
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              FunctionAssociations: !If
                - CreateBucket1Function
                - - EventType: viewer-request
                    FunctionARN: !GetAtt Bucket1CloudFrontFunction.FunctionARN
                - []
              ResponseHeadersPolicyId: !If
                - UseResponseHeadersPolicy
                - !Ref ResponseHeadersPolicy
                - !Ref "AWS::NoValue"
            - !Ref "AWS::NoValue"
          - !If
            - CreateBucket2
            - PathPattern: !Ref Bucket2PathPattern
              TargetOriginId: !Ref Bucket2Name
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: !Ref CloudFrontCachePolicy
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              FunctionAssociations: !If
                - CreateBucket2Function
                - - EventType: viewer-request
                    FunctionARN: !GetAtt Bucket2CloudFrontFunction.FunctionARN
                - []
              ResponseHeadersPolicyId: !If
                - UseResponseHeadersPolicy
                - !Ref ResponseHeadersPolicy
                - !Ref "AWS::NoValue"
            - !Ref "AWS::NoValue"
          - !If
            - CreateBucket3
            - PathPattern: !Ref Bucket3PathPattern
              TargetOriginId: !Ref Bucket3Name
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: !Ref CloudFrontCachePolicy
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              FunctionAssociations: !If
                - CreateBucket3Function
                - - EventType: viewer-request
                    FunctionARN: !GetAtt Bucket3CloudFrontFunction.FunctionARN
                - []
              ResponseHeadersPolicyId: !If
                - UseResponseHeadersPolicy
                - !Ref ResponseHeadersPolicy
                - !Ref "AWS::NoValue"
            - !Ref "AWS::NoValue"
          - !If
            - CreateBucket4
            - PathPattern: !Ref Bucket4PathPattern
              TargetOriginId: !Ref Bucket4Name
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: !Ref CloudFrontCachePolicy
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              FunctionAssociations: !If
                - CreateBucket4Function
                - - EventType: viewer-request
                    FunctionARN: !GetAtt Bucket4CloudFrontFunction.FunctionARN
                - []
              ResponseHeadersPolicyId: !If
                - UseResponseHeadersPolicy
                - !Ref ResponseHeadersPolicy
                - !Ref "AWS::NoValue"
            - !Ref "AWS::NoValue"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Sub "/${DefaultPage}"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Sub "/${DefaultPage}"
            ErrorCachingMinTTL: 10
        ViewerCertificate: !If
          - UseCustomDomainConfig
          - AcmCertificateArn: !Ref CloudFrontCertArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: !Ref CloudFrontSecurityPolicy
          - CloudFrontDefaultCertificate: true
            MinimumProtocolVersion: !Ref CloudFrontSecurityPolicy
        Aliases: !If
          - UseCustomDomainConfig
          - - !Ref CustomDomainName
          - !Ref "AWS::NoValue"
        PriceClass: PriceClass_200
        Restrictions:
          GeoRestriction:
            RestrictionType: whitelist
            Locations: !Split
              - ","
              - !Ref GeoLocation
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAInternet-v5

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName

  ResponseHeadersPolicyId:
    Condition: UseResponseHeadersPolicy
    Description: CloudFront Response Headers Policy ID
    Value: !Ref ResponseHeadersPolicy
