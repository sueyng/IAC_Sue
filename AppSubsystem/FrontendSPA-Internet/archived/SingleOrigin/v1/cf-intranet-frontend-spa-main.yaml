AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy CloudFront distributions

Parameters:
  NumberOfDistributions:
    Type: Number
    Default: 1
    AllowedValues: [1, 2, 3, 4]
    Description: Number of CloudFront distributions to create

  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b

  DefaultPage:
    Type: String
    Description: Default or home page of the website
    Default: index.html

  # Distribution 1 Parameters
  CloudFrontS3BucketName1:
    Type: String
    Description: Name of the first S3 bucket for the first distribution

  CustomDomainName1:
    Type: String
    Description: Custom domain name for the first distribution

  CloudFrontCertArn1:
    Type: String
    Description: ACM certificate ARN for the first distribution

  # Distribution 2 Parameters
  CloudFrontS3BucketName2:
    Type: String
    Description: Name of the second S3 bucket
    Default: ""

  CustomDomainName2:
    Type: String
    Description: Custom domain name for the second distribution

  CloudFrontCertArn2:
    Type: String
    Description: ACM certificate ARN for the second distribution
    Default: ""

  # Distribution 3 Parameters
  CloudFrontS3BucketName3:
    Type: String
    Description: Name of the third S3 bucket
    Default: ""

  CustomDomainName3:
    Type: String
    Description: Custom domain name for the third distribution

  CloudFrontCertArn3:
    Type: String
    Description: ACM certificate ARN for the third distribution
    Default: ""

  # Distribution 4 Parameters
  CloudFrontS3BucketName4:
    Type: String
    Description: Name of the fourth S3 bucket
    Default: ""

  CustomDomainName4:
    Type: String
    Description: Custom domain name for the fourth distribution

  CloudFrontCertArn4:
    Type: String
    Description: ACM certificate ARN for the fourth distribution
    Default: ""

 # GeoLocation Parameters
  GeoLocation:
    Type: String
    Description: geo-location restriction code (e.g., VN)
    Default: ""

Conditions:
  CreateSecondDistribution: !Not [!Equals [!Ref NumberOfDistributions, 1]]
  CreateThirdDistribution: !Or [!Equals [!Ref NumberOfDistributions, 3], !Equals [!Ref NumberOfDistributions, 4]]
  CreateFourthDistribution: !Equals [!Ref NumberOfDistributions, 4]

Resources:
  FrontEndSPAStack1:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-cloudfront.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        S3BucketName: !Ref CloudFrontS3BucketName1
        DefaultPage: !Ref DefaultPage
        CustomDomainName: !Ref CustomDomainName1
        CloudFrontCertArn: !Ref CloudFrontCertArn1
        GeoLocation: !Ref GeoLocation

  FrontEndSPAStack2:
    Type: AWS::CloudFormation::Stack
    Condition: CreateSecondDistribution
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-cloudfront.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        S3BucketName: !Ref CloudFrontS3BucketName2
        DefaultPage: !Ref DefaultPage
        CustomDomainName: !Ref CustomDomainName2
        CloudFrontCertArn: !Ref CloudFrontCertArn2
        GeoLocation: !Ref GeoLocation

  FrontEndSPAStack3:
    Type: AWS::CloudFormation::Stack
    Condition: CreateThirdDistribution
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-cloudfront.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        S3BucketName: !Ref CloudFrontS3BucketName3
        DefaultPage: !Ref DefaultPage
        CustomDomainName: !Ref CustomDomainName3
        CloudFrontCertArn: !Ref CloudFrontCertArn3
        GeoLocation: !Ref GeoLocation

  FrontEndSPAStack4:
    Type: AWS::CloudFormation::Stack
    Condition: CreateFourthDistribution
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-cloudfront.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        S3BucketName: !Ref CloudFrontS3BucketName4
        DefaultPage: !Ref DefaultPage
        CustomDomainName: !Ref CustomDomainName4
        CloudFrontCertArn: !Ref CloudFrontCertArn4
        GeoLocation: !Ref GeoLocation
