AWSTemplateFormatVersion: '2010-09-09'
Description: "Template for Data Loading with Optional Scheduled or S3 Event Trigger"

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  BatchJobName:
    Description: "Unique identifier for this batch job (e.g., resident-master)"
    Type: String
    AllowedPattern: "[a-zA-Z0-9-]+"
    ConstraintDescription: "Can only contain letters, numbers, and hyphens"

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b

  TriggerType:
    Type: String
    Description: "Choose whether to trigger batch job by schedule or S3 event"
    AllowedValues:
      - Schedule
      - S3Event
    Default: Schedule

  ScheduleExpression:
    Type: String
    Description: "Schedule expression (e.g., cron(0 12 * * ? *) or rate(1 day)). Required if TriggerType is Schedule"
    Default: "cron(0 12 * * ? *)"

  UseExistingS3:
    Type: String
    Default: false
    AllowedValues: 
      - true
      - false
    Description: "Set to true if using existing S3 bucket"
    
  ExistingBucketName:
    Type: String
    Description: "Name of the existing S3 bucket (required if UseExistingS3 is true)"
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "Must be a valid S3 bucket name or empty"

  DatabaseSecretName:
    Type: String
    Description: Name or ARN of existing RDS secret in Secrets Manager
    Default: ""

  VpcId:
    Type: String
    Description: VpcId of your existing Virtual Private Cloud (VPC)

  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Comma-delimited list of VPC Subnet IDs for application subnets

  ECRImageUri:
    Type: String
    Description: Full URI of the ECR image (e.g., {account}.dkr.ecr.{region}.amazonaws.com/{repo}:{tag})

  BatchJobVCPU:
    Type: Number
    Default: 2
    Description: Number of vCPUs for Batch job (0.25-16)
    MinValue: 0.25
    MaxValue: 16

  BatchJobMemory:
    Type: Number
    Default: 4096
    Description: Memory (MB) for Batch job (512-120000)
    MinValue: 512
    MaxValue: 120000

  LogRetention:
    Type: Number
    Default: 365
    Description: Number of days to retain logs

  InputPrefix:
    Type: String
    Description: "S3 prefix path for input files (e.g., input/, data/incoming/)"
    Default: "input/"
    ConstraintDescription: "Must be a valid S3 prefix ending with a forward slash (/)"

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VPCSubnetCidrDBAZ1:
    Type: String
    Description: AZ1 App Subnet
    Default: ""
  VPCSubnetCidrDBAZ2:
    Type: String
    Description: AZ2 App Subnet
    Default: ""
  VPCSubnetCidrDBAZ3:
    Type: String
    Description: AZ3 App Subnet
    Default: ""
  ProdDBPort:
    Type: String
    Default: 53341
    NoEcho: true
  NProdDBPort:
    Type: String
    Default: 53331
    NoEcho: true
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""
  SNSTopicName:
    Type: String
    Description: "Name of the SNS topic for notifications (without the ARN)"
    Default: ""
    
Conditions:
  IsProduction: !Or [!Equals [!Ref EnvName, "prod"], !Equals [!Ref EnvName, "prod-a"], !Equals [!Ref EnvName, "prod-b"]]
  HasDatabaseSecret: !Not [!Equals [!Ref DatabaseSecretName, ""]]
  UseS3: !Equals [!Ref UseExistingS3, 'true']
  IsScheduleTrigger: !Equals [!Ref TriggerType, 'Schedule']
  IsS3EventTrigger: !And 
    - !Equals [!Ref TriggerType, 'S3Event']
    - !Equals [!Ref UseExistingS3, 'true']
  HasVPCSubnetCidrDBAZ3: !Not [!Equals [!Ref VPCSubnetCidrDBAZ3, '']]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasSNSTopic: !Not [!Equals [!Ref SNSTopicName, ""]]

Rules:
  ScheduleExpressionRequired:
    RuleCondition: !Equals [!Ref TriggerType, 'Schedule']
    Assertions:
      - Assert: !Not [!Equals [!Ref ScheduleExpression, '']]
        AssertDescription: "ScheduleExpression is required when TriggerType is Schedule"
  
  ExistingBucketNameRequired:
    RuleCondition: !Equals [!Ref UseExistingS3, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingBucketName, '']]
        AssertDescription: "ExistingBucketName is required when UseExistingS3 is set to true"
  
  S3EventTriggerValidation:
    RuleCondition: !Equals [!Ref TriggerType, 'S3Event']
    Assertions:
      - Assert: !Equals [!Ref UseExistingS3, 'true']
        AssertDescription: "S3Event trigger type requires UseExistingS3 to be true"

Resources:
  # CloudWatch Log Group
  DataLoadingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RetentionInDays: !Ref LogRetention
      LogGroupName: !Sub /aws/batch/${AppShortName}-${EnvName}-${BatchJobName}
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2

  # S3 Bucket Policy - Only created if UseExistingS3 is true
  DataLoadingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Bucket: !Ref ExistingBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBatchJobAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt BatchJobRole.Arn
            Action: 
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: 
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource: 
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Batch Security Group
  BatchJobSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Security group for Batch Compute Environment
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-${BatchJobName}
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-${BatchJobName}
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ1
          Description: Allow DB AZ1 Subnet
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ2
          Description: Allow DB AZ2 Subnet
        - !If
          - HasVPCSubnetCidrDBAZ3
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ3
            Description: Allow DB Subnet AZ3
          - !Ref "AWS::NoValue"
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"

  # IAM Roles and Policies
  BatchJobRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchJobPolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2

  BatchJobPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - UseS3
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub arn:aws:s3:::${ExistingBucketName}
                - !Sub arn:aws:s3:::${ExistingBucketName}/*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:aws:s3:::sftp*
              - !Sub arn:aws:s3:::sftp*/*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*/*  
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          - !If 
            - HasDatabaseSecret
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*

  BatchExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-execution-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchExecutionPolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2

  BatchExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-execution-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${AppShortName}-${EnvName}-${BatchJobName}:*
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Sub arn:aws:ecr:${AWS::Region}:*:repository/*
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - !If
            - UseS3
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:PutObject
                - s3:DeleteObject                
              Resource:
                - !Sub arn:aws:s3:::${ExistingBucketName}
                - !Sub arn:aws:s3:::${ExistingBucketName}/*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:aws:s3:::sftp*
              - !Sub arn:aws:s3:::sftp*/* 
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*/* 
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          - !If 
            - HasDatabaseSecret
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: 
                !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}*
                !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-*
            - !Ref AWS::NoValue

  # Batch Components
  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ComputeEnvironmentName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}
      Type: MANAGED
      ServiceRole: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/batch.amazonaws.com/AWSServiceRoleForBatch
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        SecurityGroupIds:
          - !Ref BatchJobSecurityGroup
        Subnets: !Ref AppSubnetIds
      State: ENABLED
      Tags:
        IaCVersion: AppSubsystem-BatchJob-v2

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      JobQueueName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-queue
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      Tags:
        IaCVersion: AppSubsystem-BatchJob-v2

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      JobDefinitionName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-job
      Type: container
      PlatformCapabilities:
        - FARGATE
      Tags:
        IaCVersion: AppSubsystem-BatchJob-v2
      ContainerProperties:
        Image: !Ref ECRImageUri
        ReadonlyRootFilesystem: true
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        FargatePlatformConfiguration:
          PlatformVersion: 1.4.0
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref BatchJobVCPU
          - Type: MEMORY
            Value: !Ref BatchJobMemory
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref DataLoadingLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: batch
        Environment:
          - !If
            - UseS3
            - Name: S3_BUCKET_NAME
              Value: !Ref ExistingBucketName
            - !Ref AWS::NoValue
          - !If
            - UseS3
            - Name: S3_INPUT_PREFIX
              Value: !Ref InputPrefix
            - !Ref AWS::NoValue
          - Name: ENVIRONMENT
            Value: !Ref EnvName
          - !If
            - HasSNSTopic
            - Name: SNS_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SNSTopicName}
            - !Ref AWS::NoValue
        Secrets: !If
          - HasDatabaseSecret
          - - Name: DB_SECRET_NAME
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}
          - !Ref AWS::NoValue
          
  # EventBridge Scheduler
  BatchSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: IsScheduleTrigger
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-schedule
      Description: "Triggers Batch job on schedule using EventBridge Scheduler"
      FlexibleTimeWindow: 
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:batch:submitJob
        RoleArn: !GetAtt EventBridgeRole.Arn
        Input: !Sub |
          {
            "JobName": "${AppShortName}-${EnvName}-${BatchJobName}-job",
            "JobDefinition": "${BatchJobDefinition}",
            "JobQueue": "${BatchJobQueue}"
          }

  # S3 Event Rule (Keeping this for S3 event triggers)
  S3EventRule:
    Type: AWS::Events::Rule
    Condition: IsS3EventTrigger
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-s3event
      Description: "Triggers Batch job when new file arrives in S3"
      State: ENABLED
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2
      EventPattern:
        detail-type: 
          - "Object Created"
        source: 
          - aws.s3
        detail:
          bucket:
            name:
              - !Ref ExistingBucketName
          object:
            key:
              - prefix: !Ref InputPrefix
      Targets:
        - Id: BatchJobTarget
          Arn: !Ref BatchJobQueue
          RoleArn: !GetAtt EventBridgeRole.Arn
          BatchParameters:
            JobDefinition: !Ref BatchJobDefinition
            JobName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-job
            RetryStrategy:
              Attempts: 3

  # EventBridge IAM Role and Policy
  EventBridgeRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-events-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
                - scheduler.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventBridgePolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v2

  EventBridgePolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-events-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - batch:SubmitJob
              - batch:TagResource
              - batch:DescribeJobDefinitions
              - batch:DescribeJobQueues
              - scheduler:CreateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
              - scheduler:UpdateSchedule
            Resource:
              - !Ref BatchJobDefinition
              - !Ref BatchJobQueue
              - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${AppShortName}-${EnvName}-${BatchJobName}*