AWSTemplateFormatVersion: '2010-09-09'
Description: "Template for Data Loading with Optional Scheduled or S3 Event Trigger - Version 7"

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  BatchJobName:
    Description: "Unique identifier for this batch job (e.g., resident-master)"
    Type: String
    AllowedPattern: "[a-zA-Z0-9-]+"
    ConstraintDescription: "Can only contain letters, numbers, and hyphens"

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  TriggerType:
    Type: String
    Description: "Choose whether to trigger batch job by schedule or S3 event"
    AllowedValues:
      - Schedule
      - S3Event
    Default: Schedule

  ScheduleExpression:
    Type: String
    Description: "Schedule expression (e.g., cron(0 12 * * ? *) or rate(1 day)). Required if TriggerType is Schedule"
    Default: "cron(0 12 * * ? *)"

  UseExistingS3:
    Type: String
    Default: false
    AllowedValues: 
      - true
      - false
    Description: "Set to true if using existing S3 bucket"
    
  ExistingBucketName:
    Type: String
    Description: "Name of the existing S3 bucket (required if UseExistingS3 is true)"
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "Must be a valid S3 bucket name or empty"

  DatabaseSecretName:
    Type: String
    Description: Name or ARN of existing RDS secret in Secrets Manager
    Default: ""

  AdditionalSecret2Name:
    Type: String
    Description: "Name of the second secret (optional)"
    Default: ""

  AdditionalSecret2EnvVarName:
    Type: String
    Description: "Environment variable name for Additional Secret 2 (e.g., API_KEY_SECRET)"
    Default: "ADDITIONAL_SECRET_2"

  AdditionalSecret3Name:
    Type: String
    Description: "Name of the third secret (optional)"
    Default: ""

  AdditionalSecret3EnvVarName:
    Type: String
    Description: "Environment variable name for Additional Secret 3 (e.g., EXTERNAL_API_SECRET)"
    Default: "ADDITIONAL_SECRET_3"

  AdditionalSecret4Name:
    Type: String
    Description: "Name of the fourth secret (optional)"
    Default: ""

  AdditionalSecret4EnvVarName:
    Type: String
    Description: "Environment variable name for Additional Secret 4 (e.g., STORAGE_SECRET)"
    Default: "ADDITIONAL_SECRET_4"

  AdditionalSecret5Name:
    Type: String
    Description: "Name of the fifth secret (optional)"
    Default: ""

  AdditionalSecret5EnvVarName:
    Type: String
    Description: "Environment variable name for Additional Secret 5 (e.g., AUTH_TOKEN_SECRET)"
    Default: "ADDITIONAL_SECRET_5"

  VpcId:
    Type: String
    Description: VpcId of your existing Virtual Private Cloud (VPC)

  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Comma-delimited list of VPC Subnet IDs for application subnets

  ECRImageUri:
    Type: String
    Description: Full URI of the ECR image (e.g., {account}.dkr.ecr.{region}.amazonaws.com/{repo}:{tag})

  BatchJobVCPU:
    Type: Number
    Default: 2
    Description: Number of vCPUs for Batch job (0.25-16)
    MinValue: 0.25
    MaxValue: 16

  BatchJobMemory:
    Type: Number
    Default: 4096
    Description: Memory (MB) for Batch job (512-120000)
    MinValue: 512
    MaxValue: 120000

  LogRetention:
    Type: Number
    Default: 365
    Description: Number of days to retain logs

  InputPrefix:
    Type: String
    Description: "S3 prefix path for input files (e.g., input/, data/incoming/)"
    Default: ""
    ConstraintDescription: "Must be a valid S3 prefix ending with a forward slash (/)"

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  VPCSubnetCidrDBAZ1:
    Type: String
    Description: AZ1 App Subnet
    Default: ""
  VPCSubnetCidrDBAZ2:
    Type: String
    Description: AZ2 App Subnet
    Default: ""
  VPCSubnetCidrDBAZ3:
    Type: String
    Description: AZ3 App Subnet
    Default: ""
  ProdDBPort:
    Type: String
    Default: 53341
    NoEcho: true
  NProdDBPort:
    Type: String
    Default: 53331
    NoEcho: true
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  ExternalServicesPrefixListId:
    Description: Prefix List ID for external services (CAG, ESB, etc.)
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""

  # -----------------------------------------------------------
  # HCC Forward Proxy Parameters
  # -----------------------------------------------------------
  EnableBCSProxy:
    Description: "Set to true to enable egress rules for BCS Forward Proxy"
    Type: String
    AllowedValues:
      - true
      - false
    Default: false

  HCCProxyPort:
    Description: "HCC Forward Proxy port for external communication"
    Type: Number
    Default: 4000

  ProdHCCProxyCidr1:
    Description: "Production HCC Forward Proxy Subnet CIDR 1"
    Type: String
    Default: ""

  ProdHCCProxyCidr2:
    Description: "Production HCC Forward Proxy Subnet CIDR 2"
    Type: String
    Default: ""

  NprdHCCProxyCidr1:
    Description: "Non-Production HCC Forward Proxy Subnet CIDR 1"
    Type: String
    Default: ""

  NprdHCCProxyCidr2:
    Description: "Non-Production HCC Forward Proxy Subnet CIDR 2"
    Type: String
    Default: ""

  # -----------------------------------------------------------
  # ElastiCache Redis Parameters
  # -----------------------------------------------------------
  ElastiCacheSubnetAZ1:
    Description: "Optional dedicated ElastiCache subnet CIDR AZ1 (if ElastiCache sits in different subnets from VPC CIDRs)"
    Type: String
    Default: ""

  ElastiCacheSubnetAZ2:
    Description: "Optional dedicated ElastiCache subnet CIDR AZ2 (if ElastiCache sits in different subnets from VPC CIDRs)"
    Type: String
    Default: ""

  ElastiCacheSubnetAZ3:
    Description: "Optional dedicated ElastiCache subnet CIDR AZ3 (if ElastiCache sits in different subnets from VPC CIDRs)"
    Type: String
    Default: ""

  SNSTopicName:
    Type: String
    Description: "Name of the SNS topic for notifications (without the ARN)"
    Default: ""

  SQSQueueArns:
    Type: String
    Description: "Optional comma-delimited SQS queue ARN(s) that the batch job container can send messages to"
    Default: ""

  SQSCustomerManagedKmsKeyArns:
    Type: String
    Description: "Optional comma-delimited customer-managed KMS key ARN(s) for encrypted SQS queues. Leave empty when the queue uses AWS managed key alias/aws/sqs."
    Default: ""

  EnableInputTransformation:
    Type: String
    Description: "Enable input transformation for S3 events to pass bucket name and object key as environment variables"
    AllowedValues:
      - true
      - false
    Default: false

  EnvVarConnectionStringSecretName:
    Description: "Environment Variable ECS Connection String Secret Name"
    Type: String
    Default: ""
  
  EnvVar1Name:
    Description: "Environment Variable #1 Name"
    Type: String
    Default: ""

  EnvVar1Value:
    Description: "Environment Variable #1 Value"
    Type: String
    Default: ""

  EnvVar2Name:
    Description: "Environment Variable #2 Name"
    Type: String
    Default: ""

  EnvVar2Value:
    Description: "Environment Variable #2 Value"
    Type: String
    Default: ""

  EnvVar3Name:
    Description: "Environment Variable #3 Name"
    Type: String
    Default: ""

  EnvVar3Value:
    Description: "Environment Variable #3 Value"
    Type: String
    Default: ""

  # -----------------------------------------------------------
  # ECS.20 - Non-root User Configuration
  # -----------------------------------------------------------
  ContainerUser:
    Type: String
    Description: "Non-root user and group (UID:GID) for the container. Must not be root (0 or 0:0). Remediates ECS.20."
    Default: "1000"
    AllowedPattern: "^(?!0$)(?!0:0$)[0-9]+(:[0-9]+)?$"
    ConstraintDescription: "Must be a non-root UID (e.g. 1000) or UID:GID pair (e.g. 1000:1000). Root (0 or 0:0) is not allowed."
    
Conditions:
  IsProduction: !Or [!Equals [!Ref EnvName, "prod"], !Equals [!Ref EnvName, "prod-a"], !Equals [!Ref EnvName, "prod-b"], !Equals [!Ref EnvName, "prod-c"]]
  HasDatabaseSecret: !Not [!Equals [!Ref DatabaseSecretName, ""]]
  HasAdditionalSecret2: !Not [!Equals [!Ref AdditionalSecret2Name, ""]]
  HasAdditionalSecret3: !Not [!Equals [!Ref AdditionalSecret3Name, ""]]
  HasAdditionalSecret4: !Not [!Equals [!Ref AdditionalSecret4Name, ""]]
  HasAdditionalSecret5: !Not [!Equals [!Ref AdditionalSecret5Name, ""]]
  HasAnySecret: !Or
    - !Condition HasDatabaseSecret
    - !Condition HasAdditionalSecret2
    - !Condition HasAdditionalSecret3
    - !Condition HasAdditionalSecret4
    - !Condition HasAdditionalSecret5
  UseS3: !Equals [!Ref UseExistingS3, 'true']
  IsScheduleTrigger: !Equals [!Ref TriggerType, 'Schedule']
  IsS3EventTrigger: !And 
    - !Equals [!Ref TriggerType, 'S3Event']
    - !Equals [!Ref UseExistingS3, 'true']
  HasVPCSubnetCidrDBAZ3: !Not [!Equals [!Ref VPCSubnetCidrDBAZ3, '']]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasExternalServicesPrefixListId: !Not [!Equals [!Ref ExternalServicesPrefixListId, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, ""]]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, ""]]
  HasSNSTopic: !Not [!Equals [!Ref SNSTopicName, ""]]
  HasSQSQueueArns: !Not [!Equals [!Ref SQSQueueArns, ""]]
  HasSQSCustomerManagedKmsKeyArns: !Not [!Equals [!Ref SQSCustomerManagedKmsKeyArns, ""]]
  HasInputPrefix: !Not [!Equals [!Ref InputPrefix, ""]]
  IsInputTransformationEnabled: !Equals [!Ref EnableInputTransformation, 'true']
  HasEnvVar1Name: !Not [!Equals [!Ref EnvVar1Name, '']]
  HasEnvVar2Name: !Not [!Equals [!Ref EnvVar2Name, '']]
  HasEnvVar3Name: !Not [!Equals [!Ref EnvVar3Name, '']]
  HasEnvVarConnectionStringSecretName: !Not [!Equals [!Ref EnvVarConnectionStringSecretName, '']]
  # HCC Forward Proxy conditions
  EnableBCSProxy: !Equals [!Ref EnableBCSProxy, 'true']
  HasProdHCCProxyCidr1: !Not [!Equals [!Ref ProdHCCProxyCidr1, ""]]
  HasProdHCCProxyCidr2: !Not [!Equals [!Ref ProdHCCProxyCidr2, ""]]
  HasNprdHCCProxyCidr1: !Not [!Equals [!Ref NprdHCCProxyCidr1, ""]]
  HasNprdHCCProxyCidr2: !Not [!Equals [!Ref NprdHCCProxyCidr2, ""]]
  HasHCCProxyCidr1: !And
    - !Condition EnableBCSProxy
    - !Or
      - !And [!Condition IsProduction, !Condition HasProdHCCProxyCidr1]
      - !And [!Not [!Condition IsProduction], !Condition HasNprdHCCProxyCidr1]
  HasHCCProxyCidr2: !And
    - !Condition EnableBCSProxy
    - !Or
      - !And [!Condition IsProduction, !Condition HasProdHCCProxyCidr2]
      - !And [!Not [!Condition IsProduction], !Condition HasNprdHCCProxyCidr2]
  # ElastiCache Redis conditions
  HasElastiCacheSubnetAZ1: !Not [!Equals [!Ref ElastiCacheSubnetAZ1, ""]]
  HasElastiCacheSubnetAZ2: !Not [!Equals [!Ref ElastiCacheSubnetAZ2, ""]]
  HasElastiCacheSubnetAZ3: !Not [!Equals [!Ref ElastiCacheSubnetAZ3, ""]]

Rules:
  ScheduleExpressionRequired:
    RuleCondition: !Equals [!Ref TriggerType, 'Schedule']
    Assertions:
      - Assert: !Not [!Equals [!Ref ScheduleExpression, '']]
        AssertDescription: "ScheduleExpression is required when TriggerType is Schedule"
  
  ExistingBucketNameRequired:
    RuleCondition: !Equals [!Ref UseExistingS3, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingBucketName, '']]
        AssertDescription: "ExistingBucketName is required when UseExistingS3 is set to true"
  
  S3EventTriggerValidation:
    RuleCondition: !Equals [!Ref TriggerType, 'S3Event']
    Assertions:
      - Assert: !Equals [!Ref UseExistingS3, 'true']
        AssertDescription: "S3Event trigger type requires UseExistingS3 to be true"

Resources:

  # CloudWatch Log Group
  DataLoadingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RetentionInDays: !Ref LogRetention
      LogGroupName: !Sub /aws/batch/${AppShortName}-${EnvName}-${BatchJobName}
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v7

  # S3 Bucket Policy - Only created if UseExistingS3 is true
  DataLoadingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Bucket: !Ref ExistingBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBatchJobAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt BatchJobRole.Arn
            Action: 
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: 
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource: 
              - !Sub arn:aws:s3:::${ExistingBucketName}
              - !Sub arn:aws:s3:::${ExistingBucketName}/*
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Batch Security Group
  BatchJobSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupDescription: Security group for Batch Compute Environment
      GroupName: !Sub ${AppShortName}-${EnvName}-sg-${BatchJobName}
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-sg-${BatchJobName}
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v7
      SecurityGroupEgress:
        # -------------------------------------------------------
        # HTTPS (port 443) - VPC CIDRs
        # -------------------------------------------------------
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # -------------------------------------------------------
        # Database port - DB Subnets
        # -------------------------------------------------------
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ1
          Description: Allow DB AZ1 Subnet
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ2
          Description: Allow DB AZ2 Subnet
        - !If
          - HasVPCSubnetCidrDBAZ3
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ3
            Description: Allow DB Subnet AZ3
          - !Ref "AWS::NoValue"
        # -------------------------------------------------------
        # S3 VPC Endpoint and HCC VPCE
        # -------------------------------------------------------
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasExternalServicesPrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref ExternalServicesPrefixListId
            Description: Allow HTTPS to external services (CAG, ESB, etc.) via prefix list
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"
        # -------------------------------------------------------
        # HCC Forward Proxy (port 4000 default) - prod/nprd split CIDRs
        # -------------------------------------------------------
        - !If
          - HasHCCProxyCidr1
          - IpProtocol: tcp
            FromPort: !Ref HCCProxyPort
            ToPort: !Ref HCCProxyPort
            CidrIp: !If [IsProduction, !Ref ProdHCCProxyCidr1, !Ref NprdHCCProxyCidr1]
            Description: HCC Forward Proxy Subnet 1
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCProxyCidr2
          - IpProtocol: tcp
            FromPort: !Ref HCCProxyPort
            ToPort: !Ref HCCProxyPort
            CidrIp: !If [IsProduction, !Ref ProdHCCProxyCidr2, !Ref NprdHCCProxyCidr2]
            Description: HCC Forward Proxy Subnet 2
          - !Ref "AWS::NoValue"
        # -------------------------------------------------------
        # SES SMTP (port 587) - VPC CIDRs
        # -------------------------------------------------------
        - IpProtocol: tcp
          FromPort: 587
          ToPort: 587
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 587
            ToPort: 587
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"
        # -------------------------------------------------------
        # ElastiCache Redis (port 6379-6380) - base VPC CIDRs
        # -------------------------------------------------------
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          CidrIp: !Ref VpcCidr1
          Description: Allow ElastiCache Redis VPC CIDR 1
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref VpcCidr2
            Description: Allow ElastiCache Redis VPC CIDR 2
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref VpcCidr3
            Description: Allow ElastiCache Redis VPC CIDR 3
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref VpcCidr4
            Description: Allow ElastiCache Redis VPC CIDR 4
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref VpcCidr5
            Description: Allow ElastiCache Redis VPC CIDR 5
          - !Ref "AWS::NoValue"
        # ElastiCache Redis - optional dedicated cache subnet CIDRs
        - !If
          - HasElastiCacheSubnetAZ1
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref ElastiCacheSubnetAZ1
            Description: Allow ElastiCache Dedicated Subnet AZ1
          - !Ref "AWS::NoValue"
        - !If
          - HasElastiCacheSubnetAZ2
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref ElastiCacheSubnetAZ2
            Description: Allow ElastiCache Dedicated Subnet AZ2
          - !Ref "AWS::NoValue"
        - !If
          - HasElastiCacheSubnetAZ3
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6380
            CidrIp: !Ref ElastiCacheSubnetAZ3
            Description: Allow ElastiCache Dedicated Subnet AZ3
          - !Ref "AWS::NoValue"

  # IAM Roles and Policies
  BatchJobRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchJobPolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v7

  BatchJobPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:ListSecrets'
            Resource: '*'
          - !If
            - UseS3
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub arn:aws:s3:::${ExistingBucketName}
                - !Sub arn:aws:s3:::${ExistingBucketName}/*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:aws:s3:::sftp*
              - !Sub arn:aws:s3:::sftp*/*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*/*  
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          - !If 
            - HasDatabaseSecret
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret2
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret2Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret3
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret3Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret4
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret4Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret5
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret5Name}*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*
          - !If
            - HasSQSQueueArns
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueUrl
                - sqs:GetQueueAttributes
              Resource: !Split [",", !Ref SQSQueueArns]
            - !Ref AWS::NoValue
          - !If
            - HasSQSCustomerManagedKmsKeyArns
            - Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource: !Split [",", !Ref SQSCustomerManagedKmsKeyArns]
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - states:StartExecution
              - states:DescribeExecution
              - states:StopExecution
              - states:ListExecutions
              - states:ListStateMachineVersions
              - states:ListStateMachines
            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

  BatchExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-execution-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchExecutionPolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v7

  BatchExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-execution-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:ListSecrets'
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${AppShortName}-${EnvName}-${BatchJobName}:*
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Sub arn:aws:ecr:${AWS::Region}:*:repository/*
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - !If
            - UseS3
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:PutObject
                - s3:DeleteObject                
              Resource:
                - !Sub arn:aws:s3:::${ExistingBucketName}
                - !Sub arn:aws:s3:::${ExistingBucketName}/*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:aws:s3:::sftp*
              - !Sub arn:aws:s3:::sftp*/* 
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*
              - !Sub arn:aws:s3:::${AppShortName}-${EnvName}-*/* 
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          - !If 
            - HasDatabaseSecret
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret2
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret2Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret3
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret3Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret4
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret4Name}*
            - !Ref AWS::NoValue
          - !If 
            - HasAdditionalSecret5
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret5Name}*
            - !Ref AWS::NoValue
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-*

  # Batch Components
  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ComputeEnvironmentName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}
      Type: MANAGED
      ServiceRole: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/batch.amazonaws.com/AWSServiceRoleForBatch
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        SecurityGroupIds:
          - !Ref BatchJobSecurityGroup
        Subnets: !Ref AppSubnetIds
      State: ENABLED

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      JobQueueName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-queue
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      JobDefinitionName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-job
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Ref ECRImageUri
        ReadonlyRootFilesystem: true
        User: !Ref ContainerUser
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        FargatePlatformConfiguration:
          PlatformVersion: 1.4.0
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref BatchJobVCPU
          - Type: MEMORY
            Value: !Ref BatchJobMemory
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref DataLoadingLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: batch
        Environment:
          - !If
            - UseS3
            - Name: S3_BUCKET_NAME
              Value: !Ref ExistingBucketName
            - !Ref AWS::NoValue
          - !If
            - HasInputPrefix
            - Name: S3_INPUT_PREFIX
              Value: !Ref InputPrefix
            - !Ref AWS::NoValue
          - Name: ENVIRONMENT
            Value: !Ref EnvName
          - !If
            - HasSNSTopic
            - Name: SNS_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SNSTopicName}
            - !Ref AWS::NoValue
          - !If
            - HasEnvVarConnectionStringSecretName
            - Name: "AwsSecretPrefix"
              Value: !Ref EnvVarConnectionStringSecretName
            - !Ref "AWS::NoValue"
          - !If
            - HasEnvVar1Name
            - Name: !Ref EnvVar1Name
              Value: !Ref EnvVar1Value
            - !Ref "AWS::NoValue"
          - !If
            - HasEnvVar2Name
            - Name: !Ref EnvVar2Name
              Value: !Ref EnvVar2Value
            - !Ref "AWS::NoValue"
          - !If
            - HasEnvVar3Name
            - Name: !Ref EnvVar3Name
              Value: !Ref EnvVar3Value
            - !Ref "AWS::NoValue"
        Secrets: !If
          - HasAnySecret
          - - !If
              - HasDatabaseSecret
              - Name: DB_SECRET_NAME
                ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseSecretName}
              - !Ref AWS::NoValue
            - !If
              - HasAdditionalSecret2
              - Name: !Ref AdditionalSecret2EnvVarName
                ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret2Name}
              - !Ref AWS::NoValue
            - !If
              - HasAdditionalSecret3
              - Name: !Ref AdditionalSecret3EnvVarName
                ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret3Name}
              - !Ref AWS::NoValue
            - !If
              - HasAdditionalSecret4
              - Name: !Ref AdditionalSecret4EnvVarName
                ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret4Name}
              - !Ref AWS::NoValue
            - !If
              - HasAdditionalSecret5
              - Name: !Ref AdditionalSecret5EnvVarName
                ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdditionalSecret5Name}
              - !Ref AWS::NoValue
          - !Ref AWS::NoValue
      Tags:
        IaCVersion: AppSubsystem-BatchJob-v7

  # EventBridge Scheduler
  BatchSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: IsScheduleTrigger
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-schedule
      Description: "Triggers Batch job on schedule using EventBridge Scheduler"
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:batch:submitJob
        RoleArn: !GetAtt EventBridgeRole.Arn
        Input: !Sub |
          {
            "JobName": "${AppShortName}-${EnvName}-${BatchJobName}-job",
            "JobDefinition": "${BatchJobDefinition}",
            "JobQueue": "${BatchJobQueue}"
          }

  # S3 Event Rule
  S3EventRule:
    Type: AWS::Events::Rule
    Condition: IsS3EventTrigger
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-s3event
      Description: "Triggers Batch job when new file arrives in S3"
      State: ENABLED
      EventPattern:
        detail-type: 
          - "Object Created"
        source: 
          - aws.s3
        detail:
          bucket:
            name:
              - !Ref ExistingBucketName
          object: !If
            - HasInputPrefix
            - key:
                - prefix: !Ref InputPrefix
            - !Ref "AWS::NoValue"
      Targets:
        - Id: BatchJobTarget
          Arn: !Ref BatchJobQueue
          RoleArn: !GetAtt EventBridgeRole.Arn
          InputTransformer: !If
            - IsInputTransformationEnabled
            - InputPathsMap:
                bucketname: "$.detail.bucket.name"
                filename: "$.detail.object.key"
              InputTemplate: |
                {
                  "ContainerOverrides": {
                    "Environment": [
                      {
                        "Name": "S3_BUCKET_NAME",
                        "Value": "<bucketname>"
                      },
                      {
                        "Name": "S3_INPUT_PREFIX",
                        "Value": "<filename>"
                      }
                    ]
                  }
                }
            - !Ref "AWS::NoValue"
          BatchParameters:
            JobDefinition: !Ref BatchJobDefinition
            JobName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-job
            RetryStrategy:
              Attempts: 3

  # EventBridge IAM Role and Policy
  EventBridgeRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-events-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - events.amazonaws.com
                - scheduler.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventBridgePolicy
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BatchJob-v7

  EventBridgePolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub ${AppShortName}-${EnvName}-${BatchJobName}-events-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - batch:SubmitJob
              - batch:TagResource
              - batch:DescribeJobDefinitions
              - batch:DescribeJobQueues
              - scheduler:CreateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
              - scheduler:UpdateSchedule
            Resource:
              - !Ref BatchJobDefinition
              - !Ref BatchJobQueue
              - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${AppShortName}-${EnvName}-${BatchJobName}*
