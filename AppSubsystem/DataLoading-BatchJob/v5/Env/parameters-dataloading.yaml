# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates Batch job definition name: {AppShortName}-{EnvName}-batchjob-{BatchJobName}
# - Creates EventBridge rule name: {AppShortName}-{EnvName}-{trigger-type}-{BatchJobName}
# - Scopes IAM permissions to resources matching: {AppShortName}-{EnvName}-*
#
# Format: Lowercase alphanumeric
# Example: myapp, api, webapp
#
# Finding the value:
# - Check with your team for the standard application identifier
# - Must match AppShortName used in other infrastructure stacks

# --- BATCH JOB NAME ---
# BatchJobName: Individual batch job identifier
#
# Purpose: Identifies this specific batch job workload
#
# Format: Lowercase alphanumeric with hyphens
# Example: learner-master-data, file-processor, data-loader, etl-pipeline
#
# Requirements:
# - Must be unique within the application (AppShortName + EnvName)
# - Descriptive of job purpose
# - Final job definition name: {AppShortName}-{EnvName}-batchjob-{BatchJobName}

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines log retention (shorter for dev, longer for prod)
#
# Common Values:
# - nprd: Non-production
# - nprd-dev: Development
# - nprd-stg: Staging
# - nprd-sit: System Integration Testing
# - nprd-uat: User Acceptance Testing
# - prod: Production
# - prod-a, prod-b: Multi-region production

# --- TRIGGER TYPE ---
# TriggerType: How the batch job is triggered
#
# Purpose: Defines job execution pattern
#
# Options:
#
# Schedule (Cron-based):
# - Value: "Schedule"
# - Uses EventBridge Scheduler with cron or rate expressions
# - Runs batch job at specified intervals
# - Requires: ScheduleExpression parameter
# - Suitable for: Regular data imports, daily reports, periodic ETL
# - Example: Daily at 12 PM UTC
#   TriggerType: "Schedule"
#   ScheduleExpression: "cron(0 12 * * ? *)"
#
# S3Event (Event-driven):
# - Value: "S3Event"
# - Triggered when files are uploaded to S3 bucket
# - Uses EventBridge rules with S3 event notifications
# - Supports prefix filtering via InputPrefix parameter
# - Requires: UseExistingS3=true, ExistingBucketName, InputPrefix
# - Suitable for: On-demand processing, file arrival triggers
# - Example: Process files uploaded to "input/" prefix
#   TriggerType: "S3Event"
#   UseExistingS3: "true"
#   ExistingBucketName: "my-data-bucket"
#   InputPrefix: "input/"

# --- SCHEDULE EXPRESSION ---
# ScheduleExpression: Cron or rate expression for scheduled execution
#
# Purpose: Defines when batch job runs (only if TriggerType=Schedule)
#
# Format:
# cron(minute hour day-of-month month day-of-week year)
# rate(value unit)
#
# Cron Examples (all times UTC):
# - cron(0 12 * * ? *): Daily at 12 PM UTC
# - cron(0 */6 * * ? *): Every 6 hours
# - cron(0 9 ? * MON-FRI *): Weekdays at 9 AM UTC
# - cron(0 0 1 * ? *): First day of every month at midnight
#
# Rate Examples:
# - rate(5 minutes): Every 5 minutes
# - rate(1 hour): Every hour
# - rate(7 days): Every 7 days
#
# Important:
# - All times are in UTC
# - For Singapore time (UTC+8), subtract 8 hours from desired time
# - Example: 9:00 AM SGT = 1:00 AM UTC = cron(0 1 * * ? *)
#
# Leave empty if TriggerType=S3Event

# --- USE EXISTING S3 ---
# UseExistingS3: Whether to use existing S3 bucket or create new one
#
# Purpose: Controls S3 bucket provisioning
#
# Values:
# - "true": Use existing S3 bucket (requires ExistingBucketName)
# - "false": Template creates new S3 bucket
#
# When to use "true":
# ✅ Files uploaded to existing SFTP/data bucket
# ✅ Multiple batch jobs process same bucket
# ✅ Bucket already exists with data
#
# When to use "false":
# ❌ New dedicated bucket needed for this job
# ❌ Isolated storage required

# --- EXISTING BUCKET NAME ---
# ExistingBucketName: Name of existing S3 bucket
#
# Purpose: Specifies which bucket to use (only if UseExistingS3=true)
#
# Format: Bucket name (no s3:// prefix)
# Example: sftpxxxxxxxxxxxx, myapp-nprd-data-ingestion
#
# Requirements (if UseExistingS3=true):
# - Bucket must exist before deployment
# - EventBridge will be configured to trigger on uploads to this bucket
# - Batch job will have read/write access to this bucket
#
# Finding Bucket Name:
# AWS Console → S3 → Buckets
# - Locate your data ingestion bucket
# - Copy bucket name
#
# Leave empty if UseExistingS3=false

# --- INPUT PREFIX ---
# InputPrefix: S3 prefix for event filtering
#
# Purpose: Controls which S3 objects trigger the batch job (if TriggerType=S3Event)
#
# Format: path/ or "" (empty for entire bucket)
# Example: input/, data/raw/, landing-zone/
#
# Behavior:
#
# With Prefix (e.g., "input/"):
# - Only files uploaded to s3://bucket/input/* trigger the job
# - Example: s3://bucket/input/file.csv → triggers job
# - Example: s3://bucket/output/file.csv → does NOT trigger job
# - S3_INPUT_PREFIX environment variable passed to container
#
# Without Prefix (""):
# - Any file uploaded to s3://bucket/* triggers the job
# - Process entire bucket
# - S3_INPUT_PREFIX environment variable will be empty
#
# Use Cases:
# - input/: Trigger on new input files
# - landing/: Trigger on files in landing zone
# - "": Trigger on any file in bucket

# --- DATABASE SECRET NAME ---
# DatabaseSecretName: Primary database secret in Secrets Manager
#
# Purpose: Provides database credentials to batch job container
#
# Format: Secret name (not ARN)
# Example: myapp-nprd-dev-postgresql, myapp-prod-mysql, webapp-nprd-aurora
#
# Requirements:
# - Secret must exist in AWS Secrets Manager before deployment
# - Secret should contain database credentials (username, password, host, port, database)
# - Leave empty ("") if batch job doesn't need database access
#
# Finding Secret Name:
# AWS Console → Secrets Manager → Secrets
# - Locate your database secret
# - Copy secret name
#
# Secret Format (typical):
# {
#   "username": "dbadmin",
#   "password": "secretpassword",
#   "host": "mydb.cluster-xyz.rds.amazonaws.com",
#   "port": 5432,
#   "dbname": "myapp"
# }

# --- VPC ID ---
# VpcId: VPC identifier where batch job runs
#
# Purpose: Specifies which VPC to deploy batch job in
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-0d99a0c727b301d67
#
# Requirements:
# - VPC must exist before deployment
# - VPC must have VPC endpoints for ECR, S3, Secrets Manager, CloudWatch
# - Security group will be created in this VPC
#
# Finding VPC ID:
# AWS Console → VPC → Your VPCs
# - Locate the VPC for your environment
# - Copy VPC ID from the list

# --- APP SUBNET IDS ---
# AppSubnetIds: Private subnet IDs for batch job execution
#
# Purpose: Specifies where Batch tasks run
#
# Format: subnet-abc123,subnet-def456,subnet-ghi789 (comma-separated, no spaces)
# Example: subnet-0abc123def456789a,subnet-0def456abc789123b
#
# Requirements:
# - Must be private subnets (NEVER public)
# - Minimum 2 subnets recommended (for high availability)
# - Subnets should be in different Availability Zones
# - Subnets must have internet access via NAT Gateway or VPC endpoints
# - All subnets must be in same VPC as VpcId
#
# Finding Subnet IDs:
# AWS Console → VPC → Subnets
# - Filter by VPC ID
# - Select private application subnets
# - Copy subnet IDs (comma-separated, no spaces)

# --- ECR IMAGE URI ---
# ECRImageUri: Docker container image URI with tag
#
# Purpose: Specifies which container image to run in batch job
#
# Format: {account}.dkr.ecr.{region}.amazonaws.com/{repository}:{tag}
# Example: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/myapp-nprd-batch:latest
#
# Requirements:
# - Image must be pushed to ECR before deployment
# - Image must exist in same region as batch job
# - Batch job execution role will pull image from ECR
# - Use specific tags (not :latest) for production
#
# Finding ECR Image URI:
# AWS Console → ECR → Repositories
# - Select repository
# - Click "View push commands" or copy image URI
# - Append tag (e.g., :latest, :v1.0.0, :20240315)

# --- BATCH JOB VCPU ---
# BatchJobVCPU: vCPU units for batch job container
#
# Purpose: Defines CPU allocation for batch job
#
# Valid Values: 0.25, 0.5, 1, 2, 4, 8, 16
#
# vCPU to Memory Mapping (AWS Fargate requirements):
# - 0.25 vCPU: 512 MB to 2048 MB
# - 0.5 vCPU: 1024 MB to 4096 MB
# - 1 vCPU: 2048 MB to 8192 MB
# - 2 vCPU: 4096 MB to 16384 MB
# - 4 vCPU: 8192 MB to 30720 MB
# - 8 vCPU: 16384 MB to 61440 MB
# - 16 vCPU: 32768 MB to 122880 MB
#
# Recommendations:
# - Light workloads (file parsing): 0.5-1 vCPU
# - Medium workloads (data transformation): 2-4 vCPU
# - Heavy workloads (large ETL): 8-16 vCPU
#
# Cost Impact:
# - Higher vCPU = higher cost per second
# - Balance cost vs execution time

# --- BATCH JOB MEMORY ---
# BatchJobMemory: Memory allocation in MiB
#
# Purpose: Defines memory available to batch job container
#
# Valid Values: 512, 1024, 2048, 4096, 8192, 16384, 30720, 61440, 122880 (and others)
# Must match vCPU constraints (see BatchJobVCPU reference)
#
# Recommendations:
# - Light workloads: 512-1024 MB
# - Medium workloads: 2048-4096 MB
# - Heavy workloads: 8192-16384 MB
# - Memory-intensive: 30720+ MB
#
# Important:
# - Must be compatible with BatchJobVCPU
# - Example: If vCPU=2, memory must be 4096-16384 MB
# - Monitor actual memory usage to optimize

# --- LOG RETENTION ---
# LogRetention: CloudWatch Logs retention period
#
# Purpose: How long to keep batch job execution logs
#
# Valid Values: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653 (days)
#
# Recommendations:
# - Development: 7-14 days
# - Staging/UAT: 14-30 days
# - Production: 90-365 days
# - Compliance/Audit: 365+ days
#
# Cost Impact:
# - Longer retention = higher storage cost
# - Archive to S3 for long-term retention at lower cost

# --- SNS TOPIC NAME ---
# SNSTopicName: SNS topic for job notifications
#
# Purpose: Sends notifications for batch job status (success/failure)
#
# Format: Topic name (not ARN)
# Example: myapp-nprd-dev-notifications, batch-job-alerts
#
# Requirements:
# - SNS topic will be created by template if it doesn't exist
# - Subscribe email addresses or other endpoints to topic manually
#
# Notification Events:
# - Job started
# - Job succeeded
# - Job failed
# - Job timed out

# --- VPC CIDR RANGES ---
# VpcCidr1, VpcCidr2, VpcCidr3, VpcCidr4, VpcCidr5: VPC CIDR blocks for security group rules
#
# Purpose: Allow batch job to access resources within VPC
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.55.53.0/24, 10.55.55.0/25
#
# VpcCidr1 (Required):
# - Primary VPC CIDR block
# - Used for security group egress rules
#
# VpcCidr2 (Optional):
# - Secondary VPC CIDR block
# - Used for VPC peering or extended CIDR ranges
#
# VpcCidr3 (Optional):
# - Tertiary VPC CIDR block
# - Additional CIDR range if needed
#
# VpcCidr4 (Optional):
# - Quaternary VPC CIDR block
# - Additional CIDR range for multi-VPC architectures
#
# VpcCidr5 (Optional):
# - Quinary VPC CIDR block
# - Additional CIDR range for complex network topologies
#
# Finding VPC CIDRs:
# AWS Console → VPC → Your VPCs
# - Select VPC
# - IPv4 CIDR shows primary CIDR
# - Check "CIDR blocks" tab for additional CIDRs

# --- S3 PREFIX LIST ID ---
# S3PrefixListId: Managed prefix list ID for S3 service
#
# Purpose: Allow batch job to access S3 via VPC endpoint
#
# Format: pl-xxxxxxxxxxxxxxxxx
# Example: pl-0f8e90357f89b3f45
#
# Finding S3 Prefix List ID:
# AWS Console → VPC → Managed Prefix Lists
# - Search for "s3" or "com.amazonaws.{region}.s3"
# - Copy prefix list ID
#
# Alternative:
# AWS CLI: aws ec2 describe-managed-prefix-lists --filters "Name=prefix-list-name,Values=com.amazonaws.ap-southeast-1.s3"

# --- VPC SUBNET CIDR DB AZ ---
# VPCSubnetCidrDBAZ1, VPCSubnetCidrDBAZ2, VPCSubnetCidrDBAZ3: Database subnet CIDRs
#
# Purpose: Allow batch job to connect to RDS databases
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.55.53.128/27, 10.55.53.160/27
#
# Requirements:
# - CIDRs must match actual database subnet ranges
# - Used for security group egress rules (port 5432 PostgreSQL, 3306 MySQL, etc.)
# - VPCSubnetCidrDBAZ1 (Required): Database subnet in AZ1
# - VPCSubnetCidrDBAZ2 (Required): Database subnet in AZ2
# - VPCSubnetCidrDBAZ3 (Optional): Database subnet in AZ3 (for 3-AZ deployment)
#
# Finding Database Subnet CIDRs:
# AWS Console → VPC → Subnets
# - Filter by "database" or "db" in subnet name
# - Copy IPv4 CIDR for each database subnet

# --- ADDITIONAL SECRETS ---
# AdditionalSecret2/3/4/5Name: Additional secrets beyond primary database
# AdditionalSecret2/3/4/5EnvVarName: Environment variable names for secrets
#
# Purpose: Provides additional credentials to batch job container
#
# Total Secret Support: Up to 6 secrets
# - 1 primary (DatabaseSecretName)
# - 5 additional (AdditionalSecret2Name through AdditionalSecret5Name)
#
# Format:
# AdditionalSecret2Name: Secret name in Secrets Manager
# AdditionalSecret2EnvVarName: Environment variable name in container
#
# Example:
# AdditionalSecret2Name: "myapp-nprd-api-key"
# AdditionalSecret2EnvVarName: "API_KEY"
# → Container receives API_KEY environment variable with secret value
#
# Use Cases:
# - API keys for external services
# - Additional database credentials
# - Authentication tokens
# - Service account credentials
#
# Leave empty ("") if not needed

# --- ENVIRONMENT VARIABLES ---
# EnvVar1/2/3Name and EnvVar1/2/3Value: Non-sensitive configuration
#
# Purpose: Provides configuration to batch job container
#
# Format:
# EnvVar1Name: Variable name
# EnvVar1Value: Variable value
#
# Example:
# EnvVar1Name: "LOG_LEVEL"
# EnvVar1Value: "INFO"
# → Container receives LOG_LEVEL=INFO
#
# Common Use Cases:
# - LOG_LEVEL: DEBUG, INFO, WARNING, ERROR
# - API_URL: External API endpoints
# - BATCH_SIZE: Number of records to process
# - PROCESSING_MODE: incremental, full, delta
# - REGION: AWS region
#
# Important:
# - DO NOT use for sensitive data (use secrets instead)
# - Use for configuration that can be visible in CloudFormation console

# --- ENV VAR CONNECTION STRING SECRET NAME ---
# EnvVarConnectionStringSecretName: Connection string secret name
#
# Purpose: Alternative database connection method using connection string
#
# Format: Secret name in Secrets Manager
# Example: myapp-nprd-connection-string
#
# Use Case:
# - Some applications prefer full connection strings
# - Alternative to individual host/port/database parameters
# - Connection string stored in Secrets Manager
#
# Connection String Format (example):
# postgresql://username:password@host:5432/database
# mysql://username:password@host:3306/database
#
# Leave empty ("") if using DatabaseSecretName instead

# --- HCC VPC ENDPOINT CIDR ---
# HCCVpceCidr: HCC VPC endpoint CIDR for external connectivity
#
# Purpose: Allow batch job to route through corporate proxy
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.48.42.0/24
#
# Use Cases:
# - Corporate policy requires proxy for external APIs
# - Centralized traffic monitoring
# - Access to on-premises resources
#
# Leave empty ("") if not using corporate proxy

# --- ENABLE INPUT TRANSFORMATION ---
# EnableInputTransformation: EventBridge input transformation for S3 events
#
# Purpose: Transforms S3 event payload before passing to batch job
#
# Values:
# - true: Enable input transformation (extracts bucket name, object key, etc.)
# - false: Pass raw S3 event to batch job
#
# When to use "true":
# - Need simplified input format in batch job
# - Extract specific fields from S3 event
# - Custom payload structure required
#
# When to use "false":
# - Batch job handles raw S3 events
# - Need full S3 event details
#
# Default: false

# --- RESOURCES CREATED ---

# CloudWatch Log Group: /aws/batch/{AppShortName}-{EnvName}-{BatchJobName} ({LogRetention} days)
# S3 Bucket Policy (if UseExistingS3=true): {ExistingBucketName} with OAC access, TLS 1.2+
# Security Group: {AppShortName}-{EnvName}-sg-{BatchJobName} in {VpcId}
#   - Egress: HTTPS to VPC CIDRs, DB port to DB subnets, S3 prefix list, HCC endpoint
# IAM Roles:
#   - Batch Job Role: S3, SES, Secrets Manager, SNS access
#   - Batch Execution Role: ECR, CloudWatch Logs, S3, Secrets Manager access
#   - EventBridge Role: Batch SubmitJob, Scheduler permissions
# AWS Batch:
#   - Compute Environment: {AppShortName}-{EnvName}-{BatchJobName} (Fargate, Max 4 vCPUs)
#   - Job Queue: {AppShortName}-{EnvName}-{BatchJobName}-queue
#   - Job Definition: {AppShortName}-{EnvName}-{BatchJobName}-job
#     * Image: {ECRImageUri}, vCPU: {BatchJobVCPU}, Memory: {BatchJobMemory}
#     * Env Vars: S3_BUCKET_NAME, ENVIRONMENT, SNS_TOPIC_ARN, {EnvVar1/2/3Name}
#     * Secrets: DB_SECRET_NAME, {AdditionalSecret2/3/4/5EnvVarName}
# EventBridge Trigger:
#   - Schedule: {ScheduleExpression} (if TriggerType=Schedule)
#   - S3 Event: {ExistingBucketName}/{InputPrefix} (if TriggerType=S3Event)
