AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create or update an ECS Task Definition using Fargate with configurable OS, memory, CPU, ECR image, container name, port mappings, logging, and store output in Parameter Store.

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  VpcId:
    Description: VPC to create endpoints and workspace
    Type: AWS::EC2::VPC::Id

  VPCSubnetCidrAZ1:
    Description: CIDR block for the ECS service traffic
    Type: String
 
  VPCSubnetCidrAZ2:
    Description: CIDR block for the ECS service traffic
    Type: String

  VPCSubnetCidrAZ3:
    Description: CIDR block for the ECS service traffic
    Type: String

  ECSClusterName:
    Type: String
    Description: Name for the ECS cluster to be created

  ALBName:
    Type: String
    Description: Name of the ALB to associate with this service

  ECRImage:
    Type: String
    Description: "The link to the ECR image (e.g., 533267434948.dkr.ecr.ap-southeast-1.amazonaws.com/hxis-fhir-ecr-repo:stable-alpine)"

  ECSCpuArchitecture:
    Type: String
    Description: "The CPU architecture for the task (e.g., X86_64, ARM64)"

  CPUUnits:
    Description: number of cpu units used by the task
    Type: String

  Memory:
    Description: The amount (in MiB) of memory used by the task
    Type: String

  ECSOperatingSystemFamily: 
    Type: String
    Description: "Operating system family to be used for the task."
    AllowedValues: 
      - LINUX
      - WINDOWS_SERVER_2019_FULL
      - WINDOWS_SERVER_2019_CORE
      - WINDOWS_SERVER_2016_FULL
      - WINDOWS_SERVER_2004_CORE
      - WINDOWS_SERVER_2022_CORE
      - WINDOWS_SERVER_2022_FULL
      - WINDOWS_SERVER_20H2_CORE
    Default: "LINUX"

  ECSServiceProtocol:
    Type: String
    AllowedValues:
      - HTTP
      - HTTPS
    Description: "The protocol used for the port mapping in target group (eg, http or https)"

  ServiceContainerPort:
    Type: Number
    Description: "The port on which the container listens (e.g., 80, 443, Custom Port)"

  ContainerProtocol:
    Type: String
    AllowedValues:
      - tcp
      - udp
    Description: "The protocol used for the port mapping (e.g., tcp, udp)"
    Default: "tcp"

  CreateNewTaskDefinition:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Description: "Choose 'true' to create a new Task Definition family or 'false' to create a new revision of an existing Task Definition."

  ExistingTaskFamily:
    Type: String
    Description: "The existing ECS task definition family name stored in Parameter Store. Leave blank if creating a new task definition."
    Default: ""

  ECSDesiredTaskCount:
    Type: Number
    Description: Number of desired tasks to run

  AppSubnetIds:
    Type: CommaDelimitedList
    Description: List of subnet IDs where the ECS tasks will be deployed
  
  PathPattern:
    Description: Path-pattern for ALB listerner Rule condition check to route it to specific target group
    Type: String

  PathPattern2:
    Description: Second path-pattern for ALB listener Rule condition (optional)
    Type: String
    Default: ""

  PathPattern3:
    Description: Third path-pattern for ALB listener Rule condition (optional)
    Type: String
    Default: ""

  # Target Group Health Check Parameters
  TGHealthCheckPath:
    Description: ALB TargetGroup HealthCheck Path
    Type: String

  TGHealthCheckIntervalSeconds:
    Type: Number
    Description: "The time period in seconds between target group health checks"
    Default: 15
    MinValue: 5

  TGHealthCheckTimeoutSeconds:
    Type: Number
    Description: "The time period in seconds to wait for a target group health check response"
    Default: 10
    MinValue: 2

  TGHealthyThresholdCount:
    Type: Number
    Description: "Number of consecutive successful health checks before considering target healthy"
    Default: 2
    MinValue: 2

  TGUnhealthyThresholdCount:
    Type: Number
    Description: "Number of consecutive failed health checks before considering target unhealthy"
    Default: 5
    MinValue: 2

  # Container Health Check Parameters
  EnableContainerHealthCheck:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable or disable container health checks

  ContainerHealthCheckCommand:
    Type: String
    Description: "The command to use for container health check (e.g., CMD-SHELL,curl -f http://localhost/health)"
    Default: ""

  ContainerHealthCheckInterval:
    Type: Number
    Description: "Time period in seconds between container health checks"
    Default: 30

  ContainerHealthCheckTimeout:
    Type: Number
    Description: "Time period in seconds to wait for health check to succeed"
    Default: 5

  ContainerHealthCheckStartPeriod:
    Type: Number
    Description: "Grace period in seconds before starting health checks"
    Default: 60

  ContainerHealthCheckRetries:
    Type: Number
    Description: "Number of retries before considering container unhealthy"
    Default: 3

  ServiceName:
    Type: String
    Description: Service name (alphanumeric and hyphens only)

  LogsRetentionInDays:
    Description: ECS Service Name
    Type: String
    Default: "7"

  ALBRulePriorityForService:
    Description: ALB Listener Rules Priority
    Type: String
    Default: "2"

  EnvVarConnectionStringSecretName:
    Description: "Environment Variable ECS Connection String Secret Name"
    Type: String  
  
  EnvVar1Name:
    Description: "Environment Variable #1 Name"
    Type: String

  EnvVar1Value:
    Description: "Environment Variable #1 Value"
    Type: String

  EnvVar2Name:
    Description: "Environment Variable #2 Name"
    Type: String

  EnvVar2Value:
    Description: "Environment Variable #2 Value"
    Type: String

  EnvVar3Name:
    Description: "Environment Variable #3 Name"
    Type: String

  EnvVar3Value:
    Description: "Environment Variable #3 Value"
    Type: String

  EnableAutoScaling:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable or disable auto-scaling for the ECS service

  MinContainers:
    Type: Number
    Description: Minimum number of containers to run

  MaxContainers:
    Type: Number
    Description: Maximum number of containers to run

  CPUUtilizationThreshold:
    Type: String
    Description: CPU utilization threshold for auto-scaling (percentage)

  MemoryUtilizationThreshold:
    Type: String
    Description: Memory utilization threshold for auto-scaling (percentage)

  EnableADOT:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable or disable ADOT configuration

  ADOTEndpoint:
    Type: String
    Description: "ADOT endpoint from parent stack"

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""

  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""

  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""

  VPCSubnetCidrDBAZ1:
    Type: String
    Description: AZ1 App Subnet
  
  VPCSubnetCidrDBAZ2:
    Type: String
    Description: AZ2 App Subnet

  VPCSubnetCidrDBAZ3:
    Type: String
    Description: AZ3 App Subnet

  ProdDBPort:
    Type: String
    Default: 53341
    NoEcho: true

  NProdDBPort:
    Type: String
    Default: 53331
    NoEcho: true

  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""

  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""
  
Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasEnvVar1Name: !Not [!Equals [!Ref EnvVar1Name, '']]
  HasEnvVar2Name: !Not [!Equals [!Ref EnvVar2Name, '']]
  HasEnvVar3Name: !Not [!Equals [!Ref EnvVar3Name, '']]
  HasEnvVarConnectionStringSecretName: !Not [!Equals [!Ref EnvVarConnectionStringSecretName, '']]
  HasPathPattern2: !Not [!Equals [!Ref PathPattern2, '']]
  HasPathPattern3: !Not [!Equals [!Ref PathPattern3, '']]
  HasVPCSubnetCidrDBAZ3: !Not [!Equals [!Ref VPCSubnetCidrDBAZ3, '']]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]

  CreateNewTaskDefinitionCondition:
    Fn::Equals: [!Ref CreateNewTaskDefinition, "true"]

  HasSubnetCidrAZ3: !Not [!Equals [!Ref VPCSubnetCidrAZ3, '']]
  EnableAutoScalingCondition: !Equals [!Ref EnableAutoScaling, 'true']
  EnableADOTCondition: !Equals [!Ref EnableADOT, 'true']

  EnableHealthCheckCondition: !Equals [!Ref EnableContainerHealthCheck, 'true']
      
Resources:
  ECSServiceSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-${ServiceName}"
      Description: !Sub "Connection Strings for ${AppShortName}-${EnvName}-${ServiceName}"
      KmsKeyId: !Sub "alias/aws/secretsmanager"
      SecretString: !Sub |
        {
          "ConnectionStrings__Local": "",
          "ConnectionStrings__FhirMetadata": ""
        }
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v3
        
  # Target Group
  ECSALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-tg-ecs-${ServiceName}"
      VpcId: !Ref VpcId
      Protocol: !Ref ECSServiceProtocol
      Port: !Ref ServiceContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: !Ref ECSServiceProtocol
      HealthCheckPort: !Ref ServiceContainerPort
      HealthCheckPath: !Ref TGHealthCheckPath
      HealthyThresholdCount: !Ref TGHealthyThresholdCount
      UnhealthyThresholdCount: !Ref TGUnhealthyThresholdCount
      HealthCheckIntervalSeconds: !Ref TGHealthCheckIntervalSeconds
      HealthCheckTimeoutSeconds: !Ref TGHealthCheckTimeoutSeconds
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v3

  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]    
    Properties:
      ListenerArn: !Sub "{{resolve:ssm:/${ALBName}/alb-https-listener-arn}}"
      Priority: !Ref ALBRulePriorityForService
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref PathPattern
            - !If 
              - HasPathPattern2
              - !Ref PathPattern2
              - !Ref AWS::NoValue
            - !If
              - HasPathPattern3
              - !Ref PathPattern3
              - !Ref AWS::NoValue
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ECSALBTG

  # CloudWatch Log Group Resource
  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub "/ecs/${AppShortName}/${EnvName}/${ServiceName}"
      RetentionInDays: !Ref LogsRetentionInDays  # Adjust the retention period as needed
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v3

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Condition: HasEnvVarConnectionStringSecretName
    Properties:
      Family: !If
        - CreateNewTaskDefinitionCondition
        - !Sub "${AppShortName}-${EnvName}-${ServiceName}"  # New family
        - !Ref ExistingTaskFamily  # Use existing family from Parameter Store if provided
      Cpu: !Ref CPUUnits
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Sub "{{resolve:ssm:/${ECSClusterName}/ECSTaskExecutionRoleArn}}"
      TaskRoleArn: !Sub "{{resolve:ssm:/${ECSClusterName}/ECSTaskExecutionRoleArn}}"
      RuntimePlatform:
        CpuArchitecture: !Ref ECSCpuArchitecture
        OperatingSystemFamily: !Ref ECSOperatingSystemFamily
      Volumes:
        - Name: Tmpfs
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref ECRImage
          MountPoints:
            - ContainerPath: /tmp/   # Path inside the container
              ReadOnly: false
              SourceVolume: Tmpfs
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: !Ref ServiceContainerPort
              Protocol: !Ref ContainerProtocol
              AppProtocol: http
          Essential: true
          Environment:
            - !If
              - HasEnvVarConnectionStringSecretName
              - Name: "AwsSecretPrefix"
                Value: !Ref EnvVarConnectionStringSecretName
              - !Ref "AWS::NoValue"
            - !If 
              - EnableADOTCondition
              - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                Value: !Ref ADOTEndpoint
              - !Ref AWS::NoValue
            - !If 
              - EnableADOTCondition
              - Name: OTEL_EXPORTER_OTLP_PROTOCOL
                Value: "grpc"
              - !Ref AWS::NoValue
            - !If 
              - EnableADOTCondition
              - Name: OTEL_EXPORTER_OTLP_INSECURE
                Value: "false"
              - !Ref AWS::NoValue
            - !If
              - HasEnvVar1Name
              - Name: !Ref EnvVar1Name
                Value: !Ref EnvVar1Value
              - !Ref "AWS::NoValue"
            - !If
              - HasEnvVar2Name
              - Name: !Ref EnvVar2Name
                Value: !Ref EnvVar2Value
              - !Ref "AWS::NoValue"
            - !If
              - HasEnvVar3Name
              - Name: !Ref EnvVar3Name
                Value: !Ref EnvVar3Value
              - !Ref "AWS::NoValue"
          HealthCheck: !If
            - EnableHealthCheckCondition
            - Command: !Split [",", !Ref ContainerHealthCheckCommand]
              Interval: !Ref ContainerHealthCheckInterval
              Timeout: !Ref ContainerHealthCheckTimeout
              StartPeriod: !Ref ContainerHealthCheckStartPeriod 
              Retries: !Ref ContainerHealthCheckRetries
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup  # Referencing the created log group
              awslogs-region: ap-southeast-1
              awslogs-stream-prefix: "ecs"
          StopTimeout: 120  #Adjust this value based on your application needs, max is 120 seconds for Fargate (If not configured, default is 30s)

## ECS Service/Container Setup
  ECSServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${AppShortName}-${EnvName}-sg-ecs-${ServiceName}"
      GroupDescription: Security group for ECS Service
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ServiceContainerPort
          ToPort: !Ref ServiceContainerPort
          CidrIp: !Ref VPCSubnetCidrAZ1
          Description: App Subnet CIDR AZ1
        - IpProtocol: tcp
          FromPort: !Ref ServiceContainerPort
          ToPort: !Ref ServiceContainerPort
          CidrIp: !Ref VPCSubnetCidrAZ2
          Description: App Subnet CIDR AZ2
        - !If
          - HasSubnetCidrAZ3
          - IpProtocol: tcp
            FromPort: !Ref ServiceContainerPort
            ToPort: !Ref ServiceContainerPort
            CidrIp: !Ref VPCSubnetCidrAZ3
            Description: App Subnet CIDR AZ3
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: !Ref ServiceContainerPort
          ToPort: !Ref ServiceContainerPort
          SourceSecurityGroupId: !Sub "{{resolve:ssm:/${ALBName}/ecs-alb-security-group-id}}"
          Description: Allow traffic from ALB Security Group
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          CidrIp: !Ref VPCSubnetCidrAZ1
          Description: Allow ElasticCache AZ1
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          CidrIp: !Ref VPCSubnetCidrAZ2
          Description: Allow ElasticCache AZ2
        - !If 
            - "HasSubnetCidrAZ3"
            - IpProtocol: tcp
              FromPort: 6379
              ToPort: 6380
              CidrIp: !Ref VPCSubnetCidrAZ1
              Description: Allow ElasticCache AZ3
            - !Ref "AWS::NoValue"
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ1
          Description: Allow DB AZ1 Subnet
        - IpProtocol: tcp
          FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
          CidrIp: !Ref VPCSubnetCidrDBAZ2
          Description: Allow DB AZ2 Subnet
        - !If
          - HasVPCSubnetCidrDBAZ3
          - IpProtocol: tcp
            FromPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            ToPort: !If [IsProduction, !Ref ProdDBPort, !Ref NProdDBPort]
            CidrIp: !Ref VPCSubnetCidrDBAZ3
            Description: Allow DB Subnet AZ3
          - !Ref "AWS::NoValue"
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v3

  ECSService:
    Type: AWS::ECS::Service
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Condition: HasEnvVarConnectionStringSecretName
    DependsOn:
      - ECSALBTG
      - ALBListenerRule    
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ECSClusterName
      TaskDefinition: !Ref ECSTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref ECSDesiredTaskCount
      HealthCheckGracePeriodSeconds: 60      
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: ECS
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref ECSServiceSecurityGroup
          Subnets: !Ref AppSubnetIds
      LoadBalancers:
        - TargetGroupArn: !Ref ECSALBTG
          ContainerName: !Ref ServiceName
          ContainerPort: !Ref ServiceContainerPort

  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: EnableAutoScalingCondition
    DependsOn: ECSService
    Properties:
      MaxCapacity: !Ref MaxContainers
      MinCapacity: !Ref MinContainers
      ResourceId: !Join 
        - '/'
        - - service
          - !Ref ECSClusterName
          - !Ref ServiceName
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  AutoScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: EnableAutoScalingCondition
    Properties:
      PolicyName: !Sub ${ServiceName}-cpu-autoscaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CPUUtilizationThreshold
        ScaleInCooldown: 300
        ScaleOutCooldown: 300

  AutoScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: EnableAutoScalingCondition
    Properties:
      PolicyName: !Sub ${ServiceName}-memory-autoscaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref MemoryUtilizationThreshold
        ScaleInCooldown: 300
        ScaleOutCooldown: 300