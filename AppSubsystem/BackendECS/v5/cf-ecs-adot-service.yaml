AWSTemplateFormatVersion: '2010-09-09'
Description:  CloudFormation template to create ADOT collector resources v5

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the ECS tasks will run

  Subnets:
    Type: CommaDelimitedList
    Description: The list of Subnets in your Virtual Private Cloud (VPC)

  VPCSubnetCidrAZ1:
    Type: String
    Description: VPC Subnet CIDR for App AZ1

  VPCSubnetCidrAZ2:
    Type: String
    Description: VPC Subnet CIDR for App AZ2

  VPCSubnetCidrAZ3:
    Type: String
    Description: VPC Subnet CIDR for App AZ3
    Default: ''

  ADOTContainerImage:
    Type: String
    Description: URI of the container image

  ADOTTaskCpu:
    Type: String
    Default: '256'
    Description: CPU units for the task

  ADOTTaskMemory:
    Type: String
    Default: '512'
    Description: Memory for the task in MiB

  PrivateHostedZoneId:
    Type: String
    Description: ID of the existing private hosted zone

  ADOTCustomDomainName:
    Type: String
    Description: Custom domain name for ADOT collector

  ADOTInternalCertificateArn:
    Type: String
    Description: ARN of the internal certificate for ADOT collector HTTPS listener

  ECSClusterName:
    Type: String
    Description: Name of the existing ECS cluster where ADOT collector will be deployed

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""

Conditions:
  HasVPCSubnetCidrAZ3: !Not [!Equals [!Ref VPCSubnetCidrAZ3, '']]
  HasPrivateHostedZoneId: !Not [!Equals [!Ref PrivateHostedZoneId, '']]
  IsProduction:
    Fn::Or:
      - Fn::Equals: [!Ref EnvName, prod]
      - Fn::Equals: [!Ref EnvName, prod-a]
      - Fn::Equals: [!Ref EnvName, prod-b]
      - Fn::Equals: [!Ref EnvName, prod-c]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, '']]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, '']]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]

Resources:
  # # CNAME Record for ADOT ALB
  # ADOTALBDNSRecord:
  #   Condition: HasPrivateHostedZoneId
  #   Type: AWS::Route53::RecordSet
  #   Properties:
  #     HostedZoneId: !Ref PrivateHostedZoneId
  #     Name: !Ref ADOTCustomDomainName
  #     Type: CNAME
  #     TTL: 300
  #     ResourceRecords:
  #       - !GetAtt ADOTInternalALB.DNSName

  # ADOT Dedicated ALB
  ADOTInternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-adot-alb"
      Scheme: internal
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      SecurityGroups:
        - !Ref ADOTALBSecurityGroup
      Subnets: !Ref Subnets
      Type: application
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: "true"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5   

  ADOTALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AppShortName}-${EnvName}-sg-adot-alb"
      GroupDescription: Security group for ADOT internal ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAZ1
          Description: App Subnet CIDR AZ1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAZ2
          Description: App Subnet CIDR AZ2
        - !If
          - HasVPCSubnetCidrAZ3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VPCSubnetCidrAZ3
            Description: Allow traffic from AZ3
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAZ1
          Description: App Subnet CIDR AZ1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCSubnetCidrAZ2
          Description: App Subnet CIDR AZ2
        - !If
          - HasVPCSubnetCidrAZ3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VPCSubnetCidrAZ3
            Description: Allow traffic from AZ3
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: 4317
          ToPort: 4318
          CidrIp: !Ref VPCSubnetCidrAZ1
          Description: App Subnet CIDR AZ1
        - IpProtocol: tcp
          FromPort: 4317
          ToPort: 4318
          CidrIp: !Ref VPCSubnetCidrAZ2
          Description: App Subnet CIDR AZ2
        - !If
          - HasVPCSubnetCidrAZ3
          - IpProtocol: tcp
            FromPort: 4317
            ToPort: 4318
            CidrIp: !Ref VPCSubnetCidrAZ3
            Description: Allow traffic from AZ3 
          - !Ref AWS::NoValue
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5

  ADOTTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn:
      - ADOTInternalALB
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-adot-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      ProtocolVersion: GRPC
      Port: 4317
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 4
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        GrpcCode: 0-99
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5     
      
  ADOTListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - ADOTInternalALB
      - ADOTTargetGroup
    Properties:
      LoadBalancerArn: !Ref ADOTInternalALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ADOTInternalCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ADOTTargetGroup

  ADOTECSServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ${AppShortName}-${EnvName}-adot-collector-service
      RetentionInDays: 7
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5

  ADOTECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: adot-collector
      Cpu: !Ref ADOTTaskCpu
      Memory: !Ref ADOTTaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Sub "{{resolve:ssm:/${ECSClusterName}/ECSTaskExecutionRoleArn}}"
      TaskRoleArn: !Sub "{{resolve:ssm:/${ECSClusterName}/ECSTaskExecutionRoleArn}}"
      Volumes:
        - Name: Tmpfs
      ContainerDefinitions:
        - Name: adot-collector
          Image: !Ref ADOTContainerImage
          MountPoints:
            - ContainerPath: /tmp/   # Path inside the container
              ReadOnly: false
              SourceVolume: Tmpfs
          ReadonlyRootFilesystem: true
          PortMappings: 
            - ContainerPort: 4317
              Name: otlp-grpc
            - ContainerPort: 4318
              Name: otlp-http
            - ContainerPort: 13133
              Name: healthcheck
          Environment:
            - Name: AOT_CONFIG_CONTENT 
              Value: !Sub |
                extensions:
                  health_check:
                    endpoint: 0.0.0.0:13133
                receivers:
                  otlp:
                    protocols:
                      grpc:
                        endpoint: 0.0.0.0:4317
                      http:
                        endpoint: 0.0.0.0:4318
                exporters:
                  awsxray:
                    region: "${AWS::Region}"
                  debug:
                    verbosity: "detailed"
                processors:
                  memory_limiter:
                    limit_mib: 100
                    check_interval: 5s
                  batch:
                    timeout: 1s
                    send_batch_size: 8192
                  resourcedetection:
                    detectors: [ecs]
                    timeout: 2s
                service:
                  extensions: [health_check]
                  pipelines:
                    traces:
                      receivers: [otlp]
                      processors: [memory_limiter, resourcedetection, batch]
                      exporters: [awsxray, debug]
                  telemetry:
                    logs:
                      level: "error"
          HealthCheck:
            Command: ["/healthcheck"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 1
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ADOTECSServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ADOTECSServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AppShortName}-${EnvName}-sg-ecs-adot"
      GroupDescription: Security group for ADOT Collector
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4317
          ToPort: 4318
          SourceSecurityGroupId: !Ref ADOTALBSecurityGroup
          Description: Allow traffic from ADOT ALB
        - IpProtocol: tcp
          FromPort: 13133
          ToPort: 13133
          SourceSecurityGroupId: !Ref ADOTALBSecurityGroup
          Description: Allow health check from ALB
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"     
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5
          
  ADOTECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ADOTListener
    Properties:
      ServiceName: adot-collector
      Cluster: !Ref ECSClusterName
      TaskDefinition: !Ref ADOTECSTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref ADOTECSServiceSecurityGroup]
      LoadBalancers:
        - TargetGroupArn: !Ref ADOTTargetGroup
          ContainerName: adot-collector
          ContainerPort: 4317

Outputs:
  ADOTEndpoint:
    Description: ADOT Collector endpoint URL
    Value: !Sub "https://${ADOTCustomDomainName}"