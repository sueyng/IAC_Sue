AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy ALB, ECS Cluster and ADOT ECS Service v5

Parameters:
  # General Configuration
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  # Network Configuration
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the ALB will be created
  AppSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for Application Subnets where the ALB and ECS tasks will be deployed
  VPCSubnetCidrAZ1:
    Type: String
    Description: VPC Subnet CIDR for App AZ1
  VPCSubnetCidrAZ2:
    Type: String
    Description: VPC Subnet CIDR for App AZ2
  VPCSubnetCidrAZ3:
    Type: String
    Description: VPC Subnet CIDR for App AZ3
    Default: ''
  VPCSubnetCidrInternetIngressAlbAZ1:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ1 (optional)
    Default: ''
  VPCSubnetCidrInternetIngressAlbAZ2:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ2 (optional)
    Default: ''
  VPCSubnetCidrInternetIngressAlbAZ3:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ3 (optional)
    Default: ''
  # ALB Configuration
  ALBName:
    Type: String
    Description: Name for the new Application Load Balancer to be created.
  DefaultCertificateArn:
    Type: String
    Description: ARN of the default SSL certificate
  AdditionalCertificateArn:
    Type: String
    Description: ARN of the additional SSL certificate
  NLBSecurityGroupId:
    Type: String
    Description: Security Group ID of the NLB to allow inbound traffic
    Default: ''
  # ECS Cluster Configuration
  ECSClusterName:
    Type: String
    Description: Name for the ECS cluster to be created
  # ADOT Collector Configuration
  EnableADOT:
      Type: String
      AllowedValues: ['true', 'false']
      Default: 'false'
      Description: Enable or disable ADOT collector deployment
  ADOTContainerImage:
    Type: String
    Description: URI of the container image
  ADOTTaskCpu:
    Type: String
    Default: '256'
    Description: CPU units for the task
  ADOTTaskMemory:
    Type: String
    Default: '512'
    Description: Memory for the task in MiB
  PrivateHostedZoneId:
    Type: String
    Description: ID of the existing private hosted zone 
  ADOTCustomDomainName:
    Type: String
    Description: Custom domain name for ADOT collector
  ADOTInternalCertificateArn:
    Type: String
    Description: ARN of the internal certificate for ADOT collector HTTPS listener
  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""
  ServiceContainerPort:
    Type: Number
    Description: "The port on which the container listens (e.g., 80, Custom Port)"
    Default: 8080
  ServiceContainerSSLPort:
    Type: Number
    Description: "The port on which the container listens (e.g., 443, Custom Port)"
    Default: 8443
  PrefixListId:
    Type: String
    Description: ID of the prefix list to allow inbound traffic (optional)
    Default: ""
    
Conditions:
  IsProduction: !Or 
    - !Equals [!Ref EnvName, prod]
    - !Equals [!Ref EnvName, prod-a]
    - !Equals [!Ref EnvName, prod-b]
    - !Equals [!Ref EnvName, prod-c]
  EnableADOTCondition: !Equals [!Ref EnableADOT, 'true']
  HasPrivateHostedZoneId: !Not [!Equals [!Ref PrivateHostedZoneId, '']]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]

Resources:
  # ALB Stack
  PrivateALBStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-alb.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        ALBName: !Ref ALBName
        ALBSubnetIds: !Join [",", !Ref AppSubnetIds]
        VPCSubnetCidrInternetIngressAlbAZ1: !Ref VPCSubnetCidrInternetIngressAlbAZ1
        VPCSubnetCidrInternetIngressAlbAZ2: !Ref VPCSubnetCidrInternetIngressAlbAZ2
        VPCSubnetCidrInternetIngressAlbAZ3: !Ref VPCSubnetCidrInternetIngressAlbAZ3
        DefaultCertificateArn: !Ref DefaultCertificateArn
        AdditionalCertificateArn: !Ref AdditionalCertificateArn
        NLBSecurityGroupId: !Ref NLBSecurityGroupId
        ServiceContainerPort: !Ref ServiceContainerPort
        ServiceContainerSSLPort: !Ref ServiceContainerSSLPort
        PrefixListId: !Ref PrefixListId

  # ECS Stack
  BackendECSClusterStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
      - PrivateALBStack    
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-cluster.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        ECSClusterName: !Ref ECSClusterName

  # ADOT Stack
  BackendECSADOTServiceStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: EnableADOTCondition
    DependsOn:
      - BackendECSClusterStack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-adot-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        Subnets: !Join [",", !Ref AppSubnetIds]
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        ADOTContainerImage: !Ref ADOTContainerImage
        ADOTTaskCpu: !Ref ADOTTaskCpu
        ADOTTaskMemory: !Ref ADOTTaskMemory
        PrivateHostedZoneId: !If [HasPrivateHostedZoneId, !Ref PrivateHostedZoneId, '']
        ADOTCustomDomainName: !Ref ADOTCustomDomainName
        ADOTInternalCertificateArn: !Ref ADOTInternalCertificateArn
        ECSClusterName: !Ref ECSClusterName
        VpcCidr1: !Ref VpcCidr1
        VpcCidr2: !Ref VpcCidr2
        VpcCidr3: !Ref VpcCidr3
        HCCVpceCidr: !Ref HCCVpceCidr
        S3PrefixListId: !Ref S3PrefixListId