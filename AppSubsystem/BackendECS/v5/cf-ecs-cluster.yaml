AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create an ECS Cluster and ECS Task Execution Role with custom managed policies v5

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the ECS tasks will run

  ECSClusterName:
    Type: String
    Description: Name for the ECS cluster to be created

Conditions:
  IsProduction:
    Fn::Or:
      - Fn::Equals: [!Ref EnvName, prod]
      - Fn::Equals: [!Ref EnvName, prod-a]
      - Fn::Equals: [!Ref EnvName, prod-b]
      - Fn::Equals: [!Ref EnvName, prod-c]
      
Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ClusterName: !Ref ECSClusterName
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-BackendECS-v5
    
  ECSTaskECRPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-ECRPolicy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "ecr:GetDownloadUrlForLayer"
              - "ecr:BatchGetImage"
              - "ecr:BatchCheckLayerAvailability"
              - "ecr:GetAuthorizationToken"
            Resource: "*"

  ECSTaskCloudWatchPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-CloudWatchPolicy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "logs:DescribeLogStreams"
              - "logs:DescribeLogGroups"
              - "cloudwatch:PutMetricData"
              - "cloudwatch:GetMetricStatistics"
              - "cloudwatch:ListMetrics"
              - "cloudwatch:DescribeAlarms"
            Resource: 
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/*:*"
              - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:*"

  ECSTaskSSMPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-SSMPolicy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "ssmmessages:CreateControlChannel"
              - "ssmmessages:CreateDataChannel"
              - "ssmmessages:OpenControlChannel"
              - "ssmmessages:OpenDataChannel"
              - "ecs:ExecuteCommand"
            Resource: "*"

  ECSTaskSQSPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-SQSPolicy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:GetQueueUrl
              - sqs:ListDeadLetterSourceQueues
              - sqs:ChangeMessageVisibility
              - sqs:PurgeQueue
              - sqs:ReceiveMessage
              - sqs:DeleteQueue
              - sqs:SendMessage
              - sqs:GetQueueAttributes
              - sqs:ListQueueTags
              - sqs:CreateQueue
              - sqs:SetQueueAttributes
              - sqs:TagQueue
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*"

  ECSTaskExtendedServicesPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-ExtendedServicesPolicy"
      Description: Policy for S3, SNS, DynamoDB and SES services
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # S3 permissions
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:PutObjectAcl
              - s3:GetObjectAttributes
            Resource:
              - !Sub "arn:aws:s3:::*"
          
          # SNS permissions  
          - Effect: Allow
            Action:
              - sns:Publish
              - sns:ListTopics
              - sns:GetTopicAttributes
              - sns:CreateTopic
              - sns:Subscribe
            Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*"
          
          # DynamoDB permissions
          - Effect: Allow
            Action:
              # Read operations
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              # Write operations
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              # Table operations
              - dynamodb:DescribeTable
              - dynamodb:ListTables
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:*"
          
          # SES permissions
          - Effect: Allow
            Action:
              # Email sending operations
              - ses:SendEmail
              - ses:SendRawEmail
              - ses:SendTemplatedEmail
            Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:*"

  ECSTaskSecretsManagerAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ManagedPolicyName: !Sub "${ECSClusterName}-SecretsManagerAccessPolicy"
      Description: Policy to allow access to container secret keys
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetResourcePolicy'
              - 'secretsmanager:GetSecretValue'
              - 'kms:Decrypt'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:ListSecretVersionIds'
              - 'secretsmanager:BatchGetSecretValue'
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppShortName}-${EnvName}-*"
              - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              # - !GetAtt ECSkmsKey.Arn
          - Effect: Allow
            Action:
              - 'secretsmanager:GetRandomPassword'
              - 'secretsmanager:ListSecrets'
            Resource: '*'

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    DependsOn:
      - ECSTaskECRPolicy
      - ECSTaskCloudWatchPolicy
      - ECSTaskSSMPolicy
      - ECSTaskSQSPolicy
      - ECSTaskExtendedServicesPolicy
      - ECSTaskSecretsManagerAccessPolicy
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      RoleName: !Sub "${ECSClusterName}-TaskExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref ECSTaskECRPolicy
        - !Ref ECSTaskCloudWatchPolicy
        - !Ref ECSTaskSSMPolicy
        - !Ref ECSTaskSQSPolicy
        - !Ref ECSTaskExtendedServicesPolicy
        - !Ref ECSTaskSecretsManagerAccessPolicy
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
        - 'arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

  # Store ECS Task Execution Role ARN in SSM for other services to use
  ECSTaskExecutionRoleParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]    
    Properties:
      Name: !Sub "/${ECSClusterName}/ECSTaskExecutionRoleArn"
      Type: String
      Value: !GetAtt ECSTaskExecutionRole.Arn
      Description: ARN of the ECS Task Execution Role

  # Store the SecretManagerPolicy ARN in SSM
  SecretsManagerPolicyArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ECSClusterName}/secrets-manager-policy-arn"
      Type: String
      Value: !Ref ECSTaskSecretsManagerAccessPolicy