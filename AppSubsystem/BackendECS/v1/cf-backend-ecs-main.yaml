AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy ALB, ECS Cluster and Service

Parameters:
  # General Configuration
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Env Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  # Network Configuration
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the ALB will be created

  AppSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for Application Subnets where the ALB and ECS tasks will be deployed

  VPCSubnetCidrAZ1:
    Type: String
    Description: VPC Subnet CIDR for App AZ1

  VPCSubnetCidrAZ2:
    Type: String
    Description: VPC Subnet CIDR for App AZ2

  VPCSubnetCidrAZ3:
    Type: String
    Description: VPC Subnet CIDR for App AZ3
    Default: ''

  VPCSubnetCidrInternetIngressAlbAZ1:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ1 (optional)
    Default: ''

  VPCSubnetCidrInternetIngressAlbAZ2:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ2 (optional)
    Default: ''

  VPCSubnetCidrInternetIngressAlbAZ3:
    Type: String
    Description: Internet ALB Subnet CIDR for AZ3 (optional)
    Default: ''

  DefaultCertificateArn:
    Type: String
    Description: ARN of the default SSL certificate

  AdditionalCertificateArn:
    Type: String
    Description: ARN of the additional SSL certificate

  # ADOT Collector Configuration
  EnableADOT:
      Type: String
      AllowedValues: ['true', 'false']
      Default: 'false'
      Description: Enable or disable ADOT collector deployment

  ADOTContainerImage:
    Type: String
    Description: URI of the container image

  ADOTTaskCpu:
    Type: String
    Default: '256'
    Description: CPU units for the task

  ADOTTaskMemory:
    Type: String
    Default: '512'
    Description: Memory for the task in MiB

  PrivateHostedZoneId:
    Type: String
    Description: ID of the existing private hosted zone
    
  ADOTCustomDomainName:
    Type: String
    Description: Custom domain name for ADOT collector

  ADOTInternalCertificateArn:
    Type: String
    Description: ARN of the internal certificate for ADOT collector HTTPS listener

  # Common ECS Service Configuration
  NumberOfServices:
    Type: Number
    Default: 1
    AllowedValues: [1, 2, 3, 4]
    Description: Number of ECS services to deploy

  ECSCpuArchitecture:
    Type: String
    AllowedValues: [X86_64, ARM64]
    Default: "ARM64"

  ECSOperatingSystemFamily:
    Type: String
    AllowedValues: [LINUX]
    Default: "LINUX"

  ECSServiceProtocol:
    Type: String
    AllowedValues: [HTTP, HTTPS]
    Default: "HTTP"

  ContainerProtocol:
    Type: String
    AllowedValues: [tcp, udp]
    Default: "tcp"

  CreateNewTaskDefinition:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  ExistingTaskFamily:
    Type: String
    Default: ""

  ECSDesiredTaskCount:
    Type: Number
    Default: 1

  LogsRetentionInDays:
    Type: String
    Default: "7"

  CPUUtilizationThreshold:
    Type: String
    Default: "70"

  MemoryUtilizationThreshold:
    Type: String
    Default: "70"

  HealthCheckPath:
    Type: String
    Description: Health Check Path for ECS Services
    Default: "/health"

  # Service 1 Configuration
  Service1ECRImage:
    Type: String
    Description: "The link to the ECR image for Service 1"

  Service1CPUUnits:
    Type: String
    Default: "2048"

  Service1Memory:
    Type: String
    Default: "4096"

  Service1ContainerPort:
    Type: Number
    Default: 8080

  Service1Name:
    Type: String

  Service1PathPattern:
    Type: String
    Description: "URL path pattern for Service 1 ALB routing (e.g., /api/*)"

  Service1RulePriority:
    Type: String

  Service1EnableAutoScaling:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  Service1MinContainers:
    Type: Number
    Default: 1

  Service1MaxContainers:
    Type: Number
    Default: 4

  Service1EnvVarConnectionStringSecretName:
    Type: String
    Description: "Environment Variable Secret Value for Service 1"

  Service1EnvVar1Name:
    Type: String
    Description: "Environment Variable #1 Name for Service 1"

  Service1EnvVar1Value:
    Type: String
    Description: "Environment Variable #1 Value for Service 1"

  Service1EnvVar2Name:
    Type: String
    Description: "Environment Variable #2 Name for Service 1"

  Service1EnvVar2Value:
    Type: String
    Description: "Environment Variable #2 Value for Service 1"

  Service1EnvVar3Name:
    Type: String
    Description: "Environment Variable #3 Name for Service 1"

  Service1EnvVar3Value:
    Type: String
    Description: "Environment Variable #3 Value for Service 1"

  # ECS Service 2 Parameters
  Service2ECRImage:
    Type: String
    Description: "The link to the ECR image for Service 2"

  Service2CPUUnits:
    Type: String
    Default: ""

  Service2Memory:
    Type: String
    Default: ""

  Service2ContainerPort:
    Type: Number
    Default: 8080

  Service2Name:
    Type: String

  Service2PathPattern:
    Type: String
    Description: "URL path pattern for Service 2 ALB routing (e.g., /api/*)"

  Service2RulePriority:
    Type: String
    Default: ""

  Service2EnableAutoScaling:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  Service2MinContainers:
    Type: Number
    Default: 1

  Service2MaxContainers:
    Type: Number
    Default: 4

  Service2EnvVarConnectionStringSecretName:
    Type: String
    Default: ""
    Description: "Environment Variable Secrent Name for Service 2"
    
  Service2EnvVar1Name:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Name for Service 2"

  Service2EnvVar1Value:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Value for Service 2"

  Service2EnvVar2Name:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Name for Service 2"

  Service2EnvVar2Value:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Value for Service 2"

  Service2EnvVar3Name:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Name for Service 2"

  Service2EnvVar3Value:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Value for Service 2"

# Service 3 Parameters
  Service3ECRImage:
    Type: String
    Description: "The link to the ECR image for Service 3"
    Default: ""

  Service3CPUUnits:
    Type: String
    Default: ""

  Service3Memory:
    Type: String
    Default: ""

  Service3ContainerPort:
    Type: Number
    Default: 8080

  Service3Name:
    Type: String
    Default: ""

  Service3PathPattern:
    Type: String
    Description: "URL path pattern for Service 3 ALB routing (e.g., /api/*)"

  Service3RulePriority:
    Type: String
    Default: ""

  Service3EnableAutoScaling:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  Service3MinContainers:
    Type: Number
    Default: 1

  Service3MaxContainers:
    Type: Number
    Default: 4

  Service3EnvVarConnectionStringSecretName:
    Type: String
    Default: ""
    Description: "Environment Variable Secret Name for Service 3"

  Service3EnvVar1Name:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Name for Service 3"

  Service3EnvVar1Value:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Value for Service 3"

  Service3EnvVar2Name:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Name for Service 3"

  Service3EnvVar2Value:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Value for Service 3"

  Service3EnvVar3Name:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Name for Service 3"

  Service3EnvVar3Value:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Value for Service 3"

  # Service 4 Parameters
  Service4ECRImage:
    Type: String
    Description: "The link to the ECR image for Service 4"
    Default: ""

  Service4CPUUnits:
    Type: String

  Service4Memory:
    Type: String

  Service4ContainerPort:
    Type: Number
    Default: 8080

  Service4Name:
    Type: String
    Default: ""

  Service4PathPattern:
    Type: String
    Description: "URL path pattern for Service 4 ALB routing (e.g., /api/*)"

  Service4RulePriority:
    Type: String

  Service4EnableAutoScaling:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  Service4MinContainers:
    Type: Number
    Default: 1

  Service4MaxContainers:
    Type: Number
    Default: 4

  Service4EnvVarConnectionStringSecretName:
    Type: String
    Default: ""
    Description: "Environment Variable Secret Name for Service 4"

  Service4EnvVar1Name:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Name for Service 4"

  Service4EnvVar1Value:
    Type: String
    Default: ""
    Description: "Environment Variable #1 Value for Service 4"

  Service4EnvVar2Name:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Name for Service 4"

  Service4EnvVar2Value:
    Type: String
    Default: ""
    Description: "Environment Variable #2 Value for Service 4"

  Service4EnvVar3Name:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Name for Service 4"

  Service4EnvVar3Value:
    Type: String
    Default: ""
    Description: "Environment Variable #3 Value for Service 4"

Conditions:
  IsProduction: !Or 
    - !Equals [!Ref EnvName, prod]
    - !Equals [!Ref EnvName, prod-a]
    - !Equals [!Ref EnvName, prod-b]
    - !Equals [!Ref EnvName, prod-c]
  HasVPCSubnetCidrAZ3: !Not [!Equals [!Ref VPCSubnetCidrAZ3, '']]
  CreateSecondService: !Not [!Equals [!Ref NumberOfServices, 1]]
  CreateThirdService: !Or [!Equals [!Ref NumberOfServices, 3], !Equals [!Ref NumberOfServices, 4]]
  CreateFourthService: !Equals [!Ref NumberOfServices, 4]
  EnableADOTCondition: !Equals [!Ref EnableADOT, 'true']

Resources:
  # ALB Stack
  PrivateALBStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-alb.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        ALBSubnetIds: !Join [",", !Ref AppSubnetIds]
        VPCSubnetCidrInternetIngressAlbAZ1: !Ref VPCSubnetCidrInternetIngressAlbAZ1
        VPCSubnetCidrInternetIngressAlbAZ2: !Ref VPCSubnetCidrInternetIngressAlbAZ2
        VPCSubnetCidrInternetIngressAlbAZ3: !Ref VPCSubnetCidrInternetIngressAlbAZ3
        DefaultCertificateArn: !Ref DefaultCertificateArn
        AdditionalCertificateArn: !Ref AdditionalCertificateArn

  # ECS Stack
  BackendECSClusterStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
      - PrivateALBStack    
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-cluster.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId

  # ADOT Stack
  BackendECSADOTServiceStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: EnableADOTCondition
    DependsOn:
      - BackendECSClusterStack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-adot-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        Subnets: !Join [",", !Ref AppSubnetIds]
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        ADOTContainerImage: !Ref ADOTContainerImage
        ADOTTaskCpu: !Ref ADOTTaskCpu
        ADOTTaskMemory: !Ref ADOTTaskMemory
        PrivateHostedZoneId: !Ref PrivateHostedZoneId
        ADOTCustomDomainName: !Ref ADOTCustomDomainName
        ADOTInternalCertificateArn: !Ref ADOTInternalCertificateArn

  # ECS Service Stack 1
  BackendECSServiceStack1:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
      - BackendECSClusterStack
      - PrivateALBStack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        ECRImage: !Ref Service1ECRImage
        ECSCpuArchitecture: !Ref ECSCpuArchitecture
        CPUUnits: !Ref Service1CPUUnits
        Memory: !Ref Service1Memory
        ECSOperatingSystemFamily: !Ref ECSOperatingSystemFamily
        ECSServiceProtocol: !Ref ECSServiceProtocol
        ServiceContainerPort: !Ref Service1ContainerPort
        ContainerProtocol: !Ref ContainerProtocol
        CreateNewTaskDefinition: !Ref CreateNewTaskDefinition
        ExistingTaskFamily: !Ref ExistingTaskFamily
        ECSDesiredTaskCount: !Ref ECSDesiredTaskCount
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        AppSubnetIds: !Join [",", !Ref AppSubnetIds]
        PathPattern: !Ref Service1PathPattern
        TGHealthCheckPath: !Ref HealthCheckPath
        ServiceName: !Ref Service1Name
        LogsRetentionInDays: !Ref LogsRetentionInDays
        RulePriority: !Ref Service1RulePriority
        EnableAutoScaling: !Ref Service1EnableAutoScaling
        MinContainers: !Ref Service1MinContainers
        MaxContainers: !Ref Service1MaxContainers
        CPUUtilizationThreshold: !Ref CPUUtilizationThreshold
        MemoryUtilizationThreshold: !Ref MemoryUtilizationThreshold
        EnvVarConnectionStringSecretName: !Ref Service1EnvVarConnectionStringSecretName        
        EnvVar1Name: !Ref Service1EnvVar1Name
        EnvVar1Value: !Ref Service1EnvVar1Value
        EnvVar2Name: !Ref Service1EnvVar2Name
        EnvVar2Value: !Ref Service1EnvVar2Value
        EnvVar3Name: !Ref Service1EnvVar3Name
        EnvVar3Value: !Ref Service1EnvVar3Value
        EnableADOT: !Ref EnableADOT
        ADOTEndpoint: !If
          - EnableADOTCondition
          - !GetAtt BackendECSADOTServiceStack.Outputs.ADOTEndpoint
          - "disabled"        

  # ECS Service Stack 2 (conditional)
  BackendECSServiceStack2:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: CreateSecondService 
    DependsOn:
      - BackendECSClusterStack
      - PrivateALBStack
      - BackendECSServiceStack1
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        ECRImage: !Ref Service2ECRImage
        ECSCpuArchitecture: !Ref ECSCpuArchitecture
        CPUUnits: !Ref Service2CPUUnits
        Memory: !Ref Service2Memory
        ECSOperatingSystemFamily: !Ref ECSOperatingSystemFamily
        ECSServiceProtocol: !Ref ECSServiceProtocol
        ServiceContainerPort: !Ref Service2ContainerPort
        ContainerProtocol: !Ref ContainerProtocol
        CreateNewTaskDefinition: !Ref CreateNewTaskDefinition
        ExistingTaskFamily: !Ref ExistingTaskFamily
        ECSDesiredTaskCount: !Ref ECSDesiredTaskCount
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        AppSubnetIds: !Join [",", !Ref AppSubnetIds]
        PathPattern: !Ref Service2PathPattern
        TGHealthCheckPath: !Ref HealthCheckPath
        ServiceName: !Ref Service2Name
        LogsRetentionInDays: !Ref LogsRetentionInDays
        RulePriority: !Ref Service2RulePriority      
        EnableAutoScaling: !Ref Service2EnableAutoScaling
        MinContainers: !Ref Service2MinContainers
        MaxContainers: !Ref Service2MaxContainers
        CPUUtilizationThreshold: !Ref CPUUtilizationThreshold
        MemoryUtilizationThreshold: !Ref MemoryUtilizationThreshold
        EnvVarConnectionStringSecretName: !Ref Service2EnvVarConnectionStringSecretName        
        EnvVar1Name: !Ref Service2EnvVar1Name
        EnvVar1Value: !Ref Service2EnvVar1Value
        EnvVar2Name: !Ref Service2EnvVar2Name
        EnvVar2Value: !Ref Service2EnvVar2Value
        EnvVar3Name: !Ref Service2EnvVar3Name
        EnvVar3Value: !Ref Service2EnvVar3Value
        EnableADOT: !Ref EnableADOT
        ADOTEndpoint: !If
          - EnableADOTCondition
          - !GetAtt BackendECSADOTServiceStack.Outputs.ADOTEndpoint
          - "disabled"

  # ECS Service Stack 3 (conditional)
  BackendECSServiceStack3:
    Type: AWS::CloudFormation::Stack
    Condition: CreateThirdService
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
      - BackendECSClusterStack
      - PrivateALBStack
      - BackendECSServiceStack2
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        ECRImage: !Ref Service3ECRImage
        ECSCpuArchitecture: !Ref ECSCpuArchitecture
        CPUUnits: !Ref Service3CPUUnits
        Memory: !Ref Service3Memory
        ECSOperatingSystemFamily: !Ref ECSOperatingSystemFamily
        ECSServiceProtocol: !Ref ECSServiceProtocol
        ServiceContainerPort: !Ref Service3ContainerPort
        ContainerProtocol: !Ref ContainerProtocol
        CreateNewTaskDefinition: !Ref CreateNewTaskDefinition
        ExistingTaskFamily: !Ref ExistingTaskFamily
        ECSDesiredTaskCount: !Ref ECSDesiredTaskCount
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        AppSubnetIds: !Join [",", !Ref AppSubnetIds]
        PathPattern: !Ref Service3PathPattern
        TGHealthCheckPath: !Ref HealthCheckPath
        ServiceName: !Ref Service3Name
        LogsRetentionInDays: !Ref LogsRetentionInDays
        RulePriority: !Ref Service3RulePriority        
        EnableAutoScaling: !Ref Service3EnableAutoScaling
        MinContainers: !Ref Service3MinContainers
        MaxContainers: !Ref Service3MaxContainers
        CPUUtilizationThreshold: !Ref CPUUtilizationThreshold
        MemoryUtilizationThreshold: !Ref MemoryUtilizationThreshold
        EnvVarConnectionStringSecretName: !Ref Service3EnvVarConnectionStringSecretName
        EnvVar1Name: !Ref Service3EnvVar1Name
        EnvVar1Value: !Ref Service3EnvVar1Value
        EnvVar2Name: !Ref Service3EnvVar2Name
        EnvVar2Value: !Ref Service3EnvVar2Value
        EnvVar3Name: !Ref Service3EnvVar3Name
        EnvVar3Value: !Ref Service3EnvVar3Value
        EnableADOT: !Ref EnableADOT
        ADOTEndpoint: !If
          - EnableADOTCondition
          - !GetAtt BackendECSADOTServiceStack.Outputs.ADOTEndpoint
          - "disabled"

  # ECS Service Stack 4 (conditional)
  BackendECSServiceStack4:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Condition: CreateFourthService
    DependsOn:
      - BackendECSClusterStack
      - PrivateALBStack
      - BackendECSServiceStack3
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-ecs-service.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        VpcId: !Ref VpcId
        ECRImage: !Ref Service4ECRImage
        ECSCpuArchitecture: !Ref ECSCpuArchitecture
        CPUUnits: !Ref Service4CPUUnits
        Memory: !Ref Service4Memory
        ECSOperatingSystemFamily: !Ref ECSOperatingSystemFamily
        ECSServiceProtocol: !Ref ECSServiceProtocol
        ServiceContainerPort: !Ref Service4ContainerPort
        ContainerProtocol: !Ref ContainerProtocol
        CreateNewTaskDefinition: !Ref CreateNewTaskDefinition
        ExistingTaskFamily: !Ref ExistingTaskFamily
        ECSDesiredTaskCount: !Ref ECSDesiredTaskCount
        VPCSubnetCidrAZ1: !Ref VPCSubnetCidrAZ1
        VPCSubnetCidrAZ2: !Ref VPCSubnetCidrAZ2
        VPCSubnetCidrAZ3: !Ref VPCSubnetCidrAZ3
        AppSubnetIds: !Join [",", !Ref AppSubnetIds]
        PathPattern: !Ref Service4PathPattern
        TGHealthCheckPath: !Ref HealthCheckPath
        ServiceName: !Ref Service4Name
        LogsRetentionInDays: !Ref LogsRetentionInDays
        RulePriority: !Ref Service4RulePriority      
        EnableAutoScaling: !Ref Service4EnableAutoScaling
        MinContainers: !Ref Service4MinContainers
        MaxContainers: !Ref Service4MaxContainers
        CPUUtilizationThreshold: !Ref CPUUtilizationThreshold
        MemoryUtilizationThreshold: !Ref MemoryUtilizationThreshold
        EnvVarConnectionStringSecretName: !Ref Service4EnvVarConnectionStringSecretName        
        EnvVar1Name: !Ref Service4EnvVar1Name
        EnvVar1Value: !Ref Service4EnvVar1Value
        EnvVar2Name: !Ref Service4EnvVar2Name
        EnvVar2Value: !Ref Service4EnvVar2Value
        EnvVar3Name: !Ref Service4EnvVar3Name
        EnvVar3Value: !Ref Service4EnvVar3Value
        EnableADOT: !Ref EnableADOT
        ADOTEndpoint: !If
          - EnableADOTCondition
          - !GetAtt BackendECSADOTServiceStack.Outputs.ADOTEndpoint
          - "disabled"          