# --- TWO-PHASE DEPLOYMENT PROCESS ---
# This service template requires a two-phase deployment to properly handle secrets:
#
# 🔄 PHASE 1 - Initial Infrastructure Deployment:
# 1. Set EnvVarConnectionStringSecretName to empty string: ""
# 2. Deploy the stack - this creates:
#    ✅ Target Group
#    ✅ ALB Listener Rule
#    ✅ Empty secret in Secrets Manager
#    ✅ IAM roles and policies
#    ⚠️  ECS Service is NOT created yet (by design)
#
# 🔐 PHASE 2 - Secret Configuration & Service Deployment:
# 1. Go to AWS Secrets Manager console
# 2. Find the secret named: {AppShortName}-{EnvName}-{ServiceName}
# 3. Store your secret value (connection strings, API keys, etc.)
# 4. Update this YAML file:
#    - Set EnvVarConnectionStringSecretName: "{AppShortName}-{EnvName}-{ServiceName}"
# 5. Redeploy the stack - this creates:
#    ✅ ECS Service with access to populated secrets
#    ✅ Task Definition with environment variables
#    ✅ Running ECS tasks
#
# Why Two-Phase Deployment?
# - Prevents chicken-and-egg problem: CloudFormation can't create service without secrets,
#   but secrets need to be populated manually by project team
# - Phase 1 creates infrastructure and empty secret placeholder
# - Phase 2 (after manual secret population) creates the actual service

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates ECS service name: {AppShortName}-{EnvName}-{ServiceName}
# - Creates target group: {AppShortName}-{EnvName}-{ServiceName}-tg
# - Creates security group: {AppShortName}-{EnvName}-sg-{ServiceName}
#
# Format: Lowercase alphanumeric
# Example: hxis, myapp, webapp
#
# Requirements:
# - Must match AppShortName used in main stack
# - Must match naming convention for IAM permissions

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines log retention (7 days for nprd, 30 days for prod)
#
# Common Values:
# - nprd: Non-production (7-day log retention)
# - nprd-dev: Development (7-day log retention)
# - nprd-stg: Staging (7-day log retention)
# - nprd-sit: System Integration Testing (7-day log retention)
# - nprd-uat: User Acceptance Testing (7-day log retention)
# - prod: Production (30-day log retention)
# - prod-a, prod-b: Multi-region production (30-day log retention)
#
# Requirements:
# - Must match EnvName used in main stack

# --- SERVICE NAME ---
# ServiceName: Individual service identifier
#
# Purpose: Identifies this specific microservice within the application
#
# Format: Lowercase alphanumeric
# Example: api, web, worker, r4, auth, payment
#
# Requirements:
# - Must be unique within the application (AppShortName + EnvName)
# - Used in resource names: ECS service, target group, security group
# - Keep it short and descriptive

# --- VPC ID ---
# VpcId: VPC identifier where ECS tasks will run
#
# Purpose: Specifies which VPC to deploy ECS tasks
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-09528f37a12368b13
#
# Requirements:
# - Must match VpcId used in main stack
# - VPC must have private subnets for ECS tasks
# - VPC must have VPC endpoints for ECR, S3, CloudWatch, Secrets Manager, SSM

# --- APP SUBNET IDS ---
# AppSubnetIds: Private subnet IDs for ECS tasks
#
# Purpose: Specifies which subnets to deploy ECS tasks
#
# Format: subnet-abc123,subnet-def456,subnet-ghi789 (comma-separated, no spaces)
# Example: subnet-0e3f828d570c58f11,subnet-0d1706693a418f5a3
#
# Requirements:
# - Must be private subnets
# - Must match subnets used in main stack (or subset)
# - Must be in different Availability Zones (for high availability)
# - Minimum 2 subnets required, 3 recommended
# - Subnets must have internet access via NAT Gateway or VPC endpoints

# --- VPC SUBNET CIDR (AZ1, AZ2, AZ3) ---
# VPCSubnetCidrAZ1/AZ2/AZ3: CIDR ranges for private subnets
#
# Purpose: Used in security group rules to allow traffic from ALB to ECS tasks
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.53.144.128/26, 10.53.144.192/26
#
# Requirements:
# - Must match the CIDR ranges of the subnets in AppSubnetIds
# - Used for ECS task security group ingress rules
# - VPCSubnetCidrAZ3 is optional (only if using 3 AZs)

# --- VPC SUBNET CIDR DB (AZ1, AZ2, AZ3) ---
# VPCSubnetCidrDBAZ1/AZ2/AZ3: CIDR ranges for database subnets
#
# Purpose: Allow ECS tasks to connect to RDS databases or ElastiCache
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.53.144.128/26, 10.53.144.192/26
#
# Use Cases:
# - ECS tasks need to connect to RDS PostgreSQL/MySQL
# - ECS tasks need to connect to ElastiCache Redis
# - ECS tasks need to connect to other database resources
#
# Requirements:
# - Must be the CIDR ranges where database resources are deployed
# - Used for database security group egress rules from ECS tasks
# - VPCSubnetCidrDBAZ3 is optional (only if using 3 AZs)

# --- ECS CLUSTER NAME ---
# ECSClusterName: Name of the ECS cluster
#
# Purpose: Specifies which ECS cluster to deploy the service to
#
# Format: {AppShortName}-{EnvName}-ecs
# Example: hxis-nprd-dev-ecs
#
# Requirements:
# - Must match ECS cluster created by main stack
# - Service reads cluster name from SSM parameter: /{ECSClusterName}-ECSClusterName

# --- ALB NAME ---
# ALBName: Application Load Balancer name
#
# Purpose: Specifies which ALB to attach the service to
#
# Format: {AppShortName}-{EnvName}-ecs-alb
# Example: hxis-nprd-dev-ecs-alb
#
# Requirements:
# - Must match ALB created by main stack
# - Service reads ALB listener ARN from SSM parameter: /{ALBName}-HTTPSListenerArn
# - Service reads ALB security group from SSM parameter: /{ALBName}-ALBSecurityGroupId

# --- ECR IMAGE ---
# ECRImage: ECR image URI with tag
#
# Purpose: Specifies which container image to deploy
#
# Format: account.dkr.ecr.region.amazonaws.com/repository:tag
# Example: 533267434948.dkr.ecr.ap-southeast-1.amazonaws.com/myapp-ecr-repo:latest
#
# Requirements:
# - Image must exist in ECR
# - Image must be in same region as ECS cluster
# - Must include tag (e.g., :latest, :v1.0.0, :commit-sha)
# - Container must implement health check endpoint
# - Container must listen on ServiceContainerPort
#

# --- CPU UNITS ---
# CPUUnits: CPU allocation for ECS task
#
# Purpose: Defines compute capacity for container
#
# Values:
# - 256 = 0.25 vCPU
# - 512 = 0.5 vCPU
# - 1024 = 1 vCPU
# - 2048 = 2 vCPU
# - 4096 = 4 vCPU
#
# Recommendations:
# - Small workloads (simple APIs): 256-512
# - Medium workloads (standard APIs): 512-1024
# - Large workloads (heavy processing): 1024-2048
# - Very large workloads: 2048-4096
#
# Cost Considerations:
# - Higher CPU = higher cost
# - Monitor CPU utilization in CloudWatch
# - Start small and scale up if needed

# --- MEMORY ---
# Memory: Memory allocation for ECS task in MiB
#
# Purpose: Defines memory capacity for container
#
# Valid CPU/Memory Combinations:
# - CPU: 256  → Memory: 512, 1024, 2048
# - CPU: 512  → Memory: 1024, 2048, 3072, 4096
# - CPU: 1024 → Memory: 2048, 3072, 4096, 5120, 6144, 7168, 8192
# - CPU: 2048 → Memory: 4096 to 16384 (1 GB increments)
# - CPU: 4096 → Memory: 8192 to 30720 (1 GB increments)
#
# Recommendations:
# - Small workloads: 512-1024 MiB
# - Medium workloads: 1024-2048 MiB
# - Large workloads: 2048-4096 MiB
# - Memory-intensive workloads: 4096+ MiB
#
# Important:
# - Must be compatible with CPUUnits (see combinations above)
# - Monitor memory utilization in CloudWatch
# - Out-of-memory errors will crash containers

# --- ECS CPU ARCHITECTURE ---
# ECSCpuArchitecture: CPU architecture for Fargate task
#
# Options:
# - ARM64: AWS Graviton2 processors (cost-optimized)
# - X86_64: Intel/AMD processors (standard)
#
# ARM64 (Graviton2):
# - ✅ 20% better price-performance
# - ✅ Lower cost per vCPU
# - ⚠️  Ensure your container image is built for arm64
# - 💡 Use: docker buildx build --platform linux/arm64
#
# X86_64 (Intel/AMD):
# - ✅ Wider software compatibility
# - ✅ Standard architecture
# - ⚠️  Higher cost per vCPU
# - 💡 Use: docker buildx build --platform linux/amd64
#
# Recommendations:
# - Use ARM64 for most workloads (cost savings)
# - Use X86_64 if software requires x86 architecture

# --- ECS OPERATING SYSTEM FAMILY ---
# ECSOperatingSystemFamily: Operating system for Fargate task
#
# Options:
# - LINUX: Linux containers (most common)
# - WINDOWS_SERVER_2019_CORE: Windows containers
#
# Recommendations:
# - Use LINUX for most workloads
# - Use WINDOWS_SERVER_2019_CORE only if application requires Windows

# --- CONTAINER USER ---
# ContainerUser: Non-root user to run the container process (ECS.20 remediation)
#
# Purpose:
# - Addresses AWS Security Hub finding ECS.20 (AWS Foundational Security Best Practices)
# - Ensures containers run as a non-root user, reducing blast radius if container is compromised
# - Applied only to Linux containers (ignored for Windows containers via IsLinuxOS condition)
#
# Format: UID or UID:GID
# Examples:
# - "1000"       → run as user with UID 1000
# - "1000:1000"  → run as UID 1000, GID 1000
# - "appuser"    → run as named user (must exist in container image)
#
# Requirements:
# - The specified UID/user must exist inside the container image
# - Container application must not require root-level OS access
# - Verify your container image supports running as non-root before changing from default
#
# Default: "1000"

# --- SERVICE CONTAINER PORT ---
# ServiceContainerPort: Port your container listens on
#
# Purpose: Defines which port the container exposes for traffic
#
# Requirements:
# - Container must listen on this port
# - Health check endpoint must be accessible on this port
# - ALB target group will forward traffic to this port

# --- CONTAINER PROTOCOL ---
# ContainerProtocol: Protocol for container communication
#
# Options:
# - tcp: TCP protocol (HTTP, HTTPS, most applications)
# - udp: UDP protocol (streaming, gaming, VoIP)
#
# Recommendations:
# - Use tcp for most applications
# - Use udp only for specific UDP-based protocols

# --- CREATE NEW TASK DEFINITION ---
# CreateNewTaskDefinition: Whether to create new task definition family
#
# Options:
# - true: Create new task definition family (default, recommended)
# - false: Use existing task definition family
#
# When to use true:
# - First deployment of service
# - Creating a new service
# - Standard use case
#
# When to use false:
# - Updating existing task definition
# - Using task definition created outside CloudFormation
# - Must provide ExistingTaskFamily

# --- EXISTING TASK FAMILY ---
# ExistingTaskFamily: Name of existing task definition family
#
# Purpose: Use existing task definition instead of creating new one
#
# Format: {AppShortName}-{EnvName}-{ServiceName}
# Example: hxis-nprd-dev-r4
#
# Requirements:
# - Only used if CreateNewTaskDefinition=false
# - Task family must already exist
# - Leave empty ("") if CreateNewTaskDefinition=true

# --- ECS DESIRED TASK COUNT ---
# ECSDesiredTaskCount: Number of tasks to run
#
# Purpose: Defines how many container instances to run
#
# Recommendations:
# Development (nprd-dev):
# - 1 task (cost-optimized)
# - No high availability needed
#
# Staging/UAT:
# - 2 tasks (basic high availability)
# - Multi-AZ distribution
#
# Production:
# - 3+ tasks (high availability)
# - Multi-AZ distribution
# - Can handle AZ failures
# - Enable auto-scaling for dynamic workloads
#
# Note:
# - More tasks = higher availability + higher cost
# - Tasks distributed across AZs automatically
# - Can be overridden by auto-scaling

# --- PATH PATTERN ---
# PathPattern/PathPattern2/PathPattern3: ALB routing path patterns
#
# Purpose: Defines which HTTP paths route to this service
#
# Format: /path/* or /exact/path
# Examples:
# - /api/*: Routes all /api/* requests to this service
# - /r4/*: Routes all /r4/* requests
# - /*: Routes all requests (catch-all)
# - /health: Exact path match
#
# Multiple Patterns:
# - PathPattern: Primary pattern (required)
# - PathPattern2: Additional pattern (optional)
# - PathPattern3: Third pattern (optional)
# - Leave PathPattern2/3 empty ("") if not needed

# --- ALB RULE PRIORITY FOR SERVICE ---
# ALBRulePriorityForService: ALB listener rule priority
#
# Purpose: Determines order of rule evaluation (lower number = higher priority)
#
# How Priority Works:
# - ALB evaluates rules from lowest to highest priority number
# - First matching rule is used
# - Priority must be unique across all services
# - Range: 1-50000
#
# Recommendations:
# - Critical services (authentication): 1-10
# - Important services (API): 11-50
# - Standard services: 51-500
# - Catch-all routes (/*): 999
#
# Example Priority Assignment:
# - Priority 1: /auth/* (authentication service)
# - Priority 10: /api/v1/* (API v1)
# - Priority 20: /api/v2/* (API v2)
# - Priority 100: /app/* (application)
# - Priority 999: /* (default/catch-all)

# --- ECS SERVICE PROTOCOL ---
# ECSServiceProtocol: Target group protocol
#
# Options:
# - HTTP: HTTP traffic (most common)
# - HTTPS: HTTPS traffic (end-to-end encryption)
#
# Recommendations:
# - Use HTTP for most services (ALB handles SSL termination)
# - Use HTTPS only if end-to-end encryption required
# - HTTP is simpler and ALB already provides HTTPS to clients

# --- TARGET GROUP HEALTH CHECK ---
# Target Group Health Check Parameters:
#
# TGHealthCheckPath:
# - HTTP endpoint that returns 200 OK when healthy
# - Example: /health, /api/health, /healthz
# - Your application MUST implement this endpoint
#
# TGHealthCheckIntervalSeconds:
# - How often to check (5-300 seconds)
# - Shorter interval = faster failure detection + more requests
# - Recommendations: 15s (production), 30s (development)
#
# TGHealthCheckTimeoutSeconds:
# - How long to wait for response (2-120 seconds)
# - Must be less than interval
# - Recommendations: 5s (fast response), 10s (slow response)
#
# TGHealthyThresholdCount:
# - Consecutive successes before marking healthy (2-10)
# - Recommendations: 2-3 (faster recovery)
#
# TGUnhealthyThresholdCount:
# - Consecutive failures before marking unhealthy (2-10)
# - Recommendations: 3-5 (avoid false positives)
#
# Health Check Logic:
# - Task starts → Grace period → Health checks begin
# - Consecutive successes (TGHealthyThresholdCount) → Task is healthy
# - Consecutive failures (TGUnhealthyThresholdCount) → Task is unhealthy
# - Unhealthy tasks are stopped and replaced

# --- CONTAINER HEALTH CHECK ---
# Docker Container Health Check (runs inside container):
#
# EnableContainerHealthCheck:
# - true: Enable Docker health check (recommended)
# - false: Disable Docker health check
#
# ContainerHealthCheckCommand:
# - Command to run inside container to check health
# - Format: CMD-SHELL,<command>
# - Examples:
#   - CMD-SHELL,curl -f http://localhost:8080/health || exit 1
#   - CMD-SHELL,wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1
#   - CMD-SHELL,/app/healthcheck.sh
#
# ContainerHealthCheckInterval:
# - How often to run check (seconds)
# - Recommendations: 30s
#
# ContainerHealthCheckTimeout:
# - How long to wait for check to complete (seconds)
# - Recommendations: 5s
#
# ContainerHealthCheckStartPeriod:
# - Grace period before checks start (seconds)
# - Allows container to initialize
# - Recommendations: 60s (simple apps), 120s (complex apps)
#
# ContainerHealthCheckRetries:
# - Number of consecutive failures before unhealthy
# - Recommendations: 3
#
# Why Both ALB and Container Health Checks?
# - ALB health check: External validation (can ALB reach the service?)
# - Container health check: Internal validation (is the application healthy?)
# - Both provide comprehensive health monitoring

# --- ENVIRONMENT VARIABLES & SECRETS ---
# EnvVarConnectionStringSecretName:
# - AWS Secrets Manager secret name
# - Leave empty ("") on FIRST deployment (Phase 1)
# - Populate secret in AWS console
# - Set to secret name on SECOND deployment (Phase 2)
#
# Format: {AppShortName}-{EnvName}-{ServiceName}
# Example: hxis-nprd-dev-r4
#
# Secret Value Format (JSON):
# {
#   "ConnectionStrings__DefaultConnection": "Host=db.example.com;Database=mydb;...",
#   "API_KEY": "secret-key-value",
#   "JWT_SECRET": "jwt-secret-value"
# }
#
# How Secrets Are Used:
# - CloudFormation creates empty secret (Phase 1)
# - You manually populate secret in AWS console
# - CloudFormation creates ECS service with secret reference (Phase 2)
# - ECS injects secrets as environment variables at runtime
# - Secrets are never visible in task definition or logs

# --- ADDITIONAL ENVIRONMENT VARIABLES ---
# EnvVar1/2/3Name and EnvVar1/2/3Value:
# - Non-sensitive configuration
# - Stored directly in task definition (visible in console/logs)
# - Examples: LOG_LEVEL=INFO, API_VERSION=v1.0.0, REGION=ap-southeast-1
#
# When to use:
# - Non-sensitive values
# - Configuration that can be public
# - Values that don't change often
#
# When NOT to use:
# - Database passwords, API keys, secrets
# - Use Secrets Manager instead

# --- AUTO-SCALING CONFIGURATION ---
# EnableAutoScaling:
# - true: Enable auto-scaling based on CPU/Memory
# - false: Fixed number of tasks (ECSDesiredTaskCount)
#
# MinContainers/MaxContainers:
# - Minimum and maximum number of tasks when auto-scaling
# - Recommendations:
#   - Development: Disable auto-scaling, use fixed 1 task
#   - Staging/UAT: Min=2, Max=4
#   - Production: Min=3, Max=10+
#
# CPUUtilizationThreshold:
# - Target CPU utilization percentage (0-100)
# - Auto-scaling adds tasks when CPU exceeds threshold
# - Recommendations: 60-70% (balanced)
#
# MemoryUtilizationThreshold:
# - Target memory utilization percentage (0-100)
# - Auto-scaling adds tasks when memory exceeds threshold
# - Recommendations: 60-70% (balanced)
#
# How Auto-Scaling Works:
# - ECS monitors CPU and memory metrics
# - When threshold exceeded, adds tasks (up to MaxContainers)
# - When utilization drops, removes tasks (down to MinContainers)
# - Scale-out is faster than scale-in (safety)

# --- MONITORING & LOGGING ---
# LogsRetentionInDays:
# - How long to keep CloudWatch Logs
# - Longer retention = higher cost
# - Recommendations:
#   - Development: 7 days
#   - Staging/UAT: 14-30 days
#   - Production: 30-90 days
#   - Compliance: 365+ days
#
# EnableADOT:
# - true: Enable OpenTelemetry tracing/metrics
# - false: Disable ADOT integration
# - Requires ADOT collector deployed in main stack
#
# ADOTEndpoint:
# - ADOT collector endpoint URL
# - Example: https://adot.healthx.sg
# - Set to "disabled" if EnableADOT=false
# - Used for distributed tracing with X-Ray
# - Used for custom metrics to CloudWatch

# --- VPC CIDR RANGES ---
# VpcCidr1/VpcCidr2/VpcCidr3/VpcCidr4/VpcCidr5:
# - VPC CIDR blocks for security group rules
# - Used to allow traffic from VPC to ECS tasks
# - VpcCidr1: Primary VPC CIDR (required)
# - VpcCidr2/VpcCidr3/VpcCidr4/VpcCidr5: Additional CIDRs (optional, for VPC peering)
#
# S3PrefixListId:
# - Prefix list ID for S3 service
# - Allows ECS tasks to access S3 via VPC endpoint (egress rule on port 443)
# - Format: pl-xxxxxxxx
# - Example: pl-6fa54006
#
# How to find S3 Prefix List ID:
# 1. Open AWS Console → VPC → Managed Prefix Lists
# 2. Look for the prefix list with name "com.amazonaws.ap-southeast-1.s3"
# 3. Copy the Prefix List ID (e.g., pl-6fa54006)
#
# DynamoDBPrefixListId:
# - Prefix list ID for DynamoDB service
# - Allows ECS tasks to access DynamoDB via VPC endpoint (egress rule on port 443)
# - Format: pl-xxxxxxxx
# - Leave empty ("") if service does not require DynamoDB access
#
# How to find DynamoDB Prefix List ID:
# 1. Open AWS Console → VPC → Managed Prefix Lists
# 2. Look for the prefix list with name "com.amazonaws.ap-southeast-1.dynamodb"
# 3. Copy the Prefix List ID
#
# ExternalServicesPrefixListId:
# - Customer-managed prefix list ID for external services (e.g. CAG, ESB) reached over HTTPS 443
# - Single prefix list covering ALL external service IPs the application needs to reach outbound
# - Adds one egress rule on port 443 to the ECS task security group when set
# - Format: pl-xxxxxxxx
# - Leave empty ("") if service does not call external services from the task
#
# How to find / create the External Services Prefix List:
# 1. Open AWS Console → VPC → Managed Prefix Lists
# 2. Either reuse an existing customer-managed prefix list OR create a new one
#    populated with the external service IPs/CIDRs (CAG, ESB, etc.)
# 3. Copy the Prefix List ID
#
# Sanity check BEFORE providing the Prefix List ID (project team responsibility):
# - [ ] Prefix list exists in the SAME region and SAME account as this ECS stack
#       (cross-account/region prefix lists cannot be referenced directly)
# - [ ] Owner type is "self" (customer-managed), NOT an AWS-managed prefix list
# - [ ] Entries cover ALL external service IPs/CIDRs the application calls outbound
#       (confirm the current list with the external service / network team)
# - [ ] MaxEntries on the prefix list has headroom for future additions
#       (MaxEntries counts against the SG rule quota — see "Why one prefix list" below)
# - [ ] ECS task security group still has rule-quota headroom
#       (default quota is 60 rules per SG — each prefix list rule consumes
#        capacity equal to its MaxEntries, not 1)
# - [ ] External services are reachable on HTTPS port 443
#       (this template only opens 443; raise with infra team if other ports needed)
#
# Why one prefix list (not separate per service):
# - Each prefix list reserves SG rule capacity equal to its MaxEntries — multiple
#   prefix lists consume more of the (default 60) rules-per-SG quota for the same effect
# - Centralised maintenance: project teams update one list when external service IPs change
#
# HCCVpceCidr:
# - HCC VPC endpoint CIDR for external connectivity
# - Leave empty ("") if not using HCC connectivity

# --- HCC BCS PROXY (optional) ---
# HCCSubnetCidrBCSAZ1/HCCSubnetCidrBCSAZ2:
# - HCC BCS proxy subnet CIDRs used for outbound proxy egress.
# - Leave empty ("") if the application does not call external services through BCS proxy.
# - When provided, the ECS service security group adds TCP egress to the CIDR on BCSProxyPort.
#
# BCSProxyPort:
# - BCS proxy listener port.
# - Default is "4000".

# --- RDS PROXY (optional) ---
# UseRDSProxy: yes/no toggle (default "no")
# - Set to "yes" if the application connects to the database via RDS Proxy.
# - When "yes", the ECS service security group adds 3 conditional egress rules
#   on RDSProxyPort to VPCSubnetCidrDBAZ1, VPCSubnetCidrDBAZ2, and (if defined)
#   VPCSubnetCidrDBAZ3 — RDS Proxy ENIs live in the DB subnets.
# - When "no", no extra egress is added (default direct DB egress already in place).
#
# RDSProxyPort: RDS Proxy listener port (default "1433")
# - Common values:
#     - 1433 → SQL Server
#     - 5432 → PostgreSQL
#     - 3306 → MySQL/MariaDB
# - Used only when UseRDSProxy="yes".

