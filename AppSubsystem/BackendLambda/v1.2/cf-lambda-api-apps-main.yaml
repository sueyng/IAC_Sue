  LambdaApp20:
    Type: AWS::CloudFormation::Stack
    Condition: DeployLambda20
    Properties:
      NotificationARNs: !If
        - HasStackNotifications
        - - !Ref StackNotificationSNSTopicArn
        - !Ref 'AWS::NoValue'
      TemplateURL: !Sub 'https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-lambda-api-app.yaml'
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        LambdaS3bucket: !Ref LambdaS3bucket
        CodeZipFileName: !Ref Lambda20CodeZipFileName
        LambdaFunctionName: !Ref Lambda20FunctionName
        SubnetIds: !Join [',', !Ref SubnetIds]
        LogRetentionInDays: !Ref LogRetentionInDays
        LambdaRuntime: !Ref Lambda20Runtime
        LambdaHandler: !Ref Lambda20Handler
        LambdaMemorySize: !Ref Lambda20MemorySize
        LambdaTimeout: !Ref Lambda20Timeout
        ApiResourcePath: !Ref Lambda20ApiResourcePath
        ApiHttpMethod: !Ref Lambda20ApiHttpMethod
        TimeZone: !Ref Lambda20TimeZone