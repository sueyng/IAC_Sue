AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack for Lambda Applications deployment (up to 20 Lambda functions)

Parameters:
  # Common Parameters
  AppShortName:
    Type: String
    Description: Application short name
    Default: 'healthb'

  EnvName:
    Type: String
    Description: Environment name
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
    Default: nprd

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of Subnet IDs for Lambda functions
    Default: subnet-0fe7a1d34484c75cf,subnet-0610b1fee398eb38b

  LogRetentionInDays:
    Type: Number
    Default: 14
    Description: Number of days for Log Retention

  LambdaS3bucket:
    Type: String
    Description: S3 bucket for Lambda function code
    Default: 'health-nprd-cftemplates'

  NumberOfLambdaFunctions:
    Type: Number
    Description: Number of Lambda functions to deploy (1-20)
    Default: 1
    MinValue: 1
    MaxValue: 20
    ConstraintDescription: Must be a number between 1 and 20

  # Lambda 1 Configuration
  Lambda1FunctionName:
    Type: String
    Description: Name for Lambda function 1
    Default: 'HealthBuddyAdmissionSubmitPayment'

  Lambda1CodeZipFileName:
    Type: String
    Description: Code zip file name for Lambda function 1
    Default: 'parent-child-stacks/HealthBuddy.Admission.SubmitPayment-1.0.0.4.zip'

  Lambda1Runtime:
    Type: String
    Description: Runtime for Lambda function 1
    Default: 'dotnet8'

  Lambda1Handler:
    Type: String
    Description: Handler for Lambda function 1
    Default: 'HealthBuddy.Admission.SubmitPayment::HealthBuddy.Admission.SubmitPayment.Function::FunctionHandler'

  Lambda1MemorySize:
    Type: Number
    Default: 1024
    Description: Memory size for Lambda function 1 in MB
    MinValue: 128
    MaxValue: 10240

  Lambda1Timeout:
    Type: Number
    Default: 25
    Description: Timeout for Lambda function 1 in seconds
    MinValue: 1
    MaxValue: 900

  Lambda1ApiResourcePath:
    Type: String
    Description: API Gateway resource path for Lambda 1 (e.g., admissions/submit-payment)
    Default: 'admissions/submit-payment'

  Lambda1ApiHttpMethod:
    Type: String
    Description: HTTP method for Lambda 1 API endpoint
    AllowedValues: 
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    Default: 'POST'

  Lambda1TimeZone:
    Type: String
    Description: Timezone for Lambda function 1 (TZ environment variable)
    Default: 'Asia/Singapore'

