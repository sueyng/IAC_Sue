    Type: String
    Description: Name for Lambda function 20
    Default: ''

  Lambda20CodeZipFileName:
    Type: String
    Description: Code zip file name for Lambda function 20
    Default: ''

  Lambda20Runtime:
    Type: String
    Description: Runtime for Lambda function 20
    Default: 'dotnet8'

  Lambda20Handler:
    Type: String
    Description: Handler for Lambda function 20
    Default: ''

  Lambda20MemorySize:
    Type: Number
    Default: 1024
    Description: Memory size for Lambda function 20 in MB
    MinValue: 128
    MaxValue: 10240

  Lambda20Timeout:
    Type: Number
    Default: 25
    Description: Timeout for Lambda function 20 in seconds
    MinValue: 1
    MaxValue: 900

  Lambda20ApiResourcePath:
    Type: String
    Description: API Gateway resource path for Lambda 20 (e.g., admissions/submit-payment)
    Default: ''

  Lambda20ApiHttpMethod:
    Type: String
    Description: HTTP method for Lambda 20 API endpoint
    AllowedValues: 
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    Default: 'POST'

  Lambda20TimeZone:
    Type: String
    Description: Timezone for Lambda function 20 (TZ environment variable)
    Default: 'Asia/Singapore'

  # Stack Notification Configuration (Optional - Recommended for new stack creation)
  EnableStackNotifications:
    Type: String
    Description: Enable CloudFormation stack event notifications to SNS topic. Recommended 'yes' for NEW stack creation only - see README for limitations on existing stacks.
    AllowedValues: ['yes', 'no']
    Default: 'no'
  StackNotificationSNSTopicArn:
    Type: String
    Description: ARN of an existing SNS topic for CloudFormation stack event notifications (required when EnableStackNotifications=yes; project team must provision the topic separately)
    Default: ''

Conditions:
  HasStackNotifications: !And
    - !Equals [!Ref EnableStackNotifications, 'yes']
    - !Not [!Equals [!Ref StackNotificationSNSTopicArn, '']]
  # Number conditions
  NumberLambda20: !Equals [20, !Ref NumberOfLambdaFunctions]
  NumberLambda19: !Or [!Equals [19, !Ref NumberOfLambdaFunctions], !Condition NumberLambda20]
  NumberLambda18: !Or [!Equals [18, !Ref NumberOfLambdaFunctions], !Condition NumberLambda19]
  NumberLambda17: !Or [!Equals [17, !Ref NumberOfLambdaFunctions], !Condition NumberLambda18]
  NumberLambda16: !Or [!Equals [16, !Ref NumberOfLambdaFunctions], !Condition NumberLambda17]
  NumberLambda15: !Or [!Equals [15, !Ref NumberOfLambdaFunctions], !Condition NumberLambda16]
  NumberLambda14: !Or [!Equals [14, !Ref NumberOfLambdaFunctions], !Condition NumberLambda15]
  NumberLambda13: !Or [!Equals [13, !Ref NumberOfLambdaFunctions], !Condition NumberLambda14]
  NumberLambda12: !Or [!Equals [12, !Ref NumberOfLambdaFunctions], !Condition NumberLambda13]
  NumberLambda11: !Or [!Equals [11, !Ref NumberOfLambdaFunctions], !Condition NumberLambda12]
  NumberLambda10: !Or [!Equals [10, !Ref NumberOfLambdaFunctions], !Condition NumberLambda11]
  NumberLambda9: !Or [!Equals [9, !Ref NumberOfLambdaFunctions], !Condition NumberLambda10]
  NumberLambda8: !Or [!Equals [8, !Ref NumberOfLambdaFunctions], !Condition NumberLambda9]
  NumberLambda7: !Or [!Equals [7, !Ref NumberOfLambdaFunctions], !Condition NumberLambda8]
  NumberLambda6: !Or [!Equals [6, !Ref NumberOfLambdaFunctions], !Condition NumberLambda7]
  NumberLambda5: !Or [!Equals [5, !Ref NumberOfLambdaFunctions], !Condition NumberLambda6]
  NumberLambda4: !Or [!Equals [4, !Ref NumberOfLambdaFunctions], !Condition NumberLambda5]
  NumberLambda3: !Or [!Equals [3, !Ref NumberOfLambdaFunctions], !Condition NumberLambda4]
  NumberLambda2: !Or [!Equals [2, !Ref NumberOfLambdaFunctions], !Condition NumberLambda3]
  NumberLambda1: !Or [!Equals [1, !Ref NumberOfLambdaFunctions], !Condition NumberLambda2]

  # Final deployment conditions combining number check and name check
  DeployLambda1: !And [!Condition NumberLambda1, !Not [!Equals [!Ref Lambda1FunctionName, ""]]]
  DeployLambda2: !And [!Condition NumberLambda2, !Not [!Equals [!Ref Lambda2FunctionName, ""]]]
  DeployLambda3: !And [!Condition NumberLambda3, !Not [!Equals [!Ref Lambda3FunctionName, ""]]]
  DeployLambda4: !And [!Condition NumberLambda4, !Not [!Equals [!Ref Lambda4FunctionName, ""]]]
  DeployLambda5: !And [!Condition NumberLambda5, !Not [!Equals [!Ref Lambda5FunctionName, ""]]]
  DeployLambda6: !And [!Condition NumberLambda6, !Not [!Equals [!Ref Lambda6FunctionName, ""]]]
  DeployLambda7: !And [!Condition NumberLambda7, !Not [!Equals [!Ref Lambda7FunctionName, ""]]]
  DeployLambda8: !And [!Condition NumberLambda8, !Not [!Equals [!Ref Lambda8FunctionName, ""]]]
  DeployLambda9: !And [!Condition NumberLambda9, !Not [!Equals [!Ref Lambda9FunctionName, ""]]]
  DeployLambda10: !And [!Condition NumberLambda10, !Not [!Equals [!Ref Lambda10FunctionName, ""]]]
  DeployLambda11: !And [!Condition NumberLambda11, !Not [!Equals [!Ref Lambda11FunctionName, ""]]]
  DeployLambda12: !And [!Condition NumberLambda12, !Not [!Equals [!Ref Lambda12FunctionName, ""]]]
  DeployLambda13: !And [!Condition NumberLambda13, !Not [!Equals [!Ref Lambda13FunctionName, ""]]]
  DeployLambda14: !And [!Condition NumberLambda14, !Not [!Equals [!Ref Lambda14FunctionName, ""]]]
  DeployLambda15: !And [!Condition NumberLambda15, !Not [!Equals [!Ref Lambda15FunctionName, ""]]]
  DeployLambda16: !And [!Condition NumberLambda16, !Not [!Equals [!Ref Lambda16FunctionName, ""]]]
  DeployLambda17: !And [!Condition NumberLambda17, !Not [!Equals [!Ref Lambda17FunctionName, ""]]]
  DeployLambda18: !And [!Condition NumberLambda18, !Not [!Equals [!Ref Lambda18FunctionName, ""]]]
  DeployLambda19: !And [!Condition NumberLambda19, !Not [!Equals [!Ref Lambda19FunctionName, ""]]]
  DeployLambda20: !And [!Condition NumberLambda20, !Not [!Equals [!Ref Lambda20FunctionName, ""]]]

Resources:
  # Lambda App 1
  LambdaApp1:
    Type: AWS::CloudFormation::Stack
    Condition: DeployLambda1
    Properties:
      NotificationARNs: !If
        - HasStackNotifications
        - - !Ref StackNotificationSNSTopicArn
        - !Ref 'AWS::NoValue'
      TemplateURL: !Sub 'https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-lambda-api-app.yaml'
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        LambdaS3bucket: !Ref LambdaS3bucket
        CodeZipFileName: !Ref Lambda1CodeZipFileName
        LambdaFunctionName: !Ref Lambda1FunctionName
        SubnetIds: !Join [',', !Ref SubnetIds]
        LogRetentionInDays: !Ref LogRetentionInDays
        LambdaRuntime: !Ref Lambda1Runtime
        LambdaHandler: !Ref Lambda1Handler
        LambdaMemorySize: !Ref Lambda1MemorySize
        LambdaTimeout: !Ref Lambda1Timeout
        ApiResourcePath: !Ref Lambda1ApiResourcePath
        ApiHttpMethod: !Ref Lambda1ApiHttpMethod
