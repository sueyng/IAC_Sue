# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates prefix list name: {AppShortName}-{EnvName}-prefixlist-{PrefixListPurpose}
#
# Format: Lowercase alphanumeric
# Example: myapp, api, webapp
#
# Finding the value:
# - Check with your team for the standard application identifier
# - Must match AppShortName used in other infrastructure stacks

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose: Used in prefix list naming
#
# Common Values:
# - nprd: Non-production
# - nprd-dev: Development
# - nprd-stg: Staging
# - nprd-sit: System Integration Testing
# - nprd-uat: User Acceptance Testing
# - prod: Production
# - prod-a, prod-b: Multi-region production

# --- PREFIX LIST PURPOSE ---
# PrefixListPurpose: Purpose identifier for prefix list
#
# Purpose: Identifies what the prefix list is used for
#
# Format: Lowercase alphanumeric with hyphens
# Example: dynamodb, s3, external-api-twilio, external-api-formsg
#
# Common Values:
# - dynamodb: DynamoDB service endpoints
# - s3: S3 service endpoints
# - external-api: External API endpoints (generic)
# - external-api-twilio: Twilio API endpoints
# - external-api-formsg: FormSG API endpoints
# - cloudfront: CloudFront endpoints
#
# Best Practices:
# - Use descriptive purpose names
# - Create separate prefix lists for each service type
# - Don't mix different service CIDRs in one prefix list

# --- PREFIX LIST DESCRIPTION ---
# PrefixListDescription: Human-readable description
#
# Purpose: Describes what the prefix list contains
#
# Format: Plain text
# Example: "DynamoDB service endpoints for Lambda access", "Twilio API endpoints for SMS/WhatsApp"
#
# Best Practices:
# - Describe the service or purpose
# - Mention region if region-specific
# - Keep it concise

# --- MAX ENTRIES ---
# MaxEntries: Maximum number of CIDR entries allowed in prefix list
#
# Purpose: Sets capacity limit for future growth
#
# Range: 1-1000
# Default: 50
#
# Important:
# - MaxEntries can be INCREASED but NOT DECREASED
# - No cost difference for higher MaxEntries (unused capacity)
# - Plan ahead: set to 50 for future growth
#
# Recommendations:
# - Small lists (< 10 CIDRs): 20-30
# - Medium lists (10-30 CIDRs): 50
# - Large lists (> 30 CIDRs): 100+

# --- NUMBER OF ENTRIES ---
# NumberOfEntries: Current number of CIDR entries to create
#
# Purpose: Specifies how many CIDRs to add now
#
# Range: 1-20 (limited by template, not AWS)
# Example: 4
#
# Requirements:
# - Must be ≤ MaxEntries
# - Only fill CidrEntry01 through CidrEntry{NumberOfEntries}
# - Leave remaining entries empty ("")
#
# Example:
# If NumberOfEntries: 4
# - Fill CidrEntry01, CidrEntry02, CidrEntry03, CidrEntry04
# - Leave CidrEntry05-20 empty

# --- CIDR ENTRY ---
# CidrEntry01-20: CIDR block for prefix list entry
#
# Purpose: Defines IP address range for this entry
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 52.94.0.0/16, 10.0.0.0/24, 192.168.1.0/32
#
# Valid CIDR Ranges:
# - IPv4: 0.0.0.0/0 to 255.255.255.255/32
# - Netmask: /0 to /32
#
# Requirements:
# - Must be valid CIDR notation
# - Fill only up to NumberOfEntries
# - Leave unused entries as empty string ("")

# --- ENTRY DESCRIPTION ---
# EntryDescription01-20: Description for CIDR entry
#
# Purpose: Documents what this CIDR represents
#
# Format: Plain text
# Example: "DynamoDB Global Tables", "Twilio Voice/SMS", "S3 Endpoints"
#
# Best Practices:
# - Describe the service or endpoint
# - Mention specific purpose if applicable
# - Keep it concise
# - Fill for all non-empty CIDR entries

