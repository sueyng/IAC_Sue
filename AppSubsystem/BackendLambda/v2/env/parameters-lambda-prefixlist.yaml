# --- PREFIX LIST MANAGEMENT ---
# Updating Prefix Lists:
# 1. Update CIDR entries in parameter file
# 2. Update NumberOfEntries if adding/removing entries
# 3. Update stack with new parameters
# 4. CloudFormation will update the prefix list in-place
#
# Adding More Entries:
# 1. Ensure NumberOfEntries < MaxEntries
# 2. Fill additional CidrEntry## parameters
# 3. Increment NumberOfEntries
# 4. Update stack
#
# Expanding MaxEntries:
# - MaxEntries can be increased but NOT decreased
# - Plan ahead: set to 50 for future growth
# - No cost difference for higher MaxEntries (unused capacity)
#
# Removing Entries:
# 1. Remove CIDR from parameter file (set to "")
# 2. Decrement NumberOfEntries
# 3. Update stack
# 4. Verify prefix list in AWS Console

# --- SECURITY GROUP INTEGRATION ---
# After creating prefix list, use output in security group template:
#
# DynamoDBPrefixListId: "pl-0dynamodb123"  # From prefix list stack output
# S3PrefixListId: "pl-0s3456"              # From prefix list stack output
# AdditionalPrefixListId: "pl-0external789" # From prefix list stack output
#
# Security group egress rules will reference these prefix lists instead of
# individual CIDR entries.
#
# Benefits:
# - Centralized management of CIDRs
# - Update once, applies to all security groups
# - Cleaner security group rules
# - Easier auditing and compliance

# --- RESOURCES CREATED ---

# Managed Prefix List:
#   - Name: {AppShortName}-{EnvName}-prefixlist-{PrefixListPurpose}
#   - Description: {PrefixListDescription}
#   - Address Family: IPv4
#   - Max Entries: {MaxEntries}
#   - Current Entries: {NumberOfEntries}
#   - CIDR Entries:
#     * {CidrEntry01} - {EntryDescription01}
#     * {CidrEntry02} - {EntryDescription02}
#     * ... (up to NumberOfEntries)

# Stack Outputs:
#   - PrefixListId: pl-xxxxxxxxxxxxxxxxx (for use in security groups)
#   - PrefixListArn: arn:aws:ec2:region:account:prefix-list/pl-xxxxxxxxxxxxxxxxx
