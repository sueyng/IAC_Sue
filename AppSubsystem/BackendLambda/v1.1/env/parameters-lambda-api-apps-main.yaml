# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates Lambda function names: {AppShortName}-{EnvName}-{Lambda{N}FunctionName}
# - Creates log groups: /aws/lambda/{AppShortName}-{EnvName}-{Lambda{N}FunctionName}
# - References SSM parameters from infra-main stack
#
# Format: Lowercase alphanumeric
# Example: gms, myapp, webapp
#
# Finding the value:
# - Must match AppShortName used in cf-lambda-api-infra-main.yaml deployment

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines DeletionPolicy (Retain for prod, Delete for nprd)
#
# Common Values:
# - nprd: Base non-production
# - nprd-dev, nprd-dev1, nprd-dev2: Development
# - nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit-a, nprd-sit-b, nprd-sit-c: SIT environments
# - nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c: UAT environments
# - nprd-pt: Performance testing
# - nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c: Pre-production
# - prod, prod-a, prod-b, prod-c: Production

# --- SUBNET IDS ---
# SubnetIds: Private subnet IDs for Lambda function execution
#
# Format: subnet-abc123,subnet-def456 (comma-separated, no spaces)
# Example: subnet-0abc123def456789a,subnet-0def456abc789123b
#
# Requirements:
# - Must be private subnets (NEVER public)
# - Minimum 2 subnets recommended (for high availability)
# - Should match subnets used in infra-main deployment

# --- LOG RETENTION IN DAYS ---
# LogRetentionInDays: CloudWatch Logs retention period for Lambda functions
#
# Valid Values: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653 (days)
#
# Recommendations:
# - Development: 7-14 days
# - Staging/UAT: 14-30 days
# - Production: 90-365 days

# --- LAMBDA S3 BUCKET ---
# LambdaS3bucket: S3 bucket containing Lambda code packages
#
# Format: Bucket name (no s3:// prefix)
# Example: myapp-nprd-app-artifact
#
# Requirements:
# - Bucket must exist before deployment
# - All Lambda zip packages must be uploaded to this bucket
# - Bucket must be in same region as Lambda deployment

# --- NUMBER OF LAMBDA FUNCTIONS ---
# NumberOfLambdaFunctions: How many Lambda functions to deploy
#
# Valid Values: 1-20
#
# Notes:
# - Template supports up to 20 Lambda functions per stack
# - Each function gets its own set of Lambda{N}* parameters
# - Only functions 1 through NumberOfLambdaFunctions are deployed

# --- LAMBDA FUNCTION PARAMETERS (per function) ---
# Lambda{N}FunctionName: Lambda function name suffix
#   Format: PascalCase or descriptive name
#   Example: MyAppSubmitPayment, ProcessOrder, GetUserProfile
#   Final name: {AppShortName}-{EnvName}-{Lambda{N}FunctionName}
#
# Lambda{N}CodeZipFileName: S3 key for Lambda zip package
#   Format: relative path within LambdaS3bucket
#   Example: parent-child-stacks/MyApp-1.0.0.zip
#
# Lambda{N}Runtime: Lambda runtime
#   Valid Values: dotnet8, nodejs20.x, python3.12, java21, etc.
#
# Lambda{N}Handler: Function handler path
#   Format depends on runtime:
#   - dotnet8: Assembly::Namespace.Class::Method
#   - nodejs20.x: index.handler
#   - python3.12: lambda_function.lambda_handler
#
# Lambda{N}MemorySize: Memory allocation in MB
#   Valid Values: 128-10240
#   Default: 1024
#   Note: CPU scales proportionally with memory
#
# Lambda{N}Timeout: Function timeout in seconds
#   Valid Values: 1-900
#   Default: 25
#   Note: API Gateway has 29-second timeout, keep Lambda timeout below 29s for API use
#
# Lambda{N}ApiResourcePath: API Gateway resource path
#   Format: resource/sub-resource (no leading slash)
#   Example: admissions/submit-payment, users/profile
#
# Lambda{N}ApiHttpMethod: HTTP method for API Gateway integration
#   Valid Values: GET, POST, PUT, DELETE, PATCH, OPTIONS
#
# Lambda{N}TimeZone: IANA timezone for Lambda environment
#   Example: Asia/Singapore, UTC, America/New_York
#
# Lambda{N}AliasName: Optional Lambda alias for versioning
#   Leave empty ("") if not using aliases

# --- RESOURCES CREATED (per Lambda function) ---
# Lambda Function: {AppShortName}-{EnvName}-{Lambda{N}FunctionName}
# Log Group: /aws/lambda/{AppShortName}-{EnvName}-{Lambda{N}FunctionName}
# API Gateway Resource: /{Lambda{N}ApiResourcePath}
# API Gateway Method: {Lambda{N}ApiHttpMethod}
# Lambda Permission: API Gateway invoke permission
