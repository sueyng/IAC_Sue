VpcCidr3: ""                            # e.g. 10.195.0.0/16 (tertiary VPC CIDR, optional)
S3PrefixListId: ""                      # e.g. pl-0abc123 (S3 prefix list for egress, optional)

# ADDITIONAL VPC ENDPOINT IP
VPCEndpointIP3: ""                      # e.g. 10.1.140.50 (API Gateway VPC Endpoint IP - AZ3, if using 3 AZs)

# PREFIX LIST (inbound traffic restriction)
PrefixListIdIntranet: ""                # e.g. pl-0xyz789 (restrict inbound to specific IP ranges, optional)

# S3 UPLOAD/DOWNLOAD FEATURE
EnableS3Upload: "false"                 # Enable direct S3 access through ALB (true/false)
