# APPLICATION LOAD BALANCER
ALBName: "<edit_here>"                  # 📝 e.g. myapp-nprd-alb-portal, webapp-prod-alb-intranet
ALBScheme: "<edit_here>"                # 📝 internet-facing or internal
VpcId: "<edit_here>"                    # 📝 e.g. vpc-0d99a0c727b301d67
IngressSubnetIds: "<edit_here>"         # 📝 e.g. subnet-abc123,subnet-def456 (comma-separated, at least 2 AZs)

# VPC ENDPOINT IPs (API Gateway execute-api)
VPCEndpointIP1: "<edit_here>"           # 📝 e.g. 10.1.154.147 (API Gateway VPC Endpoint IP - AZ1)
VPCEndpointIP2: "<edit_here>"           # 📝 e.g. 10.1.138.43 (API Gateway VPC Endpoint IP - AZ2)

# SSL CERTIFICATES
SSLCertificateArn: "<edit_here>"        # 📝 e.g. arn:aws:acm:ap-southeast-1:123456789012:certificate/abc123
AdditionalCertArn: "<edit_here>"        # 📝 e.g. arn:aws:acm:ap-southeast-1:123456789012:certificate/def456 (additional domain)

# NETWORK SECURITY
VpcCidr1: "<edit_here>"                 # 📝 e.g. 10.193.0.0/16 (primary VPC CIDR)
HCCVpceCidr: "<edit_here>"              # 📝 e.g. 10.48.42.0/24 (HCC VPC Endpoint subnet)

