# ================================================================================
# 📖 PARAMETER REFERENCE
# ================================================================================

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines configuration settings
#
# Common Values:
# - nprd: Non-production
# - nprd-dev: Development
# - nprd-stg: Staging
# - nprd-sit: System Integration Testing
# - nprd-uat: User Acceptance Testing
# - prod: Production
# - prod-a, prod-b: Multi-region production

# --- ALB NAME ---
# ALBName: Application Load Balancer name
#
# Purpose: Identifies the ALB resource
#
# Format: Lowercase alphanumeric with hyphens
# Example: myapp-nprd-alb-portal, webapp-prod-alb-intranet
#
# Naming Convention:
# {AppShortName}-{EnvName}-alb-{purpose}
#
# Common Purposes:
# - portal: User-facing portal
# - intranet: Internal applications
# - api: API gateway access
# - admin: Admin interface

# --- ALB SCHEME ---
# ALBScheme: ALB accessibility scheme
#
# Purpose: Determines whether ALB is publicly accessible or internal-only
#
# Options:
#
# internet-facing:
# - Accessible from internet
# - Public DNS name (*.elb.amazonaws.com)
# - Requires public subnets (with IGW route)
# - Use case: User-facing applications, public portals
#
# internal:
# - Accessible only within VPC or connected networks
# - Private DNS name
# - Requires private subnets
# - Use case: Internal applications, intranet portals
#
# Subnet Selection:
# - internet-facing: Use public subnets (route 0.0.0.0/0 → IGW)
# - internal: Use private subnets (no internet route)
#
# ⚠️ Common Mistake:
# - Don't use private subnets for internet-facing ALB
# - Don't use public subnets for internal ALB

# --- VPC ID ---
# VpcId: VPC identifier where ALB is deployed
#
# Purpose: Specifies which VPC to create ALB in
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-0d99a0c727b301d67
#
# Requirements:
# - VPC must exist before deployment
# - VPC must have subnets in at least 2 Availability Zones
# - Security group will be created in this VPC
#
# Finding VPC ID:
# AWS Console → VPC → Your VPCs
# - Locate the VPC for your environment
# - Copy VPC ID from the list

# --- INGRESS SUBNET IDS ---
# IngressSubnetIds: Subnet IDs for ALB placement
#
# Purpose: Specifies which subnets the ALB uses
#
# Format: subnet-abc123,subnet-def456,subnet-ghi789 (comma-separated, no spaces)
# Example: subnet-0abc123def456789a,subnet-0def456abc789123b
#
# Requirements:
# - Minimum 2 subnets in different Availability Zones
# - For internet-facing ALB: Use public subnets (with IGW route)
# - For internal ALB: Use private subnets (no internet route)
# - All subnets must be in same VPC as VpcId
#
# Finding Subnet IDs:
# AWS Console → VPC → Subnets
# - Filter by VPC ID
# - Select appropriate subnets (public or private)
# - Ensure subnets are in different AZs
# - Copy subnet IDs (comma-separated, no spaces)
#
# Example Configuration:
# Internet-facing ALB:
# IngressSubnetIds: "subnet-public-1a,subnet-public-1b"
#
# Internal ALB:
# IngressSubnetIds: "subnet-private-1a,subnet-private-1b"

# --- VPC ENDPOINT IP ---
# VPCEndpointIP1, VPCEndpointIP2, VPCEndpointIP3: API Gateway VPC Endpoint IPs
#
# Purpose: IP addresses of API Gateway execute-api VPC Endpoint
#
# Format: x.x.x.x (IPv4 address)
# Example: 10.1.154.147, 10.1.138.43
#
# Requirements:
# - VPCEndpointIP1 and VPCEndpointIP2 are required (for 2 AZs)
# - VPCEndpointIP3 is optional (for 3-AZ deployment)
# - IPs must correspond to execute-api VPC Endpoint network interfaces
# - One IP per AZ matching ALB subnets
#
# How to Get VPC Endpoint IPs:
#
# Step 1: Navigate to VPC Endpoints
# AWS Console → VPC → Endpoints
#
# Step 2: Find execute-api Endpoint
# - Filter by service name: "execute-api"
# - Select the execute-api VPC Endpoint
#
# Step 3: Get IP Addresses
# - Go to "Subnets" or "Network interfaces" tab
# - Note the Private IP addresses for each subnet/AZ
# - Example:
#   AZ1 (ap-southeast-1a): 10.1.154.147
#   AZ2 (ap-southeast-1b): 10.1.138.43
#   AZ3 (ap-southeast-1c): 10.1.140.50 (optional)
#
# Step 4: Map to Parameters
# - VPCEndpointIP1: First AZ IP (e.g., 10.1.154.147)
# - VPCEndpointIP2: Second AZ IP (e.g., 10.1.138.43)
# - VPCEndpointIP3: Third AZ IP (optional)
#
# ⚠️ Important:
# - VPC Endpoint IPs are static (don't change)
# - Must have one IP per AZ
# - IPs must match ALB subnets AZs
# - Verify IPs are from correct execute-api endpoint

# --- SSL CERTIFICATE ARN ---
# SSLCertificateArn: Primary ACM certificate ARN for HTTPS
#
# Purpose: Enables HTTPS for ALB
#
# Format: arn:aws:acm:{region}:{account}:certificate/{id}
# Example: arn:aws:acm:ap-southeast-1:123456789012:certificate/abc123-def456-...
#
# Requirements:
# - Certificate MUST be in same region as ALB (not us-east-1 like CloudFront)
# - Certificate status must be "Issued"
# - Certificate must include domain name for ALB
#
# Creating Certificate:
# 1. Navigate to: Certificate Manager (same region as ALB)
# 2. Request certificate
# 3. Add domain names:
#    - Exact domain: portal.example.com
#    - Or wildcard: *.example.com (recommended)
# 4. Choose validation method: DNS (recommended)
# 5. Complete DNS validation
# 6. Wait for status to change to "Issued"
# 7. Copy certificate ARN
#
# Finding Existing Certificate:
# AWS Console (same region as ALB) → Certificate Manager
# - Verify domain matches ALB domain
# - Copy ARN

# --- ADDITIONAL CERT ARN ---
# AdditionalCertArn: Additional ACM certificate for multiple domains
#
# Purpose: Supports additional domain names on same ALB
#
# Format: arn:aws:acm:{region}:{account}:certificate/{id}
# Example: arn:aws:acm:ap-southeast-1:123456789012:certificate/def456-ghi789-...
#
# Use Cases:
# - Multiple domains on same ALB (e.g., app.example.com and portal.example.com)
# - Different domain for different services
# - Migration from old domain to new domain
#
# Requirements:
# - Certificate must be in same region as ALB
# - Certificate status must be "Issued"
# - Can be same as SSLCertificateArn if only one certificate needed

# --- VPC CIDR RANGES ---
# VpcCidr1, VpcCidr2, VpcCidr3: VPC CIDR blocks for security group rules
#
# Purpose: Allow inbound HTTPS traffic to ALB from VPC networks
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.193.0.0/16, 10.194.0.0/16
#
# VpcCidr1 (Required):
# - Primary VPC CIDR block
# - Used for security group ingress rules
#
# VpcCidr2 (Optional):
# - Secondary VPC CIDR block
# - Used for VPC peering or extended CIDR ranges
#
# VpcCidr3 (Optional):
# - Tertiary VPC CIDR block
# - Additional CIDR range if needed
#
# Finding VPC CIDRs:
# AWS Console → VPC → Your VPCs
# - Select VPC
# - IPv4 CIDR shows primary CIDR
# - Check "CIDR blocks" tab for additional CIDRs

# --- HCC VPCE CIDR ---
# HCCVpceCidr: HCC VPC Endpoint subnet CIDR
#
# Purpose: Allow inbound HTTPS traffic from HCC VPC Endpoint
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.48.42.0/24
#
# Use Case:
# - Corporate network access through HCC VPC Endpoint
# - Centralized ingress point for on-premises connectivity
# - VPN or Direct Connect access
#
# Finding HCC VPC Endpoint CIDR:
# - Contact network team for HCC VPC Endpoint subnet CIDR
# - Verify CIDR is correct for environment (prod vs nprd)

# --- S3 PREFIX LIST ID ---
# S3PrefixListId: Managed prefix list ID for S3 service
#
# Purpose: Allow ALB to access S3 via VPC endpoint (egress)
#
# Format: pl-xxxxxxxxxxxxxxxxx
# Example: pl-0abc123def456789
#
# Finding S3 Prefix List ID:
# AWS Console → VPC → Managed Prefix Lists
# - Search for "s3" or "com.amazonaws.{region}.s3"
# - Copy prefix list ID
#
# Alternative:
# AWS CLI: aws ec2 describe-managed-prefix-lists --filters "Name=prefix-list-name,Values=com.amazonaws.ap-southeast-1.s3"
#
# Leave empty ("") if not using S3 egress

# --- PREFIX LIST ID INTRANET ---
# PrefixListIdIntranet: Managed prefix list for inbound access restriction
#
# Purpose: Restrict inbound HTTPS traffic to specific IP ranges
#
# Format: pl-xxxxxxxxxxxxxxxxx
# Example: pl-0xyz789abc123456
#
# Use Cases:
# - Restrict access to corporate IP ranges
# - Whitelist specific client networks
# - Enhanced security for internal applications
#
# Creating Managed Prefix List:
# AWS Console → VPC → Managed Prefix Lists → Create prefix list
# - Add allowed IP ranges (e.g., corporate office CIDRs)
# - Copy prefix list ID
#
# Leave empty ("") for no IP-based access restrictions

# --- ENABLE S3 UPLOAD ---
# EnableS3Upload: Enable direct S3 access through ALB
#
# Purpose: Controls whether ALB routes S3 paths directly to S3 VPC Endpoint
#
# Values:
# - true: Enable S3 direct access (requires S3EndpointIP1 and S3EndpointIP2)
# - false: All traffic routes through Lambda reverse proxy
#
# When to use "true":
# ✅ Large file uploads/downloads (> 10 MB)
# ✅ Direct S3 access for better performance
# ✅ Reduce Lambda execution time and cost
# ✅ Support multipart uploads
#
# When to use "false":
# ❌ No direct S3 access needed
# ❌ All content served through Lambda
# ❌ No S3 VPC Interface Endpoint available
#
# Requirements if EnableS3Upload=true:
# - S3 VPC Interface Endpoint must exist (not gateway endpoint)
# - S3EndpointIP1 and S3EndpointIP2 are required
# - S3UploadPath and S3DownloadPath must be configured

# --- S3 ENDPOINT IP ---
# S3EndpointIP1, S3EndpointIP2, S3EndpointIP3: S3 VPC Interface Endpoint IPs
#
# Purpose: IP addresses of S3 VPC Interface Endpoint (only if EnableS3Upload=true)
#
# Format: x.x.x.x (IPv4 address)
# Example: 10.1.155.100, 10.1.139.100
#
# Requirements (if EnableS3Upload=true):
# - S3EndpointIP1 and S3EndpointIP2 are required (for 2 AZs)
# - S3EndpointIP3 is optional (for 3-AZ deployment)
# - IPs must correspond to S3 VPC Interface Endpoint network interfaces
# - One IP per AZ matching ALB subnets
# - Leave empty ("") if EnableS3Upload=false
#
# How to Get S3 VPC Endpoint IPs:
#
# Step 1: Create S3 VPC Interface Endpoint (if not exists)
# AWS Console → VPC → Endpoints → Create endpoint
# - Service category: AWS services
# - Service name: com.amazonaws.{region}.s3 (Interface type, NOT Gateway)
# - Select VPC
# - Select subnets in each AZ
# - Create endpoint
#
# Step 2: Get IP Addresses
# AWS Console → VPC → Endpoints
# - Select S3 interface endpoint
# - Go to "Subnets" or "Network interfaces" tab
# - Note the Private IP addresses for each subnet/AZ
# - Example:
#   AZ1 (ap-southeast-1a): 10.1.155.100
#   AZ2 (ap-southeast-1b): 10.1.139.100
#   AZ3 (ap-southeast-1c): 10.1.141.100 (optional)
#
# Step 3: Map to Parameters
# - S3EndpointIP1: First AZ IP
# - S3EndpointIP2: Second AZ IP
# - S3EndpointIP3: Third AZ IP (optional)
#
# ⚠️ Important:
# - Must use S3 VPC Interface Endpoint (not gateway endpoint)
# - Gateway endpoints don't have IP addresses
# - Interface endpoints have IP addresses in each AZ

# --- S3 UPLOAD PATH ---
# S3UploadPath: Path pattern for S3 upload requests
#
# Purpose: Defines which paths route to S3 for uploads (only if EnableS3Upload=true)
#
# Format: /path/* (CloudFront-style path pattern)
# Example: /uploads/*, /appartifacts/*, /files/*
#
# How It Works:
# - ALB listener rule matches this path pattern
# - Routes matching requests to S3 VPC Endpoint target group
# - Bypasses Lambda reverse proxy for better performance
#
# Common Patterns:
# - /uploads/*: General upload path
# - /appartifacts/*: Application artifacts
# - /attachments/*: Email/form attachments
# - /documents/*: Document uploads
#
# Request Flow:
# POST https://portal.example.com/uploads/file.pdf
# → ALB matches "/uploads/*"
# → Routes to S3 VPC Endpoint
# → S3 stores file
#
# Leave default or modify based on application needs

# --- S3 DOWNLOAD PATH ---
# S3DownloadPath: Path pattern for S3 download requests
#
# Purpose: Defines which paths route to S3 for downloads (only if EnableS3Upload=true)
#
# Format: /path/* (CloudFront-style path pattern)
# Example: /Download/*, /files/*, /documents/*
#
# How It Works:
# - ALB listener rule matches this path pattern
# - Routes matching requests to S3 VPC Endpoint target group
# - Bypasses Lambda reverse proxy for better performance
#
# Common Patterns:
# - /Download/*: General download path
# - /files/*: File downloads
# - /documents/*: Document downloads
# - /exports/*: Data exports
#
# Request Flow:
# GET https://portal.example.com/Download/file.pdf
# → ALB matches "/Download/*"
# → Routes to S3 VPC Endpoint
# → S3 serves file
#
# Leave default or modify based on application needs

# --- ALB LISTENER RULES (PRIORITY ORDER) ---
# ALB evaluates listener rules in priority order (lowest number first):
#
# Priority 1: S3 Upload Path (if EnableS3Upload=true)
# - Path: {S3UploadPath} (e.g., /appartifacts/*)
# - Target: S3 VPC Endpoint
# - Use case: Direct S3 uploads
#
# Priority 2: S3 Download Path (if EnableS3Upload=true)
# - Path: {S3DownloadPath} (e.g., /Download/*)
# - Target: S3 VPC Endpoint
# - Use case: Direct S3 downloads
#
# Priority 3: API Paths
# - Path: API routes defined in Swagger/OpenAPI
# - Target: API Gateway VPC Endpoint
# - Use case: Backend API calls
#
# Default Rule: /* (Catch-all)
# - Path: /* (all other paths)
# - Target: Lambda Reverse Proxy
# - Use case: Frontend SPA assets (index.html, app.js, etc.)
#
# Path Conflicts:
# Ensure S3 paths don't overlap with:
# - API routes (defined in Swagger)
# - Frontend routes (served by Lambda)
#
# Example Conflict:
# ❌ S3UploadPath: /api/uploads/* (conflicts with API routes)
# ✅ S3UploadPath: /uploads/* (no conflict)

# --- TARGET GROUP HEALTH CHECKS ---
# Template configures health checks for each target group:
#
# API Gateway Target Group:
# - Protocol: HTTPS
# - Port: 443
# - Path: /health or /ping (API-specific)
# - Interval: 30 seconds
# - Timeout: 5 seconds
# - Healthy threshold: 2
# - Unhealthy threshold: 2
#
# Lambda Reverse Proxy Target Group:
# - Protocol: HTTPS
# - Port: 443
# - Path: /health or /index.html
# - Interval: 30 seconds
#
# S3 Target Group (if EnableS3Upload=true):
# - Protocol: HTTPS
# - Port: 443
# - Path: / (S3 endpoint root)
# - Interval: 30 seconds
#
# Target health is monitored in:
# AWS Console → EC2 → Target Groups → Health checks

