AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to provision the S3 Reverse Proxy Lambda (v7 - VPC-attached)
Parameters:
  AppShortName:
    Type: String
    Description: AppShortName

  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  LambdaS3bucket:
    Type: String
    Description: The s3 bucket where Lambda code is stored

  CodeZipFileName:
    Type: String
    Description: Zip file name for lambda function code

  LambdaRuntime:
    Type: String
    Description: Runtime for Lambda
    Default: 'nodejs20.x'

  LambdaHandler:
    Type: String
    Description: Zip file name for lambda function code
    Default: 'index.handler'

  FrontendSPABucketName:
    Type: String
    Description: "S3 bucket name for frontend assets"

  LogRetentionInDays:
    Type: Number
    Description: No of days for Log Retention
    Default: 14

  # VPC Configuration (Mandatory since v6)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the Lambda security group will be created (must match the VPC of LambdaSubnetIds)

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs where Lambda ENIs will be provisioned (mandatory, min 2 for HA)

  VpcCidr1:
    Type: String
    Description: Primary VPC CIDR range (mandatory) - used for Lambda SG egress to CloudWatch Logs/X-Ray Interface Endpoint ENIs
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range in the format x.x.x.x/x (e.g., 10.193.0.0/16)

  VpcCidr2:
    Type: String
    Description: Secondary VPC CIDR range (optional) - for shared-services VPC or additional VPC CIDR peering
    Default: ""

  VpcCidr3:
    Type: String
    Description: Tertiary VPC CIDR range (optional)
    Default: ""

  VpcCidr4:
    Type: String
    Description: Quaternary VPC CIDR range (optional)
    Default: ""

  VpcCidr5:
    Type: String
    Description: Quinary VPC CIDR range (optional)
    Default: ""

  S3PrefixListId:
    Type: String
    Description: S3 Gateway VPC Endpoint prefix list ID (e.g., pl-6ca54005 for ap-southeast-1). Used for Lambda SG egress to S3 via the Gateway Endpoint.
    AllowedPattern: ^pl-[a-f0-9]+$
    ConstraintDescription: Must be a valid prefix list ID starting with pl-

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, ""]]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, ""]]

Resources:
  # Security Group for Lambda ENIs (least-privilege egress)
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub ${AppShortName}-${EnvName}-lambda-s3ReverseProxy-sg
      GroupDescription: !Sub Security group for ${AppShortName}-${EnvName}-s3ReverseProxy Lambda ENIs. Least-privilege egress to S3 Gateway Endpoint and Interface Endpoints (CloudWatch Logs, X-Ray).
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: HTTPS to S3 Gateway VPC Endpoint (for GetObject on frontend bucket)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: HTTPS to Interface VPC Endpoints (CloudWatch Logs, X-Ray) in primary VPC CIDR
      Tags:
        - Key: Name
          Value: !Sub ${AppShortName}-${EnvName}-lambda-s3ReverseProxy-sg
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  # Optional egress rules for additional VPC CIDRs (VpcCidr2-5)
  LambdaSecurityGroupEgressVpcCidr2:
    Condition: HasVpcCidr2
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr2
      Description: HTTPS to Interface VPC Endpoints in VpcCidr2

  LambdaSecurityGroupEgressVpcCidr3:
    Condition: HasVpcCidr3
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr3
      Description: HTTPS to Interface VPC Endpoints in VpcCidr3

  LambdaSecurityGroupEgressVpcCidr4:
    Condition: HasVpcCidr4
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr4
      Description: HTTPS to Interface VPC Endpoints in VpcCidr4

  LambdaSecurityGroupEgressVpcCidr5:
    Condition: HasVpcCidr5
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr5
      Description: HTTPS to Interface VPC Endpoints in VpcCidr5

  S3BucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    DependsOn: LambdaExecutionRole
    Properties:
      Bucket: !Ref FrontendSPABucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaS3Access
            Effect: "Allow"
            Principal:
              AWS:
                - !GetAtt LambdaExecutionRole.Arn  # Reference to the Lambda execution role
            Action: 
              - "s3:GetObject"
              - "s3:PutObject"
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref FrontendSPABucketName
                - /*            
          - Sid: EnforceTLSv12orHigher
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref FrontendSPABucketName
                - /*              
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref FrontendSPABucketName
                - /*  
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AppShortName}-${EnvName}-s3ReverseProxy'
      RetentionInDays: !Ref LogRetentionInDays  # Retain logs for xx days
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

# FrontEnd Lamda Function
  LambdaS3ReverseProxy:
    Type: AWS::Lambda::Function
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy
      TracingConfig:
        Mode: Active
      Code:
        S3Bucket: !Ref LambdaS3bucket  # Replace with your S3 bucket where Lambda code is stored
        S3Key: !Ref CodeZipFileName # Replace with the key to your zipped Lambda function code
      Handler: !Ref LambdaHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: !Ref LambdaRuntime
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref FrontendSPABucketName
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  # Admin Portal FrontEnd Lamda Function Execution Role
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    DeletionPolicy: !If [IsProduction, Retain, Delete]  
    Properties:
      RoleName: !Sub ${AppShortName}-${EnvName}-lambda-execution-s3ReverseProxy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
            - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7
      Policies:
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-cloudwatch-log-creation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppShortName}-${EnvName}-s3ReverseProxy:*"
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-BucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
              - s3:GetObject
              Resource:
              - !Sub "arn:aws:s3:::${FrontendSPABucketName}/*"
              - !Sub "arn:aws:s3:::${LambdaS3bucket}/*"
        - PolicyName: !Sub ${AppShortName}-${EnvName}-s3ReverseProxy-VPCAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"

  APIGatewayInvokeLambdaPolicy:
    Type: AWS::Lambda::Permission
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName:
        Ref: 'LambdaS3ReverseProxy'
      Principal: 'apigateway.amazonaws.com'
      # SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:{{resolve:ssm:/frontendspa/intranet/${AppShortName}/${EnvName}/apigw_id}}/*/*/${AppShortName}-${EnvName}-s3ReverseProxy"

  ParameterLambdaArn:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [IsProduction, Retain, Delete]  
    Properties:
      Name: !Sub "/${AppShortName}/${EnvName}/Lambda-s3ReverseProxy-Arn"
      Type: String
      Value: !GetAtt LambdaS3ReverseProxy.Arn
      Description: Lambda Function Arn for S3 Reverse Proxy
