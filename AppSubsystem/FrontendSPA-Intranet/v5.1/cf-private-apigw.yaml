  #     Name: !Sub '/frontendspa/intranet/${AppShortName}/${EnvName}/apigw_id'
  #     Type: 'String'
  #     Value: !Ref PrivateApi
  #     Description: !Sub 'API Gateway ID for ${APIName}'
