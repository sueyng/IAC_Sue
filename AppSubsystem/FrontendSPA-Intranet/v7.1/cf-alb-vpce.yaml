AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create a ALB with target Group to Endpoint IP Addresses and optional S3 endpoint routing. v7

Parameters:
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  ALBName: 
    Description: Name for Application Load Balancer
    Type: String

  ALBScheme:
    Description: ALB type, Internet or intranet ALB
    Type: String
    AllowedValues:
      - internal
      - internet-facing    
  
  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for the Ingress Subnets where the Public ALB will be deployed.

  VPCEndpointIP1:
    Description: VPC Interface Endpoint IP - AZ1
    Type: String

  VPCEndpointIP2:
    Description: VPC Interface Endpoint IP - AZ2
    Type: String

  VPCEndpointIP3:
    Description: VPC Interface Endpoint IP - AZ3
    Type: String

  SSLCertificateArn:
    Description: The ARN of the SSL certificate to associate with the ALB HTTPS listener.
    Type: String

  ALBSslPolicy:
    Type: String
    Description: "ELB Security Policy for the HTTPS listener (TLS 1.2+ only)"
    AllowedValues:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext1-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
      - ELBSecurityPolicy-TLS-1-2-Ext-2018-06
      - ELBSecurityPolicy-TLS-1-2-2017-01
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06

  AdditionalCertArn:
    Description: Additonal SSL certificate ARN to associate with the ALB HTTPS listener (eg.IntrnetBackednAPI)
    Type: String

  PrefixListIdIntranet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic from intranet subnets

  PrefixListIdInternet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic on the public ALB
    Default: ""

  EnableS3Upload:
    Type: String
    Description: Enable S3 upload functionality through ALB
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  S3EndpointIP1:
    Description: S3 VPC Interface Endpoint IP - AZ1
    Type: String
    Default: ""

  S3EndpointIP2:
    Description: S3 VPC Interface Endpoint IP - AZ2
    Type: String
    Default: ""

  S3EndpointIP3:
    Description: S3 VPC Interface Endpoint IP - AZ3 (Optional)
    Type: String
    Default: ""

  S3UploadPath:
    Description: Path pattern for S3 upload route (e.g., /upload/*)
    Type: String
    Default: "/appartifacts/*"

  S3DownloadPath:
    Description: Path pattern for S3 upload route (e.g., /Download/*)
    Type: String
    Default: ""

  S3AdditionalPathPattern1:
    Description: Optional additional S3 path pattern for listener rule priority 11. Leave empty to disable.
    Type: String
    Default: ""

  S3AdditionalPathPattern1HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for S3 additional path rule 1. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern1HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for S3 additional path rule 1. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern1UrlRewriteRegex:
    Description: Optional URL rewrite regex for S3 additional path rule 1. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern1UrlRewriteReplace:
    Description: Optional URL rewrite replacement for S3 additional path rule 1. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern2:
    Description: Optional additional S3 path pattern for listener rule priority 12. Leave empty to disable.
    Type: String
    Default: ""

  S3AdditionalPathPattern2HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for S3 additional path rule 2. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern2HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for S3 additional path rule 2. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern2UrlRewriteRegex:
    Description: Optional URL rewrite regex for S3 additional path rule 2. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern2UrlRewriteReplace:
    Description: Optional URL rewrite replacement for S3 additional path rule 2. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1:
    Description: Optional additional backend path pattern for listener rule priority 13. Forwards to the default backend target group. Leave empty to disable.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for backend additional path rule 1. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for backend additional path rule 1. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1UrlRewriteRegex:
    Description: Optional URL rewrite regex for backend additional path rule 1. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1UrlRewriteReplace:
    Description: Optional URL rewrite replacement for backend additional path rule 1. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""

Rules:
  S3AdditionalPathRule1RequiresS3Upload:
    RuleCondition: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
    Assertions:
      - Assert: !Equals [!Ref EnableS3Upload, "true"]
        AssertDescription: S3AdditionalPathPattern1 requires EnableS3Upload=true.
  S3AdditionalPathRule1HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern1 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
        AssertDescription: S3AdditionalPathPattern1 must be provided when host-header rewrite is configured.
  S3AdditionalPathRule1UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern1 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
        AssertDescription: S3AdditionalPathPattern1 must be provided when URL rewrite is configured.
  S3AdditionalPathRule2RequiresS3Upload:
    RuleCondition: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
    Assertions:
      - Assert: !Equals [!Ref EnableS3Upload, "true"]
        AssertDescription: S3AdditionalPathPattern2 requires EnableS3Upload=true.
  S3AdditionalPathRule2HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern2 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
        AssertDescription: S3AdditionalPathPattern2 must be provided when host-header rewrite is configured.
  S3AdditionalPathRule2UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern2 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
        AssertDescription: S3AdditionalPathPattern2 must be provided when URL rewrite is configured.
  BackendAdditionalPathRule1HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace, ""]]
        AssertDescription: BackendAdditionalPathPattern1 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]
        AssertDescription: BackendAdditionalPathPattern1 must be provided when host-header rewrite is configured.
  BackendAdditionalPathRule1UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteReplace, ""]]
        AssertDescription: BackendAdditionalPathPattern1 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]
        AssertDescription: BackendAdditionalPathPattern1 must be provided when URL rewrite is configured.

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVPCEndpointIP3: !Not [!Equals [!Ref "VPCEndpointIP3", ""]]
  IsPrivateALB: !Equals [!Ref "ALBScheme", "internal"]
  IsPublicALB: !Equals [!Ref "ALBScheme", "internet-facing"]
  HasPrefixListIdIntranet: !Not [!Equals [!Ref "PrefixListIdIntranet", ""]]
  HasPrefixListIdInternet: !Not [!Equals [!Ref "PrefixListIdInternet", ""]]
  HasAdditionalCertArn: !Not [!Equals [!Ref "AdditionalCertArn", ""]]
  EnableS3UploadFeature: !Equals [!Ref "EnableS3Upload", "true"]
  HasS3EndpointIP3: !And 
    - !Not [!Equals [!Ref "S3EndpointIP3", ""]]
    - !Condition EnableS3UploadFeature
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, '']]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, '']]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, '']]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, '']]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasS3DownloadPath: !Not [!Equals [!Ref S3DownloadPath, ""]]
  HasS3AdditionalPathPattern1: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
  HasS3AdditionalPathPattern1HostHeaderRewriteTransform: !And
    - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteRegex, ""]]
    - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteReplace, ""]]
  HasS3AdditionalPathPattern1UrlRewriteTransform: !And
    - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteRegex, ""]]
    - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteReplace, ""]]
  HasS3AdditionalPathPattern1AnyRewriteTransform: !Or
    - !Condition HasS3AdditionalPathPattern1HostHeaderRewriteTransform
    - !Condition HasS3AdditionalPathPattern1UrlRewriteTransform
  EnableS3AdditionalPathRule1: !And
    - !Condition EnableS3UploadFeature
    - !Condition HasS3AdditionalPathPattern1
  HasS3AdditionalPathPattern2: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
  HasS3AdditionalPathPattern2HostHeaderRewriteTransform: !And
    - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteRegex, ""]]
    - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteReplace, ""]]
  HasS3AdditionalPathPattern2UrlRewriteTransform: !And
    - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteRegex, ""]]
    - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteReplace, ""]]
  HasS3AdditionalPathPattern2AnyRewriteTransform: !Or
    - !Condition HasS3AdditionalPathPattern2HostHeaderRewriteTransform
    - !Condition HasS3AdditionalPathPattern2UrlRewriteTransform
  EnableS3AdditionalPathRule2: !And
    - !Condition EnableS3UploadFeature
    - !Condition HasS3AdditionalPathPattern2
  HasBackendAdditionalPathPattern1HostHeaderRewriteTransform: !And
    - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex, ""]]
    - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace, ""]]
  HasBackendAdditionalPathPattern1UrlRewriteTransform: !And
    - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteRegex, ""]]
    - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteReplace, ""]]
  HasBackendAdditionalPathPattern1AnyRewriteTransform: !Or
    - !Condition HasBackendAdditionalPathPattern1HostHeaderRewriteTransform
    - !Condition HasBackendAdditionalPathPattern1UrlRewriteTransform
  EnableBackendAdditionalPathRule1: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]

Resources:
  # Security Group for ALB
  PublicALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPublicALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Pulbic ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixListIdInternet
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListIdInternet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If 
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"     
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"

  PrivateALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPrivateALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Private ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixListIdIntranet
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListIdIntranet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr1
          Description: VPC CIDR 1 IP Range
        - !If
          - HasVpcCidr2
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr2
            Description: VPC CIDR 2 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr3
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr3
            Description: VPC CIDR 3 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr4
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr4
            Description: VPC CIDR 4 IP Range
          - !Ref "AWS::NoValue"
        - !If
          - HasVpcCidr5
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref VpcCidr5
            Description: VPC CIDR 5 IP Range
          - !Ref "AWS::NoValue"     
        - !If
          - HasS3PrefixListId
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationPrefixListId: !Ref S3PrefixListId
            Description: Allow access to Amazon S3 Endpoint
          - !Ref "AWS::NoValue"
        - !If
          - HasHCCVpceCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref HCCVpceCidr
            Description: HCC VPC Endpoint Subnet
          - !Ref "AWS::NoValue"

  #Application Load Balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Ref ALBName
      Subnets: !Ref IngressSubnetIds
      SecurityGroups:
        - !If
          - IsPrivateALB
          - !Ref PrivateALBSecurityGroup  # Private ALB Security Group
          - !Ref PublicALBSecurityGroup
      Scheme: !Ref ALBScheme
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: "true"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  # Target Group
  ALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${ALBName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 443
      TargetType: ip
      Targets:
        - Id: !Ref VPCEndpointIP1 # First IP
        - Id: !Ref VPCEndpointIP2  # Second IP
        - !If
          - HasVPCEndpointIP3
          - Id: !Ref VPCEndpointIP3  # Third IP
          - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,403"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  # S3 Target Group
  S3TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: EnableS3UploadFeature
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${ALBName}-s3-tg"
      Tags:
        - Key: Name
          Value: fileupload
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 443
      TargetType: ip
      Targets:
        - Id: !Ref S3EndpointIP1
        - Id: !Ref S3EndpointIP2
        - !If
          - HasS3EndpointIP3
          - Id: !Ref S3EndpointIP3
          - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,307"
        
  # Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTPS
      SslPolicy: !Ref ALBSslPolicy
      Port: 443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn

  # S3 Upload Listener Rule
  S3UploadListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: EnableS3UploadFeature
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10  # Priority for S3 path
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref S3UploadPath
            - !If 
              - HasS3DownloadPath
              - !Ref S3DownloadPath
              - !Ref AWS::NoValue

  S3AdditionalPathListenerRule1:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: EnableS3AdditionalPathRule1
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 11
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref S3AdditionalPathPattern1
      Transforms: !If
        - HasS3AdditionalPathPattern1AnyRewriteTransform
        - - !If
            - HasS3AdditionalPathPattern1HostHeaderRewriteTransform
            - Type: host-header-rewrite
              HostHeaderRewriteConfig:
                Rewrites:
                  - Regex: !Ref S3AdditionalPathPattern1HostHeaderRewriteRegex
                    Replace: !Ref S3AdditionalPathPattern1HostHeaderRewriteReplace
            - !Ref AWS::NoValue
          - !If
            - HasS3AdditionalPathPattern1UrlRewriteTransform
            - Type: url-rewrite
              UrlRewriteConfig:
                Rewrites:
                  - Regex: !Ref S3AdditionalPathPattern1UrlRewriteRegex
                    Replace: !Ref S3AdditionalPathPattern1UrlRewriteReplace
            - !Ref AWS::NoValue
        - !Ref AWS::NoValue

  S3AdditionalPathListenerRule2:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: EnableS3AdditionalPathRule2
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 12
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref S3AdditionalPathPattern2
      Transforms: !If
        - HasS3AdditionalPathPattern2AnyRewriteTransform
        - - !If
            - HasS3AdditionalPathPattern2HostHeaderRewriteTransform
