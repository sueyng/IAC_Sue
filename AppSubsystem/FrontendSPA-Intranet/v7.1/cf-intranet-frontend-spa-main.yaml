AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy Intranet Frontend SPA (v7.1 - API Gateway TLS security policy configurable) v7.1

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  LambdaS3bucket:
    Type: String
    Description: The s3 bucket where Lambda code is stored

  CodeZipFileName:
    Type: String
    Description: Zip file name for lambda function code

  LambdaRuntime:
    Type: String
    Description: Runtime for Lambda
    Default: 'nodejs20.x'

  LambdaHandler:
    Type: String
    Description: Handler for lambda function
    Default: 'index.handler'

  FrontendSPABucketName:
    Type: String
    Description: "S3 bucket name for frontend assets"

  LambdaLogRetentionInDays:
    Type: Number
    Description: No of Days for Log Retention
    Default: 14

  # Lambda VPC Configuration (Mandatory since v6) - Lambda SG is created in the nested stack
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs where the S3ReverseProxy Lambda ENIs will be provisioned (mandatory, min 2 for HA)

  # Stack Notification Configuration (Optional - Recommended for new stack creation)
  EnableStackNotifications:
    Type: String
    Description: Enable CloudFormation stack event notifications to SNS topic. Recommended 'yes' for NEW stack creation only - see README for limitations on existing stacks.
    AllowedValues: ['yes', 'no']
    Default: 'no'
  StackNotificationSNSTopicArn:
    Type: String
    Description: ARN of an existing SNS topic for CloudFormation stack event notifications (required when EnableStackNotifications=yes; project team must provision the topic separately)
    Default: ''

  SwaggerFile:
    Description: Swagger File location and filename, s3bucketname/filename
    Type: String

  ApigwVpceId:
    Type: String
    Description: VPC Endpoint ID for APIGW, execute-api

  APIName:
    Type: String
    Description: API Name

  StageName:
    Description: Stage Name for api setup, Use dev for non-prod env and prod for production env
    Type: String

  ApiGatewayClientCertificateId:
    Type: String
    Description: Optional API Gateway client certificate ID for REST API stage backend authentication. Project teams create and rotate this certificate in the API Gateway console.
    Default: ""

  CustomDomainName:
    Type: String
    Description: The custom domain name for the API Gateway (e.g., api.example.com).
    Default: ""

  SSLCertificateArn:
    Type: String
    Description: The ARN of the SSL certificate for the custom domain name.
    Default: ""

  ApiSecurityPolicy:
    Type: String
    Description: >-
      TLS security policy applied to both the REST API's own native endpoint (PrivateApi) and, when
      CustomDomainName/SSLCertificateArn are set, the custom domain name - these are two separate
      endpoints and both need this set to actually enforce the chosen policy end-to-end. 
      Values prefixed SecurityPolicy_ are "enhanced" policies that enable TLS 1.3
      (optionally with FIPS/PFS/post-quantum cipher suites) and require EndpointAccessMode to also be set.
    AllowedValues:
      - 'TLS_1_2'
      - 'SecurityPolicy_TLS13_1_2_2021_06'
      - 'SecurityPolicy_TLS13_1_2_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_FIPS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_3_2025_09'
      - 'SecurityPolicy_TLS13_1_3_FIPS_2025_09'
    Default: 'SecurityPolicy_TLS13_1_3_2025_09'

  EndpointAccessMode:
    Type: String
    Description: >-
      Endpoint access mode, forwarded to cf-private-apigw.yaml. Only meaningful when
      ApiSecurityPolicy is set to an enhanced (SecurityPolicy_-prefixed) value - the nested
      template omits this property entirely for legacy (TLS_1_0/TLS_1_2) policies, since AWS
      rejects it outright in that case. STRICT enforces additional access validation, BASIC is
      standard behavior.
    AllowedValues: ['BASIC', 'STRICT']
    Default: 'BASIC'

  AdditionalCertArn:
    Description: Additonal SSL certificate ARN to associate with the ALB HTTPS listener (eg.IntrnetBackednAPI)
    Type: String

  LambdaAuthorizerFunctionArn:
    Type: String
    Description: The ARN of the Lambda Authorizer Function
    Default: ""

  ApiGwAccessLogFormat:
    Type: String
    Description: Format string for API Gateway access logs (leave empty to disable access logging)
    Default: ""

  ApiGwLogRetentionInDays:
    Type: Number
    Description: Number of days to retain API Gateway access logs
    Default: 30

  ApiGwEnableCompression:
    Type: String
    Description: Enable API Gateway gzip response compression (yes/no). When yes, ApiGwMinimumCompressionSize is applied. Default 'no' — project teams should audit client gzip handling before enabling.
    AllowedValues: ['yes', 'no']
    Default: 'no'

  ApiGwMinimumCompressionSize:
    Type: Number
    Description: Minimum response payload size in bytes to trigger gzip compression (only used when ApiGwEnableCompression=yes). Valid range 0 to 10485760.
    Default: 10240
    MinValue: 0
    MaxValue: 10485760

  ALBName:
    Description: Name for Application Load Balancer
    Type: String

  ALBScheme:
    Description: ALB type, Internet or intranet ALB
    Type: String
    AllowedValues:
      - internal
      - internet-facing

  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for the Ingress Subnets where the Public ALB will be deployed.

  VPCEndpointIP1:
    Description: VPC Interface Endpoint IP - AZ1
    Type: String

  VPCEndpointIP2:
    Description: VPC Interface Endpoint IP - AZ2
    Type: String
    Default: ""

  VPCEndpointIP3:
    Description: VPC Interface Endpoint IP - AZ3
    Type: String
    Default: ""

  PrefixListIdIntranet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic from intranet subnets
    Default: ""

  PrefixListIdInternet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic on the public ALB
    Default: ""

  EnableS3Upload:
    Type: String
    Description: Enable S3 upload functionality through ALB
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  S3EndpointIP1:
    Description: S3 VPC Interface Endpoint IP - AZ1
    Type: String
    Default: ""

  S3EndpointIP2:
    Description: S3 VPC Interface Endpoint IP - AZ2
    Type: String
    Default: ""

  S3EndpointIP3:
    Description: S3 VPC Interface Endpoint IP - AZ3 (Optional)
    Type: String
    Default: ""

  S3UploadPath:
    Description: Path pattern for S3 upload route (e.g., /upload/*)
    Type: String
    Default: "/appartifacts/*"

  S3DownloadPath:
    Description: Path pattern for S3 upload route (e.g., /Download/*)
    Type: String
    Default: ""

  S3AdditionalPathPattern1:
    Description: Optional additional S3 path pattern for ALB listener rule priority 11. Leave empty to disable.
    Type: String
    Default: ""

  S3AdditionalPathPattern1HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for S3 additional path rule 1. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern1HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for S3 additional path rule 1. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern1UrlRewriteRegex:
    Description: Optional URL rewrite regex for S3 additional path rule 1. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern1UrlRewriteReplace:
    Description: Optional URL rewrite replacement for S3 additional path rule 1. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern2:
    Description: Optional additional S3 path pattern for ALB listener rule priority 12. Leave empty to disable.
    Type: String
    Default: ""

  S3AdditionalPathPattern2HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for S3 additional path rule 2. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern2HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for S3 additional path rule 2. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  S3AdditionalPathPattern2UrlRewriteRegex:
    Description: Optional URL rewrite regex for S3 additional path rule 2. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  S3AdditionalPathPattern2UrlRewriteReplace:
    Description: Optional URL rewrite replacement for S3 additional path rule 2. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1:
    Description: Optional additional backend path pattern for ALB listener rule priority 13. Forwards to the default backend target group. Leave empty to disable.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1HostHeaderRewriteRegex:
    Description: Optional host-header rewrite regex for backend additional path rule 1. Provide with HostHeaderRewriteReplace.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1HostHeaderRewriteReplace:
    Description: Optional host-header rewrite replacement for backend additional path rule 1. Provide with HostHeaderRewriteRegex.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1UrlRewriteRegex:
    Description: Optional URL rewrite regex for backend additional path rule 1. Provide with UrlRewriteReplace.
    Type: String
    Default: ""

  BackendAdditionalPathPattern1UrlRewriteReplace:
    Description: Optional URL rewrite replacement for backend additional path rule 1. Provide with UrlRewriteRegex.
    Type: String
    Default: ""

  VpcCidr1:
    Description: VPC CIDR 1 IP Range
    Type: String
    Default: ""
  VpcCidr2:
    Description: VPC CIDR 2 IP Range
    Type: String
    Default: ""
  VpcCidr3:
    Description: VPC CIDR 3 IP Range
    Type: String
    Default: ""
  VpcCidr4:
    Description: VPC CIDR 4 IP Range
    Type: String
    Default: ""
  VpcCidr5:
    Description: VPC CIDR 5 IP Range
    Type: String
    Default: ""
  S3PrefixListId:
    Description: S3 PrefixList ID
    Type: String
    Default: ""
  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""
  ALBSslPolicy:
    Type: String
    Description: "ELB Security Policy for the HTTPS listener (TLS 1.2+ only)"
    AllowedValues:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext1-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
      - ELBSecurityPolicy-TLS-1-2-Ext-2018-06
      - ELBSecurityPolicy-TLS-1-2-2017-01
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06

Rules:
  S3AdditionalPathRule1RequiresS3Upload:
    RuleCondition: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
    Assertions:
      - Assert: !Equals [!Ref EnableS3Upload, "true"]
        AssertDescription: S3AdditionalPathPattern1 requires EnableS3Upload=true.
  S3AdditionalPathRule1HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern1HostHeaderRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern1 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
        AssertDescription: S3AdditionalPathPattern1 must be provided when host-header rewrite is configured.
  S3AdditionalPathRule1UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern1UrlRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern1 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
        AssertDescription: S3AdditionalPathPattern1 must be provided when URL rewrite is configured.
  S3AdditionalPathRule2RequiresS3Upload:
    RuleCondition: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
    Assertions:
      - Assert: !Equals [!Ref EnableS3Upload, "true"]
        AssertDescription: S3AdditionalPathPattern2 requires EnableS3Upload=true.
  S3AdditionalPathRule2HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern2HostHeaderRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern2 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
        AssertDescription: S3AdditionalPathPattern2 must be provided when host-header rewrite is configured.
  S3AdditionalPathRule2UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref S3AdditionalPathPattern2UrlRewriteReplace, ""]]
        AssertDescription: S3AdditionalPathPattern2 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
        AssertDescription: S3AdditionalPathPattern2 must be provided when URL rewrite is configured.
  BackendAdditionalPathRule1HostHeaderRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex, ""]]
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex, ""]]
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace, ""]]
        AssertDescription: BackendAdditionalPathPattern1 host-header rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]
        AssertDescription: BackendAdditionalPathPattern1 must be provided when host-header rewrite is configured.
  BackendAdditionalPathRule1UrlRewritePair:
    RuleCondition: !Or
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteRegex, ""]]
      - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteReplace, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteRegex, ""]]
          - !Not [!Equals [!Ref BackendAdditionalPathPattern1UrlRewriteReplace, ""]]
        AssertDescription: BackendAdditionalPathPattern1 URL rewrite requires both regex and replacement.
      - Assert: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]
        AssertDescription: BackendAdditionalPathPattern1 must be provided when URL rewrite is configured.

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  EnableS3UploadFeature: !Equals [!Ref "EnableS3Upload", "true"]
  HasS3DownloadPath: !Not [!Equals [!Ref S3DownloadPath, ""]]
  HasS3AdditionalPathPattern1: !Not [!Equals [!Ref S3AdditionalPathPattern1, ""]]
  HasS3AdditionalPathPattern2: !Not [!Equals [!Ref S3AdditionalPathPattern2, ""]]
  EnableS3AdditionalPathRule1: !And
    - !Condition EnableS3UploadFeature
    - !Condition HasS3AdditionalPathPattern1
  EnableS3AdditionalPathRule2: !And
    - !Condition EnableS3UploadFeature
    - !Condition HasS3AdditionalPathPattern2
  EnableBackendAdditionalPathRule1: !Not [!Equals [!Ref BackendAdditionalPathPattern1, ""]]
  HasVpcCidr3: !Not [!Equals [!Ref VpcCidr3, ""]]
  HasVpcCidr2: !Not [!Equals [!Ref VpcCidr2, ""]]
  HasVpcCidr4: !Not [!Equals [!Ref VpcCidr4, ""]]
  HasVpcCidr5: !Not [!Equals [!Ref VpcCidr5, ""]]
  HasHCCVpceCidr: !Not [!Equals [!Ref HCCVpceCidr, ""]]
  HasS3PrefixListId: !Not [!Equals [!Ref S3PrefixListId, ""]]
  HasStackNotifications: !And
    - !Equals [!Ref EnableStackNotifications, 'yes']
    - !Not [!Equals [!Ref StackNotificationSNSTopicArn, '']]

Resources:
  Lambdas3ReverseProxyStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
         - PrivateApiGatewayStack
    Properties:
      NotificationARNs: !If
        - HasStackNotifications
        - - !Ref StackNotificationSNSTopicArn
        - !Ref AWS::NoValue
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-lambda-s3reverseproxy.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        LambdaS3bucket: !Ref LambdaS3bucket
        CodeZipFileName: !Ref CodeZipFileName
        LambdaRuntime: !Ref LambdaRuntime
        LambdaHandler: !Ref LambdaHandler
        FrontendSPABucketName: !Ref FrontendSPABucketName
        LogRetentionInDays: !Ref LambdaLogRetentionInDays
        VpcId: !Ref VpcId
        LambdaSubnetIds: !Join [",", !Ref LambdaSubnetIds]
        VpcCidr1: !Ref VpcCidr1
        VpcCidr2: !Ref VpcCidr2
        VpcCidr3: !Ref VpcCidr3
        VpcCidr4: !Ref VpcCidr4
        VpcCidr5: !Ref VpcCidr5
        S3PrefixListId: !Ref S3PrefixListId

  PrivateApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      NotificationARNs: !If
        - HasStackNotifications
        - - !Ref StackNotificationSNSTopicArn
        - !Ref AWS::NoValue
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-private-apigw.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        SwaggerFile: !Ref SwaggerFile
        ApigwVpceId: !Ref ApigwVpceId
        APIName: !Ref APIName
        StageName: !Ref StageName
        ApiGatewayClientCertificateId: !Ref ApiGatewayClientCertificateId
        CustomDomainName: !Ref CustomDomainName
        SSLCertificateArn: !Ref SSLCertificateArn
        ApiSecurityPolicy: !Ref ApiSecurityPolicy
        EndpointAccessMode: !Ref EndpointAccessMode
        LambdaAuthorizerFunctionArn: !Ref LambdaAuthorizerFunctionArn
        AccessLogFormat: !Ref ApiGwAccessLogFormat
        LogRetentionInDays: !Ref ApiGwLogRetentionInDays
        EnableCompression: !Ref ApiGwEnableCompression
        MinimumCompressionSize: !Ref ApiGwMinimumCompressionSize

  ALBtoVPCEStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      NotificationARNs: !If
        - HasStackNotifications
        - - !Ref StackNotificationSNSTopicArn
        - !Ref AWS::NoValue
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-alb-vpce.yaml"
      Parameters:
        EnvName: !Ref EnvName
        ALBName: !Ref ALBName
        ALBScheme: !Ref ALBScheme
        VpcId: !Ref VpcId
        IngressSubnetIds:  !Join [",", !Ref IngressSubnetIds]
        VPCEndpointIP1: !Ref VPCEndpointIP1
        VPCEndpointIP2: !Ref VPCEndpointIP2
        VPCEndpointIP3: !Ref VPCEndpointIP3
        PrefixListIdIntranet: !Ref PrefixListIdIntranet
        PrefixListIdInternet: !Ref PrefixListIdInternet
        SSLCertificateArn: !Ref SSLCertificateArn
        AdditionalCertArn: !Ref AdditionalCertArn
        EnableS3Upload: !Ref EnableS3Upload
        S3EndpointIP1: !If [EnableS3UploadFeature, !Ref S3EndpointIP1, ""]
        S3EndpointIP2: !If [EnableS3UploadFeature, !Ref S3EndpointIP2, ""]
        S3EndpointIP3: !If [EnableS3UploadFeature, !Ref S3EndpointIP3, ""]
        S3UploadPath: !If [EnableS3UploadFeature, !Ref S3UploadPath, "/appartifacts/*"]
        S3DownloadPath: !If [HasS3DownloadPath, !Ref S3DownloadPath, ""]
        S3AdditionalPathPattern1: !If [EnableS3AdditionalPathRule1, !Ref S3AdditionalPathPattern1, ""]
        S3AdditionalPathPattern1HostHeaderRewriteRegex: !Ref S3AdditionalPathPattern1HostHeaderRewriteRegex
        S3AdditionalPathPattern1HostHeaderRewriteReplace: !Ref S3AdditionalPathPattern1HostHeaderRewriteReplace
        S3AdditionalPathPattern1UrlRewriteRegex: !Ref S3AdditionalPathPattern1UrlRewriteRegex
        S3AdditionalPathPattern1UrlRewriteReplace: !Ref S3AdditionalPathPattern1UrlRewriteReplace
        S3AdditionalPathPattern2: !If [EnableS3AdditionalPathRule2, !Ref S3AdditionalPathPattern2, ""]
        S3AdditionalPathPattern2HostHeaderRewriteRegex: !Ref S3AdditionalPathPattern2HostHeaderRewriteRegex
        S3AdditionalPathPattern2HostHeaderRewriteReplace: !Ref S3AdditionalPathPattern2HostHeaderRewriteReplace
        S3AdditionalPathPattern2UrlRewriteRegex: !Ref S3AdditionalPathPattern2UrlRewriteRegex
        S3AdditionalPathPattern2UrlRewriteReplace: !Ref S3AdditionalPathPattern2UrlRewriteReplace
        BackendAdditionalPathPattern1: !If [EnableBackendAdditionalPathRule1, !Ref BackendAdditionalPathPattern1, ""]
        BackendAdditionalPathPattern1HostHeaderRewriteRegex: !Ref BackendAdditionalPathPattern1HostHeaderRewriteRegex
        BackendAdditionalPathPattern1HostHeaderRewriteReplace: !Ref BackendAdditionalPathPattern1HostHeaderRewriteReplace
        BackendAdditionalPathPattern1UrlRewriteRegex: !Ref BackendAdditionalPathPattern1UrlRewriteRegex
        BackendAdditionalPathPattern1UrlRewriteReplace: !Ref BackendAdditionalPathPattern1UrlRewriteReplace
        VpcCidr1: !Ref VpcCidr1
        VpcCidr2: !Ref VpcCidr2
        VpcCidr3: !Ref VpcCidr3
        VpcCidr4: !Ref VpcCidr4
        VpcCidr5: !Ref VpcCidr5
        HCCVpceCidr: !Ref HCCVpceCidr
        S3PrefixListId: !Ref S3PrefixListId
        ALBSslPolicy: !Ref ALBSslPolicy
