AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to provision and deploy a private API with swagger json file
Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c
  SwaggerFile:
    Description: Swagger File location and filename, s3bucketname/filename
    Type: String
  ApigwVpceId:
    Type: String
    Description: VPC Endpoint ID for APIGW, execute-api
  APIName:
    Type: String
    Description: API Name
  StageName:
    Description: Stage Name for api setup, Use dev for non-prod env and prod for production env
    Type: String
  ApiGatewayClientCertificateId:
    Type: String
    Description: Optional API Gateway client certificate ID for REST API stage backend authentication
    Default: ""
  CustomDomainName:
    Type: String
    Description: The custom domain name for the API Gateway (e.g., api.example.com).
  SSLCertificateArn:
    Type: String
    Description: The ARN of the SSL certificate for the custom domain name.
  ApiSecurityPolicy:
    Type: String
    Description: >-
      TLS security policy applied to both the REST API's own native endpoint (PrivateApi) and, when
      CustomDomainName/SSLCertificateArn are set, the custom domain name - these are two separate
      endpoints and both need this set to actually enforce the chosen policy end-to-end. 
      Values prefixed SecurityPolicy_ are "enhanced" policies that enable TLS 1.3
      (optionally with FIPS/PFS/post-quantum cipher suites) and require EndpointAccessMode to also be set.
    AllowedValues:
      - 'SecurityPolicy_TLS13_1_2_2021_06'
      - 'SecurityPolicy_TLS13_1_2_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_FIPS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_3_2025_09'
      - 'SecurityPolicy_TLS13_1_3_FIPS_2025_09'
    Default: 'SecurityPolicy_TLS13_1_3_2025_09'
  EndpointAccessMode:
    Type: String
    Description: >-
      Endpoint access mode, applied to both the REST API's own native endpoint (PrivateApi) and the
      custom domain name. Required by AWS whenever ApiSecurityPolicy is set to an enhanced
      (SecurityPolicy_-prefixed) value; harmless to leave at default otherwise. STRICT enforces
      additional access validation, BASIC is standard behavior.
    AllowedValues: ['BASIC', 'STRICT', '']
    Default: 'BASIC'

  LambdaAuthorizerFunctionArn:
    Type: String
    Description: The ARN of the Lambda Authorizer Function

  AccessLogFormat:
    Type: String
    Description: Format string for API Gateway access logs (leave empty to disable access logging)
    Default: ""

  LogRetentionInDays:
    Type: Number
    Description: Number of days to retain API Gateway access logs
    Default: 30

  EnableCompression:
    Type: String
    Description: Enable API Gateway gzip response compression (yes/no). When yes, MinimumCompressionSize is applied. Default 'no' — project teams should audit client gzip handling (esp. .NET HttpClient AutomaticDecompression) before enabling.
    AllowedValues: ['yes', 'no']
    Default: 'no'

  MinimumCompressionSize:
    Type: Number
    Description: Minimum response payload size in bytes to trigger gzip compression (only used when EnableCompression=yes). Valid range 0 to 10485760.
    Default: 10240
    MinValue: 0
    MaxValue: 10485760

Conditions:
  EnableCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref SSLCertificateArn, ""]]
  EnableLambdaAuthorizer: !Not [!Equals [!Ref LambdaAuthorizerFunctionArn, ""]]
  EnableAccessLogs: !Not [!Equals [!Ref AccessLogFormat, ""]]
  CompressionEnabled: !Equals [!Ref EnableCompression, 'yes']
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]

Resources:
  ApiGatewayAccessLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Condition: EnableAccessLogs
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${APIName}-access-logs'
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  ApiGatewayDomainName:
    Type: AWS::ApiGateway::DomainName
    Condition: EnableCustomDomain
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref SSLCertificateArn
      SecurityPolicy: !Ref ApiSecurityPolicy
      EndpointAccessMode: !Ref EndpointAccessMode
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7.1

  ApiGatewayBasePathMapping:
    Type: 'AWS::ApiGateway::BasePathMapping'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Condition: EnableCustomDomain
    Properties:
      DomainName: !Ref ApiGatewayDomainName
      RestApiId: !Ref PrivateApi
      Stage: !Ref StageName
      BasePath: ''   # Leave empty for the root path
    DependsOn:
      - ApiGatewayStage

  PrivateApi:
    Type: 'AWS::ApiGateway::RestApi'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Metadata:
      DependsOn: !If [EnableCustomDomain, !Ref ApiGatewayDomainName, !Ref 'AWS::NoValue']
    Properties:
      Name: !Ref APIName
      Description: API Import from Swagger file
      SecurityPolicy: !Ref ApiSecurityPolicy
      EndpointAccessMode: !Ref EndpointAccessMode
      MinimumCompressionSize: !If
        - CompressionEnabled
        - !Ref MinimumCompressionSize
        - !Ref 'AWS::NoValue'
      FailOnWarnings: false
      Body:
        Fn::Transform:
          Name: 'AWS::Include'
          Parameters:
            Location: !Sub 's3://${SwaggerFile}'
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref ApigwVpceId
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApigwVpceId
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v7

  ApiDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    DependsOn:
      - PrivateApi
    Properties:
      RestApiId: !Ref PrivateApi

  ApiGatewayStage:
    Type: 'AWS::ApiGateway::Stage'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref PrivateApi
      StageName: !Ref StageName
      ClientCertificateId: !Ref ApiGatewayClientCertificateId
      TracingEnabled: true
      AccessLogSetting: !If
        - EnableAccessLogs
        - DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
          Format: !Ref AccessLogFormat
        - !Ref 'AWS::NoValue'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: true

  ApiGatewayAuthorizer:
    Type: 'AWS::ApiGateway::Authorizer'
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    Condition: EnableLambdaAuthorizer
    Properties:
      Name: 'LambdaAuthorizer'
      Type: 'REQUEST'  # You can also use 'REQUEST' based on your use case
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerFunctionArn}/invocations'
      IdentitySource: 'method.request.header.Authorization'
      RestApiId: !Ref PrivateApi

  # ApiGatewayIdSSMParameter:
  #   Type: 'AWS::SSM::Parameter'
  #   Properties:
  #     Name: !Sub '/frontendspa/intranet/${AppShortName}/${EnvName}/apigw_id'
  #     Type: 'String'
  #     Value: !Ref PrivateApi
  #     Description: !Sub 'API Gateway ID for ${APIName}'
