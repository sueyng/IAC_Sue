AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy various resources using child CloudFormation templates.

Parameters:
  AppShortName:
    Type: String
    Description: Application short name.

  EnvName:
    Type: String
    Description: Environment name.
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - prod
      - prod-a
      - prod-b

  # ALB Parameters
  ALBName:
    Type: String
    Description: Name of the Application Load Balancer.

  ALBScheme:
    Type: String
    Description: ALB type (internal or internet-facing).
    AllowedValues:
      - internal
      - internet-facing

  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: Subnet IDs for ALB deployment.

  VPCEndpointIP1:
    Type: String
    Description: VPC Endpoint IP (AZ1).

  VPCEndpointIP2:
    Type: String
    Description: VPC Endpoint IP (AZ2).

  VPCEndpointIP3:
    Type: String
    Description: VPC Endpoint IP (AZ3, optional).

  SSLCertificateArn:
    Type: String
    Description: ARN of the SSL certificate for the ALB.

  PrefixListIdIntranet:
    Type: String
    Description: AWS Prefix List ID for intranet traffic (optional).

  # S3 Bucket Parameters
  BucketName:
    Type: String
    Description: Name of the S3 bucket.

  # Lambda Reverse Proxy Parameters
  LambdaS3bucket:
    Type: String
    Description: S3 bucket where Lambda code is stored.

  CodeZipFileName:
    Type: String
    Description: Name of the Lambda code zip file.

Resources:
  # ALB Substack
  ALBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-alb-intranet.yaml"
      Parameters:
        EnvName: !Ref EnvName
        ALBName: !Ref ALBName
        ALBScheme: !Ref ALBScheme
        VpcId: !Ref VpcId
        IngressSubnetIds: !Ref IngressSubnetIds
        VPCEndpointIP1: !Ref VPCEndpointIP1
        VPCEndpointIP2: !Ref VPCEndpointIP2
        VPCEndpointIP3: !Ref VPCEndpointIP3
        SSLCertificateArn: !Ref SSLCertificateArn
        PrefixListIdIntranet: !Ref PrefixListIdIntranet

  # S3 Bucket Substack
  S3BucketStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-s3bucket.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        BucketName: !Ref BucketName

  # Lambda Reverse Proxy Substack
  LambdaS3ReverseProxyStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.amazonaws.com/cf-lambda-s3reverseproxy.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        LambdaS3bucket: !Ref LambdaS3bucket
        CodeZipFileName: !Ref CodeZipFileName
