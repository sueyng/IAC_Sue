AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create a ALB with target Group to Endpoint IP Addresses and optional S3 endpoint routing. v2

Parameters:
  EnvName:
    Type: String
    Description: Environment
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  ALBName: 
    Description: Name for Application Load Balancer
    Type: String

  ALBScheme:
    Description: ALB type, Internet or intranet ALB
    Type: String
    AllowedValues:
      - internal
      - internet-facing    
  
  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for the Ingress Subnets where the Public ALB will be deployed.

  VPCEndpointIP1:
    Description: VPC Interface Endpoint IP - AZ1
    Type: String

  VPCEndpointIP2:
    Description: VPC Interface Endpoint IP - AZ2
    Type: String

  VPCEndpointIP3:
    Description: VPC Interface Endpoint IP - AZ3
    Type: String

  SSLCertificateArn:
    Description: The ARN of the SSL certificate to associate with the ALB HTTPS listener.
    Type: String

  AdditionalCertArn:
    Description: Additonal SSL certificate ARN to associate with the ALB HTTPS listener (eg.IntrnetBackednAPI)
    Type: String

  PrefixListIdIntranet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic from intranet subnets

  EnableS3Upload:
    Type: String
    Description: Enable S3 upload functionality through ALB
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  S3EndpointIP1:
    Description: S3 VPC Interface Endpoint IP - AZ1
    Type: String
    Default: ""

  S3EndpointIP2:
    Description: S3 VPC Interface Endpoint IP - AZ2
    Type: String
    Default: ""

  S3EndpointIP3:
    Description: S3 VPC Interface Endpoint IP - AZ3 (Optional)
    Type: String
    Default: ""

  S3UploadPath:
    Description: Path pattern for S3 upload route (e.g., /upload/*)
    Type: String
    Default: "/appartifacts/*"

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasVPCEndpointIP3: !Not [!Equals [!Ref "VPCEndpointIP3", ""]]
  IsPrivateALB: !Equals [!Ref "ALBScheme", "internal"]
  IsPublicALB: !Equals [!Ref "ALBScheme", "internet-facing"]
  HasPrefixListIdIntranet: !Not [!Equals [!Ref "PrefixListIdIntranet", ""]]
  HasAdditionalCertArn: !Not [!Equals [!Ref "AdditionalCertArn", ""]]
  EnableS3UploadFeature: !Equals [!Ref "EnableS3Upload", "true"]
  HasS3EndpointIP3: !And 
    - !Not [!Equals [!Ref "S3EndpointIP3", ""]]
    - !Condition EnableS3UploadFeature

Resources:

  # Security Group for ALB
  PublicALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPublicALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Pulbic ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v3

  PrivateALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsPrivateALB
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      GroupName: !Sub "${ALBName}-sg"
      GroupDescription: Security group for the Private ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixListIdIntranet
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref PrefixListIdIntranet
          - !Ref "AWS::NoValue"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v3

  #Application Load Balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Ref ALBName
      Subnets: !Ref IngressSubnetIds
      SecurityGroups:
        - !If
          - IsPrivateALB
          - !Ref PrivateALBSecurityGroup  # Private ALB Security Group
          - !Ref PublicALBSecurityGroup
      Scheme: !Ref ALBScheme
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: "true"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v3

  # Target Group
  ALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${ALBName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 443
      TargetType: ip
      Targets:
        - Id: !Ref VPCEndpointIP1 # First IP
        - Id: !Ref VPCEndpointIP2  # Second IP
        - !If
          - HasVPCEndpointIP3
          - Id: !Ref VPCEndpointIP3  # Third IP
          - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,403"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v3

  # S3 Target Group
  S3TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: EnableS3UploadFeature
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Name: !Sub "${ALBName}-s3-tg"
      Tags:
        - Key: Name
          Value: fileupload
        - Key: IaCVersion
          Value: AppSubsystem-SPAIntranet-v3
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 443
      TargetType: ip
      Targets:
        - Id: !Ref S3EndpointIP1
        - Id: !Ref S3EndpointIP2
        - !If
          - HasS3EndpointIP3
          - Id: !Ref S3EndpointIP3
          - !Ref "AWS::NoValue"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,307"
        
  # Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Port: 443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn

  # S3 Upload Listener Rule
  S3UploadListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: EnableS3UploadFeature
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10  # Priority for S3 path
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Conditions:
        - Field: path-pattern
          Values: 
            - !Ref S3UploadPath

  AdditionalCertificates:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerCertificate'
    Condition: HasAdditionalCertArn
    Properties:
      Certificates:
        - CertificateArn: !Ref AdditionalCertArn
#        - CertificateArn: !Ref SSLCertificateArn
      ListenerArn: !Ref ALBListener