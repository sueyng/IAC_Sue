AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack to deploy Intranet Frontend SPA - v1.1

Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-stg
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  LambdaS3bucket:
    Type: String
    Description: The s3 bucket where Lambda code is stored

  CodeZipFileName:
    Type: String
    Description: Zip file name for lambda function code

  LambdaRuntime:
    Type: String
    Description: Runtime for Lambda
    Default: 'nodejs20.x'

  LambdaHandler:
    Type: String
    Description: Zip file name for lambda function code
    Default: 'index.mjs.handler'

  FrontendPortalDNSName:
    Type: String
    Description: DNS Name for Frontdend portal URL

  LambdaLogRetentionInDays:
    Type: Number
    Description: No of Days for Log Retention
    Default: 14

  SwaggerFile:
    Description: Swagger File location and filename, s3bucketname/filename
    Type: String

  ApigwVpceId:
    Type: String
    Description: VPC Endpoint ID for APIGW, execute-api

  APIName:
    Type: String
    Description: API Name

  StageName:
    Description: Stage Name for api setup, Use dev for non-prod env and prod for production env
    Type: String

  CustomDomainName:
    Type: String
    Description: The custom domain name for the API Gateway (e.g., api.example.com).
    Default: ""

  SSLCertificateArn:
    Type: String
    Description: The ARN of the SSL certificate for the custom domain name.
    Default: ""

  LambdaAuthorizerFunctionArn:
    Type: String
    Description: The ARN of the Lambda Authorizer Function
    Default: ""

  ALBName:
    Description: Name for Application Load Balancer
    Type: String

  ALBSslPolicy:
    Type: String
    Description: "ELB Security Policy for the HTTPS listener (TLS 1.2+ only)"
    AllowedValues:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext1-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-2-Ext2-PQ-2025-09
      - ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06

  ALBScheme:
    Description: ALB type, Internet or intranet ALB
    Type: String
    AllowedValues:
      - internal
      - internet-facing

  VpcId:
    Type: String
    Description: The VPC ID where the ALB will be created.

  IngressSubnetIds:
    Type: CommaDelimitedList
    Description: The Subnet IDs for the Ingress Subnets where the Public ALB will be deployed.

  VPCEndpointIP1:
    Description: VPC Interface Endpoint IP - AZ1
    Type: String

  VPCEndpointIP2:
    Description: VPC Interface Endpoint IP - AZ2
    Type: String
    Default: ""

  VPCEndpointIP3:
    Description: VPC Interface Endpoint IP - AZ3
    Type: String
    Default: ""

  PrefixListIdIntranet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic from intranet subnets
    Default: ""

  PrefixListIdInternet:
    Type: String
    Description: The ID of the AWS Prefix List to allow inbound traffic on the public ALB
    Default: ""

  # New parameters for security group egress rules
  VpcCidr1:
    Description: VPC CIDR 1 IP Range for egress rules
    Type: String
    Default: ""

  VpcCidr2:
    Description: VPC CIDR 2 IP Range for egress rules
    Type: String
    Default: ""

  VpcCidr3:
    Description: VPC CIDR 3 IP Range for egress rules
    Type: String
    Default: ""

  VpcCidr4:
    Description: VPC CIDR 4 IP Range for egress rules
    Type: String
    Default: ""

  VpcCidr5:
    Description: VPC CIDR 5 IP Range for egress rules
    Type: String
    Default: ""

  S3PrefixListId:
    Description: S3 PrefixList ID for egress rules
    Type: String
    Default: ""

  HCCVpceCidr:
    Description: HCC VPC Endpoint Subnet, Fixed CIDR Range from HCC
    Type: String
    Default: ""

Resources:
  Lambdas3ReverseProxyStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
         - PrivateApiGatewayStack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-lambda-s3reverseproxy.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        LambdaS3bucket: !Ref LambdaS3bucket
        CodeZipFileName: !Ref CodeZipFileName
        LambdaRuntime: !Ref LambdaRuntime
        LambdaHandler: !Ref LambdaHandler
        FrontendPortalDNSName: !Ref FrontendPortalDNSName
        LogRetentionInDays: !Ref LambdaLogRetentionInDays

  PrivateApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-private-apigw.yaml"
      Parameters:
        AppShortName: !Ref AppShortName
        EnvName: !Ref EnvName
        SwaggerFile: !Ref SwaggerFile
        ApigwVpceId: !Ref ApigwVpceId
        APIName: !Ref APIName
        StageName: !Ref StageName
        CustomDomainName: !Ref CustomDomainName
        SSLCertificateArn: !Ref SSLCertificateArn
        LambdaAuthorizerFunctionArn: !Ref LambdaAuthorizerFunctionArn

  ALBtoVPCEStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${AppShortName}-${EnvName}-cftemplates.s3.ap-southeast-1.amazonaws.com/cf-alb-vpce.yaml"
      Parameters:
        EnvName: !Ref EnvName
        ALBName: !Ref ALBName
        ALBScheme: !Ref ALBScheme
        VpcId: !Ref VpcId
        IngressSubnetIds:  !Join [",", !Ref IngressSubnetIds]
        VPCEndpointIP1: !Ref VPCEndpointIP1
        VPCEndpointIP2: !Ref VPCEndpointIP2
        VPCEndpointIP3: !Ref VPCEndpointIP3
        PrefixListIdIntranet: !Ref PrefixListIdIntranet
        PrefixListIdInternet: !Ref PrefixListIdInternet
        SSLCertificateArn: !Ref SSLCertificateArn
        ALBSslPolicy: !Ref ALBSslPolicy
        # New egress rule parameters
        VpcCidr1: !Ref VpcCidr1
        VpcCidr2: !Ref VpcCidr2
        VpcCidr3: !Ref VpcCidr3
        VpcCidr4: !Ref VpcCidr4
        VpcCidr5: !Ref VpcCidr5
        S3PrefixListId: !Ref S3PrefixListId
        HCCVpceCidr: !Ref HCCVpceCidr
