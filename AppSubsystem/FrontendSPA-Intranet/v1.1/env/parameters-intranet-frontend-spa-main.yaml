# ========================================================================
# 📋 QUICK START GUIDE
#
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# APPLICATION BASICS
AppShortName: "<edit_here>"             # 📝 e.g. myapp, api, webapp
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod

# LAMBDA S3 REVERSE PROXY
LambdaS3bucket: "<edit_here>"           # 📝 e.g. myapp-lambda-artifact
CodeZipFileName: "<edit_here>"          # 📝 e.g. s3ReverseProxy-v2.zip
LambdaRuntime: "nodejs20.x"            # Lambda runtime (e.g. nodejs20.x, nodejs22.x, python3.12)
LambdaHandler: "index.mjs.handler"     # Lambda handler (e.g. index.handler, index.mjs.handler)
FrontendPortalDNSName: "<edit_here>"    # 📝 e.g. frontend.example.com (also used as S3 bucket name)

# PRIVATE API GATEWAY
SwaggerFile: "<edit_here>"              # 📝 e.g. swagger/api-spec.json (path in S3)
ApigwVpceId: "<edit_here>"              # 📝 e.g. vpce-098e2a3947c5c353b
APIName: "<edit_here>"                  # 📝 e.g. myapp-api
StageName: "<edit_here>"                # 📝 e.g. dev, stg, prod

# SSL CERTIFICATE
SSLCertificateArn: "<edit_here>"        # 📝 e.g. arn:aws:acm:ap-southeast-1:123456789012:certificate/abc123

# APPLICATION LOAD BALANCER
ALBName: "<edit_here>"                  # 📝 e.g. myapp-nprd-alb-portal
ALBSslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"  # ELB Security Policy for HTTPS listener (TLS 1.2+ only)
ALBScheme: "<edit_here>"                # 📝 internet-facing or internal
VpcId: "<edit_here>"                    # 📝 e.g. vpc-0d99a0c727b301d67
IngressSubnetIds: "<edit_here>"         # 📝 e.g. subnet-abc123,subnet-def456 (comma-separated)

# VPC ENDPOINT IPs (API Gateway execute-api endpoint)
VPCEndpointIP1: "<edit_here>"           # 📝 e.g. 10.1.154.147 (AZ1)
VPCEndpointIP2: "<edit_here>"           # 📝 e.g. 10.1.138.43 (AZ2)

# SECURITY GROUP EGRESS (NEW in v1.1)
VpcCidr1: "<edit_here>"                 # 📝 e.g. 10.1.0.0/16 (primary VPC CIDR - required for egress)

# ========================================================================
# OPTIONAL PARAMETERS (adjust based on workload or use defaults)
# ========================================================================

# CUSTOM DOMAIN (API Gateway)
CustomDomainName: ""                    # e.g. api.example.com (leave empty for default API Gateway domain)

# LAMBDA AUTHORIZER
LambdaAuthorizerFunctionArn: ""         # e.g. arn:aws:lambda:... (leave empty if no auth needed)

# ADDITIONAL VPC ENDPOINT IP
VPCEndpointIP3: ""                      # e.g. 10.1.140.50 (AZ3, if using 3 AZs)

# INBOUND TRAFFIC RESTRICTION
PrefixListIdIntranet: ""                # e.g. pl-0xyz789 (restrict inbound for internal ALB)
PrefixListIdInternet: ""                # e.g. pl-0abc456 (restrict inbound for internet-facing ALB)

# ADDITIONAL SECURITY GROUP EGRESS CIDRs (NEW in v1.1)
VpcCidr2: ""                            # e.g. 10.2.0.0/16 (secondary VPC CIDR)
VpcCidr3: ""                            # e.g. 10.3.0.0/16 (tertiary VPC CIDR)
VpcCidr4: ""                            # e.g. 10.4.0.0/16 (quaternary VPC CIDR)
VpcCidr5: ""                            # e.g. 10.5.0.0/16 (quinary VPC CIDR)
S3PrefixListId: ""                      # e.g. pl-0abc123 (S3 prefix list for egress)
HCCVpceCidr: ""                         # e.g. 10.48.42.0/24 (HCC VPC Endpoint subnet)

# LAMBDA CONFIGURATION
LambdaLogRetentionInDays: "14"          # CloudWatch Logs retention (7, 14, 30, 60, 90 days)

# <<< PARAMETERS_END >>>

# ================================================================================
# 📖 PARAMETER REFERENCE
# ================================================================================

# --- APP SHORT NAME ---
# AppShortName: Application identifier for resource naming
#
# Purpose:
# - Creates nested stack names: {AppShortName}-{EnvName}-{stack-type}
# - Creates S3 bucket pattern: {AppShortName}-{EnvName}-cftemplates
#
# Format: Lowercase alphanumeric (3-6 characters recommended)
# Example: myapp, api, webapp
#
# How to determine:
# - This is defined by your project team
# - Check existing resources in your account for naming convention
# - Typically matches your project code or application name

# --- ENVIRONMENT NAME ---
# EnvName: Environment designation
#
# Purpose:
# - Used in resource naming
# - Determines DeletionPolicy (Retain for prod, Delete for non-prod)
#
# Allowed Values:
# - Non-Production: nprd, nprd-dev, nprd-stg, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit,
#   nprd-sit-a, nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#   nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
# - Production: prod, prod-a, prod-b, prod-c
#
# How to determine:
# - Check with your project manager for the target environment
# - Must match one of the allowed values above

# --- LAMBDA S3 BUCKET ---
# LambdaS3bucket: S3 bucket containing Lambda deployment package
#
# Format: bucket-name (no s3:// prefix)
# Example: myapp-nprd-app-artifact
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → S3
# 2. Search for your application's artifact bucket
#    (usually named: {AppShortName}-{EnvName}-app-artifact or similar)
# 3. Copy the bucket name (NOT the ARN)
# 4. Verify the Lambda zip file exists in this bucket

# --- CODE ZIP FILE NAME ---
# CodeZipFileName: S3 key for Lambda deployment package
#
# Format: filename.zip or path/to/filename.zip
# Example: lambda/s3ReverseProxy-v2.zip
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → S3
# 2. Open the LambdaS3bucket you identified above
# 3. Navigate to find your Lambda deployment package (.zip file)
# 4. Copy the full path including filename
#    e.g., if file is at: mybucket/lambda/proxy.zip → use "lambda/proxy.zip"

# --- LAMBDA RUNTIME ---
# LambdaRuntime: Lambda function runtime version
#
# Default: nodejs20.x
# Example: nodejs20.x, nodejs22.x, python3.12
#
# Supported Node.js runtimes: nodejs18.x, nodejs20.x, nodejs22.x
# Check latest supported runtimes: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

# --- LAMBDA HANDLER ---
# LambdaHandler: Lambda function entry point
#
# Default: index.mjs.handler
# Format: filename.handler_function (e.g. index.handler, index.mjs.handler)
#
# Must match the exported handler function in your Lambda code package

# --- FRONTEND PORTAL DNS NAME ---
# FrontendPortalDNSName: Domain name for frontend (also used as S3 bucket name)
#
# Format: your-frontend-domain.example.com
# Example: myapp-portal.company.com
#
# How to determine:
# - This should be the DNS name you plan to use for your frontend
# - Coordinate with your network team for DNS registration
# - This value will be used to create the S3 bucket for static assets

# --- SWAGGER FILE ---
# SwaggerFile: Swagger/OpenAPI spec file path in S3
#
# Format: path/to/swagger.json (relative to LambdaS3bucket)
# Example: swagger/frontend-api-spec.json
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → S3
# 2. Open the LambdaS3bucket
# 3. Navigate to find your Swagger/OpenAPI specification file
# 4. Copy the full S3 key path
#    e.g., swagger/api-spec.json

# --- APIGW VPCE ID ---
# ApigwVpceId: VPC Endpoint ID for execute-api service
#
# Format: vpce-xxxxxxxxxxxxxxxxx
# Example: vpce-098e2a3947c5c353b
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Endpoints"
# 3. Look for endpoint with Service Name containing "execute-api"
#    (e.g., com.amazonaws.ap-southeast-1.execute-api)
# 4. Copy the "VPC Endpoint ID" (starts with vpce-)
#
# ⚠️ Note: If no execute-api endpoint exists, you need to create one first
#    or request infrastructure team to provision it

# --- API NAME ---
# APIName: API Gateway REST API name
#
# Format: Lowercase alphanumeric with hyphens
# Example: myapp-frontend-api
#
# How to determine:
# - Follow naming convention: {AppShortName}-{purpose}-api
# - This will be the display name in API Gateway console

# --- STAGE NAME ---
# StageName: API Gateway deployment stage name
#
# Allowed Values: dev, stg, sit, uat, prod (or custom)
# Example: dev
#
# How to determine:
# - Match your environment (dev for development, prod for production)
# - This creates the API URL path: https://{api-id}.execute-api.{region}.amazonaws.com/{StageName}/

# --- SSL CERTIFICATE ARN ---
# SSLCertificateArn: ACM certificate ARN for HTTPS on ALB
#
# Format: arn:aws:acm:{region}:{account}:certificate/{id}
# Example: arn:aws:acm:ap-southeast-1:123456789012:certificate/abc12345-1234-1234-1234-abc123456789
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → Certificate Manager (ACM)
# 2. Make sure you are in the correct region (ap-southeast-1)
# 3. Find the certificate that matches your domain
# 4. Click on the certificate to view details
# 5. Copy the "ARN" value from the certificate details
#
# ⚠️ Note: Certificate must be in ISSUED status and cover your domain

# --- CUSTOM DOMAIN NAME (Optional) ---
# CustomDomainName: Custom domain for API Gateway
#
# Format: api.yourdomain.com
# Example: api.myapp.company.com
#
# Leave empty ("") to use default API Gateway domain
#
# How to determine:
# - Coordinate with network team if custom domain is needed
# - Must have matching ACM certificate

# --- LAMBDA AUTHORIZER FUNCTION ARN (Optional) ---
# LambdaAuthorizerFunctionArn: ARN of existing Lambda authorizer function
#
# Format: arn:aws:lambda:{region}:{account}:function:{function-name}
# Example: arn:aws:lambda:ap-southeast-1:123456789012:function:myapp-authorizer
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → Lambda
# 2. Find your authorizer function in the function list
# 3. Click on the function name
# 4. Copy the "Function ARN" from the top right of the page
#
# Leave empty ("") if no authorization is required

# --- ALB NAME ---
# ALBName: Application Load Balancer name
#
# Format: {AppShortName}-{EnvName}-alb-{purpose}
# Example: myapp-nprd-alb-portal
#
# How to determine:
# - Follow your organization's naming convention
# - This will be the display name in EC2 Load Balancers console

# --- ALB SSL POLICY ---
# ALBSslPolicy: ELB Security Policy for the HTTPS listener
#
# Purpose: Controls TLS protocol versions and cipher suites for the ALB HTTPS listener
#
# Default: ELBSecurityPolicy-TLS13-1-2-2021-06
#
# Allowed Values:
# - ELBSecurityPolicy-TLS13-1-2-2021-06        (TLS 1.2+1.3, default)
# - ELBSecurityPolicy-TLS13-1-2-Res-2021-06    (TLS 1.2+1.3, restricted ciphers)
# - ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06   (TLS 1.2+1.3, extended ciphers set 1)
# - ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06   (TLS 1.2+1.3, extended ciphers set 2)
# - ELBSecurityPolicy-TLS13-1-3-2021-06        (TLS 1.3 only)
# - ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09 (TLS 1.2+1.3, restricted + post-quantum)
# - ELBSecurityPolicy-TLS13-1-2-PQ-2025-09     (TLS 1.2+1.3, post-quantum)
# - ELBSecurityPolicy-TLS13-1-2-Ext1-PQ-2025-09(TLS 1.2+1.3, extended set 1 + post-quantum)
# - ELBSecurityPolicy-TLS13-1-2-Ext2-PQ-2025-09(TLS 1.2+1.3, extended set 2 + post-quantum)
# - ELBSecurityPolicy-TLS13-1-3-PQ-2025-09     (TLS 1.3 only + post-quantum)
#
# Recommendations:
# - Standard workloads: Use default (ELBSecurityPolicy-TLS13-1-2-2021-06)
# - TLS 1.3 only: Use ELBSecurityPolicy-TLS13-1-3-2021-06
# - Post-quantum readiness: Use ELBSecurityPolicy-TLS13-1-2-PQ-2025-09
#
# Reference: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html

# --- ALB SCHEME ---
# ALBScheme: Load balancer accessibility
#
# Allowed Values:
# - "internal"        → Only accessible within VPC (recommended for intranet)
# - "internet-facing" → Accessible from internet
#
# How to determine:
# - For intranet applications: use "internal"
# - For public-facing applications: use "internet-facing"

# --- VPC ID ---
# VpcId: VPC where ALB and resources will be deployed
#
# Format: vpc-xxxxxxxxxxxxxxxxx
# Example: vpc-0d99a0c727b301d67
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Your VPCs"
# 3. Identify your target VPC (check Name tag or CIDR)
# 4. Copy the "VPC ID" column value
#
# ⚠️ Tip: Look for VPC with Name tag matching your environment
#    e.g., "nprd-vpc" or "prod-vpc"

# --- INGRESS SUBNET IDS ---
# IngressSubnetIds: Subnet IDs for ALB placement (minimum 2 AZs required)
#
# Format: subnet-xxx,subnet-yyy (comma-separated, NO spaces)
# Example: subnet-0abc123def456789a,subnet-0def456abc789012b
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Subnets"
# 3. Filter by your VPC ID
# 4. For internal ALB: Select PRIVATE subnets (usually tagged "private" or "app")
#    For internet-facing ALB: Select PUBLIC subnets (usually tagged "public" or "ingress")
# 5. Select subnets from at least 2 different Availability Zones
# 6. Copy each "Subnet ID" and combine with commas
#
# ⚠️ Important:
# - Must be from at least 2 different AZs for high availability
# - Subnets must be in the same VPC as VpcId above
# - For internal ALB, use private subnets
# - For internet-facing ALB, use public subnets with internet gateway route

# --- VPC ENDPOINT IPs ---
# VPCEndpointIP1, VPCEndpointIP2, VPCEndpointIP3: Private IPs of API Gateway VPC Endpoint
#
# Format: x.x.x.x (IPv4 address)
# Example: VPCEndpointIP1: "10.1.154.147"
#          VPCEndpointIP2: "10.1.138.43"
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Endpoints"
# 3. Find the execute-api endpoint (same as ApigwVpceId above)
# 4. Click on the endpoint to view details
# 5. Go to "Subnets" tab
# 6. Look at the "IPv4 address" column for each subnet/AZ
# 7. Copy each IP address:
#    - First IP → VPCEndpointIP1 (AZ1)
#    - Second IP → VPCEndpointIP2 (AZ2)
#    - Third IP → VPCEndpointIP3 (AZ3, optional)
#
# ⚠️ Note: Number of IPs depends on how many AZs the endpoint spans

# --- PREFIX LIST ID INTRANET (Optional) ---
# PrefixListIdIntranet: Managed prefix list to restrict inbound traffic sources
#
# Format: pl-xxxxxxxxxxxxxxxxx
# Example: pl-0abc123def456789
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Managed prefix lists"
# 3. Find the prefix list for your intranet/corporate IP ranges
#    (usually named "intranet" or "corporate-ips")
# 4. Copy the "Prefix list ID" column value
#
# Leave empty ("") if no inbound restriction is needed

# --- PREFIX LIST ID INTERNET (Optional) ---
# PrefixListIdInternet: Managed prefix list for inbound traffic restriction (internet-facing ALB)
#
# Purpose: Restrict inbound HTTPS on public ALB to specific IP ranges
# Note: If empty, no ingress rules are created (ALB will have no inbound access)
# Format: pl-xxxxxxxxxxxxxxxxx

# --- LAMBDA LOG RETENTION ---
# LambdaLogRetentionInDays: CloudWatch Logs retention period for Lambda
#
# Valid Values: 1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365 days
# Default: 14
#
# How to determine:
# - Check your organization's log retention policy
# - Longer retention = higher CloudWatch Logs cost

# ================================================================================
# 🆕 v1.1 NEW PARAMETERS - Security Group Egress Configuration
# ================================================================================

# --- VPC CIDR 1-5 ---
# VpcCidr1-5: VPC CIDR blocks for security group egress rules
#
# Purpose:
# - Restricts ALB outbound traffic to specific VPC CIDRs only
# - Replaces default "allow all" egress rule from v1
# - Enhances security by limiting outbound destinations
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.1.0.0/16
#
# 🔍 How to find VPC CIDR in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Your VPCs"
# 3. Find your VPC (same as VpcId above)
# 4. Look at the "IPv4 CIDR" column
# 5. Copy the CIDR value (e.g., 10.1.0.0/16)
#
# 🔍 For additional CIDRs (VpcCidr2-5):
# 1. In VPC details, check "CIDRs" tab for secondary CIDR blocks
# 2. Or check peered VPCs if backend services are in different VPCs
#
# ⚠️ Important:
# - VpcCidr1 is REQUIRED for ALB to reach backend targets
# - Without any CIDR, all outbound traffic will be blocked
# - Add additional CIDRs if backend services span multiple VPCs

# --- S3 PREFIX LIST ID ---
# S3PrefixListId: AWS-managed prefix list for S3 service
#
# Purpose: Allow ALB security group egress to S3 endpoints
#
# Format: pl-xxxxxxxxxxxxxxxxx
# Example: pl-6fa54006
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Managed prefix lists"
# 3. In the search box, type "s3"
# 4. Find the AWS-managed prefix list:
#    - Name: "com.amazonaws.ap-southeast-1.s3" (or your region)
#    - Owner: "AWS"
# 5. Copy the "Prefix list ID" (e.g., pl-6fa54006)
#
# ⚠️ Note: This is an AWS-managed prefix list, not customer-managed
# Leave empty ("") if S3 egress is not needed

# --- HCC VPCE CIDR ---
# HCCVpceCidr: HCC (Healthcare Cloud Connectivity) VPC Endpoint subnet CIDR
#
# Purpose: Allow egress to HCC VPC Endpoint for corporate/healthcare connectivity
#
# Format: x.x.x.x/xx (CIDR notation)
# Example: 10.48.42.0/24
#
# 🔍 How to find in AWS Console:
# 1. Go to AWS Console → VPC
# 2. In left menu, click "Endpoints"
# 3. Find the HCC-related endpoint (check with infrastructure team for name)
# 4. Click on the endpoint to view details
# 5. Go to "Subnets" tab
# 6. Note the subnet IDs, then:
#    - Go to VPC → Subnets
#    - Find those subnets and check their CIDR blocks
# 7. Use the subnet CIDR that contains the HCC endpoint IPs
#
# Leave empty ("") if HCC connectivity is not required

