# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (must fill before deployment)
# ========================================================================
# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"             # 📝 e.g. myapp, api, webapp
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod

# NETWORK LOAD BALANCER
NLBName: "<edit_here>"                  # 📝 e.g. myapp-nprd-nlb-vpclink
NLBSubnetIds: "<edit_here>"             # 📝 e.g. subnet-xxx,subnet-yyy (min 2, different AZs, NO SPACES)

# NETWORK CONFIGURATION
VpcId: "<edit_here>"                    # 📝 e.g. vpc-0d99a0c727b301d67
VPCSubnetCidrAppAZ1: "<edit_here>"      # 📝 e.g. 10.53.144.128/26 (app subnet CIDR AZ1)
VPCSubnetCidrAppAZ2: "<edit_here>"      # 📝 e.g. 10.53.144.192/26 (app subnet CIDR AZ2)

# HEALTH CHECK
HealthCheckPath: "<edit_here>"          # 📝 e.g. /ALBhealth, /health (must return HTTP 200-399)

# ========================================================================
# OPTIONAL PARAMETERS (leave empty if not needed)
# ========================================================================
TargetALBArn: ""                        # e.g. arn:aws:elasticloadbalancing:region:account:loadbalancer/app/xxx/yyy (recommended: get from ECS stack outputs)
PrefixListNLBIngress: ""                # e.g. pl-abc123 (prefix list for ingress whitelist)
APIGWVPCESecurityGroupID: ""            # e.g. sg-abc123 (API Gateway VPC endpoint security group)
VPCSubnetCidrAppAZ3: ""                 # e.g. 10.53.145.0/26 (app subnet CIDR AZ3, for 3-AZ deployment)

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================

# --- DEPLOYMENT STRATEGIES ---

# 💡 RECOMMENDED - Single Deployment (with ALB ARN):
#   1. Deploy ECS Backend with ALB first
#   2. Get ALB ARN from stack outputs
#   3. Set TargetALBArn parameter
#   4. Deploy this NLB + VPC Link stack
#   ✅ Target group immediately healthy

# 🔄 ALTERNATIVE - Two-Phase Deployment:
#   Phase 1: Leave TargetALBArn empty ""
#     - Deploy NLB stack (target group unhealthy, no targets)
#   Phase 2: Register ALB
#     - Deploy ECS Backend, get ALB ARN
#     - Update TargetALBArn parameter
#     - Redeploy stack (target group becomes healthy)

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. myapp, api, webapp)
#   Creates: {AppShortName}-{EnvName}-vpclink-nlb

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain, deletion protection enabled
#   Non-Prod (nprd*): DeletionPolicy Delete, deletion protection enabled

# NLBName
#   Value: Network Load Balancer name (e.g. myapp-nprd-nlb-vpclink)
#   Format: {AppShortName}-{EnvName}-nlb-vpclink (recommended)
#   Max length: 32 characters
#   Creates security group: {NLBName}-sg

# NLBSubnetIds
#   Value: Comma-separated subnet IDs (NO SPACES)
#   Format: subnet-xxx,subnet-yyy
#   Requirements:
#     - Minimum 2 subnets in different AZs
#     - Must be private subnets
#     - Must be in VpcId
#   Finding: VPC Console → Subnets → filter by VPC → copy private subnet IDs
#   Recommendation: 2 AZs minimum, 3 AZs for production

# --- NETWORK CONFIGURATION ---

# VpcId
#   Value: VPC ID (e.g. vpc-0d99a0c727b301d67)
#   Finding: VPC Console → Your VPCs → copy VPC ID

# VPCSubnetCidrAppAZ1, VPCSubnetCidrAppAZ2
#   Value: Application subnet CIDRs (e.g. 10.53.144.128/26, 10.53.144.192/26)
#   Purpose: Security group egress rules (NLB → ALB in app subnets)
#   Finding: VPC Console → Subnets → select app subnet → copy IPv4 CIDR

# VPCSubnetCidrAppAZ3 (optional)
#   Value: Third app subnet CIDR for 3-AZ deployment
#   Leave empty for 2-AZ deployment

# --- HEALTH CHECK ---

# HealthCheckPath
#   Value: URL path for health check (e.g. /ALBhealth, /health, /healthcheck)
#   Requirements:
#     - ALB must respond with HTTP 200-399
#     - Path must be accessible on ALB
#   Health check config:
#     - Protocol: HTTPS
#     - Port: 443 (traffic-port)
#     - Interval: 30 seconds
#     - Timeout: 10 seconds
#     - Healthy threshold: 3 consecutive successes
#     - Unhealthy threshold: 3 consecutive failures
#   Recommendation: Implement lightweight health endpoint

# --- OPTIONAL PARAMETERS ---

# TargetALBArn
#   Value: ALB ARN to register as target
#   Format: arn:aws:elasticloadbalancing:region:account:loadbalancer/app/name/id
#   Example: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:loadbalancer/app/myapp-nprd-alb-ecs/abc123
#   Finding:
#     - Load Balancers Console → select ALB → Details → copy ARN
#     - CloudFormation → ECS stack → Outputs → ALB ARN
#   Leave empty for two-phase deployment
#   Provide ARN for single deployment (recommended)

# PrefixListNLBIngress
#   Value: Prefix list ID for ingress whitelist (e.g. pl-abc123)
#   Purpose: Security group ingress rule (TCP 443 from prefix list)
#   Use cases: VPN endpoints, service endpoints, centralized IP management
#   Finding: VPC Console → Managed Prefix Lists → copy ID
#   Leave empty if not using prefix lists

# APIGWVPCESecurityGroupID
#   Value: API Gateway VPC endpoint security group ID (e.g. sg-abc123)
#   Purpose: Security group ingress rule (TCP 443 from API Gateway VPCE)
#   Finding:
#     - Security Groups Console → search API Gateway VPCE SG
#     - VPC Endpoints Console → API Gateway endpoint → Security groups
#   Leave empty if not using VPC endpoint security group

# --- RESOURCES CREATED ---

# Network Load Balancer
#   Name: {NLBName}
#   Type: network
#   Scheme: internal (VPC-private)
#   IP address type: ipv4
#   Subnets: {NLBSubnetIds}
#   Deletion protection: enabled (both prod and nprd)
#   Security groups: {NLBName}-sg

# NLB Security Group
#   Name: {NLBName}-sg
#   VPC: {VpcId}
#   Ingress:
#     - TCP 443 from PrefixListNLBIngress (if specified)
#     - TCP 443 from APIGWVPCESecurityGroupID (if specified)
#   Egress:
#     - TCP 443 to VPCSubnetCidrAppAZ1
#     - TCP 443 to VPCSubnetCidrAppAZ2
#     - TCP 443 to VPCSubnetCidrAppAZ3 (if specified)

# NLB Target Group
#   Name: {NLBName}-TG
#   Target type: alb
#   Protocol: TCP
#   Port: 443
#   VPC: {VpcId}
#   Targets: {TargetALBArn} on port 443 (if provided)
#   Health check:
#     - Protocol: HTTPS
#     - Port: traffic-port (443)
#     - Path: {HealthCheckPath}
#     - Matcher: HTTP 200-399
#     - Interval: 30 seconds
#     - Timeout: 10 seconds
#     - Healthy/Unhealthy threshold: 3

# NLB Listener
#   Protocol: TCP
#   Port: 443
#   Default action: Forward to {NLBName}-TG

# VPC Link
#   Name: {AppShortName}-{EnvName}-vpclink-nlb
#   Target: NLB ARN
#   Purpose: Connect API Gateway (REST API) to NLB

# --- POST-DEPLOYMENT NOTES ---

# VPC Link Status:
#   Check: API Gateway Console → VPC Links
#   Expected: Status "Available" (takes 5-10 minutes)
#   If pending: Wait for provisioning to complete
#   If failed: Check NLB status and security group rules

# Target Group Health:
#   Check: EC2 Console → Target Groups → {NLBName}-TG → Targets
#   Expected: Healthy (if TargetALBArn provided)
#   If unhealthy:
#     - Verify ALB is running and healthy
#     - Check health check path returns HTTP 200-399
#     - Verify security group allows NLB → ALB traffic
#     - Check ALB access logs for health check requests

# Integrating with API Gateway:
#   1. Navigate to API Gateway → select REST API
#   2. Create or select resource and method
#   3. Integration type: VPC Link
#   4. VPC Link: Select {AppShortName}-{EnvName}-vpclink-nlb
#   5. Endpoint URL: http://{nlb-dns-name} or http://{alb-dns-name}
#   6. Deploy API to stage
#   7. Test: Call API endpoint

# NLB DNS Name:
#   Check: CloudFormation → Stack → Outputs → NLBDNSName
#   Format: {nlb-name}-{random}.elb.{region}.amazonaws.com
#   Use: For API Gateway VPC Link integration

# Two-Phase Deployment Steps:
#   If deployed without ALB ARN:
#     1. Check target group status (will show unhealthy)
#     2. Deploy ECS Backend stack
#     3. Get ALB ARN from stack outputs
#     4. Update TargetALBArn parameter
#     5. Redeploy this stack
#     6. Verify target group becomes healthy

# Security Group Rules:
#   Ingress: Controlled by PrefixListNLBIngress and APIGWVPCESecurityGroupID
#   Egress: TCP 443 to app subnets (where ALB resides)
#   Note: NLB uses security groups (not NLB security group feature from older NLB versions)

# Common Issues:
#   - VPC Link stuck in "Pending": Wait 5-10 minutes, check NLB status
#   - Target unhealthy: Verify health check path, security group rules, ALB status
#   - API Gateway 5XX errors: Check VPC Link status, NLB listener, target group
#   - Timeout: Verify security group egress rules allow NLB → ALB traffic

# Deletion Protection:
#   NLB has deletion protection enabled (both prod and nprd)
#   To delete stack:
#     1. Disable deletion protection on NLB
#     2. Delete CloudFormation stack

