AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to provision VPCLink
Parameters:
  AppShortName:
    Description: Application name
    Type: String

  EnvName:
    Description: Environment Name
    Type: String
    AllowedValues:
      - nprd
      - nprd-dev
      - nprd-dev1
      - nprd-dev2
      - nprd-sit1
      - nprd-sit2
      - nprd-sit3
      - nprd-sit
      - nprd-sit-a
      - nprd-sit-b
      - nprd-sit-c
      - nprd-uat
      - nprd-uat-a
      - nprd-uat-b
      - nprd-uat-c      
      - nprd-pt
      - nprd-pp
      - nprd-pp-a
      - nprd-pp-b
      - nprd-pp-c
      - prod
      - prod-a
      - prod-b
      - prod-c

  NLBArn:
    Description: NLB Arn
    Type: String

Conditions:
  IsProduction: !Or [!Equals [!Ref "EnvName", "prod"], !Equals [!Ref "EnvName", "prod-a"], !Equals [!Ref "EnvName", "prod-b"], !Equals [!Ref "EnvName", "prod-c"]]
  HasNLBArn: !Not [!Equals [!Ref NLBArn, '']]

Resources:
  VpcLink:
    Type: 'AWS::ApiGateway::VpcLink'
    Properties:
      Name: !Sub "${AppShortName}-${EnvName}-vpclink-nlb"
      TargetArns:
        - !If
          - HasNLBArn
          - !Ref NLBArn
          - !Sub "{{resolve:ssm:${AppShortName}-${EnvName}-parameter-NLBArn:1}}"
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-VPCLink-v1