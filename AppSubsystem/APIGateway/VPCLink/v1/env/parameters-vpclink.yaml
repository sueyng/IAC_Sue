# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"             # 📝 e.g. myapp, api, webapp
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod

# NETWORK LOAD BALANCER (choose one approach)
NLBArn: ""                              # 📝 e.g. arn:aws:elasticloadbalancing:region:account:loadbalancer/net/xxx/yyy
# Option 1 (Recommended): Provide NLB ARN directly
# Option 2: Leave "" to fetch from SSM parameter: /{AppShortName}-{EnvName}-parameter-NLBArn

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================
# --- DEPLOYMENT ORDER ---

# Correct sequence:
#   1. Deploy VPC and networking
#   2. Deploy backend (ECS, etc.)
#   3. Deploy ALB for backend
#   4. Deploy NLB (get NLB ARN from outputs)
#   5. Deploy VPC Link (this template, use NLB ARN)
#   6. Deploy Private API Gateway (use VPC Link ID)

# --- REQUIRED PARAMETERS ---

# AppShortName
#   Value: Application short name (e.g. myapp, api, webapp)
#   Creates: {AppShortName}-{EnvName}-vpclink-nlb

# EnvName
#   Allowed Values (Non-Prod):
#     nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3,
#     nprd-sit-a, nprd-sit-b, nprd-sit-c,
#     nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c,
#     nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#   Allowed Values (Production):
#     prod, prod-a, prod-b, prod-c
#   Production (prod*): DeletionPolicy Retain
#   Non-Prod (nprd*): DeletionPolicy Delete

# NLBArn
#   Value: Network Load Balancer ARN
#   Format: arn:aws:elasticloadbalancing:{region}:{account}:loadbalancer/net/{name}/{id}
#   Example: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:loadbalancer/net/myapp-nprd-nlb/1234567890abcdef
#
#   Option 1 (Recommended): Provide NLB ARN directly
#     - More explicit and easier to troubleshoot
#     - No SSM parameter dependency
#     - Finding: EC2 Console → Load Balancers → select NLB → Details → copy ARN
#     - Or: CloudFormation → NLB stack → Outputs → NLB ARN
#
#   Option 2: Leave empty ("") to fetch from SSM
#     - Template retrieves from SSM: /{AppShortName}-{EnvName}-parameter-NLBArn
#     - NLB stack must have created this SSM parameter
#     - Stack fails if SSM parameter doesn't exist
#
#   Requirements:
#     - NLB must be in "Active" state
#     - NLB must have at least one listener (typically port 443)
#     - NLB target group should have healthy targets
#     - NLB in same region as VPC Link