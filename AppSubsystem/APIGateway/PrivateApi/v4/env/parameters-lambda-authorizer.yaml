# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"             # 📝 e.g. xyz, api, webapp
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod

# LAMBDA PACKAGE
LambdaS3bucket: "<edit_here>"           # 📝 e.g. apt-lambda-deployment, myapp-nprd-app-artifact
CodeZipFileName: "<edit_here>"          # 📝 e.g. LambdaAuthorizer.zip

# LAMBDA RUNTIME
LambdaRuntime: "<edit_here>"            # 📝 e.g. dotnet8, python3.12, nodejs20.x
LambdaHandler: "<edit_here>"            # 📝 e.g. Assembly::Namespace.Class::Method (dotnet) or module.handler (python)

# AZURE AD CONFIGURATION
AzureAdClientId: "<edit_here>"          # 📝 Azure AD application (client) ID (GUID)
AzureAdTenantId: "<edit_here>"          # 📝 Azure AD tenant ID (GUID)

# FORWARD PROXY (mandatory — Lambda uses this to reach Azure AD)
# Use the HCC App proxy matching your environment:
#   non-prod: http://hisproxyapps.bcs.hcc.com.sg:4000
#   prod    : http://hisproxyappp.bcs.hcc.com.sg:4000
ForwardProxyAddress: "<edit_here>"      # 📝 e.g. http://hisproxyapps.bcs.hcc.com.sg:4000 (non-prod)

# VPC CONFIGURATION (MANDATORY in v4 — TISO compliance; Lambda runs with VpcConfig for egress control)
VpcId: "<edit_here>"                    # 📝 e.g. vpc-02fb2e32bbb6ff24e (must match VPC of LambdaSubnetIds)
LambdaSubnetIds: "<edit_here>"          # 📝 e.g. subnet-abc,subnet-def (comma-separated private subnets, min 2 for HA)
VpcCidr1: "<edit_here>"                 # 📝 e.g. 10.193.0.0/16 (primary VPC CIDR — for egress to Logs/X-Ray Interface Endpoints and forward proxy)
VpcCidr2: ""                            # optional, e.g. 10.194.0.0/16 (shared-services VPC CIDR)
VpcCidr3: ""                            # optional additional CIDR
VpcCidr4: ""                            # optional additional CIDR
VpcCidr5: ""                            # optional additional CIDR

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================
# AppShortName
#   Value: Application identifier (e.g. xyz, api, webapp)
#   Creates:
#     - Lambda function: {AppShortName}-{EnvName}-LambdaAuthorizer
#     - IAM role: {AppShortName}-{EnvName}-lambda-authorizer-role
#     - CloudWatch log group: /aws/lambda/{AppShortName}-{EnvName}-LambdaAuthorizer
#   Format: Lowercase alphanumeric

# EnvName
#   Allowed Values:
#     Non-prod: nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit-a, nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c, nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#     Production: prod, prod-a, prod-b, prod-c
#   Log retention: nprd (7 days), prod (30 days)

# --- LAMBDA PACKAGE ---

# LambdaS3bucket
#   Value: S3 bucket name with Lambda ZIP file (NOT ARN)
#   Example: apt-lambda-deployment, myapp-nprd-app-artifact
#   Requirements: Bucket in same region as Lambda, ZIP file uploaded
#   Finding: S3 Console → Buckets → copy bucket name

# CodeZipFileName
#   Value: ZIP file name in S3 bucket (e.g. LambdaAuthorizer.zip)
#   Location: s3://{LambdaS3bucket}/{CodeZipFileName}
#   Best practice: Include version in filename (authorizer-v1.0.0.zip)

# --- LAMBDA RUNTIME ---

# LambdaRuntime
#   Supported runtimes:
#     .NET: dotnet8, dotnet6
#     Python: python3.12, python3.11, python3.10
#     Node.js: nodejs20.x, nodejs18.x
#     Java: java21, java17, java11
#   Must match language in deployment package

# LambdaHandler
#   Format by runtime:
#     .NET: {Assembly}::{Namespace}.{Class}::{Method}
#       Example: Authorizer::MyApp.Function::FunctionHandler
#     Python: {module}.{function}
#       Example: lambda_function.lambda_handler
#     Node.js: {file}.{export}
#       Example: index.handler
#     Java: {package}.{class}::{method}
#       Example: com.example.Handler::handleRequest
#   Finding: Check Lambda code entry point, case-sensitive

# --- AZURE AD CONFIGURATION ---

# AzureAdClientId
#   Value: Azure AD application (client) ID (GUID)
#   Example: 56d10777-fe7c-494b-a37b-88a50fb7cd29
#   Finding: Azure Portal → Azure Active Directory → App registrations → Overview → Application (client) ID
#   Purpose: Validates JWT "aud" (audience) claim
#   Environment variable: AZURE_AD_CLIENT_ID
#   Not a secret (can be public)

# AzureAdTenantId
#   Value: Azure AD tenant ID (GUID)
#   Example: 6ef68169-639f-4d8f-8b7a-c981fab3c31b
#   Finding: Azure Portal → Azure Active Directory → Overview → Tenant ID
#   Purpose: Constructs Azure AD metadata URL
#   URL: https://login.microsoftonline.com/{TenantId}/v2.0/.well-known/openid-configuration
#   Environment variable: AZURE_AD_TENANT_ID
#   Not a secret (used to fetch public keys)

# ForwardProxyAddress
#   Value: HCC App forward proxy URL used by the Lambda to reach Azure AD
#   Endpoints:
#     non-prod: http://hisproxyapps.bcs.hcc.com.sg:4000   (note the trailing 's' = staging/sandbox)
#     prod    : http://hisproxyappp.bcs.hcc.com.sg:4000   (note the trailing 'p' = production)
#   Purpose: Lambda code reads this env var and routes outbound HTTPS to Azure AD via the proxy
#   Environment variable: FORWARD_PROXY_ADDRESS
#   Not a secret (proxy host:port only)

# --- VPC CONFIGURATION (MANDATORY in v4 — TISO compliance) ---
#
# New in v4: Lambda runs with VpcConfig for egress control and VPC Flow Log visibility.
# A dedicated Security Group (LambdaAuthorizerSecurityGroup) is created with least-privilege egress:
#   - HTTPS (443) to VpcCidr1-5 → CloudWatch Logs + X-Ray Interface Endpoints, and
#     centralised egress path for Azure AD token validation
#
# Pre-deployment requirements:
#   1. VPC has the following Interface Endpoints (or reachable via peering/shared-services VPC):
#        - com.amazonaws.{region}.logs
#        - com.amazonaws.{region}.xray
#   2. Subnets must be PRIVATE and have route to Azure AD via the organisation's
#      centralised egress path (e.g. shared-services VPC / transit gateway egress).
#      The Lambda SG allows egress only to VpcCidr1-5 on 443 — internet reach is
#      handled by the routing / egress VPC, not by this SG.
#
# IAM role already has LambdaAuthorizerVPCAccessExecutionPolicy for ENI management.

# VpcId
#   Value: VPC ID where the Lambda Security Group is created
#   Format: vpc-xxxxxxxxxxxxxxxxx
#   Example: vpc-02fb2e32bbb6ff24e
#   Must be the same VPC as LambdaSubnetIds

# LambdaSubnetIds
#   Value: Comma-separated list of private subnet IDs where Lambda ENIs are provisioned
#   Format: subnet-xxx,subnet-yyy
#   Recommendation: minimum 2 subnets in different AZs for HA
#   Must be PRIVATE subnets with route to forward proxy + Interface Endpoints
#   Finding: VPC Console → Subnets → filter by VPC + private route table

# VpcCidr1 (REQUIRED)
#   Value: Primary VPC CIDR range for Security Group egress rules
#   Format: x.x.x.x/x (e.g. 10.193.0.0/16)
#   Purpose: Allows Lambda SG egress to Interface Endpoint ENIs + forward proxy within primary CIDR
#   Finding: VPC Console → your VPC → IPv4 CIDR

# VpcCidr2-5 (OPTIONAL)
#   Use when Interface Endpoints or forward proxy are reachable via additional CIDRs
#   (e.g. shared-services VPC peering, multi-CIDR VPC)
#   Leave empty if not needed

