AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to provision and deploy a private API with swagger json file
Parameters:
  SwaggerBucket:
    Description: S3 bucket containing the Swagger file
    Type: String
  
  SwaggerKey:
    Description: Path to the Swagger file within the bucket
    Type: String

  ApigwVpceId:
    Type: String
    Description: VPC Endpoint ID for APIGW, execute-api

  APIName:
    Type: String
    Description: API Name

  APIDescription:
    Type: String
    Description: Description for the API (optional)
    Default: ""
    
  StageName:
    Description: Stage Name for api setup, Use dev for non-prod env and prod for production env
    Type: String

  ApiGatewayClientCertificateId:
    Type: String
    Description: Optional API Gateway client certificate ID for REST API stage backend authentication
    Default: ""

  CustomDomainName:
    Type: String
    Description: The custom domain name for the API Gateway (e.g., api.example.com).
    Default: ""

  SSLCertificateArn:
    Type: String
    Description: The ARN of the SSL certificate for the custom domain name.
    Default: ""

  LambdaAuthorizerFunctionArn:
    Type: String
    Description: The ARN of the Lambda Authorizer Function
    Default: ""
    
  AccessLogFormat:
    Type: String
    Description: Format string for API Gateway access logs (leave empty to disable access logging)

  LogRetentionInDays:
    Type: Number
    Description: Number of days to retain API Gateway access logs
    Default: 30

  EnableCompression:
    Type: String
    Description: Enable API Gateway gzip response compression (yes/no). When yes, MinimumCompressionSize is applied. Default 'no' — project teams should audit client gzip handling (esp. .NET HttpClient AutomaticDecompression) before enabling.
    AllowedValues: ['yes', 'no']
    Default: 'no'

  MinimumCompressionSize:
    Type: Number
    Description: Minimum response payload size in bytes to trigger gzip compression (only used when EnableCompression=yes). Valid range 0 to 10485760.
    Default: 10240
    MinValue: 0
    MaxValue: 10485760

Conditions:
  EnableCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref SSLCertificateArn, ""]]
  EnableLambdaAuthorizer: !Not [!Equals [!Ref LambdaAuthorizerFunctionArn, ""]]
  EnableAccessLogs: !Not [!Equals [!Ref AccessLogFormat, ""]]
  CompressionEnabled: !Equals [!Ref EnableCompression, 'yes']
  IsProduction: !Equals [!Ref StageName, "prod"]

Resources:
  # Create CloudWatch Log Group for API Gateway Access Logs (only if access logs are enabled)
  ApiGatewayAccessLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Condition: EnableAccessLogs
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${APIName}-access-logs'
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-PrivateApi-v4

  ApiGatewayDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: EnableCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
          CertificateArn: !Ref SSLCertificateArn

  ApiGatewayBasePathMapping:
    Type: 'AWS::ApiGateway::BasePathMapping'
    Condition: EnableCustomDomain
    Properties:
      DomainName: !Ref ApiGatewayDomainName
      RestApiId: !Ref PrivateApi
      Stage: !Ref StageName
      BasePath: ''   # Leave empty for the root path
    DependsOn:
      - ApiGatewayStage

  PrivateApi:
    Type: 'AWS::ApiGateway::RestApi'
    Metadata:
      DependsOn: !If [EnableCustomDomain, !Ref ApiGatewayDomainName, !Ref 'AWS::NoValue']
    Properties:
      Name: !Ref APIName
      Description: !Ref APIDescription
      MinimumCompressionSize: !If
        - CompressionEnabled
        - !Ref MinimumCompressionSize
        - !Ref 'AWS::NoValue'
      FailOnWarnings: false
      BodyS3Location:
        Bucket: !Ref SwaggerBucket
        Key: !Ref SwaggerKey
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref ApigwVpceId
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-PrivateApi-v4
      Policy: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApigwVpceId

  ApiDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    Properties:
      RestApiId: !Ref PrivateApi

  ApiGatewayStage:
    Type: 'AWS::ApiGateway::Stage'
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref PrivateApi
      StageName: !Ref StageName
      ClientCertificateId: !Ref ApiGatewayClientCertificateId
      TracingEnabled: true
      AccessLogSetting: !If 
        - EnableAccessLogs
        - DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
          Format: !Ref AccessLogFormat
        - !Ref 'AWS::NoValue'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: true

  ApiGatewayAuthorizer:
    Type: 'AWS::ApiGateway::Authorizer'
    Condition: EnableLambdaAuthorizer
    Properties:
      Name: 'LambdaAuthorizer'
      Type: 'REQUEST'  # You can also use 'REQUEST' based on your use case
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerFunctionArn}/invocations'
      IdentitySource: 'method.request.header.Authorization'
      RestApiId: !Ref PrivateApi
