AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to provision and deploy a private API with swagger json file V4.1
Parameters:
  SwaggerBucket:
    Description: S3 bucket containing the Swagger file
    Type: String

  SwaggerKey:
    Description: Path to the Swagger file within the bucket
    Type: String

  ApigwVpceId:
    Type: String
    Description: VPC Endpoint ID for APIGW, execute-api

  APIName:
    Type: String
    Description: API Name

  APIDescription:
    Type: String
    Description: Description for the API (optional)
    Default: ""

  StageName:
    Description: Stage Name for api setup, Use dev for non-prod env and prod for production env
    Type: String

  ApiGatewayClientCertificateId:
    Type: String
    Description: Optional API Gateway client certificate ID for REST API stage backend authentication
    Default: ""

  CustomDomainName:
    Type: String
    Description: The custom domain name for the API Gateway (e.g., api.example.com).
    Default: ""

  SSLCertificateArn:
    Type: String
    Description: The ARN of the SSL certificate for the custom domain name.
    Default: ""

  ApiSecurityPolicy:
    Type: String
    Description: >-
      TLS security policy applied to both the REST API's own native endpoint (PrivateApi) and, when
      CustomDomainName/SSLCertificateArn are set, the custom domain name - these are two separate
      endpoints and both need this set to actually enforce the chosen policy end-to-end. TLS_1_2 is the
      legacy policy and deploys the custom domain as AWS::ApiGatewayV2::DomainName (v4-compatible).
      Values prefixed SecurityPolicy_ are "enhanced" policies that enable TLS 1.3 (optionally with
      FIPS/PFS/post-quantum cipher suites), deploy the custom domain as AWS::ApiGateway::DomainName,
      and require EndpointAccessMode to also be set.
    AllowedValues:
      - 'TLS_1_2'
      - 'SecurityPolicy_TLS13_1_2_2021_06'
      - 'SecurityPolicy_TLS13_1_2_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_FIPS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09'
      - 'SecurityPolicy_TLS13_1_3_2025_09'
      - 'SecurityPolicy_TLS13_1_3_FIPS_2025_09'
    Default: 'TLS_1_2'

  EndpointAccessMode:
    Type: String
    Description: >-
      Endpoint access mode, applied to both the REST API's own native endpoint (PrivateApi) and the
      custom domain name. Only applied when ApiSecurityPolicy is an enhanced (SecurityPolicy_-prefixed)
      value; omitted for TLS_1_2. STRICT enforces additional access validation, BASIC is standard behavior.
    AllowedValues: ['BASIC', 'STRICT']
    Default: 'BASIC'

  LambdaAuthorizerFunctionArn:
    Type: String
    Description: The ARN of the Lambda Authorizer Function
    Default: ""

  AccessLogFormat:
    Type: String
    Description: Format string for API Gateway access logs (leave empty to disable access logging)

  LogRetentionInDays:
    Type: Number
    Description: Number of days to retain API Gateway access logs
    Default: 30

  EnableCompression:
    Type: String
    Description: Enable API Gateway gzip response compression (yes/no). When yes, MinimumCompressionSize is applied. Default 'no' — project teams should audit client gzip handling (esp. .NET HttpClient AutomaticDecompression) before enabling.
    AllowedValues: ['yes', 'no']
    Default: 'no'

  MinimumCompressionSize:
    Type: Number
    Description: Minimum response payload size in bytes to trigger gzip compression (only used when EnableCompression=yes). Valid range 0 to 10485760.
    Default: 10240
    MinValue: 0
    MaxValue: 10485760

Conditions:
  EnableCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref SSLCertificateArn, ""]]
  IsLegacyTlsPolicy: !Equals [!Ref ApiSecurityPolicy, 'TLS_1_2']
  EnableCustomDomainLegacy: !And
    - !Condition EnableCustomDomain
    - !Condition IsLegacyTlsPolicy
  EnableCustomDomainEnhanced: !And
    - !Condition EnableCustomDomain
    - !Not [!Condition IsLegacyTlsPolicy]
  EnableLambdaAuthorizer: !Not [!Equals [!Ref LambdaAuthorizerFunctionArn, ""]]
  EnableAccessLogs: !Not [!Equals [!Ref AccessLogFormat, ""]]
  CompressionEnabled: !Equals [!Ref EnableCompression, 'yes']
  IsProduction: !Equals [!Ref StageName, "prod"]

Resources:
  # Create CloudWatch Log Group for API Gateway Access Logs (only if access logs are enabled)
  ApiGatewayAccessLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Condition: EnableAccessLogs
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${APIName}-access-logs'
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-PrivateApi-v4.1

  # ApiSecurityPolicy = TLS_1_2 -> v4-compatible custom domain (same logical ID and type as v4)
  ApiGatewayDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: EnableCustomDomainLegacy
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: !Ref ApiSecurityPolicy
          CertificateArn: !Ref SSLCertificateArn
      Tags:
        IaCVersion: AppSubsystem-PrivateApi-v4.1

  # ApiSecurityPolicy = SecurityPolicy_* -> only AWS::ApiGateway::DomainName supports enhanced (TLS 1.3) policies
  ApiGatewayDomainNameEnhanced:
    Type: AWS::ApiGateway::DomainName
    Condition: EnableCustomDomainEnhanced
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref SSLCertificateArn
      SecurityPolicy: !Ref ApiSecurityPolicy
      EndpointAccessMode: !Ref EndpointAccessMode
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-PrivateApi-v4.1

  ApiGatewayBasePathMapping:
    Type: 'AWS::ApiGateway::BasePathMapping'
    Condition: EnableCustomDomain
    Properties:
      DomainName: !If
        - IsLegacyTlsPolicy
        - !Ref ApiGatewayDomainName
        - !Ref ApiGatewayDomainNameEnhanced
      RestApiId: !Ref PrivateApi
      Stage: !Ref StageName
      BasePath: ''   # Leave empty for the root path
    DependsOn:
      - ApiGatewayStage

  PrivateApi:
    Type: 'AWS::ApiGateway::RestApi'
    Metadata:
      DependsOn: !If
        - EnableCustomDomainLegacy
        - !Ref ApiGatewayDomainName
        - !If [EnableCustomDomainEnhanced, !Ref ApiGatewayDomainNameEnhanced, !Ref 'AWS::NoValue']
    Properties:
      Name: !Ref APIName
      Description: !Ref APIDescription
      # SecurityPolicy/EndpointAccessMode on RestApi govern TLS for the API's own native endpoint
      # (what's reached via the VPC endpoint) - this is separate from, and in addition to,
      # the same settings on the custom domain name resource, which only govern the custom domain name.
      # EndpointAccessMode is omitted for the legacy TLS_1_2 policy.
      SecurityPolicy: !Ref ApiSecurityPolicy
      EndpointAccessMode: !If [IsLegacyTlsPolicy, !Ref 'AWS::NoValue', !Ref EndpointAccessMode]
      MinimumCompressionSize: !If
        - CompressionEnabled
        - !Ref MinimumCompressionSize
        - !Ref 'AWS::NoValue'
      FailOnWarnings: false
      BodyS3Location:
        Bucket: !Ref SwaggerBucket
        Key: !Ref SwaggerKey
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref ApigwVpceId
      Tags:
        - Key: IaCVersion
          Value: AppSubsystem-PrivateApi-v4.1
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApigwVpceId

  ApiDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    Properties:
      RestApiId: !Ref PrivateApi

  ApiGatewayStage:
    Type: 'AWS::ApiGateway::Stage'
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref PrivateApi
      StageName: !Ref StageName
      ClientCertificateId: !Ref ApiGatewayClientCertificateId
      TracingEnabled: true
      AccessLogSetting: !If
        - EnableAccessLogs
        - DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
          Format: !Ref AccessLogFormat
        - !Ref 'AWS::NoValue'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: true

  ApiGatewayAuthorizer:
    Type: 'AWS::ApiGateway::Authorizer'
    Condition: EnableLambdaAuthorizer
    Properties:
      Name: 'LambdaAuthorizer'
      Type: 'REQUEST'  # You can also use 'REQUEST' based on your use case
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerFunctionArn}/invocations'
      IdentitySource: 'method.request.header.Authorization'
      RestApiId: !Ref PrivateApi