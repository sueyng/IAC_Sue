# ========================================================================
# 📋 QUICK START GUIDE
# 
# Before deployment:
# 1. Fill in all fields marked with 📝 (these are required)
# 2. Only edit values between PARAMETERS_START and PARAMETERS_END
#
# ========================================================================
# REQUIRED PARAMETERS (FILL THESE BEFORE DEPLOYMENT)
# ========================================================================
# <<< PARAMETERS_START >>>

# REQUIRED PARAMETERS
AppShortName: "<edit_here>"             # 📝 e.g. xyz, api, webapp
EnvName: "<edit_here>"                  # 📝 e.g. nprd, nprd-dev, prod

# LAMBDA PACKAGE
LambdaS3bucket: "<edit_here>"           # 📝 e.g. apt-lambda-deployment, myapp-nprd-app-artifact
CodeZipFileName: "<edit_here>"          # 📝 e.g. LambdaAuthorizer.zip

# LAMBDA RUNTIME
LambdaRuntime: "<edit_here>"            # 📝 e.g. dotnet8, python3.12, nodejs20.x
LambdaHandler: "<edit_here>"            # 📝 e.g. Assembly::Namespace.Class::Method (dotnet) or module.handler (python)

# AZURE AD CONFIGURATION
AzureAdClientId: "<edit_here>"          # 📝 Azure AD application (client) ID (GUID)
AzureAdTenantId: "<edit_here>"          # 📝 Azure AD tenant ID (GUID)

# PROXY CONFIGURATION
ForwardProxyAddress: "<edit_here>"      # 📝 e.g. http://hisproxydefp.gut.hcc.com.sg:4000

# <<< PARAMETERS_END >>>
# ========================================================================
# 📖 PARAMETER REFERENCE — DO NOT EDIT BELOW THIS LINE
# ========================================================================
# AppShortName
#   Value: Application identifier (e.g. xyz, api, webapp)
#   Creates:
#     - Lambda function: {AppShortName}-{EnvName}-LambdaAuthorizer
#     - IAM role: {AppShortName}-{EnvName}-lambda-authorizer-role
#     - CloudWatch log group: /aws/lambda/{AppShortName}-{EnvName}-LambdaAuthorizer
#   Format: Lowercase alphanumeric

# EnvName
#   Allowed Values:
#     Non-prod: nprd, nprd-dev, nprd-sit, nprd-sit1, nprd-sit2, nprd-sit3, nprd-sit-a, nprd-sit-b, nprd-sit-c, nprd-uat, nprd-uat-a, nprd-uat-b, nprd-uat-c, nprd-pt, nprd-pp, nprd-pp-a, nprd-pp-b, nprd-pp-c
#     Production: prod, prod-a, prod-b, prod-c
#   Log retention: nprd (7 days), prod (30 days)

# --- LAMBDA PACKAGE ---

# LambdaS3bucket
#   Value: S3 bucket name with Lambda ZIP file (NOT ARN)
#   Example: apt-lambda-deployment, myapp-nprd-app-artifact
#   Requirements: Bucket in same region as Lambda, ZIP file uploaded
#   Finding: S3 Console → Buckets → copy bucket name

# CodeZipFileName
#   Value: ZIP file name in S3 bucket (e.g. LambdaAuthorizer.zip)
#   Location: s3://{LambdaS3bucket}/{CodeZipFileName}
#   Best practice: Include version in filename (authorizer-v1.0.0.zip)

# --- LAMBDA RUNTIME ---

# LambdaRuntime
#   Supported runtimes:
#     .NET: dotnet8, dotnet6
#     Python: python3.12, python3.11, python3.10
#     Node.js: nodejs20.x, nodejs18.x
#     Java: java21, java17, java11
#   Must match language in deployment package

# LambdaHandler
#   Format by runtime:
#     .NET: {Assembly}::{Namespace}.{Class}::{Method}
#       Example: Authorizer::MyApp.Function::FunctionHandler
#     Python: {module}.{function}
#       Example: lambda_function.lambda_handler
#     Node.js: {file}.{export}
#       Example: index.handler
#     Java: {package}.{class}::{method}
#       Example: com.example.Handler::handleRequest
#   Finding: Check Lambda code entry point, case-sensitive

# --- AZURE AD CONFIGURATION ---

# AzureAdClientId
#   Value: Azure AD application (client) ID (GUID)
#   Example: 56d10777-fe7c-494b-a37b-88a50fb7cd29
#   Finding: Azure Portal → Azure Active Directory → App registrations → Overview → Application (client) ID
#   Purpose: Validates JWT "aud" (audience) claim
#   Environment variable: AZURE_AD_CLIENT_ID
#   Not a secret (can be public)

# AzureAdTenantId
#   Value: Azure AD tenant ID (GUID)
#   Example: 6ef68169-639f-4d8f-8b7a-c981fab3c31b
#   Finding: Azure Portal → Azure Active Directory → Overview → Tenant ID
#   Purpose: Constructs Azure AD metadata URL
#   URL: https://login.microsoftonline.com/{TenantId}/v2.0/.well-known/openid-configuration
#   Environment variable: AZURE_AD_TENANT_ID
#   Not a secret (used to fetch public keys)

# --- PROXY CONFIGURATION ---

# ForwardProxyAddress
#   Value: HTTP proxy address (e.g. http://hisproxydefp.gut.hcc.com.sg:4000)
#   Purpose: Route Lambda traffic to Azure AD through corporate proxy
#   Requirements: Lambda must be in VPC, proxy accessible from subnets
#   Environment variable: FORWARD_PROXY_ADDRESS
#   Finding: Contact network team for corporate proxy details
#   Use case: Lambda needs to reach login.microsoftonline.com

